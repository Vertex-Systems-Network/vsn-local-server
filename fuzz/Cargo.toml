[package]
name = "vsn-fuzz"
version = "0.0.0"
publish = false
edition = "2021"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
serde_json = "1"
vsn-remote = { path = "../crates/vsn-remote" }
vsn-stream = { path = "../crates/vsn-stream" }

[[bin]]
name = "remote_protocol"
path = "fuzz_targets/remote_protocol.rs"
test = false
doc = false
bench = false

[[bin]]
name = "stream_open"
path = "fuzz_targets/stream_open.rs"
test = false
doc = false
bench = false
