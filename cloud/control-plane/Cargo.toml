[package]
name = "vsn-control-plane"
version = "0.38.1"
edition = "2021"
license = "Proprietary"

[dependencies]
axum = { version = "0.8", features = ["ws"] }
rand_core = { version = "0.6", features = ["getrandom"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "sync", "time"] }
vsn-remote = { path = "../../crates/vsn-remote" }
tower-http = { version = "0.7", features = ["fs"] }

vsn-audit = { path = "../../crates/vsn-audit" }
vsn-control-store = { path = "../../crates/vsn-control-store" }
vsn-auth = { path = "../../crates/vsn-auth" }

base64 = "0.22"
chacha20poly1305 = "0.10"
webauthn-rs = "0.5.5"

futures-util = "0.3"

reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }

openidconnect = { version = "4.0.1", default-features = false, features = ["reqwest"] }

vsn-stream = { path = "../../crates/vsn-stream" }

vsn-saml = { path = "../../crates/vsn-saml" }
