[package]
name = "vsn-auth"
version = "0.38.1"
edition = "2021"
license = "Proprietary"

[dependencies]
serde = { version = "1", features = ["derive"] }
thiserror = "2"

argon2 = "0.5"
rand_core = { version = "0.6", features = ["getrandom"] }
data-encoding = "2"
totp-rs = { version = "6", features = ["otpauth", "zeroize"] }

base64 = "0.22"
sha2 = "0.10"
