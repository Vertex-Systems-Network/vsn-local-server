[package]
name = "vsn-database-native"
version = "0.38.1"
edition = "2021"
license = "Proprietary"

[dependencies]
mongodb = { version = "3.8", features = ["sync"] }
bson = { version = "3.1", features = ["serde", "serde_json-1"] }
mysql = { version = "28", default-features = false, features = ["minimal-rust"] }
postgres = "0.19"
postgres-native-tls = "0.5.3"
native-tls = "0.2"
redis = { version = "1", features = ["tls-rustls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

vsn-database = { path = "../vsn-database" }
