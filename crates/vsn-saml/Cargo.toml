[package]
name = "vsn-saml"
version = "0.38.1"
edition = "2021"
license = "Proprietary"

[dependencies]
base64 = "0.22"
flate2 = "1"
rand_core = { version = "0.6", features = ["getrandom"] }
roxmltree = "0.21"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
time = { version = "0.3", features = ["formatting", "parsing"] }
url = "2"
vsn-auth = { path = "../vsn-auth" }
vsn-system = { path = "../vsn-system" }
