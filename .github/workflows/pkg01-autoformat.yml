name: PKG-01 Source Auto-Fix

on:
  push:
    branches:
      - chore/rustfmt-vsn-security

permissions:
  contents: write

jobs:
  source-fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout isolated rustfmt lane
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install exact Rust 1.97.1 rustfmt
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.97.1'
          components: 'rustfmt'
      - name: Apply workspace rustfmt
        run: |
          set -euo pipefail
          cargo fmt --all
          git diff --check
      - name: Commit Rust-only formatting
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo 'No Rust formatting changes required.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -u
          git diff --cached --name-only | tee /tmp/rustfmt-files.txt
          if grep -Ev '\.rs$' /tmp/rustfmt-files.txt | grep -q .; then
            echo 'Refusing to commit non-Rust changes from rustfmt lane.' >&2
            exit 2
          fi
          git commit -m 'chore: apply workspace rustfmt'
          git push origin HEAD:${GITHUB_REF_NAME}
