name: AI Planning Governance

on:
  pull_request:
    paths:
      - '.ai/**'
      - 'scripts/ai-planning-governance.py'
      - 'docs/AI-NATIVE-DEVELOPMENT-BLUEPRINT.md'
      - 'docs/PLATFORM-DEVELOPMENT-CATALOG.md'
      - 'docs/AI-PLAN-AUDIT-2026-08-24.md'
      - 'docs/MASTER-EXECUTION-STATUS.json'
      - 'docs/MASTER-EXECUTION-PLAN.md'
      - 'certification/*.json'
      - '.github/workflows/ai-planning-governance.yml'
  push:
    branches:
      - main
    paths:
      - '.ai/**'
      - 'scripts/ai-planning-governance.py'
      - 'docs/AI-NATIVE-DEVELOPMENT-BLUEPRINT.md'
      - 'docs/PLATFORM-DEVELOPMENT-CATALOG.md'
      - 'docs/AI-PLAN-AUDIT-2026-08-24.md'
      - 'docs/MASTER-EXECUTION-STATUS.json'
      - 'docs/MASTER-EXECUTION-PLAN.md'
      - 'certification/*.json'
      - '.github/workflows/ai-planning-governance.yml'

permissions:
  contents: read

jobs:
  ai-planning-governance:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 1
      - name: Validate AI lifecycle, trust, manifests and platform catalog
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/ai-planning-governance.py
