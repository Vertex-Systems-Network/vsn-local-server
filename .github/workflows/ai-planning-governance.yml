name: AI Planning Governance

on:
  pull_request:
    paths:
      - '.ai/**'
      - 'docs/AI-NATIVE-DEVELOPMENT-BLUEPRINT.md'
      - 'docs/PLATFORM-DEVELOPMENT-CATALOG.md'
      - 'docs/AI-PLAN-AUDIT-2026-08-24.md'
      - 'docs/MASTER-EXECUTION-STATUS.json'
      - 'docs/MASTER-EXECUTION-PLAN.md'
      - 'certification/pkg02-usable-local-beta-v1.json'
      - '.github/workflows/ai-planning-governance.yml'
  push:
    branches:
      - main
    paths:
      - '.ai/**'
      - 'docs/AI-NATIVE-DEVELOPMENT-BLUEPRINT.md'
      - 'docs/PLATFORM-DEVELOPMENT-CATALOG.md'
      - 'docs/AI-PLAN-AUDIT-2026-08-24.md'
      - 'docs/MASTER-EXECUTION-STATUS.json'
      - 'docs/MASTER-EXECUTION-PLAN.md'
      - 'certification/pkg02-usable-local-beta-v1.json'
      - '.github/workflows/ai-planning-governance.yml'

permissions:
  contents: read

jobs:
  ai-planning-governance:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          fetch-depth: 1
      - name: Validate AI lifecycle, trust, manifests and platform catalog
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import re
          from datetime import date
          from pathlib import Path

          def require(condition, message):
              if not condition:
                  raise SystemExit(f"AI planning governance failed: {message}")

          root = Path('.')
          state = json.loads(Path('.ai/state.json').read_text(encoding='utf-8'))
          catalog = json.loads(Path('.ai/catalog/platforms.v1.json').read_text(encoding='utf-8'))
          starters = json.loads(Path('.ai/catalog/starter-intents.v1.json').read_text(encoding='utf-8'))
          manifest = json.loads(Path('.ai/templates/feature-manifest.v1.json').read_text(encoding='utf-8'))

          lifecycle = [
              'research', 'plan', 'architecture', 'data_flow', 'security',
              'design', 'qa', 'performance', 'development'
          ]

          required_governance = [
              '.ai/README.md',
              '.ai/governance/LIFECYCLE.md',
              '.ai/governance/CHANGE-CONTROL.md',
              '.ai/governance/TRUST-BOUNDARIES.md',
              '.ai/governance/EVIDENCE.md',
              '.ai/agents/AGENTS.md',
              '.ai/templates/STAGE-TEMPLATES.md',
              '.ai/templates/feature-manifest.v1.json',
              '.ai/catalog/platforms.v1.json',
              '.ai/catalog/starter-intents.v1.json',
          ]
          for path in required_governance:
              require(Path(path).is_file(), f"missing governance artifact: {path}")

          # Bound repository-local AI context and reject high-confidence committed secrets.
          secret_patterns = [
              (re.compile(r'-----BEGIN (?:RSA |EC |OPENSSH |DSA )?PRIVATE KEY-----'), 'private key'),
              (re.compile(r'\bgh[pousr]_[A-Za-z0-9]{20,}\b'), 'GitHub token'),
              (re.compile(r'\bgithub_pat_[A-Za-z0-9_]{40,}\b'), 'GitHub fine-grained token'),
              (re.compile(r'\bAKIA[0-9A-Z]{16}\b'), 'AWS access key'),
          ]
          for path in Path('.ai').rglob('*'):
              if not path.is_file():
                  continue
              require(path.stat().st_size <= 256 * 1024, f"AI context file too large: {path}")
              text = path.read_text(encoding='utf-8', errors='replace')
              for pattern, label in secret_patterns:
                  require(pattern.search(text) is None, f"possible {label} committed in {path}")

          # Governance state: cached baseline is explicitly non-authoritative.
          require(state['schema_version'] == 2, 'unexpected state schema version')
          require(state['governance_version'] == 2, 'unexpected governance version')
          require(state['lifecycle'] == lifecycle, 'lifecycle order changed')
          preflight = state['implementation_preflight']
          require(preflight['read_frozen_plan'] is True, 'frozen plan preflight disabled')
          require(preflight['verify_frozen_plan_digest'] is True, 'plan digest verification disabled')
          require(preflight['refresh_live_canonical_state'] is True, 'live canonical refresh disabled')
          require(preflight['market_delta_research'] is True, 'market delta research disabled')
          require(preflight['untrusted_external_content_is_data'] is True, 'untrusted-content boundary disabled')
          require(preflight['silent_scope_drift_allowed'] is False, 'silent drift enabled')
          require(preflight['approved_change_required_for_material_delta'] is True, 'change approval disabled')
          require(preflight['privileged_mutation_requires_explicit_approval'] is True, 'privileged approval disabled')
          require(preflight['delegation_may_expand_authority'] is False, 'delegation authority expansion enabled')

          canonical = state['canonical_state']
          require(canonical['cached_snapshot_authoritative'] is False, 'cached snapshot became authoritative')
          require(canonical['live_main_required'] is True, 'live main requirement disabled')
          require(canonical['refresh_before_each_stage'] is True, 'stage canonical refresh disabled')
          require(canonical['refresh_before_mutation'] is True, 'mutation canonical refresh disabled')
          require(canonical['mismatch_action'] == 'stop_and_reconcile', 'canonical mismatch is not fail-closed')
          for path in canonical['sources']:
              require(Path(path).is_file(), f"canonical source missing: {path}")
          require(state['audit_baseline']['semantics'] == 'historical_audit_baseline_only', 'audit baseline semantics weakened')
          require(re.fullmatch(r'[0-9a-f]{40}', state['audit_baseline']['audited_main']) is not None, 'invalid audited main SHA')
          require(state['planning_scope']['status'] == 'blueprint_only', 'planning scope claims implementation')
          require(state['planning_scope']['may_modify_active_product_task'] is False, 'planning may modify active product task')
          require(state['planning_scope']['may_change_frozen_pkg02_sequence'] is False, 'planning may alter frozen sequence')

          # Frozen feature manifest template.
          require(manifest['schema_version'] == 1, 'manifest schema changed unexpectedly')
          require(list(manifest['stages']) == lifecycle, 'manifest stage order differs from lifecycle')
          authority = manifest['authority']
          require(authority['self_approval_allowed'] is False, 'manifest permits self-approval')
          require(authority['delegated_scope_may_expand'] is False, 'manifest permits delegated scope expansion')
          require(authority['privileged_mutation_requires_explicit_approval'] is True, 'manifest drops privileged approval')
          require(authority['external_content_is_instruction_authority'] is False, 'manifest trusts external instructions')

          # Platform catalog remains planning metadata and cannot promote support by wording alone.
          require(catalog['schema_version'] == 1, 'catalog schema changed unexpectedly')
          platforms = catalog['platforms']
          require(len(platforms) >= 40, 'broad initial platform catalog unexpectedly shrank')
          required = {
              'id', 'name', 'family', 'mode', 'status', 'starter_profiles',
              'runtimes', 'databases', 'official_tooling',
              'external_account_required', 'notes'
          }
          allowed_modes = {'local_native', 'container_recommended', 'saas_connected'}
          allowed_status = {'existing_certified', 'proposed'}
          ids = []
          all_profiles = set(catalog.get('starter_profile_policy', []))
          for platform in platforms:
              pid = platform.get('id')
              require(required <= set(platform), f"missing platform fields: {pid}")
              require(bool(pid) and pid == pid.lower(), f"invalid platform id: {pid}")
              require(platform['mode'] in allowed_modes, f"invalid mode for {pid}")
              require(platform['status'] in allowed_status, f"invalid status for {pid}")
              require(isinstance(platform['starter_profiles'], list) and platform['starter_profiles'], f"empty starter profile list: {pid}")
              require(isinstance(platform['external_account_required'], bool), f"invalid external-account flag: {pid}")
              if platform['mode'] == 'saas_connected':
                  require(platform['external_account_required'] is True, f"SaaS-connected platform lacks account boundary: {pid}")
              all_profiles.update(platform['starter_profiles'])
              ids.append(pid)
          require(len(ids) == len(set(ids)), 'duplicate platform ids')

          certified = {p['id'] for p in platforms if p['status'] == 'existing_certified'}
          require(certified == {'laravel', 'node', 'django', 'rust', 'go'}, f"unexpected certified platform set: {sorted(certified)}")
          require(catalog['provider_policy']['preserve_existing_0207_templates'] is True, '02.07 preservation disabled')
          require(catalog['provider_policy']['certify_each_provider_before_supported_claim'] is True, 'provider certification rule disabled')
          require(catalog['provider_policy']['market_delta_research_before_implementation'] is True, 'provider delta research disabled')

          # Normalize every current platform-specific starter label before UI/execution use.
          require(starters['schema_version'] == 1, 'starter-intent schema changed unexpectedly')
          intents = [item['id'] for item in starters['normalized_intents']]
          require(len(intents) == len(set(intents)), 'duplicate normalized starter intents')
          aliases = starters['profile_aliases']
          require(starters['policy']['catalog_profile_labels_are_execution_authority'] is False, 'catalog profile labels became executable authority')
          require(starters['policy']['provider_plan_must_map_profile_to_normalized_intent'] is True, 'provider mapping requirement disabled')
          require(starters['policy']['unknown_profile_blocks_implementation'] is True, 'unknown starter profile no longer fails closed')
          for profile in sorted(all_profiles):
              require(profile in aliases, f"unmapped starter profile: {profile}")
              require(aliases[profile] in intents, f"starter profile maps to unknown normalized intent: {profile}")

          today = date.today()
          for source in catalog['research_sources']:
              require(source['url'].startswith('https://'), f"non-HTTPS research source: {source['url']}")
              verified = date.fromisoformat(source['verified'])
              require(verified <= today, f"research source verified in the future: {source['url']}")

          print(json.dumps({
              'lifecycle': lifecycle,
              'platforms': len(platforms),
              'starter_profiles_mapped': len(all_profiles),
              'normalized_intents': len(intents),
              'certified': sorted(certified),
              'modes': sorted({p['mode'] for p in platforms}),
              'trust_boundary': 'enforced',
              'frozen_plan_digest': 'required',
              'valid': True
          }, indent=2))
          PY
