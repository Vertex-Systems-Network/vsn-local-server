name: TMP PKG-01 Fix Capability Init

on:
  push:
    branches:
      - pkg01/clippy-after-pr7

permissions:
  contents: write

jobs:
  fix-capability-init:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repair branch
        uses: actions/checkout@v4
        with:
          ref: pkg01/clippy-after-pr7
          fetch-depth: 0

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.97.1
          components: rustfmt, clippy

      - name: Apply exact source repair and restore clean workflows
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path('apps/agent/src/main.rs')
          text = p.read_text()
          old = '''            let mut caps = vsn_database::CapabilitySet::default();
            caps.query = true;
            caps.indexes = true;
            caps.relations = true;
            caps.statistics = true;
'''
          new = '''            let caps = vsn_database::CapabilitySet {
                query: true,
                indexes: true,
                relations: true,
                statistics: true,
                ..Default::default()
            };
'''
          if old not in text:
              raise SystemExit('expected CapabilitySet reassignment block missing')
          p.write_text(text.replace(old, new, 1))
          PY
          git checkout af6ab1404357c030490ddee8f854ee8dd6b993da -- .github/workflows/pkg01-build-foundation.yml
          rm .github/workflows/tmp-pkg01-fix-capability-init.yml
          cargo fmt --all
          git diff --check

      - name: Commit clean repair state
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- apps/agent/src/main.rs .github/workflows/pkg01-build-foundation.yml .github/workflows/tmp-pkg01-fix-capability-init.yml
          git commit -m "fix(agent): initialize database demo capabilities"
          git push origin HEAD:pkg01/clippy-after-pr7
