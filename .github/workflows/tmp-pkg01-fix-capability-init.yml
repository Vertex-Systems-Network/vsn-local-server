name: PKG-01 01.07 Apply Capability Init Fix

on:
  push:
    branches:
      - pkg01/clippy-after-pr7
    paths:
      - .github/workflows/tmp-pkg01-fix-capability-init.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact branch head
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify source blob identity
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object apps/agent/src/main.rs)" = "5e2e7e355c439bc78fe1f95d802e0c9736705162"

      - name: Apply exact asserted fix and restore clean workflow
        shell: python
        run: |
          from pathlib import Path
          p = Path("apps/agent/src/main.rs")
          text = p.read_text(encoding="utf-8")
          old = '''            let mut caps = vsn_database::CapabilitySet::default();
            caps.query = true;
            caps.indexes = true;
            caps.relations = true;
            caps.statistics = true;
'''
          new = '''            let caps = vsn_database::CapabilitySet {
                query: true,
                indexes: true,
                relations: true,
                statistics: true,
                ..Default::default()
            };
'''
          count = text.count(old)
          if count != 1:
              raise SystemExit(f"expected one CapabilitySet block, found {count}")
          p.write_text(text.replace(old, new, 1), encoding="utf-8")

      - name: Restore acceptance workflow and verify patch
        shell: bash
        run: |
          set -euo pipefail
          git checkout af6ab1404357c030490ddee8f854ee8dd6b993da -- .github/workflows/pkg01-build-foundation.yml
          git diff --check
          test "$(git diff --name-only | sort | tr '\n' ' ')" = ".github/workflows/pkg01-build-foundation.yml apps/agent/src/main.rs "

      - name: Commit exact fix to active branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "vsn-ci"
          git config user.email "vsn-ci@users.noreply.github.com"
          git add -- apps/agent/src/main.rs .github/workflows/pkg01-build-foundation.yml
          git commit -m "fix(pkg01): clear agent capability initializer Clippy blocker"
          git push origin HEAD:pkg01/clippy-after-pr7
