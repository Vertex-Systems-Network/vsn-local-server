name: PKG-01 01.17 Dashboard Lockfile

on:
  push:
    branches:
      - pkg01/**
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dashboard-lock:
    name: 01.17 Verify Dashboard package-lock.json
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v7
        with:
          node-version: '22.12.0'

      - name: Verify committed certified lockfile
        working-directory: cloud/dashboard
        shell: bash
        run: |
          set -euo pipefail
          test -s package-lock.json
          echo 'a184c9f1b91b11134896692a88c8286c611a9b89ab59f66a42e94781b3127a3c  package-lock.json' | sha256sum -c -

      - name: Re-resolve graph and require zero lock drift
        working-directory: cloud/dashboard
        shell: bash
        run: |
          set -euo pipefail
          cp package-lock.json package-lock.before.json
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund
          cmp --silent package-lock.before.json package-lock.json
          rm package-lock.before.json
          git diff --exit-code -- package-lock.json

      - name: Package lockfile evidence
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist-pkg01/01.17
          cp cloud/dashboard/package-lock.json dist-pkg01/01.17/package-lock.json
          python3 - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path

          lock_path = Path('cloud/dashboard/package-lock.json')
          lock = json.loads(lock_path.read_text())
          candidate = json.loads(Path('docs/release-candidate-current.json').read_text())
          payload = {
              'schema_version': 1,
              'task_id': '01.17',
              'artifact': 'dashboard-package-lock',
              'product_version': candidate['product_version'],
              'candidate_id': candidate['candidate_id'],
              'source_commit': os.environ['GITHUB_SHA'],
              'node_version': os.popen('node --version').read().strip(),
              'npm_version': os.popen('npm --version').read().strip(),
              'package_lock_sha256': hashlib.sha256(lock_path.read_bytes()).hexdigest(),
              'lockfile_version': lock.get('lockfileVersion'),
              'package_entries': len(lock.get('packages', {})),
              'committed': True,
              'reresolution_drift': False,
          }
          Path('dist-pkg01/01.17/evidence.json').write_text(
              json.dumps(payload, indent=2, sort_keys=True) + '\n'
          )
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: pkg01-0117-dashboard-package-lock
          path: dist-pkg01/01.17
          if-no-files-found: error
