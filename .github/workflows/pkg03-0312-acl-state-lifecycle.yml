name: PKG-03 03.12 Installer ACL State Lifecycle

on:
  pull_request:
    branches: [main]
    paths:
      - '.ai/current-work.json'
      - '.ai/features/pkg03-0312/**'
      - '.ai/manifests/pkg03-0312-installer-acls-state.v1.json'
      - '.ai/plans/pkg03-0312-installer-acls-state-v1.md'
      - 'docs/PKG03-INSTALLER-ACLS-STATE-LIFECYCLE-V1.md'
      - 'scripts/ci/pkg03-0312-acl-state-lifecycle.ps1'
      - 'scripts/ci/validate-pkg03-0312.py'
      - '.github/workflows/pkg03-0312-acl-state-lifecycle.yml'
      - 'scripts/ci/pkg03-0311-agent-service-lifecycle.ps1'
      - 'apps/agent/src/main.rs'
      - 'crates/vsn-security/src/lib.rs'
      - 'crates/vsn-config/src/lib.rs'
      - 'apps/desktop/src-tauri/tauri.windows.conf.json'
      - 'apps/desktop/src-tauri/windows/pkg03-0311-agent-service.nsh'
      - 'apps/desktop/src-tauri/windows/fragments/pkg03-0311-agent-service.wxs'
      - 'installer/windows/owned-payload.v1.json'
      - 'certification/pkg03-windows-installer-v1.json'
      - 'docs/MASTER-EXECUTION-STATUS.json'
      - 'README.md'
      - '.ai/README.md'
      - 'docs/MASTER-EXECUTION-PLAN.md'
  push:
    branches:
      - 'pkg03/0312-installer-acls-state'
      - main
    paths:
      - '.ai/current-work.json'
      - '.ai/features/pkg03-0312/**'
      - '.ai/manifests/pkg03-0312-installer-acls-state.v1.json'
      - '.ai/plans/pkg03-0312-installer-acls-state-v1.md'
      - 'docs/PKG03-INSTALLER-ACLS-STATE-LIFECYCLE-V1.md'
      - 'scripts/ci/pkg03-0312-acl-state-lifecycle.ps1'
      - 'scripts/ci/validate-pkg03-0312.py'
      - '.github/workflows/pkg03-0312-acl-state-lifecycle.yml'
      - 'scripts/ci/pkg03-0311-agent-service-lifecycle.ps1'
      - 'apps/agent/src/main.rs'
      - 'crates/vsn-security/src/lib.rs'
      - 'crates/vsn-config/src/lib.rs'
      - 'apps/desktop/src-tauri/tauri.windows.conf.json'
      - 'apps/desktop/src-tauri/windows/pkg03-0311-agent-service.nsh'
      - 'apps/desktop/src-tauri/windows/fragments/pkg03-0311-agent-service.wxs'
      - 'installer/windows/owned-payload.v1.json'
      - 'certification/pkg03-windows-installer-v1.json'
      - 'docs/MASTER-EXECUTION-STATUS.json'
      - 'README.md'
      - '.ai/README.md'
      - 'docs/MASTER-EXECUTION-PLAN.md'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pkg03-0312-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  acl-state-lifecycle:
    name: 03.12 Windows ACL and state separation lifecycle
    runs-on: windows-2025
    timeout-minutes: 110
    steps:
      - name: Checkout exact source head
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          fetch-depth: 0

      - name: Bind exact source head
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $expected='${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}'
          $actual=(git rev-parse HEAD).Trim()
          if($actual -ne $expected){throw "Exact-head checkout mismatch: expected=$expected actual=$actual"}
          "VSN_SOURCE_SHA=$actual" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          if(@(git status --porcelain=v1 --untracked-files=no).Count -ne 0){throw 'Checkout is not tracked-clean before 03.12.'}

      - name: Set up Node 22.12.0
        uses: actions/setup-node@v4
        with:
          node-version: '22.12.0'

      - name: Install exact Rust 1.97.1
        shell: pwsh
        run: |
          rustup toolchain install 1.97.1 --profile minimal
          rustup default 1.97.1
          if((rustc --version).Trim() -notmatch '^rustc 1\.97\.1 '){throw 'Unexpected rustc version'}
          if((cargo --version).Trim() -notmatch '^cargo 1\.97\.1 '){throw 'Unexpected cargo version'}

      - name: Validate frozen 03.12 implementation authority
        shell: pwsh
        run: python scripts/ci/validate-pkg03-0312.py

      - name: Parse 03.12 PowerShell harness
        shell: pwsh
        run: |
          $tokens=$null;$errors=$null
          [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path 'scripts/ci/pkg03-0312-acl-state-lifecycle.ps1').Path,[ref]$tokens,[ref]$errors)|Out-Null
          if($errors.Count -ne 0){$errors|ForEach-Object{Write-Host $_.Message};throw "03.12 harness has $($errors.Count) parse error(s)."}

      - name: Install locked Desktop graph
        shell: pwsh
        run: |
          if(Test-Path apps/desktop/node_modules){throw 'node_modules unexpectedly exists before npm ci'}
          Push-Location apps/desktop
          npm ci --no-audit --no-fund
          Pop-Location
          git diff --exit-code -- apps/desktop/package.json apps/desktop/package-lock.json

      - name: Verify locked Cargo graph
        shell: pwsh
        run: |
          cargo fetch --locked
          cargo metadata --locked --no-deps --format-version 1 | Out-Null

      - name: Run focused Windows IPC ACL tests
        shell: pwsh
        run: cargo test --locked -p vsn-security windows_ipc_ -- --nocapture

      - name: Record repository-local Tauri CLI
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force target/pkg03/03.12,dist-pkg03/03.12|Out-Null
          $tauri=(& .\apps\desktop\node_modules\.bin\tauri.cmd --version|Out-String).Trim()
          if($tauri -ne 'tauri-cli 2.11.4'){throw "Unexpected local Tauri CLI output: $tauri"}
          $tauri|Set-Content -Encoding utf8NoBOM dist-pkg03/03.12/tauri-version.txt

      - name: Build exact-head current-user NSIS
        shell: pwsh
        run: |
          Push-Location apps/desktop
          & .\node_modules\.bin\tauri.cmd build --bundles nsis
          if($LASTEXITCODE -ne 0){throw "Current-user NSIS build failed: $LASTEXITCODE"}
          Pop-Location
          $setups=@(Get-ChildItem target/release/bundle/nsis -Filter '*-setup.exe' -File)
          if($setups.Count -ne 1){throw "Expected one current-user NSIS setup; found $($setups.Count)"}
          Copy-Item $setups[0].FullName target/pkg03/03.12/current-user-setup.exe -Force

      - name: Build exact-head per-machine NSIS
        shell: pwsh
        run: |
          Remove-Item target/release/bundle/nsis -Recurse -Force -ErrorAction SilentlyContinue
          Push-Location apps/desktop
          & .\node_modules\.bin\tauri.cmd build --bundles nsis --config src-tauri/tauri.per-machine.conf.json
          if($LASTEXITCODE -ne 0){throw "Per-machine NSIS build failed: $LASTEXITCODE"}
          Pop-Location
          $setups=@(Get-ChildItem target/release/bundle/nsis -Filter '*-setup.exe' -File)
          if($setups.Count -ne 1){throw "Expected one per-machine NSIS setup; found $($setups.Count)"}
          Copy-Item $setups[0].FullName target/pkg03/03.12/per-machine-setup.exe -Force

      - name: Build exact-head MSI/WiX
        shell: pwsh
        run: |
          Remove-Item target/release/bundle/msi -Recurse -Force -ErrorAction SilentlyContinue
          Push-Location apps/desktop
          & .\node_modules\.bin\tauri.cmd build --bundles msi
          if($LASTEXITCODE -ne 0){throw "MSI build failed: $LASTEXITCODE"}
          Pop-Location
          $msi=@(Get-ChildItem target/release/bundle/msi -Filter '*.msi' -File)
          if($msi.Count -ne 1){throw "Expected one MSI; found $($msi.Count)"}
          Copy-Item $msi[0].FullName target/pkg03/03.12/vsn-dev-platform.msi -Force

      - name: Exercise genuine 03.12 ACL and state lifecycle
        shell: pwsh
        run: |
          & scripts/ci/pkg03-0312-acl-state-lifecycle.ps1 `
            -CurrentUserSetupPath 'target/pkg03/03.12/current-user-setup.exe' `
            -PerMachineSetupPath 'target/pkg03/03.12/per-machine-setup.exe' `
            -MsiPath 'target/pkg03/03.12/vsn-dev-platform.msi' `
            -SourceSha $env:VSN_SOURCE_SHA `
            -EvidenceDir 'dist-pkg03/03.12'

      - name: Upload failed 03.12 diagnostics
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: pkg03-0312-installer-acl-state-diagnostics
          path: |
            dist-pkg03/03.12/**
            target/pkg03/03.12/**
          if-no-files-found: warn
          compression-level: 0

      - name: Bind workflow metadata into exact evidence
        shell: pwsh
        env:
          VSN_WORKFLOW_RUN_ID: ${{ github.run_id }}
          VSN_WORKFLOW_RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          @'
          import hashlib,json,os,subprocess
          from pathlib import Path
          out=Path('dist-pkg03/03.12');p=out/'evidence.json';e=json.loads(p.read_text(encoding='utf-8-sig'))
          def h(b): return hashlib.sha256(b).hexdigest()
          def gb(path): return subprocess.check_output(['git','show',f'HEAD:{path}'])
          source=os.environ['VSN_SOURCE_SHA'];actual=subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip()
          if source!=actual or e.get('source_commit')!=source: raise SystemExit('03.12 exact-source binding mismatch')
          e['workflow_run_id']=int(os.environ['VSN_WORKFLOW_RUN_ID']);e['workflow_run_attempt']=int(os.environ['VSN_WORKFLOW_RUN_ATTEMPT'])
          e['runner']={'os':os.environ.get('RUNNER_OS'),'arch':os.environ.get('RUNNER_ARCH'),'image_os':os.environ.get('ImageOS'),'image_version':os.environ.get('ImageVersion')}
          e['toolchain']={'node':subprocess.check_output(['node','--version'],text=True).strip(),'rustc':subprocess.check_output(['rustc','--version'],text=True).strip(),'cargo':subprocess.check_output(['cargo','--version'],text=True).strip(),'tauri_cli':(out/'tauri-version.txt').read_text(encoding='utf-8-sig').strip()}
          e['input_sha256']={
            'task_manifest':h(gb('.ai/manifests/pkg03-0312-installer-acls-state.v1.json')),
            'task_plan':h(gb('.ai/plans/pkg03-0312-installer-acls-state-v1.md')),
            'harness_0312':h(gb('scripts/ci/pkg03-0312-acl-state-lifecycle.ps1')),
            'harness_0311':h(gb('scripts/ci/pkg03-0311-agent-service-lifecycle.ps1')),
            'workflow':h(gb('.github/workflows/pkg03-0312-acl-state-lifecycle.yml')),
            'security':h(gb('crates/vsn-security/src/lib.rs')),
            'config':h(gb('crates/vsn-config/src/lib.rs')),
            'agent':h(gb('apps/agent/src/main.rs')),
            'windows_tauri_config':h(gb('apps/desktop/src-tauri/tauri.windows.conf.json')),
            'nsis_0311':h(gb('apps/desktop/src-tauri/windows/pkg03-0311-agent-service.nsh')),
            'wix_0311':h(gb('apps/desktop/src-tauri/windows/fragments/pkg03-0311-agent-service.wxs')),
            'owned_payload':h(gb('installer/windows/owned-payload.v1.json')),
          }
          p.write_text(json.dumps(e,indent=2)+'\n',encoding='utf-8')
          '@ | python -

      - name: Verify exact 03.12 evidence
        shell: pwsh
        run: |
          @'
          import hashlib,json,os
          from pathlib import Path
          out=Path('dist-pkg03/03.12');p=out/'evidence.json';e=json.loads(p.read_text(encoding='utf-8'));source=os.environ['VSN_SOURCE_SHA']
          def need(cond,msg):
              if not cond: raise SystemExit(msg)
          need(e.get('task_id')=='03.12','wrong task id');need(e.get('source_commit')==source,'wrong source commit')
          need(e.get('workflow_run_id')==int('${{ github.run_id }}'),'wrong workflow run id');need(e.get('duplicate_acl_writer_added') is False,'duplicate ACL writer was added')
          cu=e.get('current_user') or {};need(cu.get('machine_security_created_by_current_user_install') is False,'current-user install created machine security');need(cu.get('machine_security_created_by_current_user_uninstall') is False,'current-user uninstall created machine security')
          pm=e.get('per_machine') or {};msi=e.get('msi') or {}
          for label,lane in (('per_machine',pm),('msi',msi)):
              need((lane.get('ipc_acl') or {}).get('contract_passed') is True,f'{label} ACL contract failed')
              need((lane.get('localservice_projectdirs') or {}).get('service_account')=='NT AUTHORITY\\LocalService',f'{label} probe not LocalService')
              sep=lane.get('separation') or {};need(sep.get('data_outside_install_root') is True,f'{label} data under install root');need(sep.get('config_outside_install_root') is True,f'{label} config under install root');need(sep.get('machine_ipc_separate') is True,f'{label} IPC/mutable overlap')
              need(lane.get('service_absent_after_uninstall') is True,f'{label} service remained after uninstall');need(lane.get('payload_removed_after_uninstall') is True,f'{label} payload remained after uninstall');need(lane.get('comprehensive_preservation_certified') is False,f'{label} overclaimed 03.17 preservation')
          need(pm.get('localservice_projectdirs',{}).get('data_local')==msi.get('localservice_projectdirs',{}).get('data_local'),'NSIS/MSI data path mismatch');need(pm.get('localservice_projectdirs',{}).get('config_file')==msi.get('localservice_projectdirs',{}).get('config_file'),'NSIS/MSI config path mismatch')
          need(msi.get('install_exit_code')==0 and msi.get('uninstall_exit_code')==0,'MSI exit code failure');need(e.get('comprehensive_uninstall_preservation_owner')=='03.17','wrong preservation owner');need(e.get('tracked_repository_drift_zero') is True,'tracked repository drift')
          digest=hashlib.sha256(p.read_bytes()).hexdigest();(out/'evidence.json.sha256').write_text(digest+'  evidence.json\n',encoding='utf-8');print('03.12 evidence SHA-256:',digest)
          '@ | python -

      - name: Verify zero tracked drift
        shell: pwsh
        run: |
          $tracked=@(git status --porcelain=v1 --untracked-files=no)
          if($tracked.Count -ne 0){$tracked|Write-Host;throw 'Tracked repository drift detected after 03.12 evidence verification.'}

      - name: Upload exact 03.12 lifecycle evidence
        uses: actions/upload-artifact@v7
        with:
          name: pkg03-0312-installer-acl-state-evidence
          path: |
            dist-pkg03/03.12/**
            target/pkg03/03.12/current-user-setup.exe
            target/pkg03/03.12/per-machine-setup.exe
            target/pkg03/03.12/vsn-dev-platform.msi
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
