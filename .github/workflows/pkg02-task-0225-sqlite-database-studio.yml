name: PKG-02 02.25 SQLite Database Studio

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sqlite-database-studio:
    name: 02.25 GitHub-hosted SQLite Database Studio
    runs-on: windows-latest
    timeout-minutes: 60
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
        with:
          clean: true

      - name: Verify GitHub-hosted Windows runner
        run: |
          $ErrorActionPreference = 'Stop'
          if (-not $IsWindows) { throw '02.25 certification requires Windows' }
          if ($env:RUNNER_ENVIRONMENT -ne 'github-hosted') { throw '02.25 certification requires a GitHub-hosted runner' }
          Write-Host "runner=$env:RUNNER_NAME environment=$env:RUNNER_ENVIRONMENT os=$env:RUNNER_OS arch=$env:RUNNER_ARCH"

      - name: Run 02.25 certification
        run: |
          $ErrorActionPreference = 'Stop'
          & pwsh -NoProfile -File scripts/self-hosted/pkg02-0225.ps1
          if ($LASTEXITCODE -ne 0) { throw "02.25 certification failed with exit $LASTEXITCODE" }

      - name: Upload 02.25 GitHub-hosted evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pkg02-0225-sqlite-database-studio-github-hosted
          path: dist-self-hosted/02.25
          if-no-files-found: warn
