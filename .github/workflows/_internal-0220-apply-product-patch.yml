name: Internal 02.20 apply product patch

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize]

permissions:
  contents: write

jobs:
  patch:
    if: github.head_ref == 'pkg02/0220-pty-conpty-main-sync' && !contains(github.event.pull_request.head.sha, '0000000000000000000000000000000000000000')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: pkg02/0220-pty-conpty-main-sync
          fetch-depth: 0
      - name: Skip if already patched
        id: guard
        shell: bash
        run: |
          if grep -q 'writer: Arc<Mutex<Box<dyn Write + Send>>>' crates/vsn-terminal/src/lib.rs; then
            echo 'patched=true' >> "$GITHUB_OUTPUT"
          else
            echo 'patched=false' >> "$GITHUB_OUTPUT"
          fi
      - name: Apply exact 02.20 product fixes
        if: steps.guard.outputs.patched == 'false'
        shell: python
        run: |
          from pathlib import Path

          def replace_once(text, old, new, label):
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{label}: expected one match, found {count}")
              return text.replace(old, new, 1)

          terminal_path = Path('crates/vsn-terminal/src/lib.rs')
          terminal = terminal_path.read_text()
          terminal = replace_once(terminal,
              '    writer: Box<dyn Write + Send>,\n',
              '    writer: Arc<Mutex<Box<dyn Write + Send>>>,\n',
              'PTY writer field')
          terminal = replace_once(terminal,
              '        writer,\n        output,\n',
              '        writer: Arc::new(Mutex::new(writer)),\n        output,\n',
              'PTY writer construction')

          old_write = '''pub fn write_pty_session(session_id: &str, input: &str) -> Result<PtySessionState, TerminalError> {
              if input.len() > 256 * 1024 {
                  return Err(TerminalError::Invalid(
                      "PTY input chunk exceeds 256 KiB".into(),
                  ));
              }
              let mut map = pty_sessions()
                  .lock()
                  .map_err(|_| TerminalError::Process("PTY session lock poisoned".into()))?;
              let s = map
                  .get_mut(session_id)
                  .ok_or_else(|| TerminalError::Invalid("PTY session not found".into()))?;
              refresh_pty(s)?;
              if s.exit_code.is_some() {
                  return Err(TerminalError::Invalid("PTY session is not running".into()));
              }
              s.writer
                  .write_all(input.as_bytes())
                  .map_err(|e| TerminalError::Process(e.to_string()))?;
              s.writer
                  .flush()
                  .map_err(|e| TerminalError::Process(e.to_string()))?;
              Ok(pty_state_for(session_id, s))
          }
          '''.replace('          ', '')
          new_write = '''pub fn write_pty_session(session_id: &str, input: &str) -> Result<PtySessionState, TerminalError> {
              if input.len() > 256 * 1024 {
                  return Err(TerminalError::Invalid(
                      "PTY input chunk exceeds 256 KiB".into(),
                  ));
              }
              let writer = {
                  let mut map = pty_sessions()
                      .lock()
                      .map_err(|_| TerminalError::Process("PTY session lock poisoned".into()))?;
                  let s = map
                      .get_mut(session_id)
                      .ok_or_else(|| TerminalError::Invalid("PTY session not found".into()))?;
                  refresh_pty(s)?;
                  if s.exit_code.is_some() {
                      return Err(TerminalError::Invalid("PTY session is not running".into()));
                  }
                  Arc::clone(&s.writer)
              };
              {
                  let mut writer = writer
                      .lock()
                      .map_err(|_| TerminalError::Process("PTY writer lock poisoned".into()))?;
                  writer
                      .write_all(input.as_bytes())
                      .map_err(|e| TerminalError::Process(e.to_string()))?;
                  writer
                      .flush()
                      .map_err(|e| TerminalError::Process(e.to_string()))?;
              }
              let mut map = pty_sessions()
                  .lock()
                  .map_err(|_| TerminalError::Process("PTY session lock poisoned".into()))?;
              let s = map
                  .get_mut(session_id)
                  .ok_or_else(|| TerminalError::Invalid("PTY session not found".into()))?;
              refresh_pty(s)?;
              Ok(pty_state_for(session_id, s))
          }
          '''.replace('          ', '')
          terminal = replace_once(terminal, old_write, new_write, 'PTY write isolation')
          terminal = replace_once(terminal,
              '    s.rows = rows;\n    s.cols = cols;\n    Ok(pty_state_for(session_id, s))\n',
              '    s.rows = rows;\n    s.cols = cols;\n    write_pty_recovery(s, "running_at_last_checkpoint")?;\n    Ok(pty_state_for(session_id, s))\n',
              'PTY resize recovery checkpoint')

          old_recovery = '''fn write_pty_recovery(s: &PtyTerminalSession, state: &str) -> Result<(), TerminalError> {
              let Some(path) = s.recovery_path.as_ref() else {
                  return Ok(());
              };
              let info = PtyRecoveryInfo {
                  session_id: s.session_id.clone(),
                  program: s.program.clone(),
                  cwd: s.cwd.clone(),
                  pid: s.pid,
                  rows: s.rows,
                  cols: s.cols,
                  started_at_unix_ms: s.started_at_unix_ms,
                  state: state.into(),
                  exit_code: s.exit_code,
                  scrollback_file: s.scrollback_file.clone(),
                  orphaned: false,
              };
              let tmp = path.with_extension("tmp");
              let mut bytes =
                  serde_json::to_vec_pretty(&info).map_err(|e| TerminalError::Process(e.to_string()))?;
              bytes.push(b'\\n');
              std::fs::write(&tmp, bytes).map_err(|e| TerminalError::Process(e.to_string()))?;
              std::fs::rename(tmp, path).map_err(|e| TerminalError::Process(e.to_string()))?;
              Ok(())
          }
          '''.replace('          ', '')
          new_recovery = '''fn write_pty_recovery(s: &PtyTerminalSession, state: &str) -> Result<(), TerminalError> {
              let Some(path) = s.recovery_path.as_ref() else {
                  return Ok(());
              };
              let info = PtyRecoveryInfo {
                  session_id: s.session_id.clone(),
                  program: s.program.clone(),
                  cwd: s.cwd.clone(),
                  pid: s.pid,
                  rows: s.rows,
                  cols: s.cols,
                  started_at_unix_ms: s.started_at_unix_ms,
                  state: state.into(),
                  exit_code: s.exit_code,
                  scrollback_file: s.scrollback_file.clone(),
                  orphaned: false,
              };
              let mut bytes =
                  serde_json::to_vec_pretty(&info).map_err(|e| TerminalError::Process(e.to_string()))?;
              bytes.push(b'\\n');
              write_pty_recovery_bytes(path, &bytes)
          }

          fn write_pty_recovery_bytes(path: &Path, bytes: &[u8]) -> Result<(), TerminalError> {
              let tmp = path.with_extension("tmp");
              std::fs::write(&tmp, bytes).map_err(|e| TerminalError::Process(e.to_string()))?;
              replace_pty_recovery_file(&tmp, path)
          }

          #[cfg(windows)]
          fn replace_pty_recovery_file(tmp: &Path, path: &Path) -> Result<(), TerminalError> {
              use std::os::windows::ffi::OsStrExt;
              const MOVEFILE_REPLACE_EXISTING: u32 = 0x00000001;
              const MOVEFILE_WRITE_THROUGH: u32 = 0x00000008;
              #[link(name = "Kernel32")]
              extern "system" {
                  #[link_name = "MoveFileExW"]
                  fn move_file_ex_w(existing: *const u16, new: *const u16, flags: u32) -> i32;
              }
              let from = tmp.as_os_str().encode_wide().chain(std::iter::once(0)).collect::<Vec<_>>();
              let to = path.as_os_str().encode_wide().chain(std::iter::once(0)).collect::<Vec<_>>();
              let result = unsafe {
                  move_file_ex_w(from.as_ptr(), to.as_ptr(), MOVEFILE_REPLACE_EXISTING | MOVEFILE_WRITE_THROUGH)
              };
              if result == 0 {
                  return Err(TerminalError::Process(format!(
                      "PTY recovery replacement failed: {}",
                      std::io::Error::last_os_error()
                  )));
              }
              Ok(())
          }

          #[cfg(not(windows))]
          fn replace_pty_recovery_file(tmp: &Path, path: &Path) -> Result<(), TerminalError> {
              std::fs::rename(tmp, path).map_err(|e| TerminalError::Process(e.to_string()))
          }
          '''.replace('          ', '')
          terminal = replace_once(terminal, old_recovery, new_recovery, 'PTY recovery replacement')

          marker = '// True PTY/ConPTY sessions.'
          test = '''#[cfg(test)]
          mod pty_recovery_tests {
              use super::*;

              #[test]
              fn recovery_file_replaces_existing_checkpoint() {
                  let dir = std::env::temp_dir().join(format!(
                      "vsn-pty-recovery-test-{}-{}",
                      std::process::id(),
                      now_ms()
                  ));
                  std::fs::create_dir_all(&dir).expect("create PTY recovery test directory");
                  let path = dir.join("session.json");
                  write_pty_recovery_bytes(&path, b"first\\n").expect("write initial checkpoint");
                  write_pty_recovery_bytes(&path, b"second\\n").expect("replace checkpoint");
                  assert_eq!(std::fs::read(&path).expect("read checkpoint"), b"second\\n");
                  std::fs::remove_dir_all(dir).expect("remove PTY recovery test directory");
              }
          }

          '''.replace('          ', '')
          terminal = replace_once(terminal, marker, test + marker, 'PTY recovery regression module')
          terminal_path.write_text(terminal)

          ipc_path = Path('crates/vsn-ipc/src/lib.rs')
          ipc = ipc_path.read_text()
          ipc = replace_once(ipc,
              '        "terminal.session.read-wait" => Duration::from_secs(7),\n',
              '        "terminal.session.read-wait" | "terminal.pty.read-wait" => Duration::from_secs(7),\n',
              'PTY read-wait timeout')
          ipc = replace_once(ipc,
              '        assert_eq!(client_response_timeout("ping"), Duration::from_secs(5));\n',
              '        assert_eq!(\n            client_response_timeout("terminal.pty.read-wait"),\n            Duration::from_secs(7)\n        );\n        assert_eq!(client_response_timeout("ping"), Duration::from_secs(5));\n',
              'PTY read-wait timeout regression')
          ipc_path.write_text(ipc)
      - name: Format and validate
        if: steps.guard.outputs.patched == 'false'
        run: |
          cargo fmt --all
          git diff --check
          git diff -- crates/vsn-terminal/src/lib.rs crates/vsn-ipc/src/lib.rs
      - name: Commit patch
        if: steps.guard.outputs.patched == 'false'
        run: |
          git config user.name "WPEssential"
          git config user.email "wordpress.essential@gmail.com"
          git add crates/vsn-terminal/src/lib.rs crates/vsn-ipc/src/lib.rs
          git commit -m "fix(terminal): harden PTY lifecycle [0220-patched]"
          git push origin HEAD:pkg02/0220-pty-conpty-main-sync
