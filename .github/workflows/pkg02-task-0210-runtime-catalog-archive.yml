name: PKG-02 02.10 Trusted Runtime Catalog and Archive Safety

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  trusted-catalog-archive:
    name: 02.10 self-hosted trusted catalog and archive safety
    runs-on: self-hosted
    timeout-minutes: 60
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
        with:
          clean: true

      - name: Verify compatible self-hosted runner
        run: |
          $ErrorActionPreference = 'Stop'
          if (-not $IsWindows) { throw "02.10 certification requires Windows; selected runner '$env:RUNNER_NAME' is incompatible" }
          Write-Host "selected runner=$env:RUNNER_NAME os=$env:RUNNER_OS arch=$env:RUNNER_ARCH"

      - name: Run 02.10 certification
        run: |
          $ErrorActionPreference = 'Stop'
          & pwsh -NoProfile -File scripts/self-hosted/pkg02-0210.ps1
          if ($LASTEXITCODE -ne 0) { throw "02.10 certification failed with exit $LASTEXITCODE" }

      - name: Upload 02.10 self-hosted evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pkg02-0210-trusted-catalog-archive-self-hosted
          path: dist-self-hosted/02.10
          if-no-files-found: warn
