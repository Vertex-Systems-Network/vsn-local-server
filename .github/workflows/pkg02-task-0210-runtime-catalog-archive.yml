name: PKG-02 02.10 Trusted Runtime Catalog and Archive Safety

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - '.github/workflows/pkg02-task-0210-runtime-catalog-archive.yml'
      - 'crates/vsn-runtime/**'
      - 'scripts/self-hosted/pkg02-0210.ps1'

permissions:
  contents: write

concurrency:
  group: pkg02-0210-patch-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  source-patch:
    if: github.event_name == 'pull_request'
    name: Apply exact 02.10 source patch
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}

      - name: Patch runtime catalog entry points and IPC fixture
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          lib = Path('crates/vsn-runtime/src/lib.rs')
          text = lib.read_text(encoding='utf-8')
          replacements = [
              (
                  'use thiserror::Error;\n',
                  'use thiserror::Error;\n\nmod catalog_validation;\n',
              ),
              (
                  'pub fn load_catalog(path: &Path) -> Result<RuntimeCatalog, RuntimeError> {\n    let catalog: RuntimeCatalog = serde_json::from_slice(&fs::read(path)?)?;\n',
                  'pub fn load_catalog(path: &Path) -> Result<RuntimeCatalog, RuntimeError> {\n    let bytes = fs::read(path)?;\n    catalog_validation::validate_catalog_bytes(&bytes)?;\n    let catalog: RuntimeCatalog = serde_json::from_slice(&bytes)?;\n',
              ),
              (
                  '    let catalog = load_catalog(path)?;\n    let trust: RuntimeCatalogTrust = serde_json::from_slice(&fs::read(trust_path)?)?;\n',
                  '    let catalog = load_catalog(path)?;\n    let trust_bytes = fs::read(trust_path)?;\n    catalog_validation::validate_trust_bytes(&trust_bytes)?;\n    let trust: RuntimeCatalogTrust = serde_json::from_slice(&trust_bytes)?;\n',
              ),
              (
                  ') -> Result<RuntimeInstallPlan, RuntimeError> {\n    validate_runtime_id(runtime)?;\n',
                  ') -> Result<RuntimeInstallPlan, RuntimeError> {\n    let catalog_bytes = serde_json::to_vec(catalog)?;\n    catalog_validation::validate_catalog_bytes(&catalog_bytes)?;\n    validate_runtime_id(runtime)?;\n',
              ),
          ]
          for old, new in replacements:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'expected exactly one occurrence in lib.rs, found {count}: {old!r}')
              text = text.replace(old, new)
          lib.write_text(text, encoding='utf-8')

          script = Path('scripts/self-hosted/pkg02-0210.ps1')
          ps = script.read_text(encoding='utf-8')
          for old, new in [
              ('Get-NetTCPConnection -LocalPort 49731', 'Get-NetTCPConnection -LocalPort 39731'),
              ('TCP 49731 is already in use', 'TCP 39731 is already in use'),
          ]:
              count = ps.count(old)
              if count != 1:
                  raise SystemExit(f'expected exactly one occurrence in acceptance script, found {count}: {old!r}')
              ps = ps.replace(old, new)
          script.write_text(ps, encoding='utf-8')
          PY
          git diff --check
          git diff -- crates/vsn-runtime/src/lib.rs scripts/self-hosted/pkg02-0210.ps1
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add crates/vsn-runtime/src/lib.rs scripts/self-hosted/pkg02-0210.ps1
          git commit -m 'fix(runtime): enforce fail-closed catalog validation [skip ci]'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
          echo '02.10 source patch pushed; stop temporary patch run.'
          exit 1
