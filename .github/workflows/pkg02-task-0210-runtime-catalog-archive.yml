name: PKG-02 02.10 Trusted Runtime Catalog and Archive Safety

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pkg02-0210-github-hosted-${{ github.ref }}
  cancel-in-progress: true

jobs:
  trusted-catalog-archive:
    name: 02.10 GitHub-hosted trusted catalog and archive safety
    runs-on: windows-latest
    timeout-minutes: 60
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
        with:
          clean: true
          ref: ${{ github.sha }}

      - name: Verify exact source and GitHub-hosted Windows runner
        run: |
          $ErrorActionPreference = 'Stop'
          if (-not $IsWindows) { throw '02.10 certification requires Windows' }
          if ($env:RUNNER_ENVIRONMENT -ne 'github-hosted') { throw '02.10 certification requires a GitHub-hosted runner' }
          $actual = (git rev-parse HEAD).Trim()
          if ($actual -ne '${{ github.sha }}') { throw "02.10 source binding mismatch: expected=${{ github.sha }} actual=$actual" }
          Write-Host "source=$actual runner=$env:RUNNER_NAME environment=$env:RUNNER_ENVIRONMENT os=$env:RUNNER_OS arch=$env:RUNNER_ARCH"

      - name: Run 02.10 certification
        run: |
          $ErrorActionPreference = 'Stop'
          & pwsh -NoProfile -File scripts/self-hosted/pkg02-0210.ps1
          if ($LASTEXITCODE -ne 0) { throw "02.10 certification failed with exit $LASTEXITCODE" }

      - name: Upload 02.10 GitHub-hosted evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pkg02-0210-trusted-catalog-archive-github-hosted
          path: dist-self-hosted/02.10
          if-no-files-found: warn
