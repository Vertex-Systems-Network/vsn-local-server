name: PKG-02 02.10 Trusted Runtime Catalog and Archive Safety

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - '.github/workflows/pkg02-task-0210-runtime-catalog-archive.yml'
      - 'crates/vsn-runtime/**'

permissions:
  contents: write

concurrency:
  group: pkg02-0210-format-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  format:
    if: github.event_name == 'pull_request'
    name: Format 02.10 Rust sources
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
      - name: Run rustfmt and commit exact output
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:RUNNER_ENVIRONMENT -ne 'github-hosted') { throw 'GitHub-hosted runner required' }
          cargo fmt --all
          if ($LASTEXITCODE -ne 0) { throw "cargo fmt failed with exit $LASTEXITCODE" }
          git diff --check
          if ($LASTEXITCODE -ne 0) { throw 'git diff --check failed after rustfmt' }
          $changes = git status --porcelain
          if (-not $changes) { throw 'rustfmt produced no changes; formatter workflow should not be active' }
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add crates/vsn-runtime/src/catalog_validation.rs crates/vsn-runtime/src/lib.rs
          git commit -m 'style(runtime): apply rustfmt to 02.10 hardening [skip ci]'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
          throw 'Formatting commit pushed; stop temporary formatter run.'
