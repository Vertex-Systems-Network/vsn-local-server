name: Wiki Sync

# Publishes docs/wiki to the repository's GitHub wiki whenever those pages change
# on main. The wiki is a separate git repository; GITHUB_TOKEN can push to it.

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - docs/wiki/**

permissions:
  contents: write

concurrency:
  group: wiki-sync
  cancel-in-progress: false

jobs:
  sync:
    name: Publish docs/wiki
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Push pages to the wiki
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          git clone --depth 1 "https://x-access-token:${TOKEN}@github.com/${REPO}.wiki.git" wiki
          rsync -a --delete --exclude .git docs/wiki/ wiki/
          cd wiki
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then echo "wiki already up to date"; exit 0; fi
          git commit -m "Sync wiki from ${SHA}"
          git push origin HEAD
