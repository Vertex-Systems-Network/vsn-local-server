name: PKG-02 02.09 LOCAL-WIN-02 Runtime Inventory Registry

on:
  push:
    branches:
      - pkg02/0209-runtime-inventory-registry
    paths:
      - '.github/workflows/pkg02-task-0209-runtime-inventory-registry.yml'
      - 'scripts/self-hosted/pkg02-0209.ps1'
      - 'crates/vsn-runtime/**'
      - 'crates/vsn-core/**'
      - 'apps/agent/**'
      - 'apps/cli/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pkg02-0209-local-win-02
  cancel-in-progress: false

jobs:
  certify-0209:
    name: 02.09 LOCAL-WIN-02 runtime inventory certification
    runs-on: [self-hosted, LOCAL-WIN-02]
    timeout-minutes: 90
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
        with:
          clean: true

      - name: Verify exclusive runner identity
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:RUNNER_NAME -ne 'LOCAL-WIN-02') { throw "refusing runner '$env:RUNNER_NAME'; LOCAL-WIN-02 is required" }
          if (-not $IsWindows) { throw 'LOCAL-WIN-02 certification requires Windows' }

      - name: Run 02.09 certification
        run: |
          $ErrorActionPreference = 'Stop'
          & pwsh -NoProfile -File scripts/self-hosted/pkg02-0209.ps1
          if ($LASTEXITCODE -ne 0) { throw "02.09 certification failed with exit $LASTEXITCODE" }

      - name: Upload 02.09 LOCAL-WIN-02 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pkg02-0209-local-win-02
          path: dist-self-hosted/02.09
          if-no-files-found: warn
