name: PKG-02 02.09 Windows Self-Hosted Runtime Inventory Registry

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pkg02-0209-self-hosted
  cancel-in-progress: false

jobs:
  certify-0209:
    name: 02.09 self-hosted runtime inventory certification
    runs-on: self-hosted
    timeout-minutes: 90
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
        with:
          clean: true

      - name: Verify compatible self-hosted runner
        run: |
          $ErrorActionPreference = 'Stop'
          if (-not $IsWindows) { throw "02.09 certification requires Windows; selected runner '$env:RUNNER_NAME' is incompatible" }
          Write-Host "selected runner=$env:RUNNER_NAME os=$env:RUNNER_OS arch=$env:RUNNER_ARCH"

      - name: Run 02.09 certification
        run: |
          $ErrorActionPreference = 'Stop'
          & pwsh -NoProfile -File scripts/self-hosted/pkg02-0209.ps1
          if ($LASTEXITCODE -ne 0) { throw "02.09 certification failed with exit $LASTEXITCODE" }

      - name: Upload 02.09 self-hosted evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pkg02-0209-self-hosted
          path: dist-self-hosted/02.09
          if-no-files-found: warn
