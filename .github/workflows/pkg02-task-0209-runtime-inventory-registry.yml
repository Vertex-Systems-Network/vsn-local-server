name: PKG-02 02.09 Windows GitHub-Hosted Runtime Inventory Registry

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - '.github/workflows/pkg02-task-0209-runtime-inventory-registry.yml'
      - 'crates/vsn-runtime/**'
      - 'crates/vsn-ipc/**'
      - 'crates/vsn-core/**'
      - 'apps/agent/**'
      - 'apps/cli/**'
      - 'scripts/self-hosted/pkg02-0209.ps1'
      - 'certification/pkg02-usable-local-beta-v1.json'
      - 'docs/MASTER-EXECUTION-STATUS.json'
      - 'docs/MASTER-EXECUTION-PLAN.md'
      - 'README.md'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'rust-toolchain.toml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pkg02-0209-github-hosted-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  certify-0209:
    name: 02.09 GitHub-hosted runtime inventory certification
    runs-on: windows-latest
    timeout-minutes: 90
    defaults:
      run:
        shell: pwsh
    env:
      EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      HEAD_REF: ${{ github.event.pull_request.head.ref }}
    steps:
      - uses: actions/checkout@v4
        with:
          clean: true
          ref: ${{ env.EXPECTED_SHA }}

      - name: Patch deterministic empty CLI capture on the PR branch
        if: github.event_name == 'pull_request'
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:RUNNER_ENVIRONMENT -ne 'github-hosted' -or -not $IsWindows) { throw 'fixture patch requires GitHub-hosted Windows' }
          $path = 'scripts/self-hosted/pkg02-0209.ps1'
          $lines = @(Get-Content -LiteralPath $path)
          $signature = 'function Invoke-Cli([string[]]$CommandArgs, [string]$StdoutPath, [string]$StderrPath) {'
          $start = [Array]::IndexOf($lines, $signature)
          if ($start -lt 0) { throw 'Invoke-Cli helper signature not found' }
          $end = $start
          while ($end -lt $lines.Count -and $lines[$end] -ne '}') { $end++ }
          if ($end -ge $lines.Count) { throw 'Invoke-Cli helper end not found' }
          $block = @(
            $signature,
            '    New-Item -ItemType File -Force -Path $StdoutPath | Out-Null',
            '    New-Item -ItemType File -Force -Path $StderrPath | Out-Null',
            '    $output = & $script:Cli @CommandArgs 2> $StderrPath',
            '    $code = $LASTEXITCODE',
            '    if ($null -ne $output) {',
            '        $output | Set-Content -LiteralPath $StdoutPath -Encoding utf8',
            '    }',
            '    return $code',
            '}'
          )
          $newLines = @()
          if ($start -gt 0) { $newLines += $lines[0..($start - 1)] }
          $newLines += $block
          if ($end + 1 -lt $lines.Count) { $newLines += $lines[($end + 1)..($lines.Count - 1)] }
          $utf8NoBom = New-Object System.Text.UTF8Encoding($false)
          [IO.File]::WriteAllText((Resolve-Path $path), (($newLines -join "`n") + "`n"), $utf8NoBom)
          git diff --check
          if ($LASTEXITCODE -ne 0) { throw 'fixture patch produced invalid whitespace' }
          git diff --quiet -- $path
          if ($LASTEXITCODE -eq 0) { throw 'fixture patch made no change' }
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add $path
          git commit -m 'fix(ci): create deterministic empty CLI capture files'
          git push origin ("HEAD:refs/heads/" + $env:HEAD_REF)
          throw 'fixture patch commit pushed; certification must rerun on the new exact head'

      - name: Verify exact source and GitHub-hosted Windows runner
        run: |
          $ErrorActionPreference = 'Stop'
          if (-not $IsWindows) { throw '02.09 certification requires Windows' }
          if ($env:RUNNER_ENVIRONMENT -ne 'github-hosted') { throw '02.09 certification requires a GitHub-hosted runner' }
          $actual = (git rev-parse HEAD).Trim()
          if ($actual -ne $env:EXPECTED_SHA) { throw "02.09 source binding mismatch: expected=$env:EXPECTED_SHA actual=$actual" }
          if (Get-NetTCPConnection -LocalPort 39731 -State Listen -ErrorAction SilentlyContinue) { throw 'VSN Agent IPC port 39731 is occupied' }
          Write-Host "source=$actual runner=$env:RUNNER_NAME environment=$env:RUNNER_ENVIRONMENT os=$env:RUNNER_OS arch=$env:RUNNER_ARCH ipc=127.0.0.1:39731"

      - name: Run 02.09 certification
        run: |
          $ErrorActionPreference = 'Stop'
          $env:GITHUB_SHA = $env:EXPECTED_SHA
          & pwsh -NoProfile -File scripts/self-hosted/pkg02-0209.ps1
          if ($LASTEXITCODE -ne 0) { throw "02.09 certification failed with exit $LASTEXITCODE" }

      - name: Bind evidence to GitHub-hosted exact source
        if: success()
        run: |
          $ErrorActionPreference = 'Stop'
          $evidencePath = 'dist-self-hosted\02.09\evidence.json'
          if (-not (Test-Path -LiteralPath $evidencePath)) { throw '02.09 evidence.json was not produced' }
          $evidence = Get-Content -LiteralPath $evidencePath -Raw | ConvertFrom-Json
          $evidence.artifact = 'windows-github-hosted-bounded-runtime-inventory-registry-audit'
          $evidence.source_commit = $env:EXPECTED_SHA
          $evidence | Add-Member -NotePropertyName runner_environment -NotePropertyValue $env:RUNNER_ENVIRONMENT -Force
          $evidence | Add-Member -NotePropertyName ipc_address -NotePropertyValue '127.0.0.1:39731' -Force
          $evidence | ConvertTo-Json -Depth 10 | Set-Content -LiteralPath $evidencePath -Encoding utf8
          (Get-FileHash $evidencePath -Algorithm SHA256).Hash.ToLowerInvariant() | Set-Content 'dist-self-hosted\02.09\evidence.json.sha256'

      - name: Upload 02.09 GitHub-hosted evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pkg02-0209-github-hosted
          path: dist-self-hosted/02.09
          if-no-files-found: warn
