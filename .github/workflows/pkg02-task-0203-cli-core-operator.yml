name: PKG-02 02.03 CLI Core Operator Path

on:
  push:
    branches:
      - pkg02/**
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cli-core-operator:
    name: 02.03 CLI core operator path
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Linux CLI acceptance dependency
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends keyutils
          test "$(rustc --version | awk '{print $2}')" = "1.97.1"
          test "$(cargo --version | awk '{print $2}')" = "1.97.1"

      - name: Build current Agent and CLI from locked source
        shell: bash
        run: |
          set -euo pipefail
          cargo build --locked --release --package vsn-agent --package vsn
          mkdir -p dist-pkg02/02.03/bin
          cp target/release/vsn-agent dist-pkg02/02.03/bin/vsn-agent
          cp target/release/vsn dist-pkg02/02.03/bin/vsn
          chmod +x dist-pkg02/02.03/bin/vsn-agent dist-pkg02/02.03/bin/vsn
          sha256sum dist-pkg02/02.03/bin/vsn-agent > dist-pkg02/02.03/vsn-agent.sha256
          sha256sum dist-pkg02/02.03/bin/vsn > dist-pkg02/02.03/vsn.sha256

      - name: Run real CLI core operator acceptance
        shell: keyctl session vsn-pkg02-0203 bash --noprofile --norc -eo pipefail {0}
        run: |
          set -euo pipefail
          keyctl rdescribe @s > dist-pkg02/02.03/session-keyring.txt
          bin=dist-pkg02/02.03/bin

          set +e
          "$bin/vsn" status > dist-pkg02/02.03/offline-status.stdout 2> dist-pkg02/02.03/offline-status.stderr
          offline_code=$?
          set -e
          echo "$offline_code" > dist-pkg02/02.03/offline-status.exit-code.txt
          test "$offline_code" -ne 0
          test ! -s dist-pkg02/02.03/offline-status.stdout
          grep -q '^error=' dist-pkg02/02.03/offline-status.stderr
          grep -q '^hint=ensure vsn-agent is running and the authenticated local IPC channel is available$' dist-pkg02/02.03/offline-status.stderr

          "$bin/vsn-agent" > dist-pkg02/02.03/agent.log 2>&1 &
          agent_pid=$!
          echo "$agent_pid" > dist-pkg02/02.03/agent.pid

          cleanup() {
            if kill -0 "$agent_pid" 2>/dev/null; then
              kill -INT "$agent_pid" || true
              for _ in $(seq 1 50); do
                if ! kill -0 "$agent_pid" 2>/dev/null; then break; fi
                sleep 0.1
              done
              if kill -0 "$agent_pid" 2>/dev/null; then
                kill -KILL "$agent_pid" || true
              fi
            fi
          }
          trap cleanup EXIT

          ready=false
          for _ in $(seq 1 80); do
            if "$bin/vsn" ping > dist-pkg02/02.03/readiness-ping.json 2> dist-pkg02/02.03/readiness-ping.err; then
              ready=true
              break
            fi
            if ! kill -0 "$agent_pid" 2>/dev/null; then
              echo 'Agent exited before CLI readiness.' >&2
              cat dist-pkg02/02.03/agent.log >&2 || true
              cat dist-pkg02/02.03/readiness-ping.err >&2 || true
              exit 1
            fi
            sleep 0.25
          done
          test "$ready" = true
          kill -0 "$agent_pid"

          "$bin/vsn" status > dist-pkg02/02.03/status.json
          "$bin/vsn" machine > dist-pkg02/02.03/machine.json
          "$bin/vsn" security > dist-pkg02/02.03/security.json
          "$bin/vsn" diagnostics > dist-pkg02/02.03/diagnostics.json
          "$bin/vsn" config show > dist-pkg02/02.03/config.json
          "$bin/vsn" audit verify > dist-pkg02/02.03/audit.json
          kill -0 "$agent_pid"

          python3 - <<'PY'
          import json
          from pathlib import Path

          root = Path('dist-pkg02/02.03')
          status = json.loads((root / 'status.json').read_text())
          machine = json.loads((root / 'machine.json').read_text())
          security = json.loads((root / 'security.json').read_text())
          diagnostics = json.loads((root / 'diagnostics.json').read_text())
          config = json.loads((root / 'config.json').read_text())
          audit = json.loads((root / 'audit.json').read_text())
          ping = json.loads((root / 'readiness-ping.json').read_text())

          assert ping.get('pong') is True and ping.get('version') == '0.38.1'

          assert status['health']['healthy'] is True
          assert status['health']['service'] == 'vsn-core'
          assert status['security']['device_identity_ready'] is True
          assert status['security']['ipc_secret_ready'] is True

          assert isinstance(machine.get('device_id'), str) and len(machine['device_id']) >= 8
          assert isinstance(machine.get('display_name'), str) and machine['display_name']
          assert isinstance(machine.get('os'), str) and machine['os']
          assert isinstance(machine.get('public_key'), str) and machine['public_key']

          assert security.get('device_identity_ready') is True
          assert security.get('ipc_secret_ready') is True
          assert isinstance(security.get('secure_store'), str) and security['secure_store']

          assert diagnostics.get('healthy') is True
          assert diagnostics.get('event_bus_ready') is True
          assert diagnostics['security']['device_identity_ready'] is True
          assert diagnostics['security']['ipc_secret_ready'] is True
          assert diagnostics['machine']['device_id'] == machine['device_id']
          assert diagnostics['machine']['public_key'] == machine['public_key']
          assert diagnostics['config']['version'] == 3
          assert diagnostics['config']['execution_backend'] == 'native'
          assert diagnostics['config']['remote_enabled'] is False
          assert diagnostics['audit']['ok'] is True
          assert isinstance(diagnostics['audit'].get('events'), int) and diagnostics['audit']['events'] >= 1

          assert config.get('version') == 3
          assert config.get('workspace_roots') == []
          assert config.get('default_domain_suffix') == '.test'
          assert config.get('default_execution_backend') == 'native'
          assert config.get('telemetry_enabled') is False
          assert config['remote']['enabled'] is False
          assert config['remote']['allow_remote_terminal'] is False
          assert config['remote']['allow_remote_file_write'] is False
          assert config['remote']['allow_remote_database_query'] is False
          assert config['remote']['allow_remote_preview_interactive'] is False

          assert audit.get('valid') is True
          assert isinstance(audit.get('events'), int) and audit['events'] >= 7
          PY

          kill -INT "$agent_pid"
          set +e
          wait "$agent_pid"
          exit_code=$?
          set -e
          trap - EXIT
          echo "$exit_code" > dist-pkg02/02.03/agent-exit-code.txt
          test "$exit_code" -eq 0
          test ! -e /proc/$agent_pid

      - name: Package 02.03 evidence
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path

          root = Path('dist-pkg02/02.03')
          candidate = json.loads(Path('docs/release-candidate-current.json').read_text())
          outputs = {
              name: json.loads((root / filename).read_text())
              for name, filename in {
                  'status': 'status.json',
                  'machine': 'machine.json',
                  'security': 'security.json',
                  'diagnostics': 'diagnostics.json',
                  'config_show': 'config.json',
                  'audit_verify': 'audit.json',
              }.items()
          }

          def digest(path):
              return hashlib.sha256(Path(path).read_bytes()).hexdigest()

          evidence = {
              'schema_version': 1,
              'package_id': 'PKG-02',
              'task_id': '02.03',
              'artifact': 'cli-core-operator-path',
              'product_version': candidate['product_version'],
              'candidate_id': candidate['candidate_id'],
              'source_commit': os.environ['GITHUB_SHA'],
              'rust_version': '1.97.1',
              'build_mode': 'locked-release-from-current-source',
              'agent_sha256': digest(root / 'bin/vsn-agent'),
              'cli_sha256': digest(root / 'bin/vsn'),
              'linux_shared_session_keyring': True,
              'offline_agent_unavailable_rejected': int((root / 'offline-status.exit-code.txt').read_text()) != 0,
              'offline_operator_hint_present': 'hint=ensure vsn-agent is running and the authenticated local IPC channel is available' in (root / 'offline-status.stderr').read_text(),
              'authenticated_status': outputs['status']['health']['healthy'] is True,
              'authenticated_machine': bool(outputs['machine'].get('device_id')),
              'authenticated_security': outputs['security'].get('ipc_secret_ready') is True,
              'authenticated_diagnostics': outputs['diagnostics'].get('healthy') is True,
              'authenticated_config_show': outputs['config_show'].get('version') == 3,
              'authenticated_audit_verify': outputs['audit_verify'].get('valid') is True,
              'audit_events_verified': outputs['audit_verify'].get('events', 0),
              'machine_identity_consistent': outputs['diagnostics']['machine']['device_id'] == outputs['machine']['device_id'],
              'clean_shutdown_exit_code': int((root / 'agent-exit-code.txt').read_text()),
              'output_sha256': {
                  filename: digest(root / filename)
                  for filename in ['status.json','machine.json','security.json','diagnostics.json','config.json','audit.json']
              },
          }
          required = [
              evidence['linux_shared_session_keyring'],
              evidence['offline_agent_unavailable_rejected'],
              evidence['offline_operator_hint_present'],
              evidence['authenticated_status'],
              evidence['authenticated_machine'],
              evidence['authenticated_security'],
              evidence['authenticated_diagnostics'],
              evidence['authenticated_config_show'],
              evidence['authenticated_audit_verify'],
              evidence['machine_identity_consistent'],
              evidence['audit_events_verified'] >= 7,
              evidence['clean_shutdown_exit_code'] == 0,
          ]
          assert all(required)
          (root / 'evidence.json').write_text(json.dumps(evidence, indent=2, sort_keys=True) + '\n')
          PY
          sha256sum dist-pkg02/02.03/evidence.json > dist-pkg02/02.03/evidence.json.sha256
          git diff --check

      - uses: actions/upload-artifact@v4
        with:
          name: pkg02-0203-cli-core-operator
          path: dist-pkg02/02.03
          if-no-files-found: error
