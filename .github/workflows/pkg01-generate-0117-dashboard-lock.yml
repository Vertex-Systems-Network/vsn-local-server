name: PKG-01 Generate 01.17 Dashboard Lock

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  generate-lock:
    if: github.event.pull_request.head.ref == 'pkg01/0117-dashboard-lockfile'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: pkg01/0117-dashboard-lockfile
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22.12.0'

      - name: Generate and commit certified Dashboard lockfile
        working-directory: cloud/dashboard
        shell: bash
        run: |
          set -euo pipefail
          if [ -f package-lock.json ]; then
            echo 'Dashboard package-lock.json already exists; verify certified hash.'
            echo 'a184c9f1b91b11134896692a88c8286c611a9b89ab59f66a42e94781b3127a3c  package-lock.json' | sha256sum -c -
            exit 0
          fi
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund
          test -s package-lock.json
          echo 'a184c9f1b91b11134896692a88c8286c611a9b89ab59f66a42e94781b3127a3c  package-lock.json' | sha256sum -c -
          git diff --check -- package-lock.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package-lock.json
          git commit -m 'PKG-01: commit certified Dashboard package-lock.json'
          git push origin HEAD:pkg01/0117-dashboard-lockfile
