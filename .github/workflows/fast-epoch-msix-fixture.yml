name: Fast Epoch Windows MSIX Fixture

on:
  push:
    branches:
      - 'integration/fast-epoch-*'
    paths:
      - '.github/workflows/fast-epoch-msix-fixture.yml'
      - 'scripts/ci/pkg03-msix-fixture-package.ps1'
      - 'scripts/ci/pkg03-msix-product-shell-package.ps1'
      - 'scripts/ci/pkg03-msix-manifest-preimplementation.py'
      - 'scripts/ci/pkg03-msix-store-compat.py'
      - 'apps/desktop/src-tauri/msix/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fast-epoch-msix-fixture-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows-msix-fixture:
    name: NON_ACCEPTANCE_PREIMPLEMENTATION Windows MSIX fixture
    runs-on: windows-2025
    timeout-minutes: 60
    steps:
      - name: Checkout exact epoch head
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 1

      - name: Bind exact source and parse MSIX scripts
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $actual=(git rev-parse HEAD).Trim()
          if ($actual -ne '${{ github.sha }}') { throw "Exact-head mismatch: $actual" }
          foreach ($path in @('scripts/ci/pkg03-msix-fixture-package.ps1','scripts/ci/pkg03-msix-product-shell-package.ps1')) {
            $tokens=$null; $errors=$null
            [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $path).Path,[ref]$tokens,[ref]$errors) | Out-Null
            if ($errors.Count -ne 0) {
              $errors | ForEach-Object { Write-Host "$path :: $($_.Message)" }
              throw "$path contains PowerShell parse errors."
            }
          }
          if (@(git status --porcelain=v1).Count -ne 0) { throw 'Checkout is not clean before MSIX gate.' }

      - name: Package and round-trip unsigned Windows fixture MSIX
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          & scripts/ci/pkg03-msix-fixture-package.ps1 -OutputDir '.fast-msix-out'
          if ($LASTEXITCODE -ne 0) { throw "MSIX fixture package gate failed." }

      - name: Validate explicit fixture-only evidence
        shell: pwsh
        env:
          EXPECTED_SOURCE: ${{ github.sha }}
        run: |
          $ErrorActionPreference='Stop'
          $e=Get-Content -LiteralPath '.fast-msix-out/evidence.json' -Raw | ConvertFrom-Json
          if ($e.schema_version -ne 1) { throw 'Unexpected evidence schema.' }
          if ($e.lane -ne 'msix-store-preimplementation') { throw 'Unexpected lane.' }
          if ($e.mode -ne 'NON_ACCEPTANCE_PREIMPLEMENTATION') { throw 'Acceptance marker missing.' }
          if ($e.source_commit -ne $env:EXPECTED_SOURCE) { throw 'Fixture package source SHA mismatch.' }
          if ($e.fixture_identity -ne $true) { throw 'Fixture identity marker missing.' }
          if ($e.production_identity_present -ne $false) { throw 'Production identity must remain absent.' }
          if ($e.product_binary_used -ne $false) { throw 'Fast fixture must not represent the product binary.' }
          if ($e.package_signature_present -ne $false -or $e.package_signed -ne $false) { throw 'Fixture package must remain unsigned.' }
          if ($e.store_submission_performed -ne $false) { throw 'Fixture gate must not claim Store submission.' }
          if ($e.production_evidence_consumed -ne $false) { throw 'Fixture gate consumed production evidence.' }
          if ($e.canonical_state_changed -ne $false -or $e.implementation_authority -ne $false) { throw 'Fixture gate projected authority/state.' }
          if ($e.required_runtime_boundary -ne 'external_or_preprovisioned_authenticated_agent') { throw 'Agent boundary drifted.' }
          if ($e.direct_installer_lane_must_remain -ne $true) { throw 'Direct installer lane retention marker missing.' }
          if ($e.package_roundtrip_unpack_pass -ne $true) { throw 'MSIX round-trip unpack did not pass.' }
          if ($e.package_sha256 -notmatch '^[0-9a-f]{64}$') { throw 'Invalid package SHA-256.' }
          Write-Host 'PKG03_MSIX_WINDOWS_FIXTURE_EVIDENCE=PASS'

      - name: Install exact Rust toolchain
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          rustup toolchain install 1.97.1 --profile minimal
          rustup default 1.97.1
          if ((rustc --version).Trim() -notmatch '^rustc 1\.97\.1 ') { throw 'Unexpected rustc version.' }
          if ((cargo --version).Trim() -notmatch '^cargo 1\.97\.1 ') { throw 'Unexpected cargo version.' }

      - name: Set up exact Node 22.12.0
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22.12.0'

      - name: Build exact VSN Desktop release executable without installer bundles
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          Push-Location apps/desktop
          npm ci --no-audit --no-fund
          if ($LASTEXITCODE -ne 0) { throw 'Desktop npm ci failed.' }
          $tauri=(& .\node_modules\.bin\tauri.cmd --version | Out-String).Trim()
          if ($tauri -ne 'tauri-cli 2.11.4') { throw "Unexpected Tauri CLI: $tauri" }
          & .\node_modules\.bin\tauri.cmd build --no-bundle
          if ($LASTEXITCODE -ne 0) { throw "Tauri release no-bundle build failed with exit code $LASTEXITCODE" }
          Pop-Location
          git diff --exit-code -- apps/desktop/package.json apps/desktop/package-lock.json Cargo.toml Cargo.lock
          if ($LASTEXITCODE -ne 0) { throw 'Locked dependency graph drifted during product build.' }
          $desktop='target/release/VSN Dev Platform.exe'
          if (-not (Test-Path -LiteralPath $desktop -PathType Leaf)) { throw 'Exact VSN Desktop release executable missing.' }
          $sig=Get-AuthenticodeSignature -LiteralPath $desktop
          if ([string]$sig.Status -ne 'NotSigned') { throw "Release executable unexpectedly signed in preimplementation lane: $($sig.Status)" }
          Write-Host "VSN_PRODUCT_EXE_SHA256=$((Get-FileHash -LiteralPath $desktop -Algorithm SHA256).Hash.ToLowerInvariant())"

      - name: Package actual VSN Desktop executable into unsigned fixture-identity MSIX
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          & scripts/ci/pkg03-msix-product-shell-package.ps1 -OutputDir '.fast-msix-product-out' -ProductExe 'target/release/VSN Dev Platform.exe'
          if ($LASTEXITCODE -ne 0) { throw 'Product-shell MSIX package gate failed.' }

      - name: Validate actual product-shell package evidence
        shell: pwsh
        env:
          EXPECTED_SOURCE: ${{ github.sha }}
        run: |
          $ErrorActionPreference='Stop'
          $e=Get-Content -LiteralPath '.fast-msix-product-out/evidence.json' -Raw | ConvertFrom-Json
          if ($e.schema_version -ne 1 -or $e.lane -ne 'msix-store-preimplementation') { throw 'Unexpected product-shell evidence identity.' }
          if ($e.mode -ne 'NON_ACCEPTANCE_PREIMPLEMENTATION') { throw 'Product-shell acceptance marker missing.' }
          if ($e.source_commit -ne $env:EXPECTED_SOURCE) { throw 'Product-shell source SHA mismatch.' }
          if ($e.fixture_identity -ne $true -or $e.production_identity_present -ne $false) { throw 'Product-shell identity boundary drifted.' }
          if ($e.product_binary_used -ne $true) { throw 'Actual product binary was not packaged.' }
          if ($e.product_binary_build_mode -ne 'tauri-release-no-bundle') { throw 'Unexpected product build mode.' }
          if ($e.product_binary_authenticode_status -ne 'NotSigned') { throw 'Product executable must remain unsigned in preimplementation.' }
          if ($e.product_binary_sha256 -notmatch '^[0-9a-f]{64}$' -or $e.unpacked_product_binary_sha256 -notmatch '^[0-9a-f]{64}$') { throw 'Invalid product binary digest.' }
          if ($e.product_binary_sha256 -ne $e.unpacked_product_binary_sha256 -or $e.product_binary_roundtrip_hash_match -ne $true) { throw 'Product binary byte identity was not preserved.' }
          if ($e.package_signature_present -ne $false -or $e.package_signed -ne $false) { throw 'Product-shell fixture package must remain unsigned.' }
          if ($e.store_submission_performed -ne $false -or $e.production_evidence_consumed -ne $false) { throw 'Product-shell fixture crossed production boundary.' }
          if ($e.canonical_state_changed -ne $false -or $e.implementation_authority -ne $false) { throw 'Product-shell fixture projected authority/state.' }
          if ($e.standalone_full_feature_store_package_ready -ne $false) { throw 'Store shell must not claim standalone full-feature readiness.' }
          if ($e.required_runtime_boundary -ne 'external_or_preprovisioned_authenticated_agent') { throw 'Agent runtime boundary drifted.' }
          if ($e.direct_installer_lane_must_remain -ne $true) { throw 'Direct installer lane retention marker missing.' }
          if ($e.package_roundtrip_unpack_pass -ne $true) { throw 'Product-shell MSIX round-trip unpack did not pass.' }
          Write-Host 'PKG03_MSIX_PRODUCT_SHELL_EVIDENCE=PASS'

      - name: Cleanup and prove zero repository drift
        if: always()
        shell: pwsh
        run: |
          Remove-Item -Recurse -Force '.fast-msix-out','.fast-msix-product-out','apps/desktop/dist' -ErrorAction SilentlyContinue
          Remove-Item -LiteralPath 'apps/desktop/src-tauri/gen/schemas/windows-schema.json' -Force -ErrorAction SilentlyContinue
          if (@(git status --porcelain=v1).Count -ne 0) {
            git status --short
            throw 'MSIX gate left repository drift.'
          }
