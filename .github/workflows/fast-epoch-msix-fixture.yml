name: Fast Epoch Windows MSIX Fixture

on:
  push:
    branches:
      - 'integration/fast-epoch-*'
    paths:
      - '.github/workflows/fast-epoch-msix-fixture.yml'
      - 'scripts/ci/pkg03-msix-fixture-package.ps1'
      - 'scripts/ci/pkg03-msix-product-shell-package.ps1'
      - 'scripts/ci/pkg03-msix-wack-preflight.ps1'
      - 'scripts/ci/pkg03-msix-test-install.ps1'
      - 'scripts/ci/pkg03-msix-manifest-preimplementation.py'
      - 'scripts/ci/pkg03-msix-store-compat.py'
      - 'apps/desktop/src-tauri/msix/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fast-epoch-msix-fixture-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows-msix-fixture:
    name: NON_ACCEPTANCE_PREIMPLEMENTATION Windows MSIX fixture
    runs-on: windows-2025
    timeout-minutes: 60
    steps:
      - name: Checkout exact epoch head
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 1

      - name: Bind exact source and parse MSIX scripts
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $actual=(git rev-parse HEAD).Trim()
          if ($actual -ne '${{ github.sha }}') { throw "Exact-head mismatch: $actual" }
          foreach ($path in @('scripts/ci/pkg03-msix-fixture-package.ps1','scripts/ci/pkg03-msix-product-shell-package.ps1','scripts/ci/pkg03-msix-wack-preflight.ps1','scripts/ci/pkg03-msix-test-install.ps1')) {
            $tokens=$null; $errors=$null
            [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $path).Path,[ref]$tokens,[ref]$errors) | Out-Null
            if ($errors.Count -ne 0) {
              $errors | ForEach-Object { Write-Host "$path :: $($_.Message)" }
              throw "$path contains PowerShell parse errors."
            }
          }
          if (@(git status --porcelain=v1).Count -ne 0) { throw 'Checkout is not clean before MSIX gate.' }

      - name: Package and round-trip unsigned Windows fixture MSIX
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          & scripts/ci/pkg03-msix-fixture-package.ps1 -OutputDir '.fast-msix-out'
          if ($LASTEXITCODE -ne 0) { throw "MSIX fixture package gate failed." }

      - name: Validate explicit fixture-only evidence
        shell: pwsh
        env:
          EXPECTED_SOURCE: ${{ github.sha }}
        run: |
          $ErrorActionPreference='Stop'
          $e=Get-Content -LiteralPath '.fast-msix-out/evidence.json' -Raw | ConvertFrom-Json
          if ($e.schema_version -ne 1) { throw 'Unexpected evidence schema.' }
          if ($e.lane -ne 'msix-store-preimplementation') { throw 'Unexpected lane.' }
          if ($e.mode -ne 'NON_ACCEPTANCE_PREIMPLEMENTATION') { throw 'Acceptance marker missing.' }
          if ($e.source_commit -ne $env:EXPECTED_SOURCE) { throw 'Fixture package source SHA mismatch.' }
          if ($e.fixture_identity -ne $true) { throw 'Fixture identity marker missing.' }
          if ($e.production_identity_present -ne $false) { throw 'Production identity must remain absent.' }
          if ($e.product_binary_used -ne $false) { throw 'Fast fixture must not represent the product binary.' }
          if ($e.package_signature_present -ne $false -or $e.package_signed -ne $false) { throw 'Fixture package must remain unsigned.' }
          if ($e.store_submission_performed -ne $false) { throw 'Fixture gate must not claim Store submission.' }
          if ($e.production_evidence_consumed -ne $false) { throw 'Fixture gate consumed production evidence.' }
          if ($e.canonical_state_changed -ne $false -or $e.implementation_authority -ne $false) { throw 'Fixture gate projected authority/state.' }
          if ($e.required_runtime_boundary -ne 'external_or_preprovisioned_authenticated_agent') { throw 'Agent boundary drifted.' }
          if ($e.direct_installer_lane_must_remain -ne $true) { throw 'Direct installer lane retention marker missing.' }
          if ($e.package_roundtrip_unpack_pass -ne $true) { throw 'MSIX round-trip unpack did not pass.' }
          if ($e.package_sha256 -notmatch '^[0-9a-f]{64}$') { throw 'Invalid package SHA-256.' }
          Write-Host 'PKG03_MSIX_WINDOWS_FIXTURE_EVIDENCE=PASS'

      - name: Install exact Rust toolchain
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          rustup toolchain install 1.97.1 --profile minimal
          rustup default 1.97.1
          if ((rustc --version).Trim() -notmatch '^rustc 1\.97\.1 ') { throw 'Unexpected rustc version.' }
          if ((cargo --version).Trim() -notmatch '^cargo 1\.97\.1 ') { throw 'Unexpected cargo version.' }

      - name: Set up exact Node 22.12.0
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22.12.0'
          cache: 'npm'
          cache-dependency-path: 'apps/desktop/package-lock.json'

      - name: Compute exact Windows Cargo cache key
        id: msix-cache-key
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $paths=@(
            'Cargo.lock',
            'apps/desktop/package-lock.json',
            'apps/desktop/src-tauri/Cargo.toml',
            'apps/desktop/src-tauri/tauri.conf.json',
            'scripts/ci/pkg03-0310-stage-windows-payload.ps1'
          )
          $material=@()
          foreach ($path in $paths) {
            if (-not (Test-Path -LiteralPath $path -PathType Leaf)) { throw "Cache-key input missing: $path" }
            $digest=(Get-FileHash -LiteralPath $path -Algorithm SHA256).Hash.ToLowerInvariant()
            $material += "$path`t$digest"
          }
          if ([string]::IsNullOrWhiteSpace($env:ImageVersion)) { throw 'ImageVersion missing from hosted runner.' }
          $bytes=[System.Text.Encoding]::UTF8.GetBytes(($material -join "`n"))
          $hash=[System.Convert]::ToHexString([System.Security.Cryptography.SHA256]::HashData($bytes)).ToLowerInvariant()
          $key="fast-msix-$env:RUNNER_OS-$env:RUNNER_ARCH-$env:ImageVersion-rust-1.97.1-$hash"
          "key=$key" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          Write-Host "MSIX_CACHE_KEY=$key"

      - name: Restore exact Windows Cargo build cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ steps.msix-cache-key.outputs.key }}

      - name: Build exact VSN Desktop release executable without installer bundles
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          cargo clean -p vsn
          if ($LASTEXITCODE -ne 0) { throw 'Failed to clean cached VSN CLI product output.' }
          cargo clean -p vsn-agent
          if ($LASTEXITCODE -ne 0) { throw 'Failed to clean cached VSN Agent product output.' }
          cargo clean -p vsn-desktop
          if ($LASTEXITCODE -ne 0) { throw 'Failed to clean cached VSN Desktop product output.' }
          Remove-Item -Recurse -Force 'target/pkg03' -ErrorAction SilentlyContinue
          Push-Location apps/desktop
          npm ci --no-audit --no-fund
          if ($LASTEXITCODE -ne 0) { throw 'Desktop npm ci failed.' }
          $tauri=(& .\node_modules\.bin\tauri.cmd --version | Out-String).Trim()
          if ($tauri -ne 'tauri-cli 2.11.4') { throw "Unexpected Tauri CLI: $tauri" }
          & .\node_modules\.bin\tauri.cmd build --no-bundle
          if ($LASTEXITCODE -ne 0) { throw "Tauri release no-bundle build failed with exit code $LASTEXITCODE" }
          Pop-Location
          git diff --exit-code -- apps/desktop/package.json apps/desktop/package-lock.json Cargo.toml Cargo.lock
          if ($LASTEXITCODE -ne 0) { throw 'Locked dependency graph drifted during product build.' }
          $desktop='target/release/VSN Dev Platform.exe'
          if (-not (Test-Path -LiteralPath $desktop -PathType Leaf)) { throw 'Exact VSN Desktop release executable missing.' }
          $sig=Get-AuthenticodeSignature -LiteralPath $desktop
          if ([string]$sig.Status -ne 'NotSigned') { throw "Release executable unexpectedly signed in preimplementation lane: $($sig.Status)" }
          Write-Host "VSN_PRODUCT_EXE_SHA256=$((Get-FileHash -LiteralPath $desktop -Algorithm SHA256).Hash.ToLowerInvariant())"

      - name: Package actual VSN Desktop executable into unsigned fixture-identity MSIX
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          & scripts/ci/pkg03-msix-product-shell-package.ps1 -OutputDir '.fast-msix-product-out' -ProductExe 'target/release/VSN Dev Platform.exe'
          if ($LASTEXITCODE -ne 0) { throw 'Product-shell MSIX package gate failed.' }

      - name: Validate actual product-shell package evidence
        shell: pwsh
        env:
          EXPECTED_SOURCE: ${{ github.sha }}
        run: |
          $ErrorActionPreference='Stop'
          $e=Get-Content -LiteralPath '.fast-msix-product-out/evidence.json' -Raw | ConvertFrom-Json
          if ($e.schema_version -ne 1 -or $e.lane -ne 'msix-store-preimplementation') { throw 'Unexpected product-shell evidence identity.' }
          if ($e.mode -ne 'NON_ACCEPTANCE_PREIMPLEMENTATION') { throw 'Product-shell acceptance marker missing.' }
          if ($e.source_commit -ne $env:EXPECTED_SOURCE) { throw 'Product-shell source SHA mismatch.' }
          if ($e.fixture_identity -ne $true -or $e.production_identity_present -ne $false) { throw 'Product-shell identity boundary drifted.' }
          if ($e.product_binary_used -ne $true) { throw 'Actual product binary was not packaged.' }
          if ($e.product_binary_build_mode -ne 'tauri-release-no-bundle') { throw 'Unexpected product build mode.' }
          if ($e.product_binary_authenticode_status -ne 'NotSigned') { throw 'Product executable must remain unsigned in preimplementation.' }
          if ($e.product_binary_sha256 -notmatch '^[0-9a-f]{64}$' -or $e.unpacked_product_binary_sha256 -notmatch '^[0-9a-f]{64}$') { throw 'Invalid product binary digest.' }
          if ($e.product_binary_sha256 -ne $e.unpacked_product_binary_sha256 -or $e.product_binary_roundtrip_hash_match -ne $true) { throw 'Product binary byte identity was not preserved.' }
          if ($e.package_signature_present -ne $false -or $e.package_signed -ne $false) { throw 'Product-shell fixture package must remain unsigned.' }
          if ($e.store_submission_performed -ne $false -or $e.production_evidence_consumed -ne $false) { throw 'Product-shell fixture crossed production boundary.' }
          if ($e.canonical_state_changed -ne $false -or $e.implementation_authority -ne $false) { throw 'Product-shell fixture projected authority/state.' }
          if ($e.standalone_full_feature_store_package_ready -ne $false) { throw 'Store shell must not claim standalone full-feature readiness.' }
          if ($e.required_runtime_boundary -ne 'external_or_preprovisioned_authenticated_agent') { throw 'Agent runtime boundary drifted.' }
          if ($e.direct_installer_lane_must_remain -ne $true) { throw 'Direct installer lane retention marker missing.' }
          if ($e.package_roundtrip_unpack_pass -ne $true) { throw 'Product-shell MSIX round-trip unpack did not pass.' }
          Write-Host 'PKG03_MSIX_PRODUCT_SHELL_EVIDENCE=PASS'

      - name: Probe Windows App Certification Kit against unsigned product-shell MSIX
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          & scripts/ci/pkg03-msix-wack-preflight.ps1 -PackagePath '.fast-msix-product-out/vsn-fast-epoch-product-shell.msix' -OutputDir '.fast-msix-wack-out'
          if ($LASTEXITCODE -ne 0) { throw 'WACK preflight harness failed.' }

      - name: Validate WACK preflight evidence remains non-acceptance
        shell: pwsh
        env:
          EXPECTED_SOURCE: ${{ github.sha }}
        run: |
          $ErrorActionPreference='Stop'
          $e=Get-Content -LiteralPath '.fast-msix-wack-out/evidence.json' -Raw | ConvertFrom-Json
          if ($e.schema_version -ne 1 -or $e.lane -ne 'msix-store-preimplementation') { throw 'Unexpected WACK evidence identity.' }
          if ($e.mode -ne 'NON_ACCEPTANCE_PREIMPLEMENTATION') { throw 'WACK preflight mode drifted.' }
          if ($e.source_commit -ne $env:EXPECTED_SOURCE) { throw 'WACK source SHA mismatch.' }
          if ($e.package_sha256 -notmatch '^[0-9a-f]{64}$') { throw 'Invalid WACK package digest.' }
          if ($e.package_signed -ne $false -or $e.production_identity_present -ne $false) { throw 'WACK preflight crossed production package boundary.' }
          if ($e.wack_required_for_production_preflight -ne $true) { throw 'WACK production-preflight requirement marker missing.' }
          if ($e.certification_pass_claimed -ne $false -or $e.production_acceptance -ne $false) { throw 'WACK fixture projected certification acceptance.' }
          if ($e.store_submission_performed -ne $false -or $e.production_evidence_consumed -ne $false) { throw 'WACK preflight crossed Store/production evidence boundary.' }
          if ($e.canonical_state_changed -ne $false -or $e.implementation_authority -ne $false) { throw 'WACK preflight projected authority/state.' }
          if ($e.required_runtime_boundary -ne 'external_or_preprovisioned_authenticated_agent' -or $e.direct_installer_lane_must_remain -ne $true) { throw 'WACK preflight drifted distribution boundary.' }
          if ($e.environment_ready -eq $true) {
            if ($e.appcert_present -ne $true -or $e.active_user_session -ne $true -or $e.administrator_token -ne $true) { throw 'WACK environment-ready evidence inconsistent.' }
            if ($e.reset_invoked -ne $true) { throw 'WACK reset was not invoked in a ready environment.' }
            if ($e.reset_exit_code -eq 0 -and $e.test_invoked -ne $true) { throw 'WACK package test was not invoked after successful reset.' }
            if ($e.test_invoked -eq $true -and $e.test_exit_code -eq 0 -and $e.report_exists -ne $true) { throw 'Successful WACK process exit did not produce a report.' }
          }
          else {
            if ([string]::IsNullOrWhiteSpace([string]$e.environment_blocker)) { throw 'Unavailable WACK environment lacks explicit blocker.' }
            if ($e.test_invoked -ne $false) { throw 'WACK package test ran despite unavailable environment.' }
          }
          Write-Host "PKG03_MSIX_WACK_EVIDENCE=PASS outcome=$($e.wack_outcome)"

      - name: Test-sign, register, query and remove actual product-shell MSIX
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          & scripts/ci/pkg03-msix-test-install.ps1 -PackagePath '.fast-msix-product-out/vsn-fast-epoch-product-shell.msix' -OutputDir '.fast-msix-install-out'
          if ($LASTEXITCODE -ne 0) { throw 'MSIX test-install lifecycle harness failed.' }

      - name: Validate test-install evidence remains non-production
        shell: pwsh
        env:
          EXPECTED_SOURCE: ${{ github.sha }}
        run: |
          $ErrorActionPreference='Stop'
          $e=Get-Content -LiteralPath '.fast-msix-install-out/evidence.json' -Raw | ConvertFrom-Json
          if ($e.schema_version -ne 1 -or $e.lane -ne 'msix-store-preimplementation') { throw 'Unexpected test-install evidence identity.' }
          if ($e.mode -ne 'NON_ACCEPTANCE_PREIMPLEMENTATION') { throw 'Test-install mode drifted.' }
          if ($e.source_commit -ne $env:EXPECTED_SOURCE) { throw 'Test-install source SHA mismatch.' }
          if ($e.fixture_identity -ne $true -or $e.production_identity_present -ne $false) { throw 'Test-install identity boundary drifted.' }
          if ($e.test_certificate_used -ne $true -or $e.private_key_material_recorded -ne $false) { throw 'Ephemeral test certificate hygiene marker invalid.' }
          if ($e.test_signature_verified -ne $true) { throw 'Test MSIX signature was not verified.' }
          if ($e.package_registration_pass -ne $true -or $e.package_removal_pass -ne $true) { throw 'MSIX registration lifecycle did not fully pass.' }
          if ($e.registered_name -ne 'VSN.FastEpochFixture' -or $e.registered_version -ne '0.38.1.0') { throw 'Registered package identity/version drifted.' }
          if ($e.application_launch_tested -ne $false) { throw 'Registration gate must not claim app launch.' }
          if ($e.store_submission_performed -ne $false -or $e.production_evidence_consumed -ne $false -or $e.production_acceptance -ne $false) { throw 'Test-install crossed production boundary.' }
          if ($e.canonical_state_changed -ne $false -or $e.implementation_authority -ne $false) { throw 'Test-install projected authority/state.' }
          if ($e.standalone_full_feature_store_package_ready -ne $false) { throw 'Test-install projected standalone Store readiness.' }
          if ($e.required_runtime_boundary -ne 'external_or_preprovisioned_authenticated_agent' -or $e.direct_installer_lane_must_remain -ne $true) { throw 'Test-install drifted distribution boundary.' }
          Write-Host 'PKG03_MSIX_TEST_INSTALL_EVIDENCE=PASS'

      - name: Cleanup and prove zero repository drift
        if: always()
        shell: pwsh
        run: |
          Remove-Item -Recurse -Force '.fast-msix-out','.fast-msix-product-out','.fast-msix-wack-out','.fast-msix-install-out','apps/desktop/dist','target/pkg03' -ErrorAction SilentlyContinue
          Remove-Item -LiteralPath 'apps/desktop/src-tauri/gen/schemas/windows-schema.json' -Force -ErrorAction SilentlyContinue
          if (@(Get-AppxPackage -Name 'VSN.FastEpochFixture' -ErrorAction SilentlyContinue).Count -ne 0) { throw 'Fixture MSIX remained registered after cleanup.' }
          if (@(git status --porcelain=v1).Count -ne 0) {
            git status --short
            throw 'MSIX gate left repository drift.'
          }
