name: PKG-01 01.07 Apply Policy Parse Fix

on:
  push:
    branches:
      - pkg01/clippy-after-pr7
    paths:
      - .github/workflows/pkg01-0107-apply-policy-parse.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact branch head
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify source blob identity
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object crates/vsn-policy/src/lib.rs)" = "395e5995614f0e4470fbdff57fb3f27f3a2a4ce4"

      - name: Apply exact asserted fix
        shell: python
        run: |
          from pathlib import Path
          path = Path("crates/vsn-policy/src/lib.rs")
          text = path.read_text(encoding="utf-8")
          old = "    pub fn from_str(value: &str) -> Option<Self> {"
          new = "    pub fn parse(value: &str) -> Option<Self> {"
          if text.count(old) != 1:
              raise SystemExit(f"expected exactly one policy parser declaration, found {text.count(old)}")
          path.write_text(text.replace(old, new, 1), encoding="utf-8")

      - name: Verify patch shape
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          git diff -- crates/vsn-policy/src/lib.rs
          test "$(git diff --name-only)" = "crates/vsn-policy/src/lib.rs"
          git diff --exit-code -- Cargo.lock
          ! grep -F "pub fn from_str(value: &str) -> Option<Self>" crates/vsn-policy/src/lib.rs
          grep -F "pub fn parse(value: &str) -> Option<Self>" crates/vsn-policy/src/lib.rs

      - name: Commit exact fix to active branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "vsn-ci"
          git config user.email "vsn-ci@users.noreply.github.com"
          git add -- crates/vsn-policy/src/lib.rs
          git commit -m "fix(pkg01): disambiguate permission parser"
          git push origin HEAD:pkg01/clippy-after-pr7
