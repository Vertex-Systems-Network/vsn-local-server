name: PKG-06 Remote Runtime Trust Audit

on:
  push:
    branches:
      - audit/pkg06-remote-runtime-trust
    paths:
      - .github/workflows/pkg06-remote-runtime-trust-audit.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  remote-runtime-trust:
    name: Remote RuntimeManage unsigned-catalog composition
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout exact audit head
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@1.97.1

      - name: Verify Agent remote mapping source contract
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re
          text = Path('apps/agent/src/main.rs').read_text(encoding='utf-8')
          start = text.index('fn required_remote_permission')
          end = text.index('\nfn respond', start)
          section = text[start:end]
          if not re.search(r'"runtime\.install"[\s\S]*?=>\s*RuntimeManage', section):
              raise SystemExit('runtime.install is not proven mapped to RuntimeManage')
          print('remote_runtime_install_mapped_to_runtime_manage=true')
          PY

      - name: Build isolated composition probe
        shell: bash
        run: |
          set -euo pipefail
          probe="$RUNNER_TEMP/pkg06-runtime-trust-probe"
          mkdir -p "$probe/src"
          cat > "$probe/Cargo.toml" <<EOF
          [package]
          name = "pkg06-runtime-trust-probe"
          version = "0.0.0"
          edition = "2021"
          publish = false

          [dependencies]
          vsn-core = { path = "$GITHUB_WORKSPACE/crates/vsn-core" }
          vsn-policy = { path = "$GITHUB_WORKSPACE/crates/vsn-policy" }
          vsn-runtime = { path = "$GITHUB_WORKSPACE/crates/vsn-runtime" }
          serde_json = "1"
          sha2 = "0.10"
          EOF
          cat > "$probe/src/main.rs" <<'RS'
          use sha2::{Digest, Sha256};
          use std::{env, fs, path::PathBuf};
          use vsn_policy::{Permission, Principal};
          use vsn_runtime::{RuntimeArtifact, RuntimeCatalog, RuntimeCatalogTrust, RuntimeRelease};

          fn main() {
              let root = PathBuf::from(env::var("PROBE_ROOT").expect("PROBE_ROOT"));
              fs::create_dir_all(&root).expect("create probe root");

              let artifact = root.join("probe-runtime.bin");
              let bytes = b"VSN PKG-06 unsigned runtime trust probe\n";
              fs::write(&artifact, bytes).expect("write probe artifact");
              let sha256 = format!("{:x}", Sha256::digest(bytes));
              let (os, arch) = vsn_runtime::target_triple_parts();

              let catalog = RuntimeCatalog {
                  schema_version: 1,
                  provider: "audit.unsigned".into(),
                  runtimes: vec![RuntimeRelease {
                      runtime: "probe-runtime".into(),
                      version: "1.0.0".into(),
                      artifacts: vec![RuntimeArtifact {
                          os,
                          arch,
                          url: format!("file://{}", artifact.display()),
                          sha256,
                          archive: "binary".into(),
                          executable_relpath: "bin/probe-runtime".into(),
                      }],
                  }],
                  signature: None,
              };
              let catalog_path = root.join("unsigned-catalog.json");
              fs::write(
                  &catalog_path,
                  serde_json::to_vec_pretty(&catalog).expect("serialize catalog"),
              )
              .expect("write unsigned catalog");

              let trust_path = root.join("trust.json");
              fs::write(
                  &trust_path,
                  serde_json::to_vec_pretty(&RuntimeCatalogTrust { public_keys: vec![] })
                      .expect("serialize trust"),
              )
              .expect("write trust file");

              let verified = vsn_runtime::load_catalog_verified(&catalog_path, &trust_path);
              assert!(verified.is_err(), "unsigned catalog unexpectedly passed trusted verification");
              println!("trusted_loader_rejects_unsigned_catalog=true");

              let principal = Principal::remote_delegated("audit-remote", Permission::RuntimeManage)
                  .expect("RuntimeManage is currently remotely delegatable");
              println!("remote_runtime_manage_delegation_allowed=true");

              let installed = vsn_core::runtime_install(
                  &principal,
                  &catalog_path,
                  "probe-runtime",
                  "1.0.0",
              )
              .expect("current core runtime.install accepts the unsigned catalog composition");
              let installed_bytes = fs::read(&installed.executable).expect("read installed probe runtime");
              assert_eq!(installed_bytes, bytes, "installed bytes differ from source artifact");
              println!("unsigned_catalog_runtime_install_accepted=true");
              println!("installed_artifact_hash_bound=true");
          }
          RS
          cargo build --quiet --manifest-path "$probe/Cargo.toml"

      - name: Exercise isolated runtime trust composition
        shell: bash
        run: |
          set -euo pipefail
          export XDG_DATA_HOME="$RUNNER_TEMP/vsn-pkg06-data"
          export XDG_CONFIG_HOME="$RUNNER_TEMP/vsn-pkg06-config"
          export PROBE_ROOT="$RUNNER_TEMP/vsn-pkg06-probe"
          probe="$RUNNER_TEMP/pkg06-runtime-trust-probe/target/debug/pkg06-runtime-trust-probe"
          output="$RUNNER_TEMP/pkg06-runtime-trust-output.txt"
          "$probe" | tee "$output"

          grep -Fxq 'trusted_loader_rejects_unsigned_catalog=true' "$output"
          grep -Fxq 'remote_runtime_manage_delegation_allowed=true' "$output"
          grep -Fxq 'unsigned_catalog_runtime_install_accepted=true' "$output"
          grep -Fxq 'installed_artifact_hash_bound=true' "$output"

          cat > "$RUNNER_TEMP/pkg06-remote-runtime-trust-evidence.json" <<EOF
          {
            "schema_version": 1,
            "source_sha": "$GITHUB_SHA",
            "runner_os": "$RUNNER_OS",
            "runner_arch": "$RUNNER_ARCH",
            "agent_remote_runtime_install_mapping": true,
            "remote_runtime_manage_delegation_allowed": true,
            "trusted_loader_rejects_unsigned_catalog": true,
            "unsigned_catalog_runtime_install_accepted": true,
            "installed_artifact_hash_bound": true,
            "production_or_user_state_touched": false,
            "scope": "isolated composition proof; no remote control plane or product configuration mutation"
          }
          EOF
          cat "$RUNNER_TEMP/pkg06-remote-runtime-trust-evidence.json"
          rm -rf "$XDG_DATA_HOME" "$XDG_CONFIG_HOME" "$PROBE_ROOT" "$output"

      - name: Upload non-secret audit evidence
        uses: actions/upload-artifact@v4
        with:
          name: pkg06-remote-runtime-trust-audit
          path: ${{ runner.temp }}/pkg06-remote-runtime-trust-evidence.json
          if-no-files-found: error
          retention-days: 7
