name: Repository Governance

on:
  push:
    branches:
      - main
      - chore/**
      - pkg01/**
      - pkg02/**
      - pkg03/**
      - pkg04/**
      - pkg05/**
      - pkg06/**
      - pkg07/**
      - pkg08/**
      - security/**
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  governance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Validate repository hygiene and execution status
        run: python3 scripts/repository-governance.py
      - name: Validate GitHub Actions trust boundaries
        run: python3 scripts/ci/workflow-security-governance.py
