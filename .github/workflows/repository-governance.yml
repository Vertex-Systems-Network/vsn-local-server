name: Repository Governance

on:
  push:
    branches:
      - main
      - chore/**
      - pkg01/**
      - pkg02/**
      - pkg03/**
      - pkg04/**
      - pkg05/**
      - pkg06/**
      - pkg07/**
      - pkg08/**
      - security/**
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  governance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Validate repository hygiene and execution status
        run: python3 scripts/repository-governance.py
