name: TMP PKG-01 Fix vsn-ai

on:
  pull_request:
    branches: [main]
    types: [synchronize]

permissions:
  contents: write

jobs:
  fix-vsn-ai:
    if: github.event.pull_request.head.ref == 'pkg01/clippy-after-pr7'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          ref: pkg01/clippy-after-pr7
          fetch-depth: 0

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.97.1
          components: rustfmt, clippy

      - name: Add missing vsn-ai dependency
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('apps/agent/Cargo.toml')
          text = p.read_text()
          line = 'vsn-ai = { path = "../../crates/vsn-ai" }\n'
          if line not in text:
              anchor = 'vsn-audit = { path = "../../crates/vsn-audit" }\n'
              if anchor not in text:
                  raise SystemExit('expected vsn-audit dependency anchor missing')
              text = text.replace(anchor, line + anchor, 1)
              p.write_text(text)
          PY

      - name: Regenerate lockfile for agent graph
        run: cargo check -p vsn-agent

      - name: Verify formatting
        run: cargo fmt --all -- --check

      - name: Commit dependency and regenerated lockfile, remove probe
        shell: bash
        run: |
          rm .github/workflows/tmp-pkg01-fix-vsn-ai.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- apps/agent/Cargo.toml Cargo.lock .github/workflows/tmp-pkg01-fix-vsn-ai.yml
          if git diff --cached --quiet; then
            echo "No dependency/lockfile changes to commit"
          else
            git commit -m "fix(agent): link vsn-ai dependency"
            git push origin HEAD:pkg01/clippy-after-pr7
          fi

      - name: Probe agent Clippy on patched graph
        run: cargo clippy -p vsn-agent --all-targets --locked -- -D warnings
