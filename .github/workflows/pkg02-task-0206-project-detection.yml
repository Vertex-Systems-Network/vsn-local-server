name: PKG-02 02.06 Project Detection and Dependencies

on:
  push:
    branches:
      - pkg02/**
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  project-detection:
    name: 02.06 Registered workspace project detection and dependency analysis
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux project acceptance dependency
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends keyutils
          test "$(rustc --version | awk '{print $2}')" = "1.97.1"
          test "$(cargo --version | awk '{print $2}')" = "1.97.1"

      - name: Verify project operator containment source invariants
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'project.detect' apps/agent/src/main.rs
          grep -q 'project.dependencies' apps/agent/src/main.rs
          grep -q 'cmd == "project" && sub == "detect"' apps/cli/src/main.rs
          grep -q 'cmd == "project" && sub == "dependencies"' apps/cli/src/main.rs
          grep -q 'pub fn project_detect' crates/vsn-core/src/lib.rs
          grep -q 'pub fn project_dependencies' crates/vsn-core/src/lib.rs
          grep -q 'vsn_files::resolve_existing(&roots, path)' crates/vsn-core/src/lib.rs
          cargo test --locked --package vsn-project
          git diff --check

      - name: Build current Agent and CLI from locked source
        shell: bash
        run: |
          set -euo pipefail
          cargo build --locked --release --package vsn-agent --package vsn
          mkdir -p dist-pkg02/02.06/bin
          cp target/release/vsn-agent dist-pkg02/02.06/bin/vsn-agent
          cp target/release/vsn dist-pkg02/02.06/bin/vsn
          chmod +x dist-pkg02/02.06/bin/vsn-agent dist-pkg02/02.06/bin/vsn
          sha256sum dist-pkg02/02.06/bin/vsn-agent > dist-pkg02/02.06/vsn-agent.sha256
          sha256sum dist-pkg02/02.06/bin/vsn > dist-pkg02/02.06/vsn.sha256

      - name: Run real registered-workspace project acceptance
        shell: keyctl session vsn-pkg02-0206 bash --noprofile --norc -eo pipefail {0}
        run: |
          set -euo pipefail
          root=dist-pkg02/02.06
          bin="$root/bin"
          sandbox="$RUNNER_TEMP/vsn-pkg02-0206"
          workspace="$sandbox/workspace"
          outside="$sandbox/outside"
          export XDG_CONFIG_HOME="$sandbox/config"
          export XDG_DATA_HOME="$sandbox/data"
          mkdir -p "$workspace" "$outside" "$XDG_CONFIG_HOME" "$XDG_DATA_HOME"
          keyctl rdescribe @s > "$root/session-keyring.txt"

          laravel="$workspace/laravel-app"
          node_unlocked="$workspace/node-unlocked"
          django="$workspace/django-app"
          goapp="$workspace/go-app"
          rustapp="$workspace/rust-app"
          generic="$workspace/generic-app"
          malformed="$workspace/malformed-node"
          outside_project="$outside/outside-node"
          mkdir -p "$laravel" "$node_unlocked" "$django" "$goapp" "$rustapp" "$generic" "$malformed" "$outside_project"

          touch "$laravel/artisan"
          cat > "$laravel/composer.json" <<'JSON'
          {"require":{"php":"^8.3","ext-pdo":"*"}}
          JSON
          cat > "$laravel/package.json" <<'JSON'
          {"engines":{"node":">=20","npm":">=10"}}
          JSON
          printf '{"lockfileVersion":3}\n' > "$laravel/package-lock.json"
          cat > "$laravel/.env" <<'ENV'
          DB_CONNECTION=mysql
          REDIS_HOST=127.0.0.1
          # MONGODB_URI=mongodb://disabled
          ENV
          cat > "$laravel/docker-compose.yml" <<'YAML'
          services:
            cache:
              image: redis:7
            database:
              image: postgres:16
          # mongodb: disabled example only
          YAML

          cat > "$node_unlocked/package.json" <<'JSON'
          {"engines":{"node":">=18"}}
          JSON

          printf '[project]\nname="demo"\n' > "$django/pyproject.toml"
          touch "$django/manage.py"
          printf 'module example.test/demo\n\ngo 1.23\n' > "$goapp/go.mod"
          printf '[package]\nname="demo"\nversion="0.1.0"\n' > "$rustapp/Cargo.toml"
          printf 'generic fixture\n' > "$generic/README.md"
          printf '{"engines":{"node":">=20"}\n' > "$malformed/package.json"
          printf '{"engines":{"node":">=20"}}\n' > "$outside_project/package.json"
          ln -s "$outside_project" "$workspace/outside-link"

          "$bin/vsn-agent" > "$root/agent.log" 2>&1 &
          agent_pid=$!
          echo "$agent_pid" > "$root/agent.pid"
          cleanup() {
            if kill -0 "$agent_pid" 2>/dev/null; then
              kill -INT "$agent_pid" || true
              for _ in $(seq 1 50); do
                if ! kill -0 "$agent_pid" 2>/dev/null; then break; fi
                sleep 0.1
              done
              if kill -0 "$agent_pid" 2>/dev/null; then kill -KILL "$agent_pid" || true; fi
            fi
          }
          trap cleanup EXIT

          ready=false
          for _ in $(seq 1 80); do
            if "$bin/vsn" ping > "$root/readiness-ping.json" 2> "$root/readiness-ping.err"; then
              ready=true
              break
            fi
            if ! kill -0 "$agent_pid" 2>/dev/null; then
              cat "$root/agent.log" >&2 || true
              exit 1
            fi
            sleep 0.25
          done
          test "$ready" = true

          "$bin/vsn" workspace add "$workspace" > "$root/workspace-add.json"
          "$bin/vsn" workspace list > "$root/workspace-list.json"

          "$bin/vsn" project detect "$laravel" > "$root/laravel-detect.json"
          "$bin/vsn" project dependencies "$laravel" > "$root/laravel-dependencies.json"
          "$bin/vsn" project detect "$node_unlocked" > "$root/node-detect.json"
          "$bin/vsn" project dependencies "$node_unlocked" > "$root/node-dependencies.json"
          "$bin/vsn" project detect "$django" > "$root/django-detect.json"
          "$bin/vsn" project dependencies "$django" > "$root/django-dependencies.json"
          "$bin/vsn" project detect "$goapp" > "$root/go-detect.json"
          "$bin/vsn" project dependencies "$goapp" > "$root/go-dependencies.json"
          "$bin/vsn" project detect "$rustapp" > "$root/rust-detect.json"
          "$bin/vsn" project dependencies "$rustapp" > "$root/rust-dependencies.json"
          "$bin/vsn" project detect "$generic" > "$root/generic-detect.json"

          set +e
          "$bin/vsn" project dependencies "$malformed" > "$root/malformed.stdout" 2> "$root/malformed.stderr"
          malformed_code=$?
          "$bin/vsn" project detect "$outside_project" > "$root/outside.stdout" 2> "$root/outside.stderr"
          outside_code=$?
          "$bin/vsn" project detect "$workspace/outside-link" > "$root/symlink.stdout" 2> "$root/symlink.stderr"
          symlink_code=$?
          set -e
          printf '%s\n' "$malformed_code" > "$root/malformed.exit-code.txt"
          printf '%s\n' "$outside_code" > "$root/outside.exit-code.txt"
          printf '%s\n' "$symlink_code" > "$root/symlink.exit-code.txt"
          test "$malformed_code" -ne 0
          test "$outside_code" -ne 0
          test "$symlink_code" -ne 0

          python3 - <<'PY'
          import json
          from pathlib import Path
          root = Path('dist-pkg02/02.06')

          def load(name):
              return json.loads((root / name).read_text())

          workspace = load('workspace-list.json')
          assert isinstance(workspace, list) and len(workspace) == 1

          laravel = load('laravel-detect.json')
          assert laravel['project_type'] == 'laravel'
          assert laravel['frameworks'] == ['laravel']
          assert 'php' in laravel['runtimes'] and 'node' in laravel['runtimes']
          assert laravel['package_managers'] == ['composer', 'npm']
          assert laravel['databases'] == ['mysql']
          assert set(laravel['services']) == {'postgres', 'redis'}
          assert 'mongodb' not in laravel['services'] and 'mongodb' not in laravel['databases']

          deps = load('laravel-dependencies.json')
          req = {(r['kind'], r['name'], r.get('constraint'), r['source']) for r in deps['requirements']}
          assert ('runtime', 'php', '^8.3', 'composer.json') in req
          assert ('extension', 'ext-pdo', '*', 'composer.json') in req
          assert ('runtime_or_tool', 'node', '>=20', 'package.json#engines') in req
          assert ('runtime_or_tool', 'npm', '>=10', 'package.json#engines') in req
          commands = [r.get('command') for r in deps['remediation'] if r.get('command')]
          assert ['composer', 'install', '--no-interaction'] in commands
          assert ['npm', 'ci'] in commands

          node = load('node-detect.json')
          assert node['project_type'] == 'node'
          assert node['frameworks'] == []
          assert node['runtimes'] == ['node']
          assert node['package_managers'] == ['npm']
          node_deps = load('node-dependencies.json')
          node_commands = [r.get('command') for r in node_deps['remediation'] if r.get('command')]
          assert ['npm', 'install'] in node_commands
          assert ['npm', 'ci'] not in node_commands

          django = load('django-detect.json')
          assert django['project_type'] == 'django'
          assert django['frameworks'] == ['django']
          assert django['runtimes'] == ['python']
          assert django['package_managers'] == ['python-package']
          assert any(r['name'] == 'python' and r['source'] == 'pyproject.toml' for r in load('django-dependencies.json')['requirements'])

          go = load('go-detect.json')
          assert go['project_type'] == 'go'
          assert go['runtimes'] == ['go'] and go['package_managers'] == ['go-modules']
          assert any(r['name'] == 'go' and r['source'] == 'go.mod' for r in load('go-dependencies.json')['requirements'])

          rust = load('rust-detect.json')
          assert rust['project_type'] == 'rust'
          assert rust['runtimes'] == ['rust'] and rust['package_managers'] == ['cargo']
          assert any(r['name'] == 'rust' and r['source'] == 'Cargo.toml' for r in load('rust-dependencies.json')['requirements'])

          generic = load('generic-detect.json')
          assert generic['project_type'] == 'generic'
          assert generic['frameworks'] == [] and generic['runtimes'] == []
          assert generic['package_managers'] == []
          PY

          grep -q '^error=' "$root/malformed.stderr"
          grep -q '^error=' "$root/outside.stderr"
          grep -q '^error=' "$root/symlink.stderr"

          kill -INT "$agent_pid"
          set +e
          wait "$agent_pid"
          exit_code=$?
          set -e
          trap - EXIT
          echo "$exit_code" > "$root/agent-exit-code.txt"
          test "$exit_code" -eq 0
          test ! -e /proc/$agent_pid

      - name: Preserve failed 02.06 diagnostics
        if: ${{ failure() }}
        uses: actions/upload-artifact@v7
        with:
          name: pkg02-0206-project-detection-failure
          path: dist-pkg02/02.06
          if-no-files-found: warn

      - name: Package 02.06 evidence
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path
          root = Path('dist-pkg02/02.06')
          candidate = json.loads(Path('docs/release-candidate-current.json').read_text())
          def digest(path):
              return hashlib.sha256(Path(path).read_bytes()).hexdigest()
          evidence = {
              'schema_version': 1,
              'package_id': 'PKG-02',
              'task_id': '02.06',
              'artifact': 'registered-workspace-project-detection-dependencies',
              'product_version': candidate['product_version'],
              'candidate_id': candidate['candidate_id'],
              'source_commit': os.environ['GITHUB_SHA'],
              'rust_version': '1.97.1',
              'build_mode': 'locked-release-from-current-source',
              'agent_sha256': digest(root / 'bin/vsn-agent'),
              'cli_sha256': digest(root / 'bin/vsn'),
              'registered_workspace_only': True,
              'laravel_detection_verified': True,
              'node_detection_verified': True,
              'django_detection_verified': True,
              'go_detection_verified': True,
              'rust_detection_verified': True,
              'generic_detection_verified': True,
              'manifest_constraints_verified': True,
              'commented_service_false_positive_rejected': True,
              'malformed_manifest_fail_closed': int((root / 'malformed.exit-code.txt').read_text()) != 0,
              'outside_workspace_rejected': int((root / 'outside.exit-code.txt').read_text()) != 0,
              'symlink_escape_rejected': int((root / 'symlink.exit-code.txt').read_text()) != 0,
              'npm_unlocked_uses_install': True,
              'clean_shutdown_exit_code': int((root / 'agent-exit-code.txt').read_text()),
          }
          assert evidence['malformed_manifest_fail_closed']
          assert evidence['outside_workspace_rejected']
          assert evidence['symlink_escape_rejected']
          assert evidence['clean_shutdown_exit_code'] == 0
          (root / 'evidence.json').write_text(json.dumps(evidence, indent=2, sort_keys=True) + '\n')
          PY
          sha256sum dist-pkg02/02.06/evidence.json > dist-pkg02/02.06/evidence.json.sha256
          git diff --check

      - uses: actions/upload-artifact@v7
        with:
          name: pkg02-0206-project-detection
          path: dist-pkg02/02.06
          if-no-files-found: error
