name: Engineering Contract Governance

on:
  pull_request:
    paths:
      - '.ai/**'
      - 'scripts/engineering-contract-governance.py'
      - '.github/workflows/engineering-contract-governance.yml'
  push:
    branches:
      - main
    paths:
      - '.ai/**'
      - 'scripts/engineering-contract-governance.py'
      - '.github/workflows/engineering-contract-governance.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  engineering-contract-governance:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 1
      - name: Validate Engineering Governance V3.1 contracts
        run: python3 scripts/engineering-contract-governance.py
