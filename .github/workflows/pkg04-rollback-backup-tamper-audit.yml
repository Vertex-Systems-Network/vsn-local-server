name: PKG-04 Rollback Backup Tamper Audit

on:
  push:
    branches:
      - audit/pkg04-rollback-backup-tamper
    paths:
      - .github/workflows/pkg04-rollback-backup-tamper-audit.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rollback-tamper:
    name: ${{ matrix.os }} rollback backup tamper
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - name: Checkout exact audit head
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@1.97.1

      - name: Build and run isolated rollback + durability diagnostic probe
        shell: bash
        run: |
          set -euo pipefail
          probe=".audit-pkg04-rollback-probe"
          mkdir -p "$probe/src"
          cat > "$probe/Cargo.toml" <<'EOF'
          [package]
          name = "pkg04-rollback-tamper-probe"
          version = "0.0.0"
          edition = "2021"
          publish = false

          [workspace]

          [dependencies]
          vsn-update = { path = "../crates/vsn-update" }
          sha2 = "0.10"
          EOF
          cat > "$probe/src/main.rs" <<'RS'
          use sha2::{Digest, Sha256};
          use std::{fs, process, time::{SystemTime, UNIX_EPOCH}};
          use vsn_update::{apply_verified_file, rollback_verified_file, ApplyFileRequest};

          fn now_ms() -> u128 {
              SystemTime::now().duration_since(UNIX_EPOCH).unwrap().as_millis()
          }
          fn hex_sha256(bytes: &[u8]) -> String {
              format!("{:x}", Sha256::digest(bytes))
          }

          fn main() {
              // Mirror the current private fsync_file shape directly: it opens a
              // read-only handle and calls sync_all(). Compare to a read+write handle.
              let sync_root = std::env::temp_dir().join(format!("vsn-pkg04-sync-audit-{}-{}", process::id(), now_ms()));
              fs::create_dir_all(&sync_root).expect("create sync root");
              let sync_path = sync_root.join("probe.bin");
              fs::write(&sync_path, b"sync-probe\n").expect("write sync probe");
              let read_only_sync = fs::OpenOptions::new()
                  .read(true)
                  .open(&sync_path)
                  .and_then(|file| file.sync_all());
              let read_write_sync = fs::OpenOptions::new()
                  .read(true)
                  .write(true)
                  .open(&sync_path)
                  .and_then(|file| file.sync_all());
              println!("read_only_sync_all_ok={}", read_only_sync.is_ok());
              println!("read_write_sync_all_ok={}", read_write_sync.is_ok());
              if let Err(error) = &read_only_sync {
                  println!("read_only_sync_error={}", error.to_string().replace('\n', " "));
              }
              if let Err(error) = &read_write_sync {
                  println!("read_write_sync_error={}", error.to_string().replace('\n', " "));
              }
              let _ = fs::remove_dir_all(&sync_root);
              println!("sync_probe_cleanup_complete=true");

              // Prove rollback backup identity behavior independently from apply so an
              // OS durability failure cannot mask whether unverified backup bytes move.
              let root = std::env::temp_dir().join(format!("vsn-pkg04-rollback-audit-{}-{}", process::id(), now_ms()));
              let bin = root.join("bin");
              let control = root.join(".vsn-update");
              let previous = control.join("previous");
              fs::create_dir_all(&bin).expect("create isolated install root");
              fs::create_dir_all(&previous).expect("create previous dir");

              let target = bin.join("probe-app.bin");
              let backup = previous.join("probe-app.bin.previous");
              let state = control.join("state.json");
              let v2 = b"trusted-current-v2\n";
              let tampered = b"tampered-rollback-bytes\n";
              fs::write(&target, v2).expect("write current target");
              fs::write(&backup, tampered).expect("write tampered rollback backup");
              fs::write(
                  &state,
                  b"{\"target_relative\":\"bin/probe-app.bin\",\"current_release\":\"2.0.0\",\"previous_release\":\"1.0.0\"}\n",
              ).expect("write rollback state");
              println!("rollback_backup_tampered_before_restore=true");

              let rollback_result = rollback_verified_file(&root, true);
              let rollback_ok = rollback_result.is_ok();
              let restored = fs::read(&target).expect("read post-rollback target");
              assert_eq!(restored, tampered, "current rollback must demonstrate whether tampered backup bytes are restored before any later durability result");
              println!("tampered_backup_restored_by_rollback=true");
              println!("rollback_backup_identity_reverification_absent=true");
              println!("rollback_returned_ok={rollback_ok}");
              if let Err(error) = &rollback_result {
                  println!("rollback_error={}", error.to_string().replace('\n', " "));
              }
              let _ = fs::remove_dir_all(&root);
              println!("rollback_probe_cleanup_complete=true");

              // Separate public-API apply diagnostic. Capture mutation/state postconditions.
              let apply_root = std::env::temp_dir().join(format!("vsn-pkg04-apply-audit-{}-{}", process::id(), now_ms()));
              let apply_bin = apply_root.join("bin");
              fs::create_dir_all(&apply_bin).expect("create apply root");
              let apply_target = apply_bin.join("probe-app.bin");
              let staged = apply_root.join("staged-v2.bin");
              let v1 = b"trusted-previous-v1\n";
              fs::write(&apply_target, v1).expect("write v1 target");
              fs::write(&staged, v2).expect("write v2 staged");
              let request = ApplyFileRequest {
                  install_root: apply_root.clone(),
                  target_relative: "bin/probe-app.bin".into(),
                  staged_artifact: staged,
                  expected_sha256: hex_sha256(v2),
                  release: "2.0.0".into(),
                  confirm_apply: true,
              };
              let apply_result = apply_verified_file(&request);
              let apply_ok = apply_result.is_ok();
              let target_is_v2 = fs::read(&apply_target).map(|b| b == v2).unwrap_or(false);
              let backup_exists = apply_root.join(".vsn-update/previous/probe-app.bin.previous").is_file();
              let pending_exists = apply_root.join(".vsn-update/pending/2.0.0.pending").is_file();
              let state_exists = apply_root.join(".vsn-update/state.json").is_file();
              println!("apply_returned_ok={apply_ok}");
              println!("apply_target_is_v2={target_is_v2}");
              println!("apply_backup_exists={backup_exists}");
              println!("apply_pending_exists={pending_exists}");
              println!("apply_state_exists={state_exists}");
              if let Err(error) = &apply_result {
                  println!("apply_error={}", error.to_string().replace('\n', " "));
              }
              let _ = fs::remove_dir_all(&apply_root);
              println!("apply_probe_cleanup_complete=true");
          }
          RS

          cargo run --quiet --manifest-path "$probe/Cargo.toml" | tee .audit-pkg04-rollback-output.txt
          for key in read_only_sync_all_ok read_write_sync_all_ok rollback_returned_ok apply_returned_ok apply_target_is_v2 apply_backup_exists apply_pending_exists apply_state_exists; do
            grep -Eq "^${key}=(true|false)$" .audit-pkg04-rollback-output.txt
          done
          grep -Fxq 'sync_probe_cleanup_complete=true' .audit-pkg04-rollback-output.txt
          grep -Fxq 'rollback_backup_tampered_before_restore=true' .audit-pkg04-rollback-output.txt
          grep -Fxq 'tampered_backup_restored_by_rollback=true' .audit-pkg04-rollback-output.txt
          grep -Fxq 'rollback_backup_identity_reverification_absent=true' .audit-pkg04-rollback-output.txt
          grep -Fxq 'rollback_probe_cleanup_complete=true' .audit-pkg04-rollback-output.txt
          grep -Fxq 'apply_probe_cleanup_complete=true' .audit-pkg04-rollback-output.txt

          get_bool() { sed -n "s/^$1=//p" .audit-pkg04-rollback-output.txt | tail -1; }
          read_only_sync="$(get_bool read_only_sync_all_ok)"
          read_write_sync="$(get_bool read_write_sync_all_ok)"
          rollback_ok="$(get_bool rollback_returned_ok)"
          apply_ok="$(get_bool apply_returned_ok)"
          apply_target_v2="$(get_bool apply_target_is_v2)"
          apply_backup="$(get_bool apply_backup_exists)"
          apply_pending="$(get_bool apply_pending_exists)"
          apply_state="$(get_bool apply_state_exists)"

          cat > pkg04-rollback-evidence.json <<EOF
          {
            "schema_version": 3,
            "source_sha": "$GITHUB_SHA",
            "runner_os": "$RUNNER_OS",
            "runner_arch": "$RUNNER_ARCH",
            "read_only_sync_all_ok": $read_only_sync,
            "read_write_sync_all_ok": $read_write_sync,
            "rollback_backup_tampered_before_restore": true,
            "tampered_backup_restored_by_rollback": true,
            "rollback_backup_identity_reverification_absent": true,
            "rollback_returned_ok": $rollback_ok,
            "apply_returned_ok": $apply_ok,
            "apply_target_is_v2": $apply_target_v2,
            "apply_backup_exists": $apply_backup,
            "apply_pending_exists": $apply_pending,
            "apply_state_exists": $apply_state,
            "production_or_user_state_touched": false,
            "scope": "isolated temporary roots; direct fsync handle diagnostic plus rollback identity and apply post-state proof"
          }
          EOF
          rm -rf "$probe" .audit-pkg04-rollback-output.txt

      - name: Upload non-secret audit evidence
        uses: actions/upload-artifact@v4
        with:
          name: pkg04-rollback-tamper-${{ runner.os }}
          path: pkg04-rollback-evidence.json
          if-no-files-found: error
          retention-days: 7
