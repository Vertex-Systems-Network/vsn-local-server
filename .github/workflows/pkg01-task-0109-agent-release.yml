name: PKG-01 01.09 Agent Release

on:
  push:
    branches:
      - pkg01/**
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  reconcile-ledger:
    name: TEMP reconcile canonical PKG-01 ledger
    if: github.event_name == 'push' && startsWith(github.ref_name, 'pkg01/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
      - name: Append live 01.07-01.09 evidence and restore workflow
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('VSN_AI_PROJECT_STATE.md')
          text = path.read_text()
          marker = '## 21. 2026-08-21 — PR #8 merged; 01.09 agent release certified'
          section = r'''

## 21. 2026-08-21 — PR #8 merged; 01.09 agent release certified

Live GitHub reconciliation supersedes the older snapshot sections above.

- PR #8 (`PKG-01: clear remaining workspace Clippy blockers`) merged to `main` as `99c0d9e16de4cf53ab2a316a0936c371fa003437`.
- Authoritative Build Foundation run `32455972856` on clean head `3e21738629751ce18fc52d9d220912d8fa711f99` passed all prerequisite gates through tests:
  - 01.07 Cargo Clippy job `96693481800` — **PASS**.
  - 01.08 Cargo Tests job `96694007582` — **PASS**.
- The 01.08 failure that previously blocked merge was `vsn-control-store::tests::snapshot_roundtrip_and_generation`: the test placed its DB directly under shared `/tmp`, while `SnapshotStore::open()` hardens the parent directory to mode `0700`. The fixed test uses an owned per-test temporary subdirectory and cleans it afterward; production hardening was not weakened.
- PR #10 branch `pkg01/0109-agent-release` reconciled `certification/pkg01-build-foundation-v1.json` and `docs/MASTER-EXECUTION-STATUS.json` to the live gate state.
- 01.09 dedicated workflow run `32456830259`, job `96695637607` — **PASS** for `cargo build --package vsn-agent --release --locked`.
- 01.09 artifact `9437589909` (`pkg01-0109-vsn-agent-release`) contains the verified Linux x86-64 ELF PIE `vsn-agent` release binary plus checksum/evidence metadata.
- Binary size: `30,915,800` bytes.
- Binary SHA-256: `d1f4fc47f4172b594c73f1b79e993e1ac9ad2444f466eaf7c981df677b187c18`.
- Candidate ID recorded by the evidence: `c579788ddb171fc3c094c0614b3f6e134aaa6bb2660d7e1b1856a742aebd6474`.

Current genuine PKG-01 state after this evidence:

```text
PKG-01  ████░░░░░░  9/22 = 40.91%
DONE:   01.01–01.09
ACTIVE: 01.10 Build vsn CLI release binary
NEXT:   after 01.10 PASS, activate 01.11 updater-helper release binary
```

Exact continuation rule: do not count 01.10 until a locked release build of the `vsn` CLI succeeds with artifact/checksum evidence. Keep `Cargo.lock` unchanged unless an intentional dependency-update task is opened.
'''
          if marker not in text:
              path.write_text(text.rstrip() + section + '\n')
          PY
          git checkout HEAD^ -- .github/workflows/pkg01-task-0109-agent-release.yml
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add VSN_AI_PROJECT_STATE.md .github/workflows/pkg01-task-0109-agent-release.yml
          if git diff --cached --quiet; then
            echo 'Ledger already reconciled; nothing to commit.'
            exit 0
          fi
          git commit -m 'PKG-01: reconcile canonical state through 01.09'
          git push origin HEAD:${GITHUB_REF_NAME}

  agent-release:
    name: 01.09 Build vsn-agent Release Binary
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends pkg-config libssl-dev

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.97.1'

      - name: Build locked release binary
        run: cargo build --package vsn-agent --release --locked

      - name: Verify and package evidence
        shell: bash
        run: |
          set -euo pipefail
          test -f target/release/vsn-agent
          test -x target/release/vsn-agent
          mkdir -p dist-pkg01/01.09
          cp target/release/vsn-agent dist-pkg01/01.09/vsn-agent
          sha256sum dist-pkg01/01.09/vsn-agent > dist-pkg01/01.09/vsn-agent.sha256
          file dist-pkg01/01.09/vsn-agent > dist-pkg01/01.09/vsn-agent.file.txt
          python3 - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path

          binary = Path('dist-pkg01/01.09/vsn-agent')
          candidate = json.loads(Path('docs/release-candidate-current.json').read_text())
          payload = {
              'schema_version': 1,
              'task_id': '01.09',
              'artifact': 'vsn-agent',
              'product_version': candidate['product_version'],
              'candidate_id': candidate['candidate_id'],
              'source_commit': os.environ['GITHUB_SHA'],
              'size_bytes': binary.stat().st_size,
              'sha256': hashlib.sha256(binary.read_bytes()).hexdigest(),
          }
          Path('dist-pkg01/01.09/evidence.json').write_text(
              json.dumps(payload, indent=2, sort_keys=True) + '\n'
          )
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: pkg01-0109-vsn-agent-release
          path: dist-pkg01/01.09
          if-no-files-found: error
