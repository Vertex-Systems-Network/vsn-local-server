name: PKG-01 Ledger Reconcile Final

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  reconcile:
    if: github.event.pull_request.head.ref == 'pkg01/0109-agent-release'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: pkg01/0109-agent-release
          fetch-depth: 0
      - name: Reconcile canonical ledger only
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64
          from pathlib import Path
          marker = '## 21. 2026-08-21 — PR #8 merged; 01.09 agent release certified'
          encoded = ''
          path = Path('VSN_AI_PROJECT_STATE.md')
          text = path.read_text()
          section = base64.b64decode(encoded).decode('utf-8').strip()
          if marker not in text:
              path.write_text(text.rstrip() + '\n\n' + section + '\n')
          PY
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add VSN_AI_PROJECT_STATE.md
          git diff --cached --check
          if git diff --cached --quiet; then
            echo 'Ledger already reconciled.'
            exit 0
          fi
          git commit -m 'PKG-01: reconcile canonical state through 01.09'
          git push origin HEAD:pkg01/0109-agent-release
