name: PKG-01 Current Clippy Diagnostic

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  diagnose:
    if: github.event.pull_request.head.ref == 'pkg01/clippy-after-pr7'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: pkg01/clippy-after-pr7
          fetch-depth: 0
      - name: Install Linux native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config \
            libglib2.0-dev \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libssl-dev \
            patchelf
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.97.1'
          components: 'rustfmt, clippy'
      - name: Capture exact current Clippy diagnostics
        id: clippy
        shell: bash
        run: |
          set +e
          cargo clippy --workspace --all-targets --locked -- -D warnings 2>&1 | tee /tmp/clippy-full.log
          status=${PIPESTATUS[0]}
          set -e
          python3 - <<'PY'
          import re
          from pathlib import Path
          text = Path('/tmp/clippy-full.log').read_text(errors='replace')
          text = re.sub(r'\x1b\[[0-9;]*m', '', text)
          lines = text.splitlines()
          blocks = []
          i = 0
          while i < len(lines):
              line = lines[i]
              if line.startswith('error'):
                  block = [line]
                  i += 1
                  while i < len(lines):
                      cur = lines[i]
                      if cur.startswith('error'):
                          break
                      block.append(cur)
                      if cur.startswith('warning: build failed') or cur.startswith('error: could not compile'):
                          # Keep immediate compiler summary but avoid unrelated compile chatter.
                          pass
                      i += 1
                  blocks.append('\n'.join(block).rstrip())
                  continue
              i += 1
          out = '\n\n'.join(blocks)
          Path('clippy-current-errors.txt').write_text(out + ('\n' if out else 'NO_CLIPPY_ERROR_BLOCKS_FOUND\n'))
          print(out if out else 'NO_CLIPPY_ERROR_BLOCKS_FOUND')
          PY
          echo "status=$status" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: pkg01-current-clippy-errors
          path: clippy-current-errors.txt
          if-no-files-found: error
      - name: Remove diagnostic workflow from branch
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/pkg01-clippy-diagnostic-current.yml
          git commit -m 'ci: remove temporary clippy diagnostic workflow'
          git push origin HEAD:pkg01/clippy-after-pr7
      - name: Preserve Clippy exit verdict
        if: steps.clippy.outputs.status != '0'
        run: exit 1
