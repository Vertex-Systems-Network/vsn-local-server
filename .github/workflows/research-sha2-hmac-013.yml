name: Research SHA2 HMAC 0.13 Compatibility

on:
  push:
    branches:
      - research/sha2-hmac-013-compat-20260907

permissions:
  contents: read

jobs:
  security-compat:
    name: vsn-security (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.97.1'
          components: 'clippy'
      - name: Resolve research-only lock edge
        shell: bash
        run: |
          set -euo pipefail
          cargo check -p vsn-security
          python - <<'PY'
          import subprocess
          diff = subprocess.check_output(
              ["git", "diff", "--unified=0", "--", "Cargo.lock"], text=True
          )
          changed = [
              line for line in diff.splitlines()
              if line.startswith(("+", "-")) and not line.startswith(("+++", "---"))
          ]
          expected = ['- "hmac 0.12.1",', '+ "hmac 0.13.0",']
          if changed != expected:
              raise SystemExit(
                  "unexpected Cargo.lock research drift:\n" + diff
              )
          print(diff)
          PY
      - name: Run security regression tests
        shell: bash
        run: cargo test -p vsn-security
      - name: Run security clippy
        shell: bash
        run: cargo clippy -p vsn-security --all-targets -- -D warnings

  workspace-compile:
    name: Workspace compile after compatibility adaptations
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Linux native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config \
            libglib2.0-dev \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libssl-dev \
            patchelf
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.97.1'
      - name: Apply prospective sha2 0.11 digest formatting adaptations
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          runtime = Path("crates/vsn-runtime/src/lib.rs")
          source = runtime.read_text()
          old = '    let actual = format!("{:x}", hasher.finalize());\n'
          lines = [
              '    let digest = hasher.finalize();',
              '    let mut actual = String::with_capacity(digest.len() * 2);',
              '    for byte in digest {',
              '        std::fmt::Write::write_fmt(&mut actual, format_args!("{byte:02x}"))',
              '            .expect("writing to String cannot fail");',
              '    }',
          ]
          new = "\n".join(lines) + "\n"
          if source.count(old) != 1:
              raise SystemExit("expected exactly one runtime SHA-256 LowerHex formatter")
          runtime.write_text(source.replace(old, new))

          transfer_test = Path("crates/vsn-files/tests/pkg02_binary_transfer.rs")
          source = transfer_test.read_text()
          old = '    let expected = format!("{:x}", sha2::Sha256::digest(bytes));\n'
          lines = [
              '    let digest = sha2::Sha256::digest(bytes);',
              '    let mut expected = String::with_capacity(digest.len() * 2);',
              '    for byte in digest {',
              '        std::fmt::Write::write_fmt(&mut expected, format_args!("{byte:02x}"))',
              '            .expect("writing to String cannot fail");',
              '    }',
          ]
          new = "\n".join(lines) + "\n"
          if source.count(old) != 1:
              raise SystemExit("expected exactly one binary-transfer SHA-256 LowerHex formatter")
          transfer_test.write_text(source.replace(old, new))

          txn_test = Path("crates/vsn-runtime/tests/pkg02_0211_transaction_safety.rs")
          source = txn_test.read_text()
          old = '    (artifact, format!("{:x}", hasher.finalize()))\n'
          lines = [
              '    let digest = hasher.finalize();',
              '    let mut sha256 = String::with_capacity(digest.len() * 2);',
              '    for byte in digest {',
              '        std::fmt::Write::write_fmt(&mut sha256, format_args!("{byte:02x}"))',
              '            .expect("writing to String cannot fail");',
              '    }',
              '    (artifact, sha256)',
          ]
          new = "\n".join(lines) + "\n"
          if source.count(old) != 1:
              raise SystemExit("expected exactly one transaction-safety SHA-256 LowerHex formatter")
          txn_test.write_text(source.replace(old, new))
          PY
          git diff --check
          git diff -- crates/vsn-runtime/src/lib.rs crates/vsn-files/tests/pkg02_binary_transfer.rs crates/vsn-runtime/tests/pkg02_0211_transaction_safety.rs
      - name: Reconcile lock edge and check workspace
        run: |
          set -euo pipefail
          cargo check -p vsn-security
          cargo check --workspace --all-targets
      - name: Run directly affected regressions
        run: |
          set -euo pipefail
          cargo test -p vsn-files --test pkg02_binary_transfer
          cargo test -p vsn-runtime
