name: PKG-02 02.11 Windows Clippy Fix

on:
  pull_request:
    branches: [main]
    types: [synchronize]
    paths:
      - '.github/workflows/pkg02-0211-runtime-install-activation.yml'

permissions:
  contents: write

concurrency:
  group: pkg02-0211-system-clippy-fix-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  fix:
    if: github.event_name == 'pull_request'
    name: Fix current-main Windows Clippy blockers
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
      - name: Apply exact vsn-system Clippy fixes
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:RUNNER_ENVIRONMENT -ne 'github-hosted') { throw 'GitHub-hosted runner required' }
          $path = 'crates/vsn-system/src/lib.rs'
          $text = Get-Content -LiteralPath $path -Raw
          $old1 = "        return windows_processes();"
          $new1 = "        windows_processes()"
          if (($text.Split($old1).Count - 1) -ne 1) { throw 'expected exactly one list_processes Windows return' }
          $text = $text.Replace($old1, $new1)
          $old2 = @"
        return Ok(ProcessMetrics {
            pid,
            cpu_percent: None,
            memory_bytes: value.get("WorkingSet64").and_then(|v| v.as_u64()),
        });
"@
          $new2 = @"
        Ok(ProcessMetrics {
            pid,
            cpu_percent: None,
            memory_bytes: value.get("WorkingSet64").and_then(|v| v.as_u64()),
        })
"@
          if (($text.Split($old2).Count - 1) -ne 1) { throw 'expected exactly one Windows ProcessMetrics return' }
          $text = $text.Replace($old2, $new2)
          Set-Content -LiteralPath $path -Value $text -Encoding utf8 -NoNewline
          cargo fmt --all
          if ($LASTEXITCODE -ne 0) { throw "cargo fmt failed with exit $LASTEXITCODE" }
          git diff --check
          if ($LASTEXITCODE -ne 0) { throw 'git diff --check failed' }
          $changed = git diff --name-only
          if (($changed.Count -ne 1) -or ($changed[0] -ne $path)) { throw "unexpected changed files: $($changed -join ', ')" }
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- $path
          git commit -m 'fix(system): satisfy Windows Rust 1.97.1 clippy [skip ci]'
          if ($LASTEXITCODE -ne 0) { throw 'Clippy fix commit failed' }
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
          if ($LASTEXITCODE -ne 0) { throw 'Clippy fix push failed' }
          throw 'Clippy fix commit pushed; stop temporary fixer run.'
