name: PKG-02 02.11 Windows Transaction Sync Fix

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - '.github/workflows/pkg02-0211-runtime-install-activation.yml'
      - 'crates/vsn-runtime/**'

permissions:
  contents: write

concurrency:
  group: pkg02-0211-transaction-sync-fix-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  fix:
    if: github.event_name == 'pull_request'
    name: Fix Windows transaction durability handles
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
      - name: Apply exact Windows sync fix and targeted test
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:RUNNER_ENVIRONMENT -ne 'github-hosted') { throw 'GitHub-hosted runner required' }
          $path = 'crates/vsn-runtime/src/lib.rs'
          $text = Get-Content -LiteralPath $path -Raw
          $oldMarker = '    fs::File::open(marker)?.sync_all()?;'
          $newMarker = '    fs::OpenOptions::new().write(true).open(marker)?.sync_all()?;'
          if (($text.Split($oldMarker).Count - 1) -ne 1) { throw 'expected exactly one marker read-only sync call' }
          $text = $text.Replace($oldMarker, $newMarker)
          $oldRegistry = '        fs::File::open(&transaction.registry_path)?.sync_all()?;'
          $newRegistry = '        fs::OpenOptions::new().write(true).open(&transaction.registry_path)?.sync_all()?;'
          if (($text.Split($oldRegistry).Count - 1) -ne 1) { throw 'expected exactly one registry read-only sync call' }
          $text = $text.Replace($oldRegistry, $newRegistry)
          Set-Content -LiteralPath $path -Value $text -Encoding utf8 -NoNewline
          cargo fmt --all
          if ($LASTEXITCODE -ne 0) { throw "cargo fmt failed with exit $LASTEXITCODE" }
          cargo test --locked --package vsn-runtime install_transaction_rolls_back_when_shim_stage_fails --lib
          if ($LASTEXITCODE -ne 0) { throw "targeted transaction rollback test failed with exit $LASTEXITCODE" }
          git diff --check
          if ($LASTEXITCODE -ne 0) { throw 'git diff --check failed' }
          $changed = @(git diff --name-only)
          if (($changed.Count -ne 1) -or ($changed[0] -ne $path)) { throw "unexpected changed files: $($changed -join ', ')" }
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- $path
          git commit -m 'fix(runtime): use writable handles for durable transaction sync [skip ci]'
          if ($LASTEXITCODE -ne 0) { throw 'transaction sync fix commit failed' }
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
          if ($LASTEXITCODE -ne 0) { throw 'transaction sync fix push failed' }
          throw 'Transaction sync fix commit pushed; stop temporary fixer run.'
