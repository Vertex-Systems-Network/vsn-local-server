          $actual = (git rev-parse HEAD).Trim()
          if ($actual -ne $env:EXPECTED_SHA) { throw "02.12 source binding mismatch: expected=$env:EXPECTED_SHA actual=$actual" }
          if (Get-NetTCPConnection -LocalPort 39731 -State Listen -ErrorAction SilentlyContinue) { throw 'VSN Agent IPC port 39731 is occupied' }
          Write-Host "source=$actual runner=$env:RUNNER_NAME environment=$env:RUNNER_ENVIRONMENT os=$env:RUNNER_OS arch=$env:RUNNER_ARCH ipc=127.0.0.1:39731"

      - name: Run 02.12 certification
        run: |
          $ErrorActionPreference = 'Stop'
          $env:GITHUB_SHA = $env:EXPECTED_SHA
          & pwsh -NoProfile -File scripts/self-hosted/pkg02-0212.ps1
          if ($LASTEXITCODE -ne 0) { throw "02.12 certification failed with exit $LASTEXITCODE" }

      - name: Bind evidence to GitHub-hosted exact source
        if: success()
        run: |
          $ErrorActionPreference = 'Stop'
          $evidencePath = 'dist-self-hosted\02.12\evidence.json'
          if (-not (Test-Path -LiteralPath $evidencePath)) { throw '02.12 evidence.json was not produced' }
          $evidence = Get-Content -LiteralPath $evidencePath -Raw | ConvertFrom-Json
          $evidence.artifact = 'runtime-uninstall-repair-recovery-windows-github-hosted'
          $evidence.source_commit = $env:EXPECTED_SHA
          $evidence | Add-Member -NotePropertyName runner_environment -NotePropertyValue $env:RUNNER_ENVIRONMENT -Force
          $evidence | Add-Member -NotePropertyName ipc_address -NotePropertyValue '127.0.0.1:39731' -Force
          $evidence | ConvertTo-Json -Depth 12 | Set-Content -LiteralPath $evidencePath -Encoding utf8
          (Get-FileHash $evidencePath -Algorithm SHA256).Hash.ToLowerInvariant() | Set-Content 'dist-self-hosted\02.12\evidence.json.sha256'

      - name: Upload 02.12 GitHub-hosted evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pkg02-0212-runtime-uninstall-repair-github-hosted
          path: dist-self-hosted/02.12
          if-no-files-found: warn

  service-lifecycle:
    name: 02.13 GitHub-hosted VSN-managed service lifecycle
    runs-on: windows-latest
    timeout-minutes: 90
    defaults:
      run:
        shell: pwsh
    env:
      EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          clean: true
          ref: ${{ env.EXPECTED_SHA }}

      - name: Verify exact source and GitHub-hosted Windows runner
        run: |
          $ErrorActionPreference = 'Stop'
          if (-not $IsWindows) { throw '02.13 certification requires Windows' }
          if ($env:RUNNER_ENVIRONMENT -ne 'github-hosted') { throw '02.13 certification requires a GitHub-hosted runner' }
          $actual = (git rev-parse HEAD).Trim()
          if ($actual -ne $env:EXPECTED_SHA) { throw "02.13 source binding mismatch: expected=$env:EXPECTED_SHA actual=$actual" }
          if (Get-NetTCPConnection -LocalPort 39731 -State Listen -ErrorAction SilentlyContinue) { throw 'VSN Agent IPC port 39731 is occupied' }
          Write-Host "source=$actual runner=$env:RUNNER_NAME environment=$env:RUNNER_ENVIRONMENT os=$env:RUNNER_OS arch=$env:RUNNER_ARCH ipc=127.0.0.1:39731"

      - name: Run 02.13 certification
        run: |
