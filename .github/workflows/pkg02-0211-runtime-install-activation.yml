name: PKG-02 02.11 Harness Argument Fix

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - '.github/workflows/pkg02-0211-runtime-install-activation.yml'
      - 'scripts/self-hosted/pkg02-0211.ps1'

permissions:
  contents: write

concurrency:
  group: pkg02-0211-harness-args-fix-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  fix:
    if: github.event_name == 'pull_request'
    name: Fix PowerShell CLI capture argument binding
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}

      - name: Apply exact harness binding fix
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:RUNNER_ENVIRONMENT -ne 'github-hosted') { throw 'GitHub-hosted runner required' }
          $path = 'scripts/self-hosted/pkg02-0211.ps1'
          $text = Get-Content -LiteralPath $path -Raw

          $replacements = @(
            @{
              Old = 'function Invoke-CliCapture([string[]]$Args, [string]$Stdout, [string]$Stderr) {'
              New = 'function Invoke-CliCapture([string[]]$CliArgs, [string]$Stdout, [string]$Stderr) {'
            },
            @{
              Old = '    & $script:Cli @Args 1> $Stdout 2> $Stderr'
              New = '    & $script:Cli @CliArgs 1> $Stdout 2> $Stderr'
            },
            @{
              Old = '$failureCode = Invoke-CliCapture @(''runtime'',''install-trusted'',$catalog,$trust,''node'',''20.0.0'') $failureOut $failureErr'
              New = '$failureCode = Invoke-CliCapture -CliArgs @(''runtime'',''install-trusted'',$catalog,$trust,''node'',''20.0.0'') -Stdout $failureOut -Stderr $failureErr'
            },
            @{
              Old = '$code = Invoke-CliCapture @(''runtime'',''activate'',[string]$case.Path,''node'',''20.0.0'') $stdout $stderr'
              New = '$code = Invoke-CliCapture -CliArgs @(''runtime'',''activate'',[string]$case.Path,''node'',''20.0.0'') -Stdout $stdout -Stderr $stderr'
            },
            @{
              Old = '$tamperedCode = Invoke-CliCapture @(''runtime'',''install-trusted'',$catalog,$trust,''node'',''20.0.0'') $tamperedOut $tamperedErr'
              New = '$tamperedCode = Invoke-CliCapture -CliArgs @(''runtime'',''install-trusted'',$catalog,$trust,''node'',''20.0.0'') -Stdout $tamperedOut -Stderr $tamperedErr'
            }
          )

          foreach ($replacement in $replacements) {
            $count = $text.Split([string]$replacement.Old).Count - 1
            if ($count -ne 1) { throw "expected exactly one harness replacement, got $count for: $($replacement.Old)" }
            $text = $text.Replace([string]$replacement.Old, [string]$replacement.New)
          }

          Set-Content -LiteralPath $path -Value $text -Encoding utf8 -NoNewline
          $tokens = $null
          $errors = $null
          [void][System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $path), [ref]$tokens, [ref]$errors)
          if ($errors.Count -ne 0) { throw "PowerShell parse errors: $($errors -join '; ')" }

          git diff --check
          if ($LASTEXITCODE -ne 0) { throw 'git diff --check failed' }
          $changed = @(git diff --name-only)
          if (($changed.Count -ne 1) -or ($changed[0] -ne $path)) { throw "unexpected changed files: $($changed -join ', ')" }

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- $path
          git commit -m 'test(pkg02): fix CLI capture argument binding [skip ci]'
          if ($LASTEXITCODE -ne 0) { throw 'harness binding fix commit failed' }
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
          if ($LASTEXITCODE -ne 0) { throw 'harness binding fix push failed' }
          throw 'Harness binding fix commit pushed; stop temporary fixer run.'
