name: PKG-02 02.13 Service Lifecycle Hardener

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - '.github/workflows/pkg02-0211-runtime-install-activation.yml'
      - 'apps/agent/src/main.rs'
      - 'apps/agent/examples/pkg02_service_fixture.rs'
      - 'crates/vsn-system/src/lib.rs'
      - 'crates/vsn-core/src/lib.rs'

permissions:
  contents: write

concurrency:
  group: pkg02-0213-hardener-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  harden:
    name: Apply and validate 02.13 service lifecycle hardening
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}

      - name: Apply exact service lifecycle fixes and validate
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          agent_path = Path('apps/agent/src/main.rs')
          agent = agent_path.read_text()
          old_name = 'const SERVICE_NAME: &str = "VSNAgent";'
          new_name = 'const SERVICE_NAME: &str = "VSN-Agent";'
          count = agent.count(old_name)
          if count != 1:
              raise SystemExit(f'expected one legacy Windows Agent service name, found {count}')
          agent_path.write_text(agent.replace(old_name, new_name, 1))

          system_path = Path('crates/vsn-system/src/lib.rs')
          system = system_path.read_text()
          anchor = '''pub fn service_action(name: &str, action: &str) -> Result<ServiceState, SystemError> {'''
          helper = '''#[cfg(windows)]
          fn wait_for_windows_service_state(
              name: &str,
              expected: &str,
              timeout: Duration,
          ) -> Result<(), SystemError> {
              let started = std::time::Instant::now();
              loop {
                  let state = service_state(name)?;
                  if state.state == expected {
                      return Ok(());
                  }
                  if started.elapsed() >= timeout {
                      return Err(SystemError::Command(format!(
                          "service {name} did not reach {expected} within {}ms; last state={}",
                          timeout.as_millis(),
                          state.state
                      )));
                  }
                  std::thread::sleep(Duration::from_millis(100));
              }
          }

          pub fn service_action(name: &str, action: &str) -> Result<ServiceState, SystemError> {'''
          if system.count(anchor) != 1:
              raise SystemExit(f'expected one service_action anchor, found {system.count(anchor)}')
          if 'fn wait_for_windows_service_state(' not in system:
              system = system.replace(anchor, helper, 1)

          old_wait = '            std::thread::sleep(Duration::from_millis(500));\n'
          new_wait = '            wait_for_windows_service_state(name, "stopped", Duration::from_secs(15))?;\n'
          count = system.count(old_wait)
          if count != 1:
              raise SystemExit(f'expected one fixed 500ms restart delay, found {count}')
          system = system.replace(old_wait, new_wait, 1)
          system_path.write_text(system)
          PY

          cargo fmt --all
          cargo fmt --all -- --check
          cargo clippy --locked --package vsn-system --package vsn-core --package vsn-agent --all-targets --no-deps -- -D warnings
          cargo test --locked --package vsn-system --package vsn-core
          git diff --check

          changed=$(git diff --name-only | sort)
          expected=$(printf '%s\n' 'apps/agent/src/main.rs' 'crates/vsn-system/src/lib.rs' | sort)
          if [[ "$changed" != "$expected" ]]; then
            echo 'Unexpected changed files:'
            echo "$changed"
            exit 1
          fi

          grep -F 'const SERVICE_NAME: &str = "VSN-Agent";' apps/agent/src/main.rs
          grep -F 'wait_for_windows_service_state(name, "stopped", Duration::from_secs(15))?;' crates/vsn-system/src/lib.rs
          if grep -F 'std::thread::sleep(Duration::from_millis(500));' crates/vsn-system/src/lib.rs; then
            echo 'fixed 500ms restart delay still present'
            exit 1
          fi

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps/agent/src/main.rs crates/vsn-system/src/lib.rs
          git commit -m 'fix(service): align namespace and wait for stopped state [skip ci]'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
