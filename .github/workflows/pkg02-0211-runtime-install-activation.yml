          $env:GITHUB_SHA = $env:EXPECTED_SHA
          & pwsh -NoProfile -File scripts/self-hosted/pkg02-0213.ps1
          if ($LASTEXITCODE -ne 0) { throw "02.13 certification failed with exit $LASTEXITCODE" }

      - name: Bind evidence to GitHub-hosted exact source
        if: success()
