          $evidence.artifact = 'vsn-managed-service-lifecycle-windows-github-hosted'
          $evidence.source_commit = $env:EXPECTED_SHA
          $evidence | Add-Member -NotePropertyName runner_environment -NotePropertyValue $env:RUNNER_ENVIRONMENT -Force
          $evidence | Add-Member -NotePropertyName ipc_address -NotePropertyValue '127.0.0.1:39731' -Force
          $evidence | ConvertTo-Json -Depth 12 | Set-Content -LiteralPath $evidencePath -Encoding utf8
          (Get-FileHash $evidencePath -Algorithm SHA256).Hash.ToLowerInvariant() | Set-Content 'dist-self-hosted\02.13\evidence.json.sha256'

      - name: Upload 02.13 GitHub-hosted evidence
        if: always()
