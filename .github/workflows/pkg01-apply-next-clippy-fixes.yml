name: pkg01-apply-next-clippy-fixes
on:
  push:
    branches:
      - pkg01/clippy-after-pr6
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.97.1'
          components: 'rustfmt'
      - name: Apply exact observed Clippy transformations
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          remote = Path('crates/vsn-remote/src/lib.rs')
          text = remote.read_text()
          replacements = [
              ('    Poll(AgentPollResponseV1),\n', '    Poll(Box<AgentPollResponseV1>),\n'),
              ('        authorization: RemoteCommandV1,\n', '        authorization: Box<RemoteCommandV1>,\n'),
              ('            AgentGatewayResponseV1::Poll(response) => Ok(response),\n', '            AgentGatewayResponseV1::Poll(response) => Ok(*response),\n'),
          ]
          for old, new in replacements:
              if old in text:
                  if text.count(old) != 1:
                      raise SystemExit(f'unexpected remote match count for {old!r}: {text.count(old)}')
                  text = text.replace(old, new, 1)
              elif new not in text:
                  raise SystemExit(f'expected remote block not found: {old!r}')
          remote.write_text(text)

          update = Path('crates/vsn-update/src/lib.rs')
          text = update.read_text()
          old = '    if value.len() < 1\n'
          new = '    if value.is_empty()\n'
          if old in text:
              if text.count(old) != 1:
                  raise SystemExit(f'unexpected update match count: {text.count(old)}')
              text = text.replace(old, new, 1)
          elif new not in text:
              raise SystemExit('expected safe_release len check not found')
          update.write_text(text)
          PY
          cargo fmt --all
          git diff --check
      - name: Commit exact source fixes
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- crates/vsn-remote/src/lib.rs crates/vsn-update/src/lib.rs; then
            echo 'Observed fixes already present.'
            exit 0
          fi
          git config user.name 'vsn-pkg01-bot'
          git config user.email 'vsn-pkg01-bot@users.noreply.github.com'
          git add crates/vsn-remote/src/lib.rs crates/vsn-update/src/lib.rs
          git commit -m 'fix(pkg01): box remote payloads and simplify update check'
          git push origin HEAD:${GITHUB_REF_NAME}
