name: PKG-02 02.26 External Native Database Adapters

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pkg02-0226-github-hosted-${{ github.ref }}
  cancel-in-progress: true

jobs:
  certify-0226:
    name: 02.26 GitHub-hosted database adapter certification
    runs-on: windows-latest
    timeout-minutes: 60
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
        with:
          clean: true
          ref: ${{ github.sha }}

      - name: Verify exact source and GitHub-hosted Windows runner
        run: |
          $ErrorActionPreference = 'Stop'
          if (-not $IsWindows) { throw '02.26 certification requires Windows' }
          if ($env:RUNNER_ENVIRONMENT -ne 'github-hosted') { throw '02.26 certification requires a GitHub-hosted runner' }
          $actual = (git rev-parse HEAD).Trim()
          if ($actual -ne '${{ github.sha }}') { throw "02.26 source binding mismatch: expected=${{ github.sha }} actual=$actual" }
          Write-Host "source=$actual runner=$env:RUNNER_NAME environment=$env:RUNNER_ENVIRONMENT os=$env:RUNNER_OS arch=$env:RUNNER_ARCH"

      - name: Run 02.26 certification
        run: |
          & pwsh -NoProfile -File scripts/certification/pkg02-0226.ps1
          if ($LASTEXITCODE -ne 0) { throw "02.26 certification failed with exit $LASTEXITCODE" }

      - name: Upload 02.26 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pkg02-0226-github-hosted
          path: dist-certification/02.26
          if-no-files-found: warn
