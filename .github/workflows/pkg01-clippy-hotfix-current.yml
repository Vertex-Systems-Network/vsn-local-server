name: PKG-01 Current Clippy Hotfix

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  hotfix:
    if: github.event.pull_request.head.ref == 'pkg01/clippy-after-pr7'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: pkg01/clippy-after-pr7
          fetch-depth: 0
      - name: Apply exact current blocker batch
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re, struct, zlib

          p = Path('cloud/control-plane/src/main.rs')
          s = p.read_text()

          def replace_exact(old, new, expected):
              global s
              count = s.count(old)
              if count != expected:
                  raise SystemExit(f'assertion failed: expected {expected} occurrences of {old!r}, found {count}')
              s = s.replace(old, new)

          # Distinguish OIDC Nonce from ChaCha20Poly1305 Nonce.
          replace_exact(
              'AuthorizationCode, ClientId, ClientSecret, IssuerUrl, Nonce, PkceCodeVerifier, RedirectUrl,',
              'AuthorizationCode, ClientId, ClientSecret, IssuerUrl, Nonce as OidcNonce, PkceCodeVerifier, RedirectUrl,',
              1,
          )
          replace_exact(
              '.claims(&verifier, &Nonce::new(pending.transaction.nonce.clone()))',
              '.claims(&verifier, &OidcNonce::new(pending.transaction.nonce.clone()))',
              1,
          )

          # Arc<Option<PostgresSnapshotStore>>: borrow the inner Option before consuming Option methods.
          count = s.count('state.state_postgres.as_ref().and_then(')
          if count != 1:
              raise SystemExit(f'expected 1 state_postgres and_then borrow site, found {count}')
          s = s.replace(
              'state.state_postgres.as_ref().and_then(',
              'state.state_postgres.as_ref().as_ref().and_then(',
          )
          pat = re.compile(r'(\.state_postgres\s*\.as_ref\(\))(\s*\.ok_or_else\()')
          s, count = pat.subn(r'\1.as_ref()\2', s)
          if count != 6:
              raise SystemExit(f'expected 6 state_postgres ok_or_else borrow sites, found {count}')

          # Protocol variants now own boxed recursive payloads.
          replace_exact(
              'vsn_remote::AgentGatewayResponseV1::Poll(v)',
              'vsn_remote::AgentGatewayResponseV1::Poll(Box::new(v))',
              1,
          )
          replace_exact(
              '                    authorization,\n                    request: request.clone(),',
              '                    authorization: Box::new(authorization),\n                    request: request.clone(),',
              1,
          )
          replace_exact(
              '                    authorization,\n                    request: reopen_request,',
              '                    authorization: Box::new(authorization),\n                    request: reopen_request,',
              1,
          )
          replace_exact(
              '                authorization,\n                request,',
              '                authorization: Box::new(authorization),\n                request,',
              1,
          )

          replace_exact(
              '#[derive(Debug, Clone, Deserialize)]\nstruct ScimBulkOperation {',
              '#[derive(Debug, Clone, Serialize, Deserialize)]\nstruct ScimBulkOperation {',
              1,
          )
          replace_exact(
              '    let mut builder = WebauthnBuilder::new(&rp_id, &origin)',
              '    let builder = WebauthnBuilder::new(&rp_id, &origin)',
              1,
          )

          p.write_text(s)

          # Tauri generate_context! requires the conventional icon file at compile time.
          icon = Path('apps/desktop/src-tauri/icons/icon.png')
          icon.parent.mkdir(parents=True, exist_ok=True)
          w = h = 32
          # Deterministic opaque RGBA icon; functional build asset, no external dependency.
          raw = b''.join(b'\x00' + bytes([17,17,17,255]) * w for _ in range(h))
          def chunk(kind, data):
              return struct.pack('>I', len(data)) + kind + data + struct.pack('>I', zlib.crc32(kind + data) & 0xffffffff)
          png = b'\x89PNG\r\n\x1a\n' + chunk(b'IHDR', struct.pack('>IIBBBBB', w, h, 8, 6, 0, 0, 0)) + chunk(b'IDAT', zlib.compress(raw, 9)) + chunk(b'IEND', b'')
          icon.write_bytes(png)
          PY
          cargo fmt --all
          git diff --check
      - name: Install Linux native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config \
            libglib2.0-dev \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libssl-dev \
            patchelf
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.97.1'
          components: 'rustfmt, clippy'
      - name: Verify format and full workspace Clippy
        id: verify
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt --all -- --check
          set +e
          cargo clippy --workspace --all-targets --locked -- -D warnings 2>&1 | tee /tmp/clippy-full.log
          status=${PIPESTATUS[0]}
          set -e
          python3 - <<'PY'
          import re
          from pathlib import Path
          text = Path('/tmp/clippy-full.log').read_text(errors='replace')
          text = re.sub(r'\x1b\[[0-9;]*m', '', text)
          lines = text.splitlines()
          starts = [i for i,l in enumerate(lines) if l.startswith('error')]
          blocks=[]
          for n,i in enumerate(starts):
              j=starts[n+1] if n+1 < len(starts) else len(lines)
              blocks.append('\n'.join(lines[i:j]).rstrip())
          Path('clippy-hotfix-errors.txt').write_text(('\n\n'.join(blocks) if blocks else 'CLIPPY_GREEN') + '\n')
          PY
          echo "status=$status" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: pkg01-clippy-hotfix-verdict
          path: clippy-hotfix-errors.txt
          if-no-files-found: error
      - name: Commit source fixes and remove temporary workflow
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/pkg01-clippy-hotfix-current.yml
          git add cloud/control-plane/src/main.rs apps/desktop/src-tauri/icons/icon.png
          git commit -m 'PKG-01: fix current control-plane Clippy blockers'
          git push origin HEAD:pkg01/clippy-after-pr7
      - name: Preserve Clippy exit verdict
        if: steps.verify.outputs.status != '0'
        run: exit 1
