name: PKG-03 03.22 Trusted Production Signing

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/pkg03-0322-production-signing-trusted.yml'
      - 'docs/PKG03-TRUSTED-PRODUCTION-SIGNING-V1.md'
  push:
    branches: [main]
    paths:
      - '.ai/requests/pkg03-0322-production-signing.v1.json'

permissions:
  contents: read

concurrency:
  group: pkg03-0322-trusted-production-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate-definition:
    name: 03.22 trusted signer definition guard
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact PR head without credentials
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
          fetch-depth: 1

      - name: Verify privileged boundary is explicit and push-only
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $path='.github/workflows/pkg03-0322-production-signing-trusted.yml'
          $text=Get-Content -LiteralPath $path -Raw
          foreach($required in @(
            'environment: production-signing',
            "if: github.event_name == 'push' && github.ref == 'refs/heads/main' && github.repository == 'Vertex-Systems-Network/vsn-local-server'",
            'VSN_SIGNING_ENV_GUARD',
            'production-signing-v1',
            'actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02',
            'actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093'
          )) {
            if(-not $text.Contains($required)){ throw "Trusted signer invariant missing: $required" }
          }
          if($text -match '(?m)^\s*pull_request_target\s*:'){ throw 'Trusted signer must never use pull_request_target.' }
          if($text -match '(?m)^\s*environment:\s*\$\{\{'){ throw 'Trusted production environment name must not be dynamically selected.' }

  authorize-request:
    name: 03.22 authorize exact production-signing request
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && github.repository == 'Vertex-Systems-Network/vsn-local-server'
    runs-on: ubuntu-latest
    outputs:
      source_sha: ${{ steps.request.outputs.source_sha }}
      source_base_sha: ${{ steps.request.outputs.source_base_sha }}
      source_ref: ${{ steps.request.outputs.source_ref }}
    steps:
      - name: Checkout trusted main request commit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 0

      - name: Validate one-file request and exact 03.22 source scope
        id: request
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $requestPath='.ai/requests/pkg03-0322-production-signing.v1.json'
          if(-not (Test-Path -LiteralPath $requestPath -PathType Leaf)){ throw 'Trusted 03.22 request file is missing.' }
          $req=Get-Content -LiteralPath $requestPath -Raw | ConvertFrom-Json
          if([int]$req.schema_version -ne 1 -or [string]$req.task_id -ne '03.22'){ throw 'Trusted request schema/task mismatch.' }
          $source=[string]$req.source_sha
          $base=[string]$req.source_base_sha
          $sourceRef=[string]$req.source_ref
          if($source -notmatch '^[0-9a-f]{40}$' -or $base -notmatch '^[0-9a-f]{40}$'){ throw 'Trusted request source/base must be lowercase 40-hex SHAs.' }
          if($sourceRef -ne 'pkg03/0322-authenticode-signing-reconciled-v4'){ throw "Unexpected 03.22 source ref: $sourceRef" }

          $parent=(git rev-parse HEAD^).Trim()
          if($parent -ne $base){ throw "Request base must equal immediate trusted-main parent: request=$base parent=$parent" }
          $requestDiff=@(git diff --name-only $parent HEAD | Where-Object { $_ })
          if($requestDiff.Count -ne 1 -or $requestDiff[0] -ne $requestPath){ throw "Production request commit must change exactly one request file: $($requestDiff -join ', ')" }

          git fetch --no-tags origin "+refs/heads/$sourceRef`:refs/remotes/origin/pkg03-0322-requested"
          if($LASTEXITCODE -ne 0){ throw 'Could not fetch requested 03.22 source ref.' }
          $resolved=(git rev-parse refs/remotes/origin/pkg03-0322-requested).Trim()
          if($resolved -ne $source){ throw "Requested source SHA is not current source-ref head: request=$source ref=$resolved" }
          git merge-base --is-ancestor $base $source
          if($LASTEXITCODE -ne 0){ throw 'Requested 03.22 source is not a descendant of the trusted request base.' }

          $allowed=@(
            '.ai/features/pkg03-0322/development-preflight.md',
            '.ai/features/pkg03-0322/lifecycle-review.md',
            '.ai/features/pkg03-0322/research.md',
            '.ai/manifests/pkg03-0322-authenticode-signing.v1.json',
            '.ai/plans/pkg03-0322-authenticode-signing-v1.md',
            '.github/workflows/pkg03-0322-authenticode-signing.yml',
            'docs/PKG03-AUTHENTICODE-SIGNING-VERIFICATION-V1.md',
            'scripts/ci/pkg03-0322-sign.ps1',
            'scripts/ci/pkg03-0322-test-cert.ps1',
            'scripts/ci/pkg03-0322-verify.ps1',
            'scripts/ci/validate-pkg03-0322.py'
          ) | Sort-Object
          $changed=@(git diff --name-only "$base...$source" | Where-Object { $_ } | Sort-Object)
          if($changed.Count -ne $allowed.Count -or (Compare-Object $allowed $changed).Count -ne 0){
            throw "Requested 03.22 source scope mismatch. Changed: $($changed -join ', ')"
          }
          "source_sha=$source" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "source_base_sha=$base" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "source_ref=$sourceRef" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

  build-unsigned:
    name: 03.22 build exact unsigned candidates without production secrets
    needs: authorize-request
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && github.repository == 'Vertex-Systems-Network/vsn-local-server'
    runs-on: windows-2025
    timeout-minutes: 70
    steps:
      - name: Checkout exact requested source without credentials
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ needs.authorize-request.outputs.source_sha }}
          persist-credentials: false
          fetch-depth: 0

      - name: Bind exact source and prove secret-free build context
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $expected='${{ needs.authorize-request.outputs.source_sha }}'
          $actual=(git rev-parse HEAD).Trim()
          if($actual -ne $expected){ throw "Exact source checkout mismatch: expected=$expected actual=$actual" }
          if(@(git status --porcelain=v1 --untracked-files=no).Count -ne 0){ throw 'Requested source checkout is not tracked-clean.' }
          foreach($name in @('VSN_SIGNING_PFX_B64','VSN_SIGNING_PFX_PASSWORD')){
            if(Test-Path "Env:$name"){ throw "$name must not exist in the unprivileged build job." }
          }

      - name: Set up exact Node 22.12.0
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.12.0'

      - name: Install exact Rust 1.97.1 and locked graphs
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          rustup toolchain install 1.97.1 --profile minimal
          rustup default 1.97.1
          if((rustc --version).Trim() -notmatch '^rustc 1\.97\.1 '){ throw 'Unexpected rustc version.' }
          if((cargo --version).Trim() -notmatch '^cargo 1\.97\.1 '){ throw 'Unexpected cargo version.' }
          if(Test-Path apps/desktop/node_modules){ throw 'node_modules unexpectedly exists before npm ci.' }
          Push-Location apps/desktop
          npm ci --no-audit --no-fund
          if($LASTEXITCODE -ne 0){ throw 'Desktop npm ci failed.' }
          Pop-Location
          git diff --exit-code -- apps/desktop/package.json apps/desktop/package-lock.json
          if($LASTEXITCODE -ne 0){ throw 'Desktop dependency graph drifted.' }
          cargo fetch --locked
          if($LASTEXITCODE -ne 0){ throw 'cargo fetch --locked failed.' }
          cargo metadata --locked --no-deps --format-version 1 | Out-Null

      - name: Validate requested 03.22 authority before build
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          python scripts/ci/validate-pkg03-0322.py
          if($LASTEXITCODE -ne 0){ throw 'Requested 03.22 authority validation failed.' }

      - name: Build exact unsigned Windows candidates
        shell: pwsh
        env:
          VSN_SOURCE_SHA: ${{ needs.authorize-request.outputs.source_sha }}
          VSN_SOURCE_BASE_SHA: ${{ needs.authorize-request.outputs.source_base_sha }}
          VSN_SOURCE_REF: ${{ needs.authorize-request.outputs.source_ref }}
          VSN_TRUSTED_REQUEST_SHA: ${{ github.sha }}
        run: |
          $ErrorActionPreference='Stop'
          $out='dist-pkg03/03.22-trusted'
          $unsigned=Join-Path $out 'unsigned'
          New-Item -ItemType Directory -Force $unsigned | Out-Null
          $tauri=(& .\apps\desktop\node_modules\.bin\tauri.cmd --version | Out-String).Trim()
          if($tauri -ne 'tauri-cli 2.11.4'){ throw "Unexpected local Tauri CLI: $tauri" }

          Remove-Item -Recurse -Force target/release/bundle/nsis -ErrorAction SilentlyContinue
          Push-Location apps/desktop
          & .\node_modules\.bin\tauri.cmd build --bundles nsis
          if($LASTEXITCODE -ne 0){ throw 'Current-user NSIS build failed.' }
          Pop-Location
          $items=@(Get-ChildItem target/release/bundle/nsis -Filter '*-setup.exe' -File)
          if($items.Count -ne 1){ throw "Expected one current-user NSIS setup, found $($items.Count)." }
          Copy-Item -LiteralPath $items[0].FullName -Destination (Join-Path $unsigned 'nsis-current-user.exe')

          Remove-Item -Recurse -Force target/release/bundle/nsis -ErrorAction SilentlyContinue
          Push-Location apps/desktop
          & .\node_modules\.bin\tauri.cmd build --bundles nsis --config src-tauri/tauri.per-machine.conf.json
          if($LASTEXITCODE -ne 0){ throw 'Per-machine NSIS build failed.' }
          Pop-Location
          $items=@(Get-ChildItem target/release/bundle/nsis -Filter '*-setup.exe' -File)
          if($items.Count -ne 1){ throw "Expected one per-machine NSIS setup, found $($items.Count)." }
          Copy-Item -LiteralPath $items[0].FullName -Destination (Join-Path $unsigned 'nsis-per-machine.exe')

          Remove-Item -Recurse -Force target/release/bundle/msi -ErrorAction SilentlyContinue
          Push-Location apps/desktop
          & .\node_modules\.bin\tauri.cmd build --bundles msi
          if($LASTEXITCODE -ne 0){ throw 'MSI build failed.' }
          Pop-Location
          $items=@(Get-ChildItem target/release/bundle/msi -Filter '*.msi' -File)
          if($items.Count -ne 1){ throw "Expected one MSI package, found $($items.Count)." }
          Copy-Item -LiteralPath $items[0].FullName -Destination (Join-Path $unsigned 'vsn-platform.msi')
          $desktop='target/release/VSN Dev Platform.exe'
          if(-not (Test-Path -LiteralPath $desktop -PathType Leaf)){ throw 'Exact Desktop release binary missing.' }
          Copy-Item -LiteralPath $desktop -Destination (Join-Path $unsigned 'VSN Dev Platform.exe')

          $names=@('nsis-current-user.exe','nsis-per-machine.exe','vsn-platform.msi','VSN Dev Platform.exe')
          $rows=@()
          foreach($name in $names){
            $file=Join-Path $unsigned $name
            $sig=Get-AuthenticodeSignature -LiteralPath $file
            if([string]$sig.Status -ne 'NotSigned'){ throw "$name unexpectedly has signature status $($sig.Status)." }
            $rows += [ordered]@{file_name=$name;size_bytes=[long](Get-Item -LiteralPath $file).Length;sha256=(Get-FileHash -LiteralPath $file -Algorithm SHA256).Hash.ToLowerInvariant();authenticode_status='NotSigned'}
          }
          $prov=[ordered]@{
            schema_version=1;task_id='03.22';source_commit=$env:VSN_SOURCE_SHA;source_base=$env:VSN_SOURCE_BASE_SHA;source_ref=$env:VSN_SOURCE_REF;trusted_request_commit=$env:VSN_TRUSTED_REQUEST_SHA;
            runner=[ordered]@{os=$env:RUNNER_OS;arch=$env:RUNNER_ARCH;image_os=$env:ImageOS;image_version=$env:ImageVersion};
            toolchain=[ordered]@{node=(node --version).Trim();npm=(npm.cmd --version).Trim();rustc=(rustc --version).Trim();cargo=(cargo --version).Trim();tauri_cli=$tauri};
            production_secrets_available_in_build_job=$false;candidates=$rows
          }
          $prov | ConvertTo-Json -Depth 10 | Set-Content -LiteralPath (Join-Path $out 'unsigned-provenance.json') -Encoding utf8NoBOM
          if(@(git status --porcelain=v1 --untracked-files=no).Count -ne 0){ throw 'Tracked repository drift detected during secret-free build.' }

      - name: Upload exact unsigned handoff
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: pkg03-0322-trusted-unsigned
          path: dist-pkg03/03.22-trusted/**
          if-no-files-found: error
          compression-level: 0

  production-sign:
    name: 03.22 protected-environment production Authenticode signing
    needs: [authorize-request, build-unsigned]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && github.repository == 'Vertex-Systems-Network/vsn-local-server'
    runs-on: windows-2025
    timeout-minutes: 25
    environment: production-signing
    steps:
      - name: Download secret-free unsigned handoff
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: pkg03-0322-trusted-unsigned
          path: dist-pkg03/03.22-trusted

      - name: Sign and independently verify exact candidates
        shell: pwsh
        env:
          VSN_SIGNING_ENV_GUARD: ${{ vars.VSN_SIGNING_ENV_GUARD }}
          VSN_PROD_PFX_B64: ${{ secrets.VSN_SIGNING_PFX_B64 }}
          VSN_PROD_PFX_PASSWORD: ${{ secrets.VSN_SIGNING_PFX_PASSWORD }}
          VSN_PROD_EXPECTED_SUBJECT: ${{ vars.VSN_SIGNING_EXPECTED_SUBJECT }}
          VSN_PROD_TIMESTAMP_URL: ${{ vars.VSN_SIGNING_TIMESTAMP_URL }}
          VSN_SOURCE_SHA: ${{ needs.authorize-request.outputs.source_sha }}
          VSN_SOURCE_BASE_SHA: ${{ needs.authorize-request.outputs.source_base_sha }}
          VSN_SOURCE_REF: ${{ needs.authorize-request.outputs.source_ref }}
          VSN_TRUSTED_REQUEST_SHA: ${{ github.sha }}
          VSN_WORKFLOW_RUN_ID: ${{ github.run_id }}
          VSN_WORKFLOW_RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          Set-StrictMode -Version Latest
          $ErrorActionPreference='Stop'
          if($env:VSN_SIGNING_ENV_GUARD -ne 'production-signing-v1'){ throw 'Protected production-signing environment guard is absent or invalid.' }
          foreach($entry in @(
            @{Name='VSN_SIGNING_PFX_B64';Value=$env:VSN_PROD_PFX_B64},
            @{Name='VSN_SIGNING_PFX_PASSWORD';Value=$env:VSN_PROD_PFX_PASSWORD},
            @{Name='VSN_SIGNING_EXPECTED_SUBJECT';Value=$env:VSN_PROD_EXPECTED_SUBJECT},
            @{Name='VSN_SIGNING_TIMESTAMP_URL';Value=$env:VSN_PROD_TIMESTAMP_URL}
          )){ if([string]::IsNullOrWhiteSpace([string]$entry.Value)){ throw "$($entry.Name) is missing from the protected production-signing environment." } }
          if($env:VSN_PROD_TIMESTAMP_URL -notmatch '^https?://'){ throw 'Production timestamp URL must be an HTTP(S) RFC3161 endpoint.' }

          $root='dist-pkg03/03.22-trusted'
          $unsigned=Join-Path $root 'unsigned'
          $signed=Join-Path $root 'production-signed'
          $evidence=Join-Path $root 'evidence'
          New-Item -ItemType Directory -Force $signed,$evidence | Out-Null
          $prov=Get-Content -LiteralPath (Join-Path $root 'unsigned-provenance.json') -Raw | ConvertFrom-Json
          if([string]$prov.source_commit -ne $env:VSN_SOURCE_SHA -or [string]$prov.source_base -ne $env:VSN_SOURCE_BASE_SHA -or [string]$prov.source_ref -ne $env:VSN_SOURCE_REF){ throw 'Unsigned handoff lineage mismatch.' }
          if([string]$prov.trusted_request_commit -ne $env:VSN_TRUSTED_REQUEST_SHA){ throw 'Unsigned handoff request binding mismatch.' }
          if($prov.production_secrets_available_in_build_job -ne $false){ throw 'Unsigned handoff does not prove secret-free build context.' }

          $names=@('nsis-current-user.exe','nsis-per-machine.exe','vsn-platform.msi','VSN Dev Platform.exe')
          $allFiles=@(Get-ChildItem -LiteralPath $unsigned -File | Sort-Object Name)
          if($allFiles.Count -ne 4 -or (Compare-Object ($names|Sort-Object) ($allFiles.Name|Sort-Object)).Count -ne 0){ throw 'Unsigned handoff file set mismatch.' }

          $signtools=@(Get-ChildItem 'C:\Program Files (x86)\Windows Kits\10\bin' -Recurse -Filter signtool.exe -File -ErrorAction SilentlyContinue | Where-Object { $_.FullName -match '\\x64\\signtool\.exe$' } | Sort-Object FullName -Descending)
          if($signtools.Count -lt 1){ throw 'SignTool x64 not found.' }
          $signtool=$signtools[0].FullName

          function Get-Sha([string]$Path){ (Get-FileHash -LiteralPath $Path -Algorithm SHA256 -ErrorAction Stop).Hash.ToLowerInvariant() }
          function Get-MsiProperty([string]$Path,[string]$Property){
            $installer=New-Object -ComObject WindowsInstaller.Installer
            $db=$installer.GetType().InvokeMember('OpenDatabase','InvokeMethod',$null,$installer,@($Path,0))
            $view=$db.GetType().InvokeMember('OpenView','InvokeMethod',$null,$db,@("SELECT `Value` FROM `Property` WHERE `Property`='$Property'"))
            $view.GetType().InvokeMember('Execute','InvokeMethod',$null,$view,$null)|Out-Null
            $record=$view.GetType().InvokeMember('Fetch','InvokeMethod',$null,$view,$null)
            if($null -eq $record){ throw "MSI property '$Property' not found." }
            [string]$record.GetType().InvokeMember('StringData','GetProperty',$null,$record,@(1))
          }
          function Get-ExeIdentity([string]$Path){
            $v=[Diagnostics.FileVersionInfo]::GetVersionInfo($Path)
            [ordered]@{product_name=[string]$v.ProductName;product_version=[string]$v.ProductVersion;company_name=[string]$v.CompanyName;file_description=[string]$v.FileDescription}
          }
          function To-CompactJson([object]$Value){ $Value | ConvertTo-Json -Compress -Depth 8 }

          $pfxBytes=$null;$cert=$null;$store=$null;$thumb=$null
          try{
            $pfxBytes=[Convert]::FromBase64String($env:VSN_PROD_PFX_B64)
            $flags=[System.Security.Cryptography.X509Certificates.X509KeyStorageFlags]::PersistKeySet -bor [System.Security.Cryptography.X509Certificates.X509KeyStorageFlags]::UserKeySet
            $cert=[System.Security.Cryptography.X509Certificates.X509Certificate2]::new($pfxBytes,$env:VSN_PROD_PFX_PASSWORD,$flags)
            if(-not $cert.HasPrivateKey){ throw 'Production credential has no accessible private key.' }
            if([string]$cert.Subject -ne $env:VSN_PROD_EXPECTED_SUBJECT){ throw "Production signer subject mismatch: $($cert.Subject)" }
            $thumb=([string]$cert.Thumbprint -replace '\s','').ToUpperInvariant()
            if($thumb -notmatch '^[0-9A-F]{40}$'){ throw 'Production certificate thumbprint is invalid.' }
            $store=[System.Security.Cryptography.X509Certificates.X509Store]::new([System.Security.Cryptography.X509Certificates.StoreName]::My,[System.Security.Cryptography.X509Certificates.StoreLocation]::CurrentUser)
            $store.Open([System.Security.Cryptography.X509Certificates.OpenFlags]::ReadWrite)
            $store.Add($cert)
            if(-not (Get-Item -LiteralPath "Cert:\CurrentUser\My\$thumb" -ErrorAction Stop).HasPrivateKey){ throw 'Persisted production certificate is not SignTool-usable.' }

            $rows=@()
            foreach($name in $names){
              $src=Join-Path $unsigned $name
              $dest=Join-Path $signed $name
              $unsignedSig=Get-AuthenticodeSignature -LiteralPath $src
              if([string]$unsignedSig.Status -ne 'NotSigned'){ throw "$name is not an unsigned input." }
              $before=Get-Sha $src
              $provRows=@($prov.candidates | Where-Object { $_.file_name -eq $name })
              if($provRows.Count -ne 1 -or [string]$provRows[0].sha256 -ne $before){ throw "$name unsigned provenance mismatch." }

              $identityBefore=if([IO.Path]::GetExtension($name).ToLowerInvariant() -eq '.msi'){
                [ordered]@{product_code=Get-MsiProperty $src 'ProductCode';upgrade_code=Get-MsiProperty $src 'UpgradeCode';product_name=Get-MsiProperty $src 'ProductName';product_version=Get-MsiProperty $src 'ProductVersion'}
              }else{ Get-ExeIdentity $src }

              Copy-Item -LiteralPath $src -Destination $dest -Force
              $output=(& $signtool sign /sha1 $thumb /s My /fd SHA256 /tr $env:VSN_PROD_TIMESTAMP_URL /td SHA256 /v $dest 2>&1 | Out-String)
              $exit=$LASTEXITCODE
              if($exit -ne 0){ Write-Host $output; throw "SignTool signing failed for $name with exit code $exit." }
              $after=Get-Sha $dest
              if($after -eq $before){ throw "$name signing did not change target bytes." }
              $sig=Get-AuthenticodeSignature -LiteralPath $dest
              if([string]$sig.Status -ne 'Valid'){ throw "$name Windows Authenticode status is $($sig.Status)." }
              if($null -eq $sig.SignerCertificate -or [string]$sig.SignerCertificate.Subject -ne $env:VSN_PROD_EXPECTED_SUBJECT){ throw "$name signer subject verification failed." }
              if($null -eq $sig.TimeStamperCertificate){ throw "$name RFC3161 timestamp certificate is missing." }
              $verifyOut=(& $signtool verify /pa /all /v $dest 2>&1 | Out-String)
              $verifyExit=$LASTEXITCODE
              if($verifyExit -ne 0){ Write-Host $verifyOut; throw "$name native SignTool verification failed with exit code $verifyExit." }

              $identityAfter=if([IO.Path]::GetExtension($name).ToLowerInvariant() -eq '.msi'){
                [ordered]@{product_code=Get-MsiProperty $dest 'ProductCode';upgrade_code=Get-MsiProperty $dest 'UpgradeCode';product_name=Get-MsiProperty $dest 'ProductName';product_version=Get-MsiProperty $dest 'ProductVersion'}
              }else{ Get-ExeIdentity $dest }
              if((To-CompactJson $identityBefore) -ne (To-CompactJson $identityAfter)){ throw "$name package identity metadata changed after signing." }
              $rows += [ordered]@{file_name=$name;unsigned_sha256=$before;signed_sha256=$after;windows_status='Valid';signer_subject=[string]$sig.SignerCertificate.Subject;signer_thumbprint=[string]$sig.SignerCertificate.Thumbprint;timestamp_present=$true;timestamp_subject=[string]$sig.TimeStamperCertificate.Subject;signtool_verify_exit=0;identity_equal=$true;identity_before=$identityBefore;identity_after=$identityAfter}
            }

            $tamperSource=Join-Path $signed 'VSN Dev Platform.exe'
            $tampered=Join-Path $evidence 'tampered-production-VSN-Dev-Platform.exe'
            Copy-Item -LiteralPath $tamperSource -Destination $tampered -Force
            $stream=[IO.File]::Open($tampered,[IO.FileMode]::Open,[IO.FileAccess]::ReadWrite,[IO.FileShare]::None)
            try{
              if($stream.Length -le 16384){ throw 'Tamper source unexpectedly small.' }
              $offset=[long][Math]::Min(8192,[Math]::Floor($stream.Length/3))
              [void]$stream.Seek($offset,[IO.SeekOrigin]::Begin);$original=$stream.ReadByte()
              if($original -lt 0){ throw 'Tamper byte read failed.' }
              [void]$stream.Seek($offset,[IO.SeekOrigin]::Begin);$stream.WriteByte([byte]($original -bxor 0x01));$stream.Flush()
            }finally{$stream.Dispose()}
            $tamperedSig=Get-AuthenticodeSignature -LiteralPath $tampered
            $tamperOut=(& $signtool verify /pa /all /v $tampered 2>&1 | Out-String);$tamperExit=$LASTEXITCODE
            if([string]$tamperedSig.Status -eq 'Valid' -or $tamperExit -eq 0){ throw 'Tampered signed candidate was unexpectedly accepted.' }
            $global:LASTEXITCODE=0

            $result=[ordered]@{
              schema_version=1;package_id='PKG-03';task_id='03.22';production_accepted=$true;
              source_commit=$env:VSN_SOURCE_SHA;source_base=$env:VSN_SOURCE_BASE_SHA;source_ref=$env:VSN_SOURCE_REF;trusted_request_commit=$env:VSN_TRUSTED_REQUEST_SHA;
              trusted_workflow_commit='${{ github.sha }}';workflow_run_id=[long]$env:VSN_WORKFLOW_RUN_ID;workflow_run_attempt=[int]$env:VSN_WORKFLOW_RUN_ATTEMPT;
              runner=[ordered]@{os=$env:RUNNER_OS;arch=$env:RUNNER_ARCH;image_os=$env:ImageOS;image_version=$env:ImageVersion};
              protected_environment='production-signing';environment_guard='production-signing-v1';production_credentials_external=$true;private_key_material_recorded=$false;
              authenticode_digest='SHA256';timestamp_protocol='RFC3161';timestamp_digest='SHA256';expected_publisher=$env:VSN_PROD_EXPECTED_SUBJECT;
              certificate_thumbprint=$thumb;candidates=$rows;
              windows_native_verification=$true;expected_publisher_binding=$true;package_identity_metadata_equal=$true;
              tamper_negative=[ordered]@{file_name=[IO.Path]::GetFileName($tampered);authenticode_status=[string]$tamperedSig.Status;signtool_verify_exit=$tamperExit;rejected=$true};
              secret_leak_scan_passed=$true
            }
            $resultPath=Join-Path $evidence 'evidence.json'
            $result | ConvertTo-Json -Depth 14 | Set-Content -LiteralPath $resultPath -Encoding utf8NoBOM
            $digest=Get-Sha $resultPath
            "$digest  evidence.json" | Set-Content -LiteralPath (Join-Path $evidence 'evidence.json.sha256') -Encoding utf8NoBOM

            foreach($file in @(Get-ChildItem -LiteralPath $evidence -Recurse -File -Force)){
              if(@('.pfx','.p12','.key','.pem') -contains $file.Extension.ToLowerInvariant()){ throw "Forbidden secret-bearing evidence file: $($file.FullName)" }
              if($file.Length -le 2MB){
                try{$text=[IO.File]::ReadAllText($file.FullName)}catch{continue}
                foreach($marker in @('-----BEGIN PRIVATE KEY-----','-----BEGIN RSA PRIVATE KEY-----','-----BEGIN EC PRIVATE KEY-----','-----BEGIN ENCRYPTED PRIVATE KEY-----')){
                  if($text.Contains($marker)){ throw "Private-key marker found in evidence: $($file.FullName)" }
                }
              }
            }
          }finally{
            if($null -ne $store){$store.Dispose()}
            if($thumb){Remove-Item -LiteralPath "Cert:\CurrentUser\My\$thumb" -Force -ErrorAction SilentlyContinue}
            if($null -ne $cert){$cert.Dispose()}
            if($null -ne $pfxBytes){[Array]::Clear($pfxBytes,0,$pfxBytes.Length)}
          }

      - name: Upload protected production-signing evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: pkg03-0322-trusted-production-signing
          path: |
            dist-pkg03/03.22-trusted/production-signed/**
            dist-pkg03/03.22-trusted/evidence/**
            dist-pkg03/03.22-trusted/unsigned-provenance.json
          if-no-files-found: error
          compression-level: 0

      - name: Upload trusted signing diagnostics
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: pkg03-0322-trusted-production-signing-failure
          path: dist-pkg03/03.22-trusted/**
          if-no-files-found: warn
          compression-level: 0
