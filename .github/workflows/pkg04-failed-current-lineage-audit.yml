name: PKG-04 Failed-Current Lineage Audit

on:
  push:
    branches:
      - audit/pkg04-failed-current-lineage-20260907
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pkg04-failed-current-lineage-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unix-failed-current-lineage:
    name: ${{ matrix.os }} · failed-current lineage collision
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        os: [ubuntu-24.04, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10

    steps:
      - name: Checkout exact source without credentials
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 1

      - name: Bind exact checkout identity
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = '${{ github.sha }}'
          test -z "$(git status --porcelain=v1 --untracked-files=no)"

      - name: Install exact Rust 1.97.1
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install 1.97.1 --profile minimal
          rustup default 1.97.1
          rustc --version | grep '^rustc 1.97.1 '
          cargo --version | grep '^cargo 1.97.1 '

      - name: Fetch locked dependency graph
        run: cargo fetch --locked

      - name: Materialize temporary failed-current lineage probe
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p crates/vsn-update/tests
          cat > crates/vsn-update/tests/pkg04_failed_current_lineage_probe.rs <<'RS'
          use sha2::{Digest, Sha256};
          use std::{fs, path::PathBuf, time::{SystemTime, UNIX_EPOCH}};

          fn digest_hex(bytes: &[u8]) -> String {
              Sha256::digest(bytes)
                  .iter()
                  .map(|byte| format!("{byte:02x}"))
                  .collect::<String>()
          }

          fn apply(root: &std::path::Path, rel: &str, staged: &std::path::Path, bytes: &[u8]) {
              let request = vsn_update::ApplyFileRequest {
                  install_root: root.to_path_buf(),
                  target_relative: PathBuf::from(rel),
                  staged_artifact: staged.to_path_buf(),
                  expected_sha256: digest_hex(bytes),
                  release: "1.0.0".into(),
                  confirm_apply: true,
              };
              vsn_update::apply_verified_file(&request).expect("apply");
          }

          #[test]
          fn failed_current_slot_is_overwritten_across_targets_with_same_basename_and_release() {
              let unique = format!(
                  "vsn-pkg04-failed-current-{}-{}",
                  std::process::id(),
                  SystemTime::now().duration_since(UNIX_EPOCH).expect("clock").as_nanos()
              );
              let base = std::env::temp_dir().join(unique);
              let root = base.join("install");
              let bin_dir = root.join("bin");
              let alt_dir = root.join("alt");
              fs::create_dir_all(&bin_dir).expect("create bin");
              fs::create_dir_all(&alt_dir).expect("create alt");

              let first_target = bin_dir.join("vsn-agent");
              let second_target = alt_dir.join("vsn-agent");
              fs::write(&first_target, b"BIN-OLD").expect("seed first old");
              fs::write(&second_target, b"ALT-OLD").expect("seed second old");

              let first_candidate = base.join("first.bin");
              let second_candidate = base.join("second.bin");
              fs::write(&first_candidate, b"BIN-NEW").expect("seed first candidate");
              fs::write(&second_candidate, b"ALT-NEW").expect("seed second candidate");

              apply(&root, "bin/vsn-agent", &first_candidate, b"BIN-NEW");
              vsn_update::rollback_verified_file(&root, true).expect("first rollback");

              let failed_slot = root.join(".vsn-update/failed-current/vsn-agent.1.0.0");
              assert_eq!(fs::read(&failed_slot).expect("first failed-current"), b"BIN-NEW");
              assert_eq!(fs::read(&first_target).expect("first restored"), b"BIN-OLD");

              apply(&root, "alt/vsn-agent", &second_candidate, b"ALT-NEW");
              vsn_update::rollback_verified_file(&root, true).expect("second rollback");

              // rollback_verified_file removes this deterministic slot before moving the
              // current target into it. Same basename + release therefore destroys the
              // first target's failed-current evidence/recovery bytes.
              assert_eq!(fs::read(&failed_slot).expect("second failed-current"), b"ALT-NEW");
              assert_eq!(fs::read(&first_target).expect("first target final"), b"BIN-OLD");
              assert_eq!(fs::read(&second_target).expect("second target final"), b"ALT-OLD");

              println!(
                  "PKG04_FAILED_CURRENT_LINEAGE_CONFIRMED failed_slot=vsn-agent.1.0.0 first_failed_bytes_replaced=true final_failed_bytes=ALT-NEW first_target=BIN-OLD second_target=ALT-OLD"
              );

              fs::remove_dir_all(&base).expect("cleanup isolated probe tree");
          }
          RS

      - name: Execute bounded failed-current probe
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p audit-evidence
          python3 - <<'PY'
          import pathlib, subprocess, sys
          log = pathlib.Path('audit-evidence/probe.log')
          cmd = ['cargo','test','--locked','-p','vsn-update','--test','pkg04_failed_current_lineage_probe','--','--nocapture']
          try:
              result = subprocess.run(cmd, stdout=subprocess.PIPE, stderr=subprocess.STDOUT, text=True, timeout=240, check=False)
              output = result.stdout or ''
              log.write_text(output, encoding='utf-8')
              sys.stdout.write(output[-20000:])
              if result.returncode != 0:
                  raise SystemExit(result.returncode)
          except subprocess.TimeoutExpired as exc:
              output = exc.stdout or ''
              if isinstance(output, bytes): output = output.decode('utf-8', errors='replace')
              log.write_text(output, encoding='utf-8')
              sys.stdout.write(output[-20000:])
              print('PKG04_FAILED_CURRENT_LINEAGE_TIMEOUT after 240 seconds', file=sys.stderr)
              raise SystemExit(124)
          PY
          grep -q 'PKG04_FAILED_CURRENT_LINEAGE_CONFIRMED' audit-evidence/probe.log
          checkout_sha="$(git rev-parse HEAD)"
          test "$checkout_sha" = '${{ github.sha }}'
          cat > audit-evidence/result.json <<JSON
          {
            "schema": "vsn.pkg04.failed-current-lineage.v1",
            "checkout_sha": "$checkout_sha",
            "expected_source_sha": "${{ github.sha }}",
            "canonical_base_sha": "79812eafdead24de88d8b3fafd19f1bfc0e1435c",
            "runner_os": "${RUNNER_OS}",
            "runner_arch": "${RUNNER_ARCH}",
            "generated_test_only": true,
            "production_state_used": false,
            "same_basename_same_release_different_targets": true,
            "failed_current_slot_collision_confirmed": true,
            "first_failed_current_bytes_destroyed_by_second_rollback": true,
            "second_failed_current_bytes_replace_slot": true
          }
          JSON

      - name: Remove temporary probe and prove tracked tree unchanged
        if: always()
        shell: bash
        run: |
          rm -f crates/vsn-update/tests/pkg04_failed_current_lineage_probe.rs
          git diff --exit-code
          test -z "$(git status --porcelain=v1 --untracked-files=no)"

      - name: Upload non-secret audit evidence
        if: success()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: pkg04-failed-current-lineage-${{ matrix.os }}
          path: audit-evidence/**
          if-no-files-found: error
          retention-days: 14
