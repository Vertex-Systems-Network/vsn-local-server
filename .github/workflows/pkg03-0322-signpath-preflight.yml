name: PKG-03 03.22 SignPath Foundation Preflight

on:
  workflow_dispatch:
    inputs:
      enable_signpath_submission:
        description: 'Must remain false until SignPath Foundation approval and trusted-main reconciliation.'
        required: true
        default: false
        type: boolean
  push:
    branches:
      - 'pkg03/0322-signpath-preparation'
    paths:
      - '.github/workflows/pkg03-0322-signpath-preflight.yml'
      - 'docs/CODE-SIGNING-POLICY.md'
      - 'docs/SIGNPATH-FOUNDATION-INTEGRATION.md'
      - 'scripts/ci/pkg03-0322-signpath-preflight.ps1'

permissions:
  contents: read
  actions: read

concurrency:
  group: pkg03-0322-signpath-preflight-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contract-preflight:
    name: SignPath contract preflight (no secrets)
    runs-on: windows-2025
    timeout-minutes: 15
    steps:
      - name: Checkout exact source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Verify exact head and preparation boundary
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $actual=(git rev-parse HEAD).Trim()
          if ($actual -ne '${{ github.sha }}') { throw "Exact-head mismatch: expected=${{ github.sha }} actual=$actual" }
          if ('${{ github.ref }}' -ne 'refs/heads/pkg03/0322-signpath-preparation') {
            throw 'Preparation workflow is intentionally branch-scoped until provider approval and trusted-main reconciliation.'
          }
          if (@(git status --porcelain=v1 --untracked-files=no).Count -ne 0) { throw 'Tracked checkout drift detected.' }

      - name: Validate fail-closed SignPath preparation contract
        shell: pwsh
        run: |
          & scripts/ci/pkg03-0322-signpath-preflight.ps1
          if ($LASTEXITCODE -ne 0) { throw 'SignPath preflight contract validation failed.' }

      - name: Emit non-secret readiness evidence
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          New-Item -ItemType Directory -Force 'dist-pkg03/03.22/signpath-preflight' | Out-Null
          $evidence=[ordered]@{
            schema_version=1
            package_id='PKG-03'
            task_id='03.22'
            source_commit='${{ github.sha }}'
            provider='SignPath Foundation'
            provider_approval='pending'
            production_submission_enabled=$false
            canonical_progress_changed=$false
            production_accepted=$false
            required_secret_names=@('SIGNPATH_API_TOKEN')
            required_variable_names=@('SIGNPATH_ORGANIZATION_ID','SIGNPATH_PROJECT_SLUG','SIGNPATH_SIGNING_POLICY_SLUG','SIGNPATH_ARTIFACT_CONFIGURATION_SLUG','VSN_SIGNING_ENV_GUARD')
            required_env_guard='production-signing-v1'
            trusted_target_branch='main'
            protected_environment='production-signing'
          }
          $evidence | ConvertTo-Json -Depth 8 | Set-Content -Encoding utf8NoBOM 'dist-pkg03/03.22/signpath-preflight/readiness.json'

      - name: Upload preparation evidence
        uses: actions/upload-artifact@v7
        with:
          name: pkg03-0322-signpath-preflight
          path: dist-pkg03/03.22/signpath-preflight/
          if-no-files-found: error
          retention-days: 14

  signpath-submit-placeholder:
    name: SignPath submit placeholder (hard blocked)
    needs: contract-preflight
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.enable_signpath_submission == true }}
    runs-on: windows-2025
    timeout-minutes: 5
    steps:
      - name: Refuse mutable-branch production submission
        shell: pwsh
        run: |
          throw @'
          SignPath submission is intentionally disabled in the preparation branch.
          After SignPath Foundation approval, reconcile this workflow onto trusted main,
          bind the protected production-signing Environment, build/upload the exact unsigned
          03.22 artifact, and only then enable signpath/github-action-submit-signing-request@v2.
          '@

