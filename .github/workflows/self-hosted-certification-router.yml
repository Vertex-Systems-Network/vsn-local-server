name: Windows GitHub-Hosted Certification Router

on:
  issue_comment:
    types: [created]
  create:

permissions:
  contents: read
  pull-requests: read
  issues: write

jobs:
  route-certification:
    if: >-
      (github.event_name == 'issue_comment' &&
       github.event.issue.pull_request &&
       startsWith(github.event.comment.body, '/run-github ') &&
       (github.actor == 'wpessential' ||
        github.event.comment.author_association == 'OWNER' ||
        github.event.comment.author_association == 'MEMBER' ||
        github.event.comment.author_association == 'COLLABORATOR')) ||
      (github.event_name == 'create' &&
       github.event.ref_type == 'branch' &&
       startsWith(github.event.ref, 'github-run/pr') &&
       github.actor == 'wpessential')
    name: Route certification to GitHub-hosted Windows
    runs-on: windows-latest
    timeout-minutes: 90
    defaults:
      run:
        shell: pwsh
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Validate GitHub-hosted runner and certification target
        id: route
        run: |
          $ErrorActionPreference = 'Stop'
          if (-not $IsWindows) { throw 'certification requires Windows' }
          if ($env:RUNNER_ENVIRONMENT -ne 'github-hosted') { throw 'certification requires a GitHub-hosted runner' }
          Write-Host "runner=$env:RUNNER_NAME environment=$env:RUNNER_ENVIRONMENT os=$env:RUNNER_OS arch=$env:RUNNER_ARCH"

          if ('${{ github.event_name }}' -eq 'issue_comment') {
            $command = '${{ github.event.comment.body }}'.Trim()
            if ($command -notmatch '^/run-github (02\.[0-9]{2})$') {
              throw "unsupported certification command: $command"
            }
            $task = $Matches[1]
            $number = '${{ github.event.issue.number }}'
          } else {
            $ref = '${{ github.event.ref }}'
            if ($ref -notmatch '^github-run/pr([0-9]+)-(02[0-9]{2})-[A-Za-z0-9_-]+$') {
              throw "unsupported GitHub-hosted trigger branch: $ref"
            }
            $number = $Matches[1]
            $compactTask = $Matches[2]
            $task = $compactTask.Substring(0,2) + '.' + $compactTask.Substring(2,2)
          }

          $headers = @{
            Authorization = "Bearer $env:GH_TOKEN"
            Accept = 'application/vnd.github+json'
            'X-GitHub-Api-Version' = '2022-11-28'
            'User-Agent' = 'vsn-github-hosted-certification-router'
          }
          $pr = Invoke-RestMethod -Headers $headers -Uri ('${{ github.api_url }}/repos/${{ github.repository }}/pulls/' + $number)
          if ($pr.head.repo.full_name -ne '${{ github.repository }}') {
            throw "certification target must be a same-repository PR: $($pr.head.repo.full_name)"
          }
          if ($pr.state -ne 'open') { throw 'certification target PR must be open' }
          $scriptName = 'pkg02-' + $task.Replace('.', '') + '.ps1'
          "task=$task" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "pr_number=$number" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "script_name=$scriptName" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "pr_head_sha=$($pr.head.sha)" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - uses: actions/checkout@v4
        with:
          ref: refs/pull/${{ steps.route.outputs.pr_number }}/merge
          fetch-depth: 2
          clean: true

      - name: Bind checked-out merge and exact PR head
        run: |
          $ErrorActionPreference = 'Stop'
          $mergeSha = (& git rev-parse HEAD).Trim()
          $headSha = '${{ steps.route.outputs.pr_head_sha }}'
          $parents = (& git rev-list --parents -n 1 HEAD).Trim().Split(' ')
          if ($parents.Count -lt 3) { throw 'expected GitHub pull-request merge ref' }
          if ($parents[2] -ne $headSha) {
            throw "merge ref head mismatch: expected $headSha, got $($parents[2])"
          }
          "VSN_PR_HEAD_SHA=$headSha" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "VSN_PR_MERGE_SHA=$mergeSha" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "VSN_CERT_TASK=${{ steps.route.outputs.task }}" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "VSN_CERT_PR=${{ steps.route.outputs.pr_number }}" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Report GitHub-hosted certification start
        run: |
          $ErrorActionPreference = 'Stop'
          $headers = @{
            Authorization = "Bearer $env:GH_TOKEN"
            Accept = 'application/vnd.github+json'
            'X-GitHub-Api-Version' = '2022-11-28'
            'User-Agent' = 'vsn-github-hosted-certification-router'
          }
          $body = @{
            body = "GITHUB_HOSTED_CERT START task=$env:VSN_CERT_TASK run=${{ github.run_id }} attempt=${{ github.run_attempt }} runner=$env:RUNNER_NAME head=$env:VSN_PR_HEAD_SHA merge=$env:VSN_PR_MERGE_SHA"
          } | ConvertTo-Json
          Invoke-RestMethod -Method Post -Headers $headers -ContentType 'application/json' -Body $body -Uri ('${{ github.api_url }}/repos/${{ github.repository }}/issues/' + $env:VSN_CERT_PR + '/comments') | Out-Null

      - name: Run requested certification script
        run: |
          $ErrorActionPreference = 'Stop'
          $script = Join-Path $PWD ('scripts\self-hosted\' + '${{ steps.route.outputs.script_name }}')
          if (-not (Test-Path -LiteralPath $script -PathType Leaf)) {
            throw "certification script not found: $script"
          }
          $env:GITHUB_SHA = $env:VSN_PR_HEAD_SHA
          & pwsh -NoProfile -File $script
          if ($LASTEXITCODE -ne 0) { throw "certification script failed with exit $LASTEXITCODE" }

      - name: Report GitHub-hosted certification success
        if: success()
        run: |
          $headers = @{
            Authorization = "Bearer $env:GH_TOKEN"
            Accept = 'application/vnd.github+json'
            'X-GitHub-Api-Version' = '2022-11-28'
            'User-Agent' = 'vsn-github-hosted-certification-router'
          }
          $body = @{
            body = "GITHUB_HOSTED_CERT SUCCESS task=$env:VSN_CERT_TASK run=${{ github.run_id }} attempt=${{ github.run_attempt }} runner=$env:RUNNER_NAME head=$env:VSN_PR_HEAD_SHA merge=$env:VSN_PR_MERGE_SHA artifact=github-hosted-$env:VSN_CERT_TASK-pr-$env:VSN_CERT_PR"
          } | ConvertTo-Json
          Invoke-RestMethod -Method Post -Headers $headers -ContentType 'application/json' -Body $body -Uri ('${{ github.api_url }}/repos/${{ github.repository }}/issues/' + $env:VSN_CERT_PR + '/comments') | Out-Null

      - name: Report GitHub-hosted certification failure
        if: failure()
        run: |
          $headers = @{
            Authorization = "Bearer $env:GH_TOKEN"
            Accept = 'application/vnd.github+json'
            'X-GitHub-Api-Version' = '2022-11-28'
            'User-Agent' = 'vsn-github-hosted-certification-router'
          }
          $body = @{
            body = "GITHUB_HOSTED_CERT FAILURE task=$env:VSN_CERT_TASK run=${{ github.run_id }} attempt=${{ github.run_attempt }} runner=$env:RUNNER_NAME head=$env:VSN_PR_HEAD_SHA merge=$env:VSN_PR_MERGE_SHA artifact=github-hosted-$env:VSN_CERT_TASK-pr-$env:VSN_CERT_PR"
          } | ConvertTo-Json
          Invoke-RestMethod -Method Post -Headers $headers -ContentType 'application/json' -Body $body -Uri ('${{ github.api_url }}/repos/${{ github.repository }}/issues/' + $env:VSN_CERT_PR + '/comments') | Out-Null

      - name: Upload GitHub-hosted certification evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: github-hosted-${{ steps.route.outputs.task }}-pr-${{ steps.route.outputs.pr_number }}
          path: dist-self-hosted
          if-no-files-found: warn
