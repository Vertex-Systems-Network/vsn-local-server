name: Windows GitHub-Hosted Certification Router

on:
  issue_comment:
    types: [created]
  create:

permissions:
  contents: read
  pull-requests: read

jobs:
  route-certification:
    if: >-
      (github.event_name == 'issue_comment' &&
       github.event.issue.pull_request &&
       startsWith(github.event.comment.body, '/run-github ') &&
       (github.actor == 'wpessential' ||
        github.event.comment.author_association == 'OWNER' ||
        github.event.comment.author_association == 'MEMBER' ||
        github.event.comment.author_association == 'COLLABORATOR')) ||
      (github.event_name == 'create' &&
       github.event.ref_type == 'branch' &&
       startsWith(github.event.ref, 'github-run/pr') &&
       github.actor == 'wpessential')
    name: Resolve certification target
    runs-on: windows-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
    defaults:
      run:
        shell: pwsh
    outputs:
      task: ${{ steps.route.outputs.task }}
      pr_number: ${{ steps.route.outputs.pr_number }}
      script_name: ${{ steps.route.outputs.script_name }}
      pr_head_sha: ${{ steps.route.outputs.pr_head_sha }}
    env:
      VSN_EVENT_NAME: ${{ github.event_name }}
      VSN_COMMENT_BODY: ${{ github.event.comment.body }}
      VSN_ISSUE_NUMBER: ${{ github.event.issue.number }}
      VSN_CREATED_REF: ${{ github.event.ref }}
      VSN_API_URL: ${{ github.api_url }}
      VSN_REPOSITORY: ${{ github.repository }}
      VSN_READ_TOKEN: ${{ github.token }}
    steps:
      - name: Validate GitHub-hosted runner and certification target
        id: route
        run: |
          $ErrorActionPreference = 'Stop'
          if (-not $IsWindows) { throw 'certification routing requires Windows' }
          if ($env:RUNNER_ENVIRONMENT -ne 'github-hosted') { throw 'certification routing requires a GitHub-hosted runner' }
          Write-Host "runner=$env:RUNNER_NAME environment=$env:RUNNER_ENVIRONMENT os=$env:RUNNER_OS arch=$env:RUNNER_ARCH"

          if ($env:VSN_EVENT_NAME -eq 'issue_comment') {
            $command = [string]$env:VSN_COMMENT_BODY
            if ($command -notmatch '^/run-github (02\.[0-9]{2})$') {
              throw "unsupported certification command"
            }
            $task = $Matches[1]
            $number = [string]$env:VSN_ISSUE_NUMBER
          } else {
            $ref = [string]$env:VSN_CREATED_REF
            if ($ref -notmatch '^github-run/pr([0-9]+)-(02[0-9]{2})-[A-Za-z0-9_-]+$') {
              throw "unsupported GitHub-hosted trigger branch"
            }
            $number = $Matches[1]
            $compactTask = $Matches[2]
            $task = $compactTask.Substring(0,2) + '.' + $compactTask.Substring(2,2)
          }

          if ($number -notmatch '^[0-9]+$') { throw 'invalid pull request number' }
          $headers = @{
            Authorization = "Bearer $env:VSN_READ_TOKEN"
            Accept = 'application/vnd.github+json'
            'X-GitHub-Api-Version' = '2022-11-28'
            'User-Agent' = 'vsn-github-hosted-certification-router'
          }
          $pr = Invoke-RestMethod -Headers $headers -Uri ($env:VSN_API_URL + '/repos/' + $env:VSN_REPOSITORY + '/pulls/' + $number)
          if ($pr.head.repo.full_name -ne $env:VSN_REPOSITORY) {
            throw "certification target must be a same-repository PR"
          }
          if ($pr.state -ne 'open') { throw 'certification target PR must be open' }
          if ([string]$pr.head.sha -notmatch '^[0-9a-f]{40}$') { throw 'invalid PR head SHA' }

          $scriptName = 'pkg02-' + $task.Replace('.', '') + '.ps1'
          "task=$task" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "pr_number=$number" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "script_name=$scriptName" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "pr_head_sha=$($pr.head.sha)" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

  certify:
    name: Run certification without write credentials
    needs: route-certification
    runs-on: windows-latest
    timeout-minutes: 90
    permissions:
      contents: read
    defaults:
      run:
        shell: pwsh
    env:
      VSN_PR_HEAD_SHA: ${{ needs.route-certification.outputs.pr_head_sha }}
      VSN_CERT_TASK: ${{ needs.route-certification.outputs.task }}
      VSN_CERT_PR: ${{ needs.route-certification.outputs.pr_number }}
      VSN_CERT_SCRIPT: ${{ needs.route-certification.outputs.script_name }}
    steps:
      - name: Checkout exact PR merge without persisted credentials
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: refs/pull/${{ needs.route-certification.outputs.pr_number }}/merge
          fetch-depth: 2
          clean: true
          persist-credentials: false

      - name: Bind checked-out merge and exact PR head
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:VSN_PR_HEAD_SHA -notmatch '^[0-9a-f]{40}$') { throw 'invalid routed PR head SHA' }
          $mergeSha = (& git rev-parse HEAD).Trim()
          $parents = (& git rev-list --parents -n 1 HEAD).Trim().Split(' ')
          if ($parents.Count -lt 3) { throw 'expected GitHub pull-request merge ref' }
          if ($parents[2] -ne $env:VSN_PR_HEAD_SHA) {
            throw "merge ref head mismatch"
          }
          "VSN_PR_MERGE_SHA=$mergeSha" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Prove PR-controlled execution has no write token surface
        run: |
          $ErrorActionPreference = 'Stop'
          foreach ($name in @('GH_TOKEN','GITHUB_TOKEN','VSN_READ_TOKEN','VSN_REPORT_TOKEN')) {
            if (Test-Path "Env:$name") { throw "$name must not be exposed to PR-controlled certification code" }
          }
          $credentialHelper = (& git config --local --get-all credential.helper 2>$null | Out-String).Trim()
          $extraHeader = (& git config --local --get-all http.https://github.com/.extraheader 2>$null | Out-String).Trim()
          if ($credentialHelper) { throw 'git credential helper unexpectedly persisted after checkout' }
          if ($extraHeader) { throw 'GitHub authorization header unexpectedly persisted after checkout' }

      - name: Run requested certification script
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:VSN_CERT_SCRIPT -notmatch '^pkg02-02[0-9]{2}\.ps1$') { throw 'invalid certification script name' }
          $script = Join-Path $PWD ('scripts\self-hosted\' + $env:VSN_CERT_SCRIPT)
          if (-not (Test-Path -LiteralPath $script -PathType Leaf)) {
            throw "certification script not found"
          }
          $env:GITHUB_SHA = $env:VSN_PR_HEAD_SHA
          & pwsh -NoProfile -File $script
          if ($LASTEXITCODE -ne 0) { throw "certification script failed with exit $LASTEXITCODE" }

      - name: Upload GitHub-hosted certification evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: github-hosted-${{ needs.route-certification.outputs.task }}-pr-${{ needs.route-certification.outputs.pr_number }}
          path: dist-self-hosted
          if-no-files-found: warn

  report-result:
    name: Report certification result without PR code
    if: always() && needs.route-certification.result == 'success'
    needs: [route-certification, certify]
    runs-on: windows-latest
    timeout-minutes: 10
    permissions:
      issues: write
    defaults:
      run:
        shell: pwsh
    env:
      VSN_API_URL: ${{ github.api_url }}
      VSN_REPOSITORY: ${{ github.repository }}
      VSN_REPORT_TOKEN: ${{ github.token }}
      VSN_CERT_TASK: ${{ needs.route-certification.outputs.task }}
      VSN_CERT_PR: ${{ needs.route-certification.outputs.pr_number }}
      VSN_PR_HEAD_SHA: ${{ needs.route-certification.outputs.pr_head_sha }}
      VSN_CERT_RESULT: ${{ needs.certify.result }}
      VSN_RUN_ID: ${{ github.run_id }}
      VSN_RUN_ATTEMPT: ${{ github.run_attempt }}
    steps:
      - name: Post GitHub-hosted certification result
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:VSN_CERT_PR -notmatch '^[0-9]+$') { throw 'invalid certification PR number' }
          if ($env:VSN_CERT_RESULT -eq 'success') { $status = 'SUCCESS' } else { $status = 'FAILURE' }
          $headers = @{
            Authorization = "Bearer $env:VSN_REPORT_TOKEN"
            Accept = 'application/vnd.github+json'
            'X-GitHub-Api-Version' = '2022-11-28'
            'User-Agent' = 'vsn-github-hosted-certification-router'
          }
          $artifact = 'github-hosted-' + $env:VSN_CERT_TASK + '-pr-' + $env:VSN_CERT_PR
          $message = "GITHUB_HOSTED_CERT $status task=$env:VSN_CERT_TASK run=$env:VSN_RUN_ID attempt=$env:VSN_RUN_ATTEMPT head=$env:VSN_PR_HEAD_SHA artifact=$artifact"
          $body = @{ body = $message } | ConvertTo-Json
          Invoke-RestMethod -Method Post -Headers $headers -ContentType 'application/json' -Body $body -Uri ($env:VSN_API_URL + '/repos/' + $env:VSN_REPOSITORY + '/issues/' + $env:VSN_CERT_PR + '/comments') | Out-Null
