name: PKG-02 02.21 Loopback Preview Fetch

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  loopback-preview-fetch:
    name: 02.21 GitHub-hosted loopback preview fetch
    runs-on: windows-latest
    timeout-minutes: 60
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
        with:
          clean: true

      - name: Verify GitHub-hosted Windows runner
        run: |
          $ErrorActionPreference = 'Stop'
          if (-not $IsWindows) { throw '02.21 certification requires Windows' }
          if ($env:RUNNER_ENVIRONMENT -ne 'github-hosted') { throw '02.21 certification requires a GitHub-hosted runner' }
          Write-Host "runner=$env:RUNNER_NAME environment=$env:RUNNER_ENVIRONMENT os=$env:RUNNER_OS arch=$env:RUNNER_ARCH"

      - name: Run 02.21 certification
        run: |
          $ErrorActionPreference = 'Stop'
          & pwsh -NoProfile -File scripts/self-hosted/pkg02-0221.ps1
          if ($LASTEXITCODE -ne 0) { throw "02.21 certification failed with exit $LASTEXITCODE" }

      - name: Upload 02.21 GitHub-hosted evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pkg02-0221-loopback-preview-fetch-github-hosted
          path: dist-self-hosted/02.21
          if-no-files-found: warn
