name: Fast Epoch PKG-04 04.01 Activation Preflight

on:
  push:
    branches:
      - 'integration/fast-epoch-*'
    paths:
      - '.github/workflows/fast-epoch-pkg04-activation.yml'
      - 'scripts/ci/pkg04-activation-preflight.py'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fast-epoch-pkg04-activation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  activation-preflight:
    name: NON_ACCEPTANCE_PREIMPLEMENTATION PKG-04 04.01 activation
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout exact epoch head
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 1

      - name: Bind exact source and compile validator
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = '${{ github.sha }}'
          python3 -m py_compile scripts/ci/pkg04-activation-preflight.py
          test -z "$(git status --porcelain=v1)"

      - name: Exercise synthetic PKG-03 COMPLETE to PKG-04 eligibility contract
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/ci/pkg04-activation-preflight.py \
            --self-test \
            --output .fast-pkg04-activation/report.json

      - name: Validate preflight remains non-activation
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path
          report=json.loads(Path('.fast-pkg04-activation/report.json').read_text(encoding='utf-8'))
          assert report['schema_version']==1
          assert report['task_id']=='04.01'
          assert report['mode']=='NON_ACCEPTANCE_PREIMPLEMENTATION'
          assert report['production_evidence_consumed'] is False
          assert report['canonical_state_changed'] is False
          assert report['implementation_authority'] is False
          assert report['pkg04_activated'] is False
          assert report['normalized_pkg03_final_handoff_ready'] is True
          assert report['negative_rejections'] >= 10
          assert report['self_test_pass'] is True
          print('PKG04_0401_NON_ACTIVATION_PREFLIGHT=PASS')
          PY

      - name: Cleanup and prove zero tracked drift
        if: always()
        shell: bash
        run: |
          rm -rf .fast-pkg04-activation scripts/ci/__pycache__
          test -z "$(git status --porcelain=v1)"
