name: Internal 02.20 simple branch patch

on:
  push:
    branches:
      - pkg02/0220-pty-conpty-main-sync

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[0220-patched]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: pkg02/0220-pty-conpty-main-sync
          fetch-depth: 0
      - name: Apply 02.20 patch
        run: python scripts/internal-patch-0220.py
      - name: Validate patch text
        run: |
          git diff --check
          grep -q 'writer: Arc<Mutex<Box<dyn Write + Send>>>' crates/vsn-terminal/src/lib.rs
          grep -q 'MOVEFILE_REPLACE_EXISTING' crates/vsn-terminal/src/lib.rs
          grep -q 'terminal.pty.read-wait' crates/vsn-ipc/src/lib.rs
      - name: Commit product changes
        run: |
          if git diff --quiet -- crates/vsn-terminal/src/lib.rs crates/vsn-ipc/src/lib.rs; then
            echo '02.20 product patch already present'
            exit 0
          fi
          git config user.name "WPEssential"
          git config user.email "wordpress.essential@gmail.com"
          git add crates/vsn-terminal/src/lib.rs crates/vsn-ipc/src/lib.rs
          git commit -m "fix(terminal): harden PTY lifecycle [0220-patched]"
          git push origin HEAD:pkg02/0220-pty-conpty-main-sync
