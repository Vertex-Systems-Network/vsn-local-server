name: PKG-02 02.11 Runtime Install and Project Activation

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pkg02-0211-github-hosted-${{ github.ref }}
  cancel-in-progress: true

jobs:
  runtime-install-activation:
    name: 02.11 GitHub-hosted transactional trusted install and activation
    runs-on: windows-latest
    timeout-minutes: 60
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
        with:
          clean: true
          ref: ${{ github.sha }}

      - name: Verify exact source and GitHub-hosted Windows runner
        run: |
          $ErrorActionPreference = 'Stop'
          if (-not $IsWindows) { throw '02.11 certification requires Windows' }
          if ($env:RUNNER_ENVIRONMENT -ne 'github-hosted') { throw '02.11 certification requires a GitHub-hosted runner' }
          $actual = (git rev-parse HEAD).Trim()
          if ($actual -ne '${{ github.sha }}') { throw "02.11 source binding mismatch: expected=${{ github.sha }} actual=$actual" }
          Write-Host "source=$actual runner=$env:RUNNER_NAME environment=$env:RUNNER_ENVIRONMENT os=$env:RUNNER_OS arch=$env:RUNNER_ARCH"

      - name: Run 02.11 certification
        run: |
          $ErrorActionPreference = 'Stop'
          & pwsh -NoProfile -File scripts/self-hosted/pkg02-0211.ps1
          if ($LASTEXITCODE -ne 0) { throw "02.11 certification failed with exit $LASTEXITCODE" }

      - name: Upload 02.11 GitHub-hosted evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pkg02-0211-runtime-install-activation-github-hosted
          path: dist-self-hosted/02.11
          if-no-files-found: warn
