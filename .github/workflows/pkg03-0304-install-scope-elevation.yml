name: PKG-03 03.04 Install Scope + Elevation

on:
  pull_request:
    branches: [main]
    paths:
      - '.ai/features/pkg03-0304/**'
      - '.ai/manifests/pkg03-0304-install-scope-elevation.v1.json'
      - '.ai/plans/pkg03-0304-install-scope-elevation-v1.md'
      - '.github/workflows/pkg03-0304-install-scope-elevation.yml'
      - 'docs/PKG03-WINDOWS-INSTALL-SCOPE-ELEVATION-V1.md'
      - 'scripts/ci/validate-pkg03-0304.py'
      - 'apps/desktop/src-tauri/tauri.conf.json'
      - 'apps/desktop/src-tauri/tauri.per-machine.conf.json'
      - 'apps/desktop/package.json'
      - 'apps/desktop/package-lock.json'
      - 'rust-toolchain.toml'
      - 'certification/pkg03-windows-installer-v1.json'
      - 'docs/MASTER-EXECUTION-STATUS.json'
  push:
    branches:
      - 'pkg03/0304-install-scope-elevation'
      - main
    paths:
      - '.ai/features/pkg03-0304/**'
      - '.ai/manifests/pkg03-0304-install-scope-elevation.v1.json'
      - '.ai/plans/pkg03-0304-install-scope-elevation-v1.md'
      - '.github/workflows/pkg03-0304-install-scope-elevation.yml'
      - 'docs/PKG03-WINDOWS-INSTALL-SCOPE-ELEVATION-V1.md'
      - 'scripts/ci/validate-pkg03-0304.py'
      - 'apps/desktop/src-tauri/tauri.conf.json'
      - 'apps/desktop/src-tauri/tauri.per-machine.conf.json'
      - 'apps/desktop/package.json'
      - 'apps/desktop/package-lock.json'
      - 'rust-toolchain.toml'
      - 'certification/pkg03-windows-installer-v1.json'
      - 'docs/MASTER-EXECUTION-STATUS.json'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pkg03-0304-${{ github.ref }}
  cancel-in-progress: true

jobs:
  install-scope:
    name: 03.04 Windows install-scope contract
    runs-on: windows-2025
    timeout-minutes: 35
    steps:
      - name: Checkout exact source head
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          fetch-depth: 1

      - name: Bind exact source head
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $expected = '${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}'
          $actual = (git rev-parse HEAD).Trim()
          if ($actual -ne $expected) {
            throw "Exact-head checkout mismatch: expected=$expected actual=$actual"
          }
          "VSN_SOURCE_SHA=$actual" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          $tracked = @(git status --porcelain=v1 --untracked-files=no)
          if ($tracked.Count -ne 0) {
            $tracked | Write-Host
            throw 'Checkout is not tracked-clean before 03.04.'
          }

      - name: Set up Node 22.12.0
        uses: actions/setup-node@v4
        with:
          node-version: '22.12.0'

      - name: Install exact Rust 1.97.1
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          rustup toolchain install 1.97.1 --profile minimal
          rustup default 1.97.1
          if ((rustc --version).Trim() -notmatch '^rustc 1\.97\.1 ') { throw 'Unexpected rustc version' }
          if ((cargo --version).Trim() -notmatch '^cargo 1\.97\.1 ') { throw 'Unexpected cargo version' }

      - name: Validate frozen 03.04 authority
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          python scripts/ci/validate-pkg03-0304.py

      - name: Install locked Desktop graph
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Push-Location apps/desktop
          npm ci --no-audit --no-fund
          Pop-Location
          git diff --exit-code -- apps/desktop/package.json apps/desktop/package-lock.json

      - name: Verify repository-local Tauri CLI
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force dist-pkg03/03.04 | Out-Null
          Push-Location apps/desktop
          $tauri = (& .\node_modules\.bin\tauri.cmd --version | Out-String).Trim()
          Pop-Location
          if ($tauri -notmatch '^tauri-cli ') { throw "Unexpected Tauri CLI output: $tauri" }
          $tauri | Set-Content -Encoding utf8NoBOM dist-pkg03/03.04/tauri-version.txt

      - name: Parse and compile current-user configuration without bundling
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Push-Location apps/desktop
          & .\node_modules\.bin\tauri.cmd build --no-bundle
          if ($LASTEXITCODE -ne 0) { throw "Current-user no-bundle build failed with exit code $LASTEXITCODE" }
          Pop-Location
          'passed' | Set-Content -Encoding utf8NoBOM dist-pkg03/03.04/current-user-no-bundle.txt

      - name: Parse and compile per-machine overlay without bundling
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Push-Location apps/desktop
          & .\node_modules\.bin\tauri.cmd build --no-bundle --config src-tauri/tauri.per-machine.conf.json
          if ($LASTEXITCODE -ne 0) { throw "Per-machine no-bundle build failed with exit code $LASTEXITCODE" }
          Pop-Location
          'passed' | Set-Content -Encoding utf8NoBOM dist-pkg03/03.04/per-machine-no-bundle.txt

      - name: Verify zero tracked drift
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          git diff --exit-code
          $tracked = @(git status --porcelain=v1 --untracked-files=no)
          if ($tracked.Count -ne 0) {
            $tracked | Write-Host
            throw 'Tracked repository drift detected during 03.04.'
          }

      - name: Build exact install-scope evidence
        shell: pwsh
        env:
          VSN_WORKFLOW_RUN_ID: ${{ github.run_id }}
          VSN_WORKFLOW_RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          $ErrorActionPreference = 'Stop'
          @'
          import hashlib
          import json
          import os
          import subprocess
          from pathlib import Path

          root = Path('.')
          out = root / 'dist-pkg03' / '03.04'

          def sha_bytes(data):
              return hashlib.sha256(data).hexdigest()

          def git_bytes(path):
              return subprocess.check_output(['git', 'show', f'HEAD:{path}'])

          source = os.environ['VSN_SOURCE_SHA']
          actual = subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip()
          if source != actual:
              raise SystemExit(f'source mismatch: env={source} git={actual}')

          default = json.loads((root / 'apps/desktop/src-tauri/tauri.conf.json').read_text(encoding='utf-8'))
          machine = json.loads((root / 'apps/desktop/src-tauri/tauri.per-machine.conf.json').read_text(encoding='utf-8'))
          default_mode = default['bundle']['windows']['nsis']['installMode']
          machine_mode = machine['bundle']['windows']['nsis']['installMode']
          if [default_mode, machine_mode] != ['currentUser', 'perMachine']:
              raise SystemExit(f'unexpected install modes: {[default_mode, machine_mode]}')
          if 'both' in [default_mode, machine_mode]:
              raise SystemExit('forbidden NSIS both mode present')
          if (out / 'current-user-no-bundle.txt').read_text(encoding='utf-8-sig').strip() != 'passed':
              raise SystemExit('current-user parse/build marker missing')
          if (out / 'per-machine-no-bundle.txt').read_text(encoding='utf-8-sig').strip() != 'passed':
              raise SystemExit('per-machine parse/build marker missing')

          evidence = {
              'schema_version': 1,
              'package_id': 'PKG-03',
              'task_id': '03.04',
              'source_commit': source,
              'workflow_run_id': int(os.environ['VSN_WORKFLOW_RUN_ID']),
              'workflow_run_attempt': int(os.environ['VSN_WORKFLOW_RUN_ATTEMPT']),
              'scope_contract': {
                  'default_nsis_install_mode': default_mode,
                  'machine_nsis_install_mode': machine_mode,
                  'forbidden_nsis_install_mode': 'both',
                  'msi_install_scope': 'perMachine',
                  'current_user_registry_scope': 'HKCU',
                  'per_machine_registry_scope': 'HKLM',
                  'current_user_elevation_required': False,
                  'per_machine_elevation_required': True,
              },
              'config_acceptance': {
                  'current_user_no_bundle_build': True,
                  'per_machine_no_bundle_build': True,
              },
              'tauri_cli': (out / 'tauri-version.txt').read_text(encoding='utf-8-sig').strip(),
              'input_sha256': {
                  'tauri_config': sha_bytes(git_bytes('apps/desktop/src-tauri/tauri.conf.json')),
                  'per_machine_overlay': sha_bytes(git_bytes('apps/desktop/src-tauri/tauri.per-machine.conf.json')),
                  'desktop_package_lock': sha_bytes(git_bytes('apps/desktop/package-lock.json')),
                  'task_manifest': sha_bytes(git_bytes('.ai/manifests/pkg03-0304-install-scope-elevation.v1.json')),
              },
              'installer_executed': False,
              'uac_prompted': False,
              'privileged_mutation': False,
              'service_registration_performed': False,
              'payload_ownership_mutation': False,
              'custom_installer_template_used': False,
              'signing_performed': False,
              'updater_mutation': False,
              'tracked_repository_drift_zero': True,
          }
          if evidence['input_sha256']['desktop_package_lock'] != 'b2f41ab8c7a116cb9c78d41fd8036e7e1b1307bc3b78cd9a33ef37d5911c0aa6':
              raise SystemExit('Desktop lock digest changed')

          path = out / 'evidence.json'
          path.write_text(json.dumps(evidence, indent=2, sort_keys=True) + '\n', encoding='utf-8')
          digest = sha_bytes(path.read_bytes())
          (out / 'evidence.json.sha256').write_text(f'{digest}  evidence.json\n', encoding='utf-8')
          print(json.dumps(evidence, indent=2, sort_keys=True))
          '@ | python -

      - name: Verify evidence
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          @'
          import hashlib
          import json
          from pathlib import Path

          root = Path('dist-pkg03/03.04')
          path = root / 'evidence.json'
          evidence = json.loads(path.read_text(encoding='utf-8'))
          scope = evidence['scope_contract']
          assert scope['default_nsis_install_mode'] == 'currentUser'
          assert scope['machine_nsis_install_mode'] == 'perMachine'
          assert scope['forbidden_nsis_install_mode'] == 'both'
          assert scope['current_user_elevation_required'] is False
          assert scope['per_machine_elevation_required'] is True
          assert evidence['config_acceptance']['current_user_no_bundle_build'] is True
          assert evidence['config_acceptance']['per_machine_no_bundle_build'] is True
          assert evidence['installer_executed'] is False
          assert evidence['uac_prompted'] is False
          assert evidence['privileged_mutation'] is False
          assert evidence['service_registration_performed'] is False
          assert evidence['custom_installer_template_used'] is False
          assert evidence['tracked_repository_drift_zero'] is True
          digest = hashlib.sha256(path.read_bytes()).hexdigest()
          expected = (root / 'evidence.json.sha256').read_text(encoding='utf-8').split()[0]
          assert digest == expected
          print(json.dumps({'evidence_sha256': digest, 'valid': True}, indent=2))
          '@ | python -

      - name: Upload exact 03.04 install-scope evidence
        uses: actions/upload-artifact@v4
        with:
          name: pkg03-0304-install-scope-elevation
          path: dist-pkg03/03.04
          if-no-files-found: error
          compression-level: 0
