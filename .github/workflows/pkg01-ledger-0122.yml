name: PKG-01 Ledger 01.22

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  reconcile:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'pkg01/0122-final-gate'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Reconcile PKG-01 completion state and canonical ledger
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path

          cert_path = Path('certification/pkg01-build-foundation-v1.json')
          cert = json.loads(cert_path.read_text())
          assert cert['done'] == 21 and cert['active_task'] == '01.22'
          assert all(t['status'] == 'DONE' for t in cert['tasks'][:21])
          final = cert['tasks'][21]
          assert final['id'] == '01.22'
          final['status'] = 'DONE'
          final.pop('depends_on', None)
          final['evidence'] = ('Workflow run 32478702360 job 96760289285 passed the PKG-01 final evidence-chain gate. '
                               'Artifact 9445239088 records package_ready=true after validating all 21 prerequisites, '
                               'the candidate-bound 01.20 manifest evidence, final-clean-head 01.21 fresh-checkout '
                               'reproducibility evidence, current committed lock inputs, byte-for-byte Rust release '
                               'outputs, and exact Desktop/Dashboard output-tree matches.')
          cert['done'] = 22
          cert['percent'] = 100.0
          cert['complete'] = True
          cert['active_task'] = None
          cert_path.write_text(json.dumps(cert, indent=2) + '\n')

          status_path = Path('docs/MASTER-EXECUTION-STATUS.json')
          status = json.loads(status_path.read_text())
          pkg = next(p for p in status['packages'] if p['id'] == 'PKG-01')
          assert pkg['done'] == 21
          pkg.update({'done': 22, 'percent': 100.0, 'status': 'COMPLETE'})
          status['packages_complete'] = 1
          status['active_package'] = 'PKG-02'
          status['active_task'] = None
          status['notes'].append('01.22 DONE: run 32478702360 job 96760289285 passed the final PKG-01 evidence-chain gate; artifact 9445239088 records package_ready=true.')
          status['notes'].append('PKG-01 COMPLETE: 22/22 = 100%. PKG-02 is next, but its 27 acceptance subtasks must be explicitly frozen before any PKG-02 progress is counted.')
          status_path.write_text(json.dumps(status, indent=2) + '\n')

          plan_path = Path('docs/MASTER-EXECUTION-PLAN.md')
          plan = plan_path.read_text()
          plan = plan.replace('| PKG-01 | Reproducible Build Foundation | 22 | IN PROGRESS |',
                              '| PKG-01 | Reproducible Build Foundation | 22 | COMPLETE |')
          old = '## Current blocker\nThe root `Cargo.lock` is absent. Before dependency resolution begins, `01.02` must be re-certified against the candidate currently declared by `docs/release-candidate-current.json`.'
          new = ('## Current blocker\nPKG-01 is COMPLETE at 22/22. PKG-02 (`Usable Local Server Beta`) is next, but the master plan currently declares only its fixed denominator of 27 tasks and does not enumerate those acceptance subtasks. Freeze the explicit PKG-02 task sequence before executing or counting PKG-02 progress.')
          assert old in plan
          plan = plan.replace(old, new)
          plan_path.write_text(plan)

          ledger_path = Path('VSN_AI_PROJECT_STATE.md')
          ledger = ledger_path.read_text()
          marker = '## 34. 2026-08-21 - PKG-01 COMPLETE at 22/22'
          if marker not in ledger:
              section = '''\n\n## 34. 2026-08-21 - PKG-01 COMPLETE at 22/22\n\nLive GitHub evidence closes the Reproducible Build Foundation package.\n\n- PR #22 (`PKG-01: certify 01.21 fresh-checkout reproducibility`) merged to `main` as `46196bc00ab6d13393757bf4341395d5ae3a008b`.\n- Final clean-head 01.21 run `32477336028` passed all four jobs: Dashboard `96756298259`, Rust `96756298485`, Desktop `96756298595`, and aggregate `96758677711`.\n- Final clean-head 01.21 aggregate artifact `9445049779` is bound to accepted PR #22 head `5baf14122bfde48b378bdc500d1cc7cff9054fcd`.\n- PR #23 branch: `pkg01/0122-final-gate`.\n- 01.22 workflow run `32478702360`, job `96760289285` - PASS.\n- 01.22 artifact `9445239088` (`pkg01-0122-final-gate`) records `package_ready: true` after re-validating the candidate, current lock inputs, certified 01.20 manifest evidence, and final-clean-head 01.21 reproducibility evidence.\n- Rust release outputs remained byte-for-byte identical to the certified 01.09/01.10/01.11 binaries; Desktop and Dashboard output trees remained exact matches to certified 01.15/01.19 outputs.\n- `certification/pkg01-build-foundation-v1.json` and `docs/MASTER-EXECUTION-STATUS.json` are reconciled to PKG-01 COMPLETE.\n- `docs/MASTER-EXECUTION-PLAN.md` no longer carries the obsolete Cargo.lock blocker.\n\nCurrent genuine state:\n\n```text\nPKG-01  22/22 = 100.00% COMPLETE\nDONE:   01.01-01.22\nNEXT:   PKG-02 Usable Local Server Beta\nRULE:   freeze the explicit 27-task PKG-02 acceptance sequence before counting any PKG-02 progress\n```\n\nExact continuation rule: do not invent or count `02.xx` tasks until the canonical 27-task PKG-02 sequence is explicitly defined. Once frozen, execute it sequentially with the same evidence-first and final-clean-head merge discipline used for PKG-01.\n'''
              ledger_path.write_text(ledger.rstrip() + section)
          PY
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add certification/pkg01-build-foundation-v1.json docs/MASTER-EXECUTION-STATUS.json docs/MASTER-EXECUTION-PLAN.md VSN_AI_PROJECT_STATE.md
          git commit -m 'PKG-01: mark build foundation complete at 22 of 22'
          git push origin HEAD:${GITHUB_HEAD_REF}
