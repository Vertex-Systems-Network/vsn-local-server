name: Temporary PKG-02 02.14 Rustfmt

on:
  push:
    branches:
      - pkg02/0214-local-diagnostics-main-sync
    paths:
      - '.github/workflows/tmp-pkg02-0214-rustfmt.yml'

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: pkg02/0214-local-diagnostics-main-sync
          fetch-depth: 0
      - name: Apply exact Rust 1.97.1 formatting
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install 1.97.1 --profile minimal --component rustfmt
          cargo +1.97.1 fmt --all
          mapfile -t changed < <(git diff --name-only)
          for path in "${changed[@]}"; do
            case "$path" in
              crates/vsn-system/src/lib.rs|crates/vsn-system/tests/pkg02_local_diagnostics.rs) ;;
              *) echo "unexpected rustfmt change: $path" >&2; exit 1 ;;
            esac
          done
          if [ ${#changed[@]} -eq 0 ]; then
            echo 'No formatting changes required.'
            exit 0
          fi
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add crates/vsn-system/src/lib.rs crates/vsn-system/tests/pkg02_local_diagnostics.rs
          git commit -m 'style(pkg02): apply rustfmt to 02.14 diagnostics'
          git push origin HEAD:pkg02/0214-local-diagnostics-main-sync
