name: PKG-01 Ledger 01.20

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  reconcile:
    if: github.event.pull_request.head.ref == 'pkg01/0120-build-artifact-manifest'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: pkg01/0120-build-artifact-manifest
          fetch-depth: 0

      - name: Reconcile 01.20 certification, status and canonical ledger
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64
          import json
          from pathlib import Path

          cert_path = Path('certification/pkg01-build-foundation-v1.json')
          cert = json.loads(cert_path.read_text())
          cert['done'] = 20
          cert['percent'] = 90.91
          cert['active_task'] = '01.21'
          for task in cert['tasks']:
              if task['id'] == '01.20':
                  task['status'] = 'DONE'
                  task['evidence'] = 'Workflow run 32475878603 job 96751992830 verified certification/pkg01-build-artifact-manifest-v1.json against the candidate, both committed npm lockfiles, and all five historical certified build artifacts downloaded by GitHub artifact ID. Artifact 9444250477 records manifest SHA-256 8e23f966f57a79647625b2fd9839a2e201cfaaaef547fe6c2769046aa9b23865, verified_artifact_count=5, verified_input_count=2, historical_artifacts_rehashed=true and committed_inputs_rehashed=true.'
                  task.pop('depends_on', None)
              elif task['id'] == '01.21':
                  task['status'] = 'IN_PROGRESS'
              elif task['id'] == '01.22':
                  task['status'] = 'BLOCKED'
          cert_path.write_text(json.dumps(cert, indent=2) + '\n')

          status_path = Path('docs/MASTER-EXECUTION-STATUS.json')
          status = json.loads(status_path.read_text())
          status['active_task'] = '01.21'
          pkg = next(p for p in status['packages'] if p['id'] == 'PKG-01')
          pkg['done'] = 20
          pkg['percent'] = 90.91
          pkg['status'] = 'IN_PROGRESS'
          status['notes'] = [n for n in status['notes'] if not n.startswith('01.20 ACTIVE:')]
          status['notes'].append('01.20 DONE: run 32475878603 job 96751992830 verified the candidate-bound manifest and re-hashed both committed npm lockfiles plus all five historical certified build artifacts; artifact 9444250477 records manifest SHA-256 8e23f966f57a79647625b2fd9839a2e201cfaaaef547fe6c2769046aa9b23865.')
          status['notes'].append('01.21 ACTIVE: prove fresh-checkout reproducibility for the locked Rust, Desktop and Dashboard dependency/install/build gates.')
          status_path.write_text(json.dumps(status, indent=2) + '\n')

          ledger_path = Path('VSN_AI_PROJECT_STATE.md')
          marker = '## 32. 2026-08-21 - 01.20 candidate-bound build artifact manifest certified'
          encoded = ''
          ledger = ledger_path.read_text()
          section = base64.b64decode(encoded).decode('utf-8').strip()
          if marker not in ledger:
              ledger_path.write_text(ledger.rstrip() + '\n\n' + section + '\n')
          PY

          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add certification/pkg01-build-foundation-v1.json docs/MASTER-EXECUTION-STATUS.json VSN_AI_PROJECT_STATE.md
          git diff --cached --check
          if git diff --cached --quiet; then
            echo 'State already reconciled.'
            exit 0
          fi
          git commit -m 'PKG-01: reconcile canonical state through 01.20'
          git push origin HEAD:pkg01/0120-build-artifact-manifest
