name: PKG-03 03.11 Agent Service Lifecycle

on:
  pull_request:
    branches: [main]
    paths:
      - '.ai/current-work.json'
      - '.ai/features/pkg03-0311/**'
      - '.ai/manifests/pkg03-0311-agent-service-install.v2.json'
      - '.ai/plans/pkg03-0311-agent-service-install-v2.md'
      - 'docs/PKG03-AGENT-SERVICE-LIFECYCLE-V2.md'
      - 'apps/desktop/src-tauri/tauri.windows.conf.json'
      - 'apps/desktop/src-tauri/windows/pkg03-0311-agent-service.nsh'
      - 'apps/desktop/src-tauri/windows/fragments/pkg03-0311-agent-service.wxs'
      - 'scripts/ci/pkg03-0311-agent-service-lifecycle.ps1'
      - 'scripts/ci/validate-pkg03-0311.py'
      - '.github/workflows/pkg03-0311-agent-service-lifecycle.yml'
      - 'certification/pkg03-windows-installer-v1.json'
      - 'docs/MASTER-EXECUTION-STATUS.json'
      - 'README.md'
  push:
    branches:
      - 'pkg03/0311-agent-service-install-v2'
      - main
    paths:
      - '.ai/current-work.json'
      - '.ai/features/pkg03-0311/**'
      - '.ai/manifests/pkg03-0311-agent-service-install.v2.json'
      - '.ai/plans/pkg03-0311-agent-service-install-v2.md'
      - 'docs/PKG03-AGENT-SERVICE-LIFECYCLE-V2.md'
      - 'apps/desktop/src-tauri/tauri.windows.conf.json'
      - 'apps/desktop/src-tauri/windows/pkg03-0311-agent-service.nsh'
      - 'apps/desktop/src-tauri/windows/fragments/pkg03-0311-agent-service.wxs'
      - 'scripts/ci/pkg03-0311-agent-service-lifecycle.ps1'
      - 'scripts/ci/validate-pkg03-0311.py'
      - '.github/workflows/pkg03-0311-agent-service-lifecycle.yml'
      - 'certification/pkg03-windows-installer-v1.json'
      - 'docs/MASTER-EXECUTION-STATUS.json'
      - 'README.md'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pkg03-0311-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  agent-service-lifecycle:
    name: 03.11 Windows Agent service lifecycle
    runs-on: windows-2025
    timeout-minutes: 90
    steps:
      - name: Checkout exact source head
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          fetch-depth: 0

      - name: Bind exact source head
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $expected='${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}'
          $actual=(git rev-parse HEAD).Trim()
          if($actual -ne $expected){throw "Exact-head checkout mismatch: expected=$expected actual=$actual"}
          "VSN_SOURCE_SHA=$actual" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          if(@(git status --porcelain=v1 --untracked-files=no).Count -ne 0){throw 'Checkout is not tracked-clean before 03.11.'}

      - name: Set up Node 22.12.0
        uses: actions/setup-node@v4
        with:
          node-version: '22.12.0'

      - name: Install exact Rust 1.97.1
        shell: pwsh
        run: |
          rustup toolchain install 1.97.1 --profile minimal
          rustup default 1.97.1
          if((rustc --version).Trim() -notmatch '^rustc 1\.97\.1 '){throw 'Unexpected rustc version'}
          if((cargo --version).Trim() -notmatch '^cargo 1\.97\.1 '){throw 'Unexpected cargo version'}

      - name: Validate frozen 03.11 implementation authority
        shell: pwsh
        run: python scripts/ci/validate-pkg03-0311.py

      - name: Parse 03.11 PowerShell harness
        shell: pwsh
        run: |
          $tokens=$null;$errors=$null
          [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path 'scripts/ci/pkg03-0311-agent-service-lifecycle.ps1').Path,[ref]$tokens,[ref]$errors)|Out-Null
          if($errors.Count -ne 0){$errors|ForEach-Object{Write-Host $_.Message};throw "03.11 harness has $($errors.Count) parse error(s)."}

      - name: Install locked Desktop graph
        shell: pwsh
        run: |
          if(Test-Path apps/desktop/node_modules){throw 'node_modules unexpectedly exists before npm ci'}
          Push-Location apps/desktop
          npm ci --no-audit --no-fund
          Pop-Location
          git diff --exit-code -- apps/desktop/package.json apps/desktop/package-lock.json

      - name: Verify locked Cargo graph
        shell: pwsh
        run: |
          cargo fetch --locked
          cargo metadata --locked --no-deps --format-version 1 | Out-Null

      - name: Record repository-local Tauri CLI
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force target/pkg03/03.11,dist-pkg03/03.11|Out-Null
          $tauri=(& .\apps\desktop\node_modules\.bin\tauri.cmd --version|Out-String).Trim()
          if($tauri -ne 'tauri-cli 2.11.4'){throw "Unexpected local Tauri CLI output: $tauri"}
          $tauri|Set-Content -Encoding utf8NoBOM dist-pkg03/03.11/tauri-version.txt

      - name: Build exact-head current-user NSIS
        shell: pwsh
        run: |
          Push-Location apps/desktop
          & .\node_modules\.bin\tauri.cmd build --bundles nsis
          if($LASTEXITCODE -ne 0){throw "Current-user NSIS build failed: $LASTEXITCODE"}
          Pop-Location
          $setups=@(Get-ChildItem target/release/bundle/nsis -Filter '*-setup.exe' -File)
          if($setups.Count -ne 1){throw "Expected one current-user NSIS setup; found $($setups.Count)"}
          Copy-Item $setups[0].FullName target/pkg03/03.11/current-user-setup.exe -Force

      - name: Build exact-head per-machine NSIS
        shell: pwsh
        run: |
          Remove-Item target/release/bundle/nsis -Recurse -Force -ErrorAction SilentlyContinue
          Push-Location apps/desktop
          & .\node_modules\.bin\tauri.cmd build --bundles nsis --config src-tauri/tauri.per-machine.conf.json
          if($LASTEXITCODE -ne 0){throw "Per-machine NSIS build failed: $LASTEXITCODE"}
          Pop-Location
          $setups=@(Get-ChildItem target/release/bundle/nsis -Filter '*-setup.exe' -File)
          if($setups.Count -ne 1){throw "Expected one per-machine NSIS setup; found $($setups.Count)"}
          Copy-Item $setups[0].FullName target/pkg03/03.11/per-machine-setup.exe -Force

      - name: Build exact-head MSI/WiX
        shell: pwsh
        run: |
          Remove-Item target/release/bundle/msi -Recurse -Force -ErrorAction SilentlyContinue
          Push-Location apps/desktop
          & .\node_modules\.bin\tauri.cmd build --bundles msi
          if($LASTEXITCODE -ne 0){throw "MSI build failed: $LASTEXITCODE"}
          Pop-Location
          $msi=@(Get-ChildItem target/release/bundle/msi -Filter '*.msi' -File)
          if($msi.Count -ne 1){throw "Expected one MSI; found $($msi.Count)"}
          Copy-Item $msi[0].FullName target/pkg03/03.11/vsn-dev-platform.msi -Force

      - name: Exercise genuine 03.11 service lifecycle
        shell: pwsh
        run: |
          & scripts/ci/pkg03-0311-agent-service-lifecycle.ps1 `
            -CurrentUserSetupPath 'target/pkg03/03.11/current-user-setup.exe' `
            -PerMachineSetupPath 'target/pkg03/03.11/per-machine-setup.exe' `
            -MsiPath 'target/pkg03/03.11/vsn-dev-platform.msi' `
            -SourceSha $env:VSN_SOURCE_SHA `
            -EvidenceDir 'dist-pkg03/03.11'

      - name: Capture MSI failure root cause
        if: failure()
        shell: pwsh
        run: |
          $ErrorActionPreference='Continue'
          $out=Join-Path (Get-Location) 'dist-pkg03/03.11'
          New-Item -ItemType Directory -Force $out|Out-Null
          $diag=[ordered]@{captured_at_utc=[DateTime]::UtcNow.ToString('o');custom_actions=@();execute_sequence=@();windows=@();service=$null;msiexec_before=@();msiexec_after=@();logs=@()}
          try {
            $msi=(Resolve-Path 'target/pkg03/03.11/vsn-dev-platform.msi').Path
            $installer=New-Object -ComObject WindowsInstaller.Installer
            $db=$installer.GetType().InvokeMember('OpenDatabase','InvokeMethod',$null,$installer,@($msi,0))
            foreach($spec in @(
              @{Name='custom_actions';Sql='SELECT `Action`,`Type`,`Source`,`Target` FROM `CustomAction`';Fields=4},
              @{Name='execute_sequence';Sql='SELECT `Action`,`Condition`,`Sequence` FROM `InstallExecuteSequence`';Fields=3}
            )){
              $view=$db.GetType().InvokeMember('OpenView','InvokeMethod',$null,$db,@($spec.Sql))
              $view.GetType().InvokeMember('Execute','InvokeMethod',$null,$view,$null)|Out-Null
              $rows=@()
              while($true){
                $record=$view.GetType().InvokeMember('Fetch','InvokeMethod',$null,$view,$null)
                if($null -eq $record){break}
                $vals=@();for($i=1;$i -le $spec.Fields;$i++){$vals += [string]$record.GetType().InvokeMember('StringData','GetProperty',$null,$record,@($i))}
                if($vals[0] -like 'Pkg0311*'){$rows += ,$vals}
              }
              $diag[$spec.Name]=$rows
            }
          } catch {$diag.msi_table_error=$_.Exception.Message}
          try {
            $diag.msiexec_before=@(Get-CimInstance Win32_Process -Filter "Name='msiexec.exe'" -ErrorAction SilentlyContinue | ForEach-Object {[ordered]@{pid=[int]$_.ProcessId;parent_pid=[int]$_.ParentProcessId;command_line=[string]$_.CommandLine}})
            Add-Type -AssemblyName UIAutomationClient
            Add-Type -AssemblyName UIAutomationTypes
            $root=[System.Windows.Automation.AutomationElement]::RootElement
            $all=$root.FindAll([System.Windows.Automation.TreeScope]::Children,[System.Windows.Automation.Condition]::TrueCondition)
            foreach($window in $all){
              try {
                if(([string]$window.Current.Name) -ne 'Windows Installer' -or [bool]$window.Current.IsOffscreen){continue}
                $textCondition=[System.Windows.Automation.PropertyCondition]::new([System.Windows.Automation.AutomationElement]::ControlTypeProperty,[System.Windows.Automation.ControlType]::Text)
                $buttonCondition=[System.Windows.Automation.PropertyCondition]::new([System.Windows.Automation.AutomationElement]::ControlTypeProperty,[System.Windows.Automation.ControlType]::Button)
                $texts=@($window.FindAll([System.Windows.Automation.TreeScope]::Descendants,$textCondition)|ForEach-Object{([string]$_.Current.Name).Trim()}|Where-Object{$_})
                $buttons=@($window.FindAll([System.Windows.Automation.TreeScope]::Descendants,$buttonCondition))
                $diag.windows += [ordered]@{pid=[int]$window.Current.ProcessId;title=[string]$window.Current.Name;text=$texts;buttons=@($buttons|ForEach-Object{([string]$_.Current.Name).Trim()}|Where-Object{$_})}
                $ok=$buttons|Where-Object{(([string]$_.Current.Name)-replace '&','').Trim() -eq 'OK'}|Select-Object -First 1
                if($null -ne $ok){
                  try{$invoke=[System.Windows.Automation.InvokePattern]$ok.GetCurrentPattern([System.Windows.Automation.InvokePattern]::Pattern);$invoke.Invoke();$diag.acknowledged_error_dialog=$true}catch{$diag.dialog_ack_error=$_.Exception.Message}
                }
              } catch {}
            }
            Start-Sleep -Seconds 3
            $diag.msiexec_after=@(Get-CimInstance Win32_Process -Filter "Name='msiexec.exe'" -ErrorAction SilentlyContinue | ForEach-Object {[ordered]@{pid=[int]$_.ProcessId;parent_pid=[int]$_.ParentProcessId;command_line=[string]$_.CommandLine}})
          } catch {$diag.ui_capture_error=$_.Exception.Message}
          try {
            $svc=Get-CimInstance Win32_Service -Filter "Name='VSN-Agent'" -ErrorAction SilentlyContinue
            if($null -ne $svc){$diag.service=[ordered]@{name=[string]$svc.Name;state=[string]$svc.State;start_mode=[string]$svc.StartMode;start_name=[string]$svc.StartName;path_name=[string]$svc.PathName}}
          } catch {$diag.service_capture_error=$_.Exception.Message}
          Start-Sleep -Seconds 2
          $diag.logs=@(Get-ChildItem $out -Filter 'msi-*.log' -File -ErrorAction SilentlyContinue|ForEach-Object{[ordered]@{name=$_.Name;bytes=[long]$_.Length}})
          $diag|ConvertTo-Json -Depth 10|Set-Content -LiteralPath (Join-Path $out 'msi-failure-diagnostics.json') -Encoding utf8NoBOM
          Get-ChildItem $out -Filter 'msi-*.log' -File -ErrorAction SilentlyContinue|ForEach-Object{Write-Host "Captured $($_.FullName) ($($_.Length) bytes)"}

      - name: Upload failed 03.11 diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: pkg03-0311-agent-service-lifecycle-diagnostics
          path: |
            dist-pkg03/03.11/**
            target/pkg03/03.11/**
          if-no-files-found: warn
          compression-level: 0

      - name: Bind workflow metadata into exact evidence
        shell: pwsh
        env:
          VSN_WORKFLOW_RUN_ID: ${{ github.run_id }}
          VSN_WORKFLOW_RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          @'
          import hashlib,json,os,subprocess
          from pathlib import Path
          out=Path('dist-pkg03/03.11');p=out/'evidence.json';e=json.loads(p.read_text(encoding='utf-8-sig'))
          def h(b):return hashlib.sha256(b).hexdigest()
          def gb(path):return subprocess.check_output(['git','show',f'HEAD:{path}'])
          source=os.environ['VSN_SOURCE_SHA'];actual=subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip()
          if source!=actual or e.get('source_commit')!=source:raise SystemExit('03.11 exact-source binding mismatch')
          e['workflow_run_id']=int(os.environ['VSN_WORKFLOW_RUN_ID']);e['workflow_run_attempt']=int(os.environ['VSN_WORKFLOW_RUN_ATTEMPT'])
          e['runner']={'os':os.environ.get('RUNNER_OS'),'arch':os.environ.get('RUNNER_ARCH'),'image_os':os.environ.get('ImageOS'),'image_version':os.environ.get('ImageVersion')}
          e['toolchain']={'node':subprocess.check_output(['node','--version'],text=True).strip(),'rustc':subprocess.check_output(['rustc','--version'],text=True).strip(),'cargo':subprocess.check_output(['cargo','--version'],text=True).strip(),'tauri_cli':(out/'tauri-version.txt').read_text(encoding='utf-8-sig').strip()}
          e['input_sha256']={'task_manifest':h(gb('.ai/manifests/pkg03-0311-agent-service-install.v2.json')),'windows_tauri_config':h(gb('apps/desktop/src-tauri/tauri.windows.conf.json')),'nsis_hook':h(gb('apps/desktop/src-tauri/windows/pkg03-0311-agent-service.nsh')),'wix_fragment':h(gb('apps/desktop/src-tauri/windows/fragments/pkg03-0311-agent-service.wxs')),'ownership_manifest':h(gb('installer/windows/owned-payload.v1.json'))}
          if e['input_sha256']['ownership_manifest']!='5292a1ec1ae0a48d76f80258c9e00ba17b1466dab5c5e0cdda60caf4658dabd1':raise SystemExit('03.10 ownership manifest drifted')
          p.write_text(json.dumps(e,indent=2,sort_keys=True)+'\n',encoding='utf-8')
          digest=h(p.read_bytes());(out/'evidence.json.sha256').write_text(f'{digest}  evidence.json\n',encoding='utf-8')
          print(json.dumps({'source_commit':source,'evidence_sha256':digest},indent=2))
          '@ | python -

      - name: Verify exact 03.11 evidence
        shell: pwsh
        run: |
          @'
          import hashlib,json
          from pathlib import Path
          out=Path('dist-pkg03/03.11');p=out/'evidence.json';e=json.loads(p.read_text())
          assert e['task_id']=='03.11' and e['source_commit']
          cu=e['current_user'];assert cu['service_absent_after_install'] is True and cu['service_absent_after_uninstall'] is True and cu['machine_service_mutation_observed'] is False
          for lane in ('per_machine','msi'):
              x=e[lane];assert x['visible_install_ui_observed'] is True and x['visible_uninstall_ui_observed'] is True
              assert x['service_absent_after_uninstall'] is True and x['payload_removed_after_uninstall'] is True
              s=x['service'];assert s['bounded_transitions'] is True
              assert s['config']['name']=='VSN-Agent' and s['config']['display_name']=='VSN Agent' and s['config']['state']=='Running'
              assert s['config']['start_mode']=='Auto' and s['config']['start_name']=='NT AUTHORITY\\LocalService' and '--service-run' in s['config']['path_name']
              assert s['initial_health']['exit_code']==0 and s['second_health']['exit_code']==0
              assert s['stop']['exit_code']==0 and s['start']['exit_code']==0
          assert e['tracked_repository_drift_zero'] is True and e['workflow_run_id']>0
          assert e['input_sha256']['ownership_manifest']=='5292a1ec1ae0a48d76f80258c9e00ba17b1466dab5c5e0cdda60caf4658dabd1'
          digest=hashlib.sha256(p.read_bytes()).hexdigest();expected=(out/'evidence.json.sha256').read_text().split()[0];assert digest==expected
          print(json.dumps({'valid':True,'evidence_sha256':digest},indent=2))
          '@ | python -

      - name: Verify zero tracked drift
        shell: pwsh
        run: |
          git diff --exit-code
          if(@(git status --porcelain=v1 --untracked-files=no).Count -ne 0){throw 'Tracked repository drift detected after 03.11 lifecycle.'}

      - name: Upload exact 03.11 lifecycle evidence
        uses: actions/upload-artifact@v4
        with:
          name: pkg03-0311-agent-service-lifecycle
          path: |
            dist-pkg03/03.11/**
            target/pkg03/03.11/current-user-setup.exe
            target/pkg03/03.11/per-machine-setup.exe
            target/pkg03/03.11/vsn-dev-platform.msi
          if-no-files-found: error
          compression-level: 0