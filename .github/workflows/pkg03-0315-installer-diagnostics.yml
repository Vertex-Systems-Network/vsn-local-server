name: PKG-03 03.15 Installer Diagnostics

on:
  pull_request:
    branches: [main]
    paths:
      - '.ai/features/pkg03-0315/**'
      - '.ai/manifests/pkg03-0315-installer-diagnostics.v1.json'
      - '.ai/plans/pkg03-0315-installer-diagnostics-v1.md'
      - 'docs/PKG03-INSTALLER-DIAGNOSTICS-LIFECYCLE-V1.md'
      - 'scripts/ci/validate-pkg03-0315.py'
      - 'scripts/ci/pkg03-0315-installer-diagnostics.ps1'
      - '.github/workflows/pkg03-0315-installer-diagnostics.yml'
      - 'apps/desktop/src-tauri/tauri.conf.json'
      - 'apps/desktop/src-tauri/tauri.per-machine.conf.json'
      - 'installer/windows/owned-payload.v1.json'
      - 'certification/pkg03-windows-installer-v1.json'
      - 'docs/MASTER-EXECUTION-STATUS.json'
  push:
    branches:
      - 'pkg03/0315-installer-diagnostics'
      - main
    paths:
      - '.ai/features/pkg03-0315/**'
      - '.ai/manifests/pkg03-0315-installer-diagnostics.v1.json'
      - '.ai/plans/pkg03-0315-installer-diagnostics-v1.md'
      - 'docs/PKG03-INSTALLER-DIAGNOSTICS-LIFECYCLE-V1.md'
      - 'scripts/ci/validate-pkg03-0315.py'
      - 'scripts/ci/pkg03-0315-installer-diagnostics.ps1'
      - '.github/workflows/pkg03-0315-installer-diagnostics.yml'
      - 'apps/desktop/src-tauri/tauri.conf.json'
      - 'apps/desktop/src-tauri/tauri.per-machine.conf.json'
      - 'installer/windows/owned-payload.v1.json'
      - 'certification/pkg03-windows-installer-v1.json'
      - 'docs/MASTER-EXECUTION-STATUS.json'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pkg03-0315-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  installer-diagnostics:
    name: 03.15 Windows installer diagnostics lifecycle
    runs-on: windows-2025
    timeout-minutes: 55
    steps:
      - name: Checkout exact source head
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          fetch-depth: 0

      - name: Bind exact source head
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $expected = '${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}'
          $actual = (git rev-parse HEAD).Trim()
          if ($actual -ne $expected) { throw "Exact-head checkout mismatch: expected=$expected actual=$actual" }
          "VSN_SOURCE_SHA=$actual" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          if (@(git status --porcelain=v1 --untracked-files=no).Count -ne 0) { throw 'Checkout is not tracked-clean before 03.15.' }

      - name: Set up Node 22.12.0
        uses: actions/setup-node@v7
        with:
          node-version: '22.12.0'

      - name: Install exact Rust 1.97.1
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          rustup toolchain install 1.97.1 --profile minimal
          rustup default 1.97.1
          if ((rustc --version).Trim() -notmatch '^rustc 1\.97\.1 ') { throw 'Unexpected rustc version' }
          if ((cargo --version).Trim() -notmatch '^cargo 1\.97\.1 ') { throw 'Unexpected cargo version' }

      - name: Validate frozen 03.15 authority
        shell: pwsh
        run: python scripts/ci/validate-pkg03-0315.py

      - name: Parse diagnostics harness before cold build
        shell: pwsh
        run: |
          $tokens=$null; $errors=$null
          [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path 'scripts/ci/pkg03-0315-installer-diagnostics.ps1').Path,[ref]$tokens,[ref]$errors) | Out-Null
          if ($errors.Count -ne 0) { $errors | ForEach-Object { Write-Host $_.Message }; throw "03.15 harness has $($errors.Count) parse error(s)." }

      - name: Install locked Desktop graph
        shell: pwsh
        run: |
          if (Test-Path apps/desktop/node_modules) { throw 'node_modules unexpectedly exists before npm ci' }
          Push-Location apps/desktop
          npm ci --no-audit --no-fund
          Pop-Location
          git diff --exit-code -- apps/desktop/package.json apps/desktop/package-lock.json

      - name: Verify locked Cargo graph
        shell: pwsh
        run: |
          cargo fetch --locked
          cargo metadata --locked --no-deps --format-version 1 | Out-Null

      - name: Record repository-local Tauri CLI
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist-pkg03/03.15/packages | Out-Null
          $tauri = (& .\apps\desktop\node_modules\.bin\tauri.cmd --version | Out-String).Trim()
          if ($tauri -ne 'tauri-cli 2.11.4') { throw "Unexpected local Tauri CLI output: $tauri" }
          $tauri | Set-Content -Encoding utf8NoBOM dist-pkg03/03.15/tauri-version.txt

      - name: Build exact-head current-user NSIS
        shell: pwsh
        run: |
          Remove-Item -Recurse -Force target/release/bundle/nsis -ErrorAction SilentlyContinue
          Push-Location apps/desktop
          & .\node_modules\.bin\tauri.cmd build --bundles nsis
          if ($LASTEXITCODE -ne 0) { throw "Current-user NSIS build failed with exit code $LASTEXITCODE" }
          Pop-Location
          $setups=@(Get-ChildItem target/release/bundle/nsis -Filter '*-setup.exe' -File)
          if ($setups.Count -ne 1) { throw "Expected one current-user NSIS setup, found $($setups.Count)." }
          $copy=Join-Path (Resolve-Path 'dist-pkg03/03.15/packages').Path 'nsis-current-user.exe'
          Copy-Item -LiteralPath $setups[0].FullName -Destination $copy
          "VSN_0315_NSIS_USER=$copy" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Build exact-head per-machine NSIS
        shell: pwsh
        run: |
          Remove-Item -Recurse -Force target/release/bundle/nsis -ErrorAction SilentlyContinue
          Push-Location apps/desktop
          & .\node_modules\.bin\tauri.cmd build --bundles nsis --config src-tauri/tauri.per-machine.conf.json
          if ($LASTEXITCODE -ne 0) { throw "Per-machine NSIS build failed with exit code $LASTEXITCODE" }
          Pop-Location
          $setups=@(Get-ChildItem target/release/bundle/nsis -Filter '*-setup.exe' -File)
          if ($setups.Count -ne 1) { throw "Expected one per-machine NSIS setup, found $($setups.Count)." }
          $copy=Join-Path (Resolve-Path 'dist-pkg03/03.15/packages').Path 'nsis-per-machine.exe'
          Copy-Item -LiteralPath $setups[0].FullName -Destination $copy
          "VSN_0315_NSIS_MACHINE=$copy" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Build exact-head MSI/WiX
        shell: pwsh
        run: |
          Remove-Item -Recurse -Force target/release/bundle/msi -ErrorAction SilentlyContinue
          Push-Location apps/desktop
          & .\node_modules\.bin\tauri.cmd build --bundles msi
          if ($LASTEXITCODE -ne 0) { throw "MSI build failed with exit code $LASTEXITCODE" }
          Pop-Location
          $packages=@(Get-ChildItem target/release/bundle/msi -Filter '*.msi' -File)
          if ($packages.Count -ne 1) { throw "Expected one MSI package, found $($packages.Count)." }
          $copy=Join-Path (Resolve-Path 'dist-pkg03/03.15/packages').Path 'vsn-platform.msi'
          Copy-Item -LiteralPath $packages[0].FullName -Destination $copy
          "VSN_0315_MSI=$copy" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Exercise genuine installer diagnostics and cancellation lifecycles
        shell: pwsh
        run: |
          & scripts/ci/pkg03-0315-installer-diagnostics.ps1 `
            -CurrentUserNsisPath $env:VSN_0315_NSIS_USER `
            -PerMachineNsisPath $env:VSN_0315_NSIS_MACHINE `
            -MsiPath $env:VSN_0315_MSI `
            -SourceSha $env:VSN_SOURCE_SHA `
            -EvidenceDir 'dist-pkg03/03.15'

      - name: Upload failed 03.15 diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: pkg03-0315-installer-diagnostics-failure
          path: dist-pkg03/03.15/**
          if-no-files-found: warn
          compression-level: 0

      - name: Bind workflow metadata into exact evidence
        shell: pwsh
        env:
          VSN_WORKFLOW_RUN_ID: ${{ github.run_id }}
          VSN_WORKFLOW_RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          @'
          import hashlib, json, os, subprocess
          from pathlib import Path
          out=Path('dist-pkg03/03.15')
          path=out/'evidence.json'
          e=json.loads(path.read_text(encoding='utf-8-sig'))
          source=os.environ['VSN_SOURCE_SHA']
          actual=subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip()
          if source != actual or e.get('source_commit') != source:
              raise SystemExit('03.15 exact-source binding mismatch')
          e['workflow_run_id']=int(os.environ['VSN_WORKFLOW_RUN_ID'])
          e['workflow_run_attempt']=int(os.environ['VSN_WORKFLOW_RUN_ATTEMPT'])
          e['runner']={'os':os.environ.get('RUNNER_OS'),'arch':os.environ.get('RUNNER_ARCH'),'image_os':os.environ.get('ImageOS'),'image_version':os.environ.get('ImageVersion')}
          e['toolchain']={
              'node':subprocess.check_output(['node','--version'],text=True).strip(),
              'npm':subprocess.check_output(['npm.cmd','--version'],text=True).strip(),
              'rustc':subprocess.check_output(['rustc','--version'],text=True).strip(),
              'cargo':subprocess.check_output(['cargo','--version'],text=True).strip(),
              'tauri_cli':(out/'tauri-version.txt').read_text(encoding='utf-8-sig').strip(),
          }
          path.write_text(json.dumps(e,indent=2,sort_keys=True)+'\n',encoding='utf-8')
          digest=hashlib.sha256(path.read_bytes()).hexdigest()
          (out/'evidence.json.sha256').write_text(f'{digest}  evidence.json\n',encoding='utf-8')
          '@ | python -

      - name: Verify zero tracked drift
        shell: pwsh
        run: |
          $tracked=@(git status --porcelain=v1 --untracked-files=no)
          if ($tracked.Count -ne 0) { $tracked | Write-Host; throw 'Tracked drift detected after 03.15 lifecycle.' }

      - name: Verify exact 03.15 evidence
        shell: pwsh
        run: |
          @'
          import hashlib, json, os
          from pathlib import Path
          out=Path('dist-pkg03/03.15')
          e=json.loads((out/'evidence.json').read_text(encoding='utf-8'))
          if e['source_commit'] != os.environ['VSN_SOURCE_SHA']:
              raise SystemExit('source mismatch')
          ops=e['operations']
          checks=[
              (ops['nsis_current_user_success']['install']['exit_code'],0),
              (ops['nsis_current_user_success']['uninstall']['exit_code'],0),
              (ops['nsis_per_machine_success']['install']['exit_code'],0),
              (ops['nsis_per_machine_success']['uninstall']['exit_code'],0),
              (ops['nsis_setup_cancel']['result']['exit_code'],1),
              (ops['msi_install_success']['result']['exit_code'],0),
              (ops['msi_uninstall_success']['result']['exit_code'],0),
              (ops['msi_install_cancel']['result']['exit_code'],1602),
          ]
          for actual,expected in checks:
              if actual != expected: raise SystemExit(f'exit code mismatch: {actual} != {expected}')
          for name in ('msi_install_success','msi_uninstall_success','msi_install_cancel'):
              log=ops[name]['log']; p=Path(log['path'])
              if not p.is_file() or p.stat().st_size != log['size_bytes'] or p.stat().st_size <= 0:
                  raise SystemExit(f'log missing/size mismatch: {name}')
              if hashlib.sha256(p.read_bytes()).hexdigest() != log['sha256']:
                  raise SystemExit(f'log hash mismatch: {name}')
          if e.get('tracked_repository_drift_zero') is not True: raise SystemExit('tracked drift claim false')
          if e.get('nsis_native_persistent_log_claimed') is not False: raise SystemExit('invalid NSIS log claim')
          if e.get('nsis_uninstaller_cancel_exit_code_claimed') is not False: raise SystemExit('invalid NSIS uninstall cancel claim')
          evidence_digest=hashlib.sha256((out/'evidence.json').read_bytes()).hexdigest()
          declared=(out/'evidence.json.sha256').read_text(encoding='utf-8').split()[0]
          if evidence_digest != declared: raise SystemExit('evidence digest mismatch')
          print(json.dumps({'valid':True,'task':'03.15','workflow_run_id':e['workflow_run_id'],'evidence_sha256':evidence_digest},indent=2))
          '@ | python -

      - name: Upload exact 03.15 installer diagnostics evidence
        uses: actions/upload-artifact@v4
        with:
          name: pkg03-0315-installer-diagnostics
          path: dist-pkg03/03.15/**
          if-no-files-found: error
          compression-level: 0
