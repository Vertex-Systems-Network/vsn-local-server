name: Personal macOS + Linux Build (unsigned)

# Manual, unsigned builds for the owner's own Mac and Linux machines (DVF-13 first
# step). Not an acceptance gate: produces no certification evidence and does not
# change PKG-05 status. The macOS app is not notarized, so Gatekeeper needs
# right-click → Open the first time.

on:
  workflow_dispatch:
  # workflow_dispatch only works once this file is on the default branch; until then a
  # push that changes the Unix bundle configuration builds it on the pushed branch.
  push:
    branches: ['claude/**']
    paths:
      - .github/workflows/personal-unix-build.yml
      - apps/desktop/src-tauri/tauri.linux.conf.json
      - apps/desktop/src-tauri/tauri.macos.conf.json

permissions:
  contents: read

concurrency:
  group: personal-unix-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Unsigned ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux AppImage + deb
            os: ubuntu-24.04
            bundles: appimage,deb
            artifact: linux
          - name: macOS dmg (Apple silicon)
            os: macos-15
            bundles: app,dmg
            artifact: macos
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Set up Node 22.12.0
        uses: actions/setup-node@v4
        with:
          node-version: '22.12.0'

      - name: Install Rust 1.97.1
        run: |
          rustup toolchain install 1.97.1 --profile minimal
          rustup default 1.97.1

      - name: Install Linux WebKit dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf libssl-dev

      - name: Install locked Desktop graph
        working-directory: apps/desktop
        run: npm ci --no-audit --no-fund

      - name: Build bundles
        working-directory: apps/desktop
        run: ./node_modules/.bin/tauri build --bundles '${{ matrix.bundles }}'

      - name: Collect bundles and SHA-256 hashes
        run: |
          set -euo pipefail
          mkdir -p dist-personal
          find target/release/bundle \( -name '*.AppImage' -o -name '*.deb' -o -name '*.dmg' \) -type f -exec cp {} dist-personal/ \;
          test -n "$(ls -A dist-personal)"
          (cd dist-personal && shasum -a 256 * > SHA256SUMS.txt && cat SHA256SUMS.txt)

      - name: Upload bundles
        uses: actions/upload-artifact@v4
        with:
          name: vsn-${{ matrix.artifact }}-unsigned-${{ github.sha }}
          path: dist-personal
          if-no-files-found: error
          compression-level: 0
