name: PKG-02 02.12 Runtime Uninstall Repair Hardening

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - '.github/workflows/pkg02-0212-runtime-uninstall-repair.yml'
      - 'crates/vsn-runtime/src/lib.rs'
      - 'crates/vsn-runtime/tests/pkg02_0212_uninstall_repair_safety.rs'

permissions:
  contents: write

concurrency:
  group: pkg02-0212-hardening-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  harden:
    if: github.event_name == 'pull_request'
    name: Apply 02.12 destructive-boundary hardening
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}

      - name: Patch runtime uninstall and repair safety
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path('crates/vsn-runtime/src/lib.rs')
          text = path.read_text()

          old_uninstall = r'''pub fn uninstall_runtime(
              path: &Path,
              runtime: &str,
              version: &str,
          ) -> Result<RuntimeRegistry, RuntimeError> {
              let _guard = runtime_guard()?;
              validate_runtime_id(runtime)?;
              validate_version(version)?;
              let previous = load_registry(path)?;
              let installed = previous
                  .installed
                  .iter()
                  .find(|r| r.runtime == runtime && r.version == version)
                  .cloned()
                  .ok_or_else(|| RuntimeError::NotFound(format!("installed {runtime}@{version}")))?;
              let tombstone = installed.install_dir.with_extension("vsn-removing");
              if tombstone.exists() && !installed.install_dir.exists() {
                  fs::remove_dir_all(&tombstone)?;
              }
              if installed.install_dir.exists() {
                  if tombstone.exists() {
                      fs::remove_dir_all(&tombstone)?;
                  }
                  fs::rename(&installed.install_dir, &tombstone)?;
              }
              let mut registry = previous.clone();
              registry
                  .installed
                  .retain(|r| !(r.runtime == runtime && r.version == version));
              for active in registry.project_activation.values_mut() {
                  if active.get(runtime).is_some_and(|v| v == version) {
                      active.remove(runtime);
                  }
              }
              registry
                  .project_activation
                  .retain(|_, active| !active.is_empty());
              if let Err(error) = save_registry(path, &registry) {
                  if tombstone.exists() && !installed.install_dir.exists() {
                      let _ = fs::rename(&tombstone, &installed.install_dir);
                  }
                  return Err(error);
              }
              if tombstone.exists() {
                  fs::remove_dir_all(&tombstone)?;
              }
              Ok(registry)
          }
          '''

          new_uninstall = r'''fn runtime_root_for_registry(path: &Path) -> Result<PathBuf, RuntimeError> {
              let root = path.parent().ok_or_else(|| {
                  RuntimeError::Invalid("runtime registry has no managed root".into())
              })?;
              ensure_managed_directory_if_present(root, "runtime registry root")?;
              Ok(root.to_path_buf())
          }

          fn uninstall_tombstone_path(path: &Path) -> Result<PathBuf, RuntimeError> {
              let parent = path.parent().ok_or_else(|| {
                  RuntimeError::Invalid("runtime uninstall target has no managed parent".into())
              })?;
              let name = path.file_name().and_then(|value| value.to_str()).ok_or_else(|| {
                  RuntimeError::Invalid("runtime uninstall target name is invalid".into())
              })?;
              Ok(parent.join(format!(".{name}.vsn-removing")))
          }

          fn validate_managed_directory_if_present(
              path: &Path,
              root: &Path,
              label: &str,
          ) -> Result<bool, RuntimeError> {
              match fs::symlink_metadata(path) {
                  Ok(metadata) if metadata.is_dir() && !metadata.file_type().is_symlink() => {
                      let canonical_root = root.canonicalize()?;
                      let canonical_path = path.canonicalize()?;
                      if !canonical_path.starts_with(&canonical_root) {
                          return Err(RuntimeError::Invalid(format!(
                              "{label} escapes the VSN-managed runtime root"
                          )));
                      }
                      Ok(true)
                  }
                  Ok(_) => Err(RuntimeError::Invalid(format!(
                      "{label} is not a managed directory"
                  ))),
                  Err(error) if error.kind() == std::io::ErrorKind::NotFound => Ok(false),
                  Err(error) => Err(RuntimeError::Io(error)),
              }
          }

          fn validate_managed_file_if_present(
              path: &Path,
              root: &Path,
              label: &str,
          ) -> Result<bool, RuntimeError> {
              match fs::symlink_metadata(path) {
                  Ok(metadata) if metadata.is_file() && !metadata.file_type().is_symlink() => {
                      let canonical_root = root.canonicalize()?;
                      let canonical_path = path.canonicalize()?;
                      if !canonical_path.starts_with(&canonical_root) {
                          return Err(RuntimeError::Invalid(format!(
                              "{label} escapes the VSN-managed runtime root"
                          )));
                      }
                      Ok(true)
                  }
                  Ok(_) => Err(RuntimeError::Invalid(format!(
                      "{label} is not a managed regular file"
                  ))),
                  Err(error) if error.kind() == std::io::ErrorKind::NotFound => Ok(false),
                  Err(error) => Err(RuntimeError::Io(error)),
              }
          }

          fn validate_managed_install_path(
              root: &Path,
              installed: &InstalledRuntime,
              runtime: &str,
              version: &str,
          ) -> Result<(PathBuf, bool), RuntimeError> {
              let expected = root.join(runtime).join(version);
              if installed.install_dir != expected {
                  return Err(RuntimeError::Invalid(
                      "registered runtime install directory does not match managed layout".into(),
                  ));
              }
              ensure_managed_directory_if_present(
                  &root.join(runtime),
                  "runtime installation parent",
              )?;
              let present = validate_managed_directory_if_present(
                  &expected,
                  root,
                  "runtime install directory",
              )?;
              Ok((expected, present))
          }

          fn remove_managed_directory_if_present(
              path: &Path,
              root: &Path,
              label: &str,
          ) -> Result<(), RuntimeError> {
              if validate_managed_directory_if_present(path, root, label)? {
                  fs::remove_dir_all(path)?;
              }
              Ok(())
          }

          fn remove_managed_file_if_present(
              path: &Path,
              root: &Path,
              label: &str,
          ) -> Result<(), RuntimeError> {
              if validate_managed_file_if_present(path, root, label)? {
                  fs::remove_file(path)?;
              }
              Ok(())
          }

          pub fn uninstall_runtime(
              path: &Path,
              runtime: &str,
              version: &str,
          ) -> Result<RuntimeRegistry, RuntimeError> {
              let _guard = runtime_guard()?;
              validate_runtime_id(runtime)?;
              validate_version(version)?;
              let previous = load_registry(path)?;
              let matches = previous
                  .installed
                  .iter()
                  .filter(|item| item.runtime == runtime && item.version == version)
                  .cloned()
                  .collect::<Vec<_>>();
              let installed = match matches.as_slice() {
                  [] => {
                      return Err(RuntimeError::NotFound(format!(
                          "installed {runtime}@{version}"
                      )))
                  }
                  [installed] => installed.clone(),
                  _ => {
                      return Err(RuntimeError::Invalid(format!(
                          "runtime registry contains duplicate target registrations for {runtime}@{version}"
                      )))
                  }
              };

              let root = runtime_root_for_registry(path)?;
              let (install_dir, mut install_present) =
                  validate_managed_install_path(&root, &installed, runtime, version)?;
              let tombstone = uninstall_tombstone_path(&install_dir)?;
              if validate_managed_directory_if_present(
                  &tombstone,
                  &root,
                  "runtime uninstall tombstone",
              )? {
                  if install_present {
                      fs::remove_dir_all(&tombstone)?;
                  } else {
                      fs::rename(&tombstone, &install_dir)?;
                      install_present = true;
                  }
              }

              let remove_shim = !previous
                  .installed
                  .iter()
                  .any(|item| item.runtime == runtime && item.version != version);
              let shim = shim_path(&root, runtime);
              let shim_tombstone = uninstall_tombstone_path(&shim)?;
              let mut shim_present = false;
              if remove_shim {
                  ensure_managed_directory_if_present(&root.join("shims"), "runtime shim directory")?;
                  shim_present =
                      validate_managed_file_if_present(&shim, &root, "runtime shim")?;
                  if validate_managed_file_if_present(
                      &shim_tombstone,
                      &root,
                      "runtime shim uninstall tombstone",
                  )? {
                      if shim_present {
                          fs::remove_file(&shim_tombstone)?;
                      } else {
                          fs::rename(&shim_tombstone, &shim)?;
                          shim_present = true;
                      }
                  }
              }

              let moved_install = if install_present {
                  fs::rename(&install_dir, &tombstone)?;
                  true
              } else {
                  false
              };
              let moved_shim = if remove_shim && shim_present {
                  if let Err(error) = fs::rename(&shim, &shim_tombstone) {
                      if moved_install {
                          if let Err(rollback_error) = fs::rename(&tombstone, &install_dir) {
                              return Err(RuntimeError::Invalid(format!(
                                  "{error}; runtime uninstall rollback also failed: {rollback_error}"
                              )));
                          }
                      }
                      return Err(RuntimeError::Io(error));
                  }
                  true
              } else {
                  false
              };

              let mut registry = previous.clone();
              registry
                  .installed
                  .retain(|item| !(item.runtime == runtime && item.version == version));
              for active in registry.project_activation.values_mut() {
                  if active.get(runtime).is_some_and(|active_version| active_version == version) {
                      active.remove(runtime);
                  }
              }
              registry.project_activation.retain(|_, active| !active.is_empty());

              if let Err(error) = save_registry(path, &registry) {
                  let mut rollback_errors = Vec::new();
                  if moved_shim {
                      if let Err(rollback_error) = fs::rename(&shim_tombstone, &shim) {
                          rollback_errors.push(rollback_error.to_string());
                      }
                  }
                  if moved_install {
                      if let Err(rollback_error) = fs::rename(&tombstone, &install_dir) {
                          rollback_errors.push(rollback_error.to_string());
                      }
                  }
                  if rollback_errors.is_empty() {
                      return Err(error);
                  }
                  return Err(RuntimeError::Invalid(format!(
                      "{error}; runtime uninstall rollback also failed: {}",
                      rollback_errors.join("; ")
                  )));
              }

              if moved_install {
                  remove_managed_directory_if_present(
                      &tombstone,
                      &root,
                      "runtime uninstall tombstone",
                  )?;
              }
              if moved_shim {
                  remove_managed_file_if_present(
                      &shim_tombstone,
                      &root,
                      "runtime shim uninstall tombstone",
                  )?;
              }
              Ok(registry)
          }
          '''

          old_repair = r'''pub fn repair_registry(path: &Path) -> Result<RuntimeRepairReport, RuntimeError> {
              let _guard = runtime_guard()?;
              let mut registry = load_registry(path)?;
              let mut removed = Vec::new();
              let mut fixed = Vec::new();
              registry.installed.retain_mut(|item| {
                  if !item.install_dir.is_dir() {
                      removed.push(format!("{}@{}", item.runtime, item.version));
                      return false;
                  }
                  if !item.executable.is_file() {
                      let candidate = item
                          .install_dir
                          .join(item.executable.file_name().unwrap_or_default());
                      if candidate.is_file() {
                          item.executable = candidate;
                          fixed.push(format!("{}@{}", item.runtime, item.version));
                          return true;
                      }
                      removed.push(format!("{}@{}", item.runtime, item.version));
                      return false;
                  }
                  true
              });
              let valid = registry
                  .installed
                  .iter()
                  .map(|r| (r.runtime.clone(), r.version.clone()))
                  .collect::<std::collections::HashSet<_>>();
              for active in registry.project_activation.values_mut() {
                  active.retain(|runtime, version| valid.contains(&(runtime.clone(), version.clone())));
              }
              registry.project_activation.retain(|_, v| !v.is_empty());
              save_registry(path, &registry)?;
              Ok(RuntimeRepairReport {
                  removed_missing: removed,
                  fixed_executable_paths: fixed,
                  remaining_installed: registry.installed.len(),
              })
          }
          '''

          new_repair = r'''pub fn repair_registry(path: &Path) -> Result<RuntimeRepairReport, RuntimeError> {
              let _guard = runtime_guard()?;
              let mut registry = load_registry(path)?;
              let root = runtime_root_for_registry(path)?;
              let provider_runtime_ids = builtins()
                  .into_iter()
                  .map(|runtime| runtime.id)
                  .collect::<HashSet<_>>();
              let mut seen = HashSet::new();
              let mut removed = Vec::new();
              let mut fixed = Vec::new();
              let mut repaired = Vec::new();

              for mut item in registry.installed.into_iter() {
                  let label = format!("{}@{}", item.runtime, item.version);
                  if validate_runtime_id(&item.runtime).is_err()
                      || validate_version(&item.version).is_err()
                      || !provider_runtime_ids.contains(&item.runtime)
                      || !seen.insert((item.runtime.clone(), item.version.clone()))
                  {
                      removed.push(label);
                      continue;
                  }

                  let expected_install = root.join(&item.runtime).join(&item.version);
                  if item.install_dir != expected_install
                      || ensure_managed_directory_if_present(
                          &root.join(&item.runtime),
                          "runtime installation parent",
                      )
                      .is_err()
                      || !validate_managed_directory_if_present(
                          &expected_install,
                          &root,
                          "runtime install directory",
                      )
                      .unwrap_or(false)
                  {
                      removed.push(label);
                      continue;
                  }

                  let canonical_install = match expected_install.canonicalize() {
                      Ok(path) => path,
                      Err(_) => {
                          removed.push(label);
                          continue;
                      }
                  };
                  let executable_valid = validate_managed_file_if_present(
                      &item.executable,
                      &root,
                      "runtime executable",
                  )
                  .unwrap_or(false)
                      && item.executable.starts_with(&expected_install)
                      && item
                          .executable
                          .canonicalize()
                          .map(|path| path.starts_with(&canonical_install))
                          .unwrap_or(false);

                  if !executable_valid {
                      let candidate = item
                          .executable
                          .file_name()
                          .map(|name| expected_install.join(name));
                      let Some(candidate) = candidate else {
                          removed.push(label);
                          continue;
                      };
                      let candidate_valid = validate_managed_file_if_present(
                          &candidate,
                          &root,
                          "runtime repair executable candidate",
                      )
                      .unwrap_or(false)
                          && candidate
                              .canonicalize()
                              .map(|path| path.starts_with(&canonical_install))
                              .unwrap_or(false);
                      if !candidate_valid {
                          removed.push(label);
                          continue;
                      }
                      item.executable = candidate;
                      fixed.push(label.clone());
                  }
                  repaired.push(item);
              }

              repaired.sort_by(|a, b| (&a.runtime, &a.version).cmp(&(&b.runtime, &b.version)));
              registry.installed = repaired;
              let valid = registry
                  .installed
                  .iter()
                  .map(|item| (item.runtime.clone(), item.version.clone()))
                  .collect::<HashSet<_>>();
              for active in registry.project_activation.values_mut() {
                  active.retain(|runtime, version| valid.contains(&(runtime.clone(), version.clone())));
              }
              registry.project_activation.retain(|_, active| !active.is_empty());
              save_registry(path, &registry)?;
              Ok(RuntimeRepairReport {
                  removed_missing: removed,
                  fixed_executable_paths: fixed,
                  remaining_installed: registry.installed.len(),
              })
          }
          '''

          if text.count(old_uninstall) != 1:
              raise SystemExit(f'expected one uninstall function, found {text.count(old_uninstall)}')
          if text.count(old_repair) != 1:
              raise SystemExit(f'expected one repair function, found {text.count(old_repair)}')
          text = text.replace(old_uninstall, new_uninstall)
          text = text.replace(old_repair, new_repair)
          path.write_text(text)

          test_path = Path('crates/vsn-runtime/tests/pkg02_0212_uninstall_repair_safety.rs')
          test_path.parent.mkdir(parents=True, exist_ok=True)
          test_path.write_text(r'''use std::{collections::BTreeMap, fs, path::{Path, PathBuf}};
          use vsn_runtime::{
              audit_registry, load_registry, repair_registry, save_registry, uninstall_runtime,
              write_shim, InstalledRuntime, RuntimeRegistry,
          };

          fn fresh_root(name: &str) -> PathBuf {
              let root = std::env::temp_dir().join(format!(
                  "vsn-pkg02-0212-{name}-{}",
                  std::process::id()
              ));
              let _ = fs::remove_dir_all(&root);
              fs::create_dir_all(&root).unwrap();
              root
          }

          fn installed(root: &Path, runtime: &str, version: &str) -> InstalledRuntime {
              let install_dir = root.join(runtime).join(version);
              fs::create_dir_all(&install_dir).unwrap();
              let executable = install_dir.join(format!("{runtime}.bin"));
              fs::write(&executable, runtime.as_bytes()).unwrap();
              InstalledRuntime {
                  runtime: runtime.into(),
                  version: version.into(),
                  install_dir,
                  executable,
                  source_sha256: "0".repeat(64),
              }
          }

          #[test]
          fn uninstall_rejects_registry_escape_without_touching_outside_data() {
              let top = fresh_root("escape");
              let root = top.join("runtimes");
              let outside = top.join("outside");
              fs::create_dir_all(&root).unwrap();
              fs::create_dir_all(&outside).unwrap();
              let sentinel = outside.join("keep.txt");
              fs::write(&sentinel, b"must-survive").unwrap();
              let registry_path = root.join("registry.json");
              let mut activation = BTreeMap::new();
              activation.insert("node".into(), "20.0.0".into());
              save_registry(
                  &registry_path,
                  &RuntimeRegistry {
                      installed: vec![InstalledRuntime {
                          runtime: "node".into(),
                          version: "20.0.0".into(),
                          install_dir: outside.clone(),
                          executable: sentinel.clone(),
                          source_sha256: "0".repeat(64),
                      }],
                      project_activation: BTreeMap::from([("project".into(), activation)]),
                  },
              )
              .unwrap();

              assert!(uninstall_runtime(&registry_path, "node", "20.0.0").is_err());
              assert_eq!(fs::read(&sentinel).unwrap(), b"must-survive");
              assert_eq!(load_registry(&registry_path).unwrap().installed.len(), 1);
              let _ = fs::remove_dir_all(top);
          }

          #[test]
          fn repair_drops_unsafe_registration_and_preserves_healthy_runtime() {
              let top = fresh_root("repair");
              let root = top.join("runtimes");
              let outside = top.join("outside");
              fs::create_dir_all(&root).unwrap();
              fs::create_dir_all(&outside).unwrap();
              let sentinel = outside.join("keep.txt");
              fs::write(&sentinel, b"must-survive").unwrap();
              let python = installed(&root, "python", "3.12.0");
              let registry_path = root.join("registry.json");
              let mut activation = BTreeMap::new();
              activation.insert("node".into(), "20.0.0".into());
              activation.insert("python".into(), "3.12.0".into());
              save_registry(
                  &registry_path,
                  &RuntimeRegistry {
                      installed: vec![
                          InstalledRuntime {
                              runtime: "node".into(),
                              version: "20.0.0".into(),
                              install_dir: outside.clone(),
                              executable: sentinel.clone(),
                              source_sha256: "0".repeat(64),
                          },
                          python.clone(),
                      ],
                      project_activation: BTreeMap::from([("project".into(), activation)]),
                  },
              )
              .unwrap();

              let report = repair_registry(&registry_path).unwrap();
              assert!(report.removed_missing.contains(&"node@20.0.0".to_string()));
              assert_eq!(report.remaining_installed, 1);
              assert_eq!(fs::read(&sentinel).unwrap(), b"must-survive");
              let registry = load_registry(&registry_path).unwrap();
              assert_eq!(registry.installed, vec![python]);
              assert_eq!(registry.project_activation["project"].len(), 1);
              assert_eq!(registry.project_activation["project"]["python"], "3.12.0");
              assert!(audit_registry(&registry_path).unwrap().healthy);
              let _ = fs::remove_dir_all(top);
          }

          #[test]
          fn uninstall_removes_target_shim_and_activation_but_preserves_sibling_runtime() {
              let top = fresh_root("sibling");
              let root = top.join("runtimes");
              fs::create_dir_all(&root).unwrap();
              let node = installed(&root, "node", "20.0.0");
              let python = installed(&root, "python", "3.12.0");
              let registry_path = root.join("registry.json");
              let mut activation = BTreeMap::new();
              activation.insert("node".into(), "20.0.0".into());
              activation.insert("python".into(), "3.12.0".into());
              save_registry(
                  &registry_path,
                  &RuntimeRegistry {
                      installed: vec![node.clone(), python.clone()],
                      project_activation: BTreeMap::from([("project".into(), activation)]),
                  },
              )
              .unwrap();
              let shim_dir = root.join("shims");
              let node_shim = write_shim(&shim_dir, "node", &node.executable).unwrap();
              let python_shim = write_shim(&shim_dir, "python", &python.executable).unwrap();

              let registry = uninstall_runtime(&registry_path, "node", "20.0.0").unwrap();
              assert_eq!(registry.installed, vec![python.clone()]);
              assert!(!node.install_dir.exists());
              assert!(python.install_dir.exists());
              assert!(!node_shim.exists());
              assert!(python_shim.exists());
              assert_eq!(registry.project_activation["project"].len(), 1);
              assert_eq!(registry.project_activation["project"]["python"], "3.12.0");
              let _ = fs::remove_dir_all(top);
          }

          #[test]
          fn duplicate_target_uninstall_fails_before_destructive_mutation() {
              let top = fresh_root("duplicate");
              let root = top.join("runtimes");
              fs::create_dir_all(&root).unwrap();
              let node = installed(&root, "node", "20.0.0");
              let outside = top.join("outside");
              fs::create_dir_all(&outside).unwrap();
              let sentinel = outside.join("keep.txt");
              fs::write(&sentinel, b"must-survive").unwrap();
              let registry_path = root.join("registry.json");
              save_registry(
                  &registry_path,
                  &RuntimeRegistry {
                      installed: vec![
                          node.clone(),
                          InstalledRuntime {
                              runtime: "node".into(),
                              version: "20.0.0".into(),
                              install_dir: outside.clone(),
                              executable: sentinel.clone(),
                              source_sha256: "0".repeat(64),
                          },
                      ],
                      project_activation: BTreeMap::new(),
                  },
              )
              .unwrap();

              assert!(uninstall_runtime(&registry_path, "node", "20.0.0").is_err());
              assert!(node.install_dir.exists());
              assert_eq!(fs::read(&sentinel).unwrap(), b"must-survive");
              let _ = fs::remove_dir_all(top);
          }
          ''')
          PY

          cargo fmt --all
          cargo fmt --all -- --check
          cargo clippy --locked --package vsn-runtime --all-targets --no-deps -- -D warnings
          cargo test --locked --package vsn-runtime
          git diff --check

          changed=$(git diff --name-only | sort)
          expected=$(printf '%s\n' 'crates/vsn-runtime/src/lib.rs' 'crates/vsn-runtime/tests/pkg02_0212_uninstall_repair_safety.rs' | sort)
          if [[ "$changed" != "$expected" ]]; then
            echo "Unexpected changed files:"
            echo "$changed"
            exit 1
          fi

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add crates/vsn-runtime/src/lib.rs crates/vsn-runtime/tests/pkg02_0212_uninstall_repair_safety.rs
          git commit -m 'fix(runtime): harden uninstall and repair boundaries [skip ci]'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
          exit 1
