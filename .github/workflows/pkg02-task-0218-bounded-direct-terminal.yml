name: PKG-02 02.18 Bounded Direct Terminal Execution

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bounded-direct-terminal:
    name: 02.18 GitHub-hosted bounded direct terminal
    runs-on: windows-latest
    timeout-minutes: 60
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
        with:
          clean: true
          ref: ${{ github.sha }}

      - name: Verify exact GitHub-hosted Windows source
        run: |
          $ErrorActionPreference = 'Stop'
          if (-not $IsWindows) { throw '02.18 certification requires Windows' }
          if ($env:RUNNER_ENVIRONMENT -ne 'github-hosted') { throw '02.18 certification requires a GitHub-hosted runner' }
          $expected = '${{ github.sha }}'
          $actual = (git rev-parse HEAD).Trim()
          if ($actual -ne $expected) { throw "02.18 source binding mismatch: expected=$expected actual=$actual" }
          Write-Host "source=$actual runner=$env:RUNNER_NAME environment=$env:RUNNER_ENVIRONMENT os=$env:RUNNER_OS arch=$env:RUNNER_ARCH"

      - name: Run 02.18 certification
        run: |
          $ErrorActionPreference = 'Stop'
          & pwsh -NoProfile -File scripts/self-hosted/pkg02-0218.ps1
          if ($LASTEXITCODE -ne 0) { throw "02.18 certification failed with exit $LASTEXITCODE" }

      - name: Upload 02.18 GitHub-hosted evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pkg02-0218-bounded-direct-terminal-github-hosted
          path: dist-self-hosted/02.18
          if-no-files-found: warn
