name: PKG-01 01.21 Fresh Checkout Reproducibility

on:
  push:
    branches:
      - pkg01/**
      - ci/pkg01-0121-descendant-reproducibility
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

env:
  PKG01_MANIFEST_SHA256: 8e23f966f57a79647625b2fd9839a2e201cfaaaef547fe6c2769046aa9b23865
  PKG01_HISTORICAL_0121_ARTIFACT_ID: '9445049779'
  PKG01_HISTORICAL_0121_HEAD_SHA: 5baf14122bfde48b378bdc500d1cc7cff9054fcd
  DESKTOP_LOCK_SHA256: b2f41ab8c7a116cb9c78d41fd8036e7e1b1307bc3b78cd9a33ef37d5911c0aa6
  DASHBOARD_LOCK_SHA256: a184c9f1b91b11134896692a88c8286c611a9b89ab59f66a42e94781b3127a3c

jobs:
  historical-proof:
    name: 01.21 Preserve frozen PKG-01 certification proof
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Verify frozen manifest and accepted 01.21 evidence
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          echo "${PKG01_MANIFEST_SHA256}  certification/pkg01-build-artifact-manifest-v1.json" | sha256sum -c -
          mkdir -p dist-pkg01/01.21/historical
          curl --fail --location --silent --show-error \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/${PKG01_HISTORICAL_0121_ARTIFACT_ID}/zip" \
            -o dist-pkg01/01.21/historical/artifact.zip
          curl --fail --silent --show-error \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/${PKG01_HISTORICAL_0121_ARTIFACT_ID}" \
            -o dist-pkg01/01.21/historical/artifact.json
          unzip -q dist-pkg01/01.21/historical/artifact.zip -d dist-pkg01/01.21/historical/evidence
          test -s dist-pkg01/01.21/historical/evidence/evidence.json
          python3 - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path

          manifest_path = Path('certification/pkg01-build-artifact-manifest-v1.json')
          manifest = json.loads(manifest_path.read_text())
          metadata = json.loads(Path('dist-pkg01/01.21/historical/artifact.json').read_text())
          evidence = json.loads(Path('dist-pkg01/01.21/historical/evidence/evidence.json').read_text())

          assert hashlib.sha256(manifest_path.read_bytes()).hexdigest() == os.environ['PKG01_MANIFEST_SHA256']
          assert metadata['id'] == int(os.environ['PKG01_HISTORICAL_0121_ARTIFACT_ID'])
          assert metadata['name'] == 'pkg01-0121-fresh-checkout-reproducibility'
          assert metadata['expired'] is False
          assert metadata['workflow_run']['head_sha'] == os.environ['PKG01_HISTORICAL_0121_HEAD_SHA']
          assert evidence['task_id'] == '01.21'
          assert evidence['candidate_id'] == manifest['candidate_id']
          assert evidence['product_version'] == manifest['product_version']
          assert evidence['manifest_sha256'] == os.environ['PKG01_MANIFEST_SHA256']
          assert evidence['fresh_checkout'] is True
          assert evidence['cache_restore_used'] is False
          assert evidence['rust_locked_gates_reproduced'] is True
          assert evidence['rust_release_outputs_byte_for_byte_match'] is True
          assert evidence['desktop_output_tree_match'] is True
          assert evidence['dashboard_output_tree_match'] is True
          assert {c['component'] for c in evidence['components']} == {'rust', 'desktop', 'dashboard'}
          print(json.dumps({
              'historical_0121_preserved': True,
              'historical_head_sha': metadata['workflow_run']['head_sha'],
              'manifest_sha256': os.environ['PKG01_MANIFEST_SHA256'],
          }, sort_keys=True))
          PY

  rust-current:
    name: 01.21 Rust cold build (${{ matrix.replica }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        replica: [a, b]
    steps:
      - uses: actions/checkout@v7

      - name: Assert cold checkout
        shell: bash
        run: |
          set -euo pipefail
          test ! -d target
          test -s Cargo.lock
          git diff --exit-code

      - name: Install Linux native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config \
            libglib2.0-dev \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libssl-dev \
            patchelf

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.97.1'
          components: 'rustfmt, clippy'

      - name: Reproduce locked Rust gates and release binaries
        shell: bash
        run: |
          set -euo pipefail
          test "$(rustc --version | awk '{print $2}')" = '1.97.1'
          test "$(cargo --version | awk '{print $2}')" = '1.97.1'
          cargo fetch --locked
          cargo fmt --all -- --check
          cargo clippy --workspace --all-targets --locked -- -D warnings
          cargo test --workspace --locked
          cargo build --package vsn-agent --release --locked
          cargo build --package vsn --release --locked
          cargo build --package vsn-updater-helper --release --locked
          git diff --exit-code -- Cargo.lock
          test -x target/release/vsn-agent
          test -x target/release/vsn
          test -x target/release/vsn-updater-helper

      - name: Stage current-head Rust outputs
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist-pkg01/01.21/current/rust
          cp target/release/vsn-agent dist-pkg01/01.21/current/rust/
          cp target/release/vsn dist-pkg01/01.21/current/rust/
          cp target/release/vsn-updater-helper dist-pkg01/01.21/current/rust/

      - uses: actions/upload-artifact@v4
        with:
          name: pkg01-0121-rust-${{ matrix.replica }}
          path: dist-pkg01/01.21/current/rust
          if-no-files-found: error

  desktop-current:
    name: 01.21 Desktop cold build (${{ matrix.replica }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        replica: [a, b]
    steps:
      - uses: actions/checkout@v7

      - name: Assert cold checkout and certified lock
        working-directory: apps/desktop
        shell: bash
        run: |
          set -euo pipefail
          test ! -d node_modules
          test ! -d dist
          test -s package-lock.json
          echo "${DESKTOP_LOCK_SHA256}  package-lock.json" | sha256sum -c -

      - uses: actions/setup-node@v4
        with:
          node-version: '22.12.0'

      - name: Reproduce Desktop install and production build
        working-directory: apps/desktop
        shell: bash
        run: |
          set -euo pipefail
          test "$(node --version)" = 'v22.12.0'
          test "$(npm --version)" = '10.9.0'
          npm ci --no-audit --no-fund
          npm run build
          test -d dist
          test -n "$(find dist -type f -print -quit)"
          git diff --exit-code -- package.json package-lock.json

      - uses: actions/upload-artifact@v4
        with:
          name: pkg01-0121-desktop-${{ matrix.replica }}
          path: apps/desktop/dist
          if-no-files-found: error

  dashboard-current:
    name: 01.21 Dashboard cold build (${{ matrix.replica }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        replica: [a, b]
    steps:
      - uses: actions/checkout@v7

      - name: Assert cold checkout and certified lock
        working-directory: cloud/dashboard
        shell: bash
        run: |
          set -euo pipefail
          test ! -d node_modules
          test ! -d dist
          test -s package-lock.json
          echo "${DASHBOARD_LOCK_SHA256}  package-lock.json" | sha256sum -c -

      - uses: actions/setup-node@v4
        with:
          node-version: '22.12.0'

      - name: Reproduce Dashboard install and production build
        working-directory: cloud/dashboard
        shell: bash
        run: |
          set -euo pipefail
          test "$(node --version)" = 'v22.12.0'
          test "$(npm --version)" = '10.9.0'
          npm ci --no-audit --no-fund
          npm run build
          test -d dist
          test -n "$(find dist -type f -print -quit)"
          git diff --exit-code -- package.json package-lock.json

      - uses: actions/upload-artifact@v4
        with:
          name: pkg01-0121-dashboard-${{ matrix.replica }}
          path: cloud/dashboard/dist
          if-no-files-found: error

  aggregate:
    name: 01.21 Aggregate descendant fresh-checkout evidence
    needs: [historical-proof, rust-current, desktop-current, dashboard-current]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v4
        with:
          name: pkg01-0121-rust-a
          path: dist-pkg01/01.21/current/rust/a

      - uses: actions/download-artifact@v4
        with:
          name: pkg01-0121-rust-b
          path: dist-pkg01/01.21/current/rust/b

      - uses: actions/download-artifact@v4
        with:
          name: pkg01-0121-desktop-a
          path: dist-pkg01/01.21/current/desktop/a

      - uses: actions/download-artifact@v4
        with:
          name: pkg01-0121-desktop-b
          path: dist-pkg01/01.21/current/desktop/b

      - uses: actions/download-artifact@v4
        with:
          name: pkg01-0121-dashboard-a
          path: dist-pkg01/01.21/current/dashboard/a

      - uses: actions/download-artifact@v4
        with:
          name: pkg01-0121-dashboard-b
          path: dist-pkg01/01.21/current/dashboard/b

      - name: Compare independent current-head builds and package evidence
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path

          def tree(path):
              root = Path(path)
              out = {}
              for p in sorted(x for x in root.rglob('*') if x.is_file()):
                  rel = p.relative_to(root).as_posix()
                  out[rel] = {
                      'sha256': hashlib.sha256(p.read_bytes()).hexdigest(),
                      'size_bytes': p.stat().st_size,
                  }
              assert out, f'empty output tree: {root}'
              return out

          roots = Path('dist-pkg01/01.21/current')
          rust_a = tree(roots/'rust/a')
          rust_b = tree(roots/'rust/b')
          desktop_a = tree(roots/'desktop/a')
          desktop_b = tree(roots/'desktop/b')
          dashboard_a = tree(roots/'dashboard/a')
          dashboard_b = tree(roots/'dashboard/b')

          assert rust_a == rust_b, 'Rust current-head cold builds are not byte-for-byte reproducible'
          assert desktop_a == desktop_b, 'Desktop current-head cold builds are not byte-for-byte reproducible'
          assert dashboard_a == dashboard_b, 'Dashboard current-head cold builds are not byte-for-byte reproducible'
          assert set(rust_a) == {'vsn', 'vsn-agent', 'vsn-updater-helper'}, sorted(rust_a)

          manifest_path = Path('certification/pkg01-build-artifact-manifest-v1.json')
          manifest = json.loads(manifest_path.read_text())
          candidate = json.loads(Path('docs/release-candidate-current.json').read_text())
          manifest_sha = hashlib.sha256(manifest_path.read_bytes()).hexdigest()
          assert manifest_sha == os.environ['PKG01_MANIFEST_SHA256']
          assert candidate['candidate_id'] == manifest['candidate_id']
          assert candidate['product_version'] == manifest['product_version']
          assert hashlib.sha256(Path('apps/desktop/package-lock.json').read_bytes()).hexdigest() == os.environ['DESKTOP_LOCK_SHA256']
          assert hashlib.sha256(Path('cloud/dashboard/package-lock.json').read_bytes()).hexdigest() == os.environ['DASHBOARD_LOCK_SHA256']

          def component(name, entries):
              return {
                  'component': name,
                  'current_head_reproducible': True,
                  'file_count': len(entries),
                  'total_bytes': sum(item['size_bytes'] for item in entries.values()),
                  'files': entries,
              }

          payload = {
              'schema_version': 2,
              'package_id': 'PKG-01',
              'task_id': '01.21',
              'mode': 'accepted-descendant-current-head-reproducibility',
              'correction_issue': 174,
              'source_commit': os.environ['GITHUB_SHA'],
              'product_version': candidate['product_version'],
              'candidate_id': candidate['candidate_id'],
              'manifest_sha256': manifest_sha,
              'historical_certification_preserved': True,
              'historical_0121_artifact_id': int(os.environ['PKG01_HISTORICAL_0121_ARTIFACT_ID']),
              'historical_0121_head_sha': os.environ['PKG01_HISTORICAL_0121_HEAD_SHA'],
              'fresh_checkout': True,
              'cache_restore_used': False,
              'independent_replicas_per_component': 2,
              'rust_locked_gates_reproduced': True,
              'rust_current_head_byte_for_byte_match': True,
              'desktop_current_head_tree_match': True,
              'dashboard_current_head_tree_match': True,
              'toolchains': {'rust': '1.97.1', 'node': 'v22.12.0', 'npm': '10.9.0'},
              'components': [
                  component('rust', rust_a),
                  component('desktop', desktop_a),
                  component('dashboard', dashboard_a),
              ],
          }
          out = Path('dist-pkg01/01.21/evidence')
          out.mkdir(parents=True, exist_ok=True)
          (out/'evidence.json').write_text(json.dumps(payload, indent=2, sort_keys=True) + '\n')
          print(json.dumps({
              'source_commit': payload['source_commit'],
              'historical_certification_preserved': True,
              'rust_current_head_byte_for_byte_match': True,
              'desktop_current_head_tree_match': True,
              'dashboard_current_head_tree_match': True,
          }, indent=2, sort_keys=True))
          PY
          sha256sum dist-pkg01/01.21/evidence/evidence.json > dist-pkg01/01.21/evidence/evidence.json.sha256

      - uses: actions/upload-artifact@v4
        with:
          name: pkg01-0121-current-head-reproducibility
          path: dist-pkg01/01.21/evidence
          if-no-files-found: error
