name: PKG-01 01.21 Fresh Checkout Reproducibility

on:
  push:
    branches:
      - pkg01/**
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  rust-repro:
    name: 01.21 Rust cold-checkout reproducibility
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Assert cold checkout
        shell: bash
        run: |
          set -euo pipefail
          test ! -d target
          test -s Cargo.lock
          git diff --exit-code

      - name: Install Linux native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config \
            libglib2.0-dev \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libssl-dev \
            patchelf

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.97.1'
          components: 'rustfmt, clippy'

      - name: Reproduce locked Rust gates and release binaries
        shell: bash
        run: |
          set -euo pipefail
          test "$(rustc --version | awk '{print $2}')" = '1.97.1'
          test "$(cargo --version | awk '{print $2}')" = '1.97.1'
          cargo fetch --locked
          cargo fmt --all -- --check
          cargo clippy --workspace --all-targets --locked -- -D warnings
          cargo test --workspace --locked
          cargo build --package vsn-agent --release --locked
          cargo build --package vsn --release --locked
          cargo build --package vsn-updater-helper --release --locked
          git diff --exit-code -- Cargo.lock

      - name: Compare rebuilt Rust binaries with certified artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib
          import json
          import os
          import subprocess
          import zipfile
          from pathlib import Path

          manifest = json.loads(Path('certification/pkg01-build-artifact-manifest-v1.json').read_text())
          wanted = {a['name']: a for a in manifest['artifacts'] if a['task_id'] in {'01.09','01.10','01.11'}}
          rebuilt = {
              'vsn-agent': Path('target/release/vsn-agent'),
              'vsn': Path('target/release/vsn'),
              'vsn-updater-helper': Path('target/release/vsn-updater-helper'),
          }
          root = Path('dist-pkg01/01.21/rust-baseline')
          root.mkdir(parents=True, exist_ok=True)
          repo = os.environ['GITHUB_REPOSITORY']
          token = os.environ['GH_TOKEN']
          rows = []
          for name, path in rebuilt.items():
              item = wanted[name]
              assert path.is_file()
              digest = hashlib.sha256(path.read_bytes()).hexdigest()
              size = path.stat().st_size
              assert digest == item['sha256'], (name, 'rebuilt hash differs', digest, item['sha256'])
              assert size == item['size_bytes'], (name, 'rebuilt size differs', size, item['size_bytes'])

              aid = item['github_artifact_id']
              archive = root / f'{aid}.zip'
              subprocess.run([
                  'curl','--fail','--location','--silent','--show-error',
                  '-H',f'Authorization: Bearer {token}',
                  '-H','Accept: application/vnd.github+json',
                  '-H','X-GitHub-Api-Version: 2022-11-28',
                  f'https://api.github.com/repos/{repo}/actions/artifacts/{aid}/zip',
                  '-o',str(archive),
              ], check=True)
              extract = root / str(aid)
              extract.mkdir()
              with zipfile.ZipFile(archive) as zf:
                  zf.extractall(extract)
              baseline = extract / item['payload_file']
              assert baseline.is_file()
              assert path.read_bytes() == baseline.read_bytes(), f'{name} is not byte-for-byte reproducible'
              rows.append({'name':name,'sha256':digest,'size_bytes':size,'byte_for_byte_match':True})

          out = Path('dist-pkg01/01.21/rust')
          out.mkdir(parents=True, exist_ok=True)
          payload = {
              'schema_version':1,
              'task_id':'01.21',
              'component':'rust',
              'rust_version':'1.97.1',
              'cargo_locked':True,
              'fmt_passed':True,
              'clippy_passed':True,
              'tests_passed':True,
              'release_binaries':rows,
              'historical_output_match':True,
          }
          (out/'evidence.json').write_text(json.dumps(payload, indent=2, sort_keys=True)+'\n')
          PY
          rm -rf dist-pkg01/01.21/rust-baseline

      - uses: actions/upload-artifact@v4
        with:
          name: pkg01-0121-rust-repro
          path: dist-pkg01/01.21/rust
          if-no-files-found: error

  desktop-repro:
    name: 01.21 Desktop cold-checkout reproducibility
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Assert cold checkout and certified lock
        working-directory: apps/desktop
        shell: bash
        run: |
          set -euo pipefail
          test ! -d node_modules
          test ! -d dist
          test -s package-lock.json
          echo 'b2f41ab8c7a116cb9c78d41fd8036e7e1b1307bc3b78cd9a33ef37d5911c0aa6  package-lock.json' | sha256sum -c -

      - uses: actions/setup-node@v4
        with:
          node-version: '22.12.0'

      - name: Reproduce Desktop install and production build
        working-directory: apps/desktop
        shell: bash
        run: |
          set -euo pipefail
          test "$(node --version)" = 'v22.12.0'
          test "$(npm --version)" = '10.9.0'
          npm ci --no-audit --no-fund
          npm run build
          test -d dist
          test -n "$(find dist -type f -print -quit)"
          git diff --exit-code -- package.json package-lock.json

      - name: Compare Desktop output tree with certified artifact
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib
          import json
          import os
          import subprocess
          import tarfile
          import zipfile
          from pathlib import Path

          manifest = json.loads(Path('certification/pkg01-build-artifact-manifest-v1.json').read_text())
          item = next(a for a in manifest['artifacts'] if a['task_id']=='01.15')
          root = Path('dist-pkg01/01.21/desktop-baseline')
          root.mkdir(parents=True, exist_ok=True)
          archive = root / f"{item['github_artifact_id']}.zip"
          subprocess.run([
              'curl','--fail','--location','--silent','--show-error',
              '-H',f"Authorization: Bearer {os.environ['GH_TOKEN']}",
              '-H','Accept: application/vnd.github+json',
              '-H','X-GitHub-Api-Version: 2022-11-28',
              f"https://api.github.com/repos/{os.environ['GITHUB_REPOSITORY']}/actions/artifacts/{item['github_artifact_id']}/zip",
              '-o',str(archive),
          ], check=True)
          extracted = root/'artifact'
          extracted.mkdir()
          with zipfile.ZipFile(archive) as zf:
              zf.extractall(extracted)
          tar_path = extracted/item['payload_file']
          baseline = root/'tree'
          baseline.mkdir()
          with tarfile.open(tar_path, 'r:gz') as tf:
              tf.extractall(baseline)

          def tree(path):
              out={}
              for p in sorted(x for x in path.rglob('*') if x.is_file()):
                  rel=p.relative_to(path).as_posix()
                  out[rel]={'sha256':hashlib.sha256(p.read_bytes()).hexdigest(),'size_bytes':p.stat().st_size}
              return out
          current=tree(Path('apps/desktop/dist'))
          certified=tree(baseline)
          assert current == certified, 'Desktop dist content tree differs from certified 01.15 output'
          out=Path('dist-pkg01/01.21/desktop')
          out.mkdir(parents=True, exist_ok=True)
          payload={
              'schema_version':1,
              'task_id':'01.21',
              'component':'desktop',
              'node_version':'v22.12.0',
              'npm_version':'10.9.0',
              'package_lock_sha256':'b2f41ab8c7a116cb9c78d41fd8036e7e1b1307bc3b78cd9a33ef37d5911c0aa6',
              'dist_file_count':len(current),
              'dist_total_bytes':sum(v['size_bytes'] for v in current.values()),
              'historical_output_match':True,
          }
          (out/'evidence.json').write_text(json.dumps(payload, indent=2, sort_keys=True)+'\n')
          PY
          rm -rf dist-pkg01/01.21/desktop-baseline

      - uses: actions/upload-artifact@v4
        with:
          name: pkg01-0121-desktop-repro
          path: dist-pkg01/01.21/desktop
          if-no-files-found: error

  dashboard-repro:
    name: 01.21 Dashboard cold-checkout reproducibility
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Assert cold checkout and certified lock
        working-directory: cloud/dashboard
        shell: bash
        run: |
          set -euo pipefail
          test ! -d node_modules
          test ! -d dist
          test -s package-lock.json
          echo 'a184c9f1b91b11134896692a88c8286c611a9b89ab59f66a42e94781b3127a3c  package-lock.json' | sha256sum -c -

      - uses: actions/setup-node@v4
        with:
          node-version: '22.12.0'

      - name: Reproduce Dashboard install and production build
        working-directory: cloud/dashboard
        shell: bash
        run: |
          set -euo pipefail
          test "$(node --version)" = 'v22.12.0'
          test "$(npm --version)" = '10.9.0'
          npm ci --no-audit --no-fund
          npm run build
          test -d dist
          test -n "$(find dist -type f -print -quit)"
          git diff --exit-code -- package.json package-lock.json

      - name: Compare Dashboard output tree with certified artifact
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib
          import json
          import os
          import subprocess
          import tarfile
          import zipfile
          from pathlib import Path

          manifest = json.loads(Path('certification/pkg01-build-artifact-manifest-v1.json').read_text())
          item = next(a for a in manifest['artifacts'] if a['task_id']=='01.19')
          root = Path('dist-pkg01/01.21/dashboard-baseline')
          root.mkdir(parents=True, exist_ok=True)
          archive = root / f"{item['github_artifact_id']}.zip"
          subprocess.run([
              'curl','--fail','--location','--silent','--show-error',
              '-H',f"Authorization: Bearer {os.environ['GH_TOKEN']}",
              '-H','Accept: application/vnd.github+json',
              '-H','X-GitHub-Api-Version: 2022-11-28',
              f"https://api.github.com/repos/{os.environ['GITHUB_REPOSITORY']}/actions/artifacts/{item['github_artifact_id']}/zip",
              '-o',str(archive),
          ], check=True)
          extracted = root/'artifact'
          extracted.mkdir()
          with zipfile.ZipFile(archive) as zf:
              zf.extractall(extracted)
          tar_path = extracted/item['payload_file']
          baseline = root/'tree'
          baseline.mkdir()
          with tarfile.open(tar_path, 'r:gz') as tf:
              tf.extractall(baseline)

          def tree(path):
              out={}
              for p in sorted(x for x in path.rglob('*') if x.is_file()):
                  rel=p.relative_to(path).as_posix()
                  out[rel]={'sha256':hashlib.sha256(p.read_bytes()).hexdigest(),'size_bytes':p.stat().st_size}
              return out
          current=tree(Path('cloud/dashboard/dist'))
          certified=tree(baseline)
          assert current == certified, 'Dashboard dist content tree differs from certified 01.19 output'
          out=Path('dist-pkg01/01.21/dashboard')
          out.mkdir(parents=True, exist_ok=True)
          payload={
              'schema_version':1,
              'task_id':'01.21',
              'component':'dashboard',
              'node_version':'v22.12.0',
              'npm_version':'10.9.0',
              'package_lock_sha256':'a184c9f1b91b11134896692a88c8286c611a9b89ab59f66a42e94781b3127a3c',
              'dist_file_count':len(current),
              'dist_total_bytes':sum(v['size_bytes'] for v in current.values()),
              'historical_output_match':True,
          }
          (out/'evidence.json').write_text(json.dumps(payload, indent=2, sort_keys=True)+'\n')
          PY
          rm -rf dist-pkg01/01.21/dashboard-baseline

      - uses: actions/upload-artifact@v4
        with:
          name: pkg01-0121-dashboard-repro
          path: dist-pkg01/01.21/dashboard
          if-no-files-found: error

  aggregate:
    name: 01.21 Aggregate fresh-checkout evidence
    needs: [rust-repro, desktop-repro, dashboard-repro]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          pattern: pkg01-0121-*-repro
          path: dist-pkg01/01.21/components
          merge-multiple: false

      - name: Validate and package reproducibility evidence
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path

          component_files = sorted(Path('dist-pkg01/01.21/components').rglob('evidence.json'))
          assert len(component_files) == 3, [str(p) for p in component_files]
          components = [json.loads(p.read_text()) for p in component_files]
          by_name = {c['component']:c for c in components}
          assert set(by_name) == {'rust','desktop','dashboard'}
          assert by_name['rust']['historical_output_match'] is True
          assert by_name['rust']['cargo_locked'] is True
          assert by_name['rust']['fmt_passed'] is True
          assert by_name['rust']['clippy_passed'] is True
          assert by_name['rust']['tests_passed'] is True
          assert by_name['desktop']['historical_output_match'] is True
          assert by_name['dashboard']['historical_output_match'] is True

          candidate = json.loads(Path('docs/release-candidate-current.json').read_text())
          manifest_path = Path('certification/pkg01-build-artifact-manifest-v1.json')
          payload = {
              'schema_version':1,
              'task_id':'01.21',
              'artifact':'pkg01-fresh-checkout-reproducibility',
              'product_version':candidate['product_version'],
              'candidate_id':candidate['candidate_id'],
              'source_commit':os.environ['GITHUB_SHA'],
              'manifest_sha256':hashlib.sha256(manifest_path.read_bytes()).hexdigest(),
              'fresh_checkout':True,
              'cache_restore_used':False,
              'rust_locked_gates_reproduced':True,
              'rust_release_outputs_byte_for_byte_match':True,
              'desktop_output_tree_match':True,
              'dashboard_output_tree_match':True,
              'components':components,
          }
          out=Path('dist-pkg01/01.21/final')
          out.mkdir(parents=True, exist_ok=True)
          (out/'evidence.json').write_text(json.dumps(payload, indent=2, sort_keys=True)+'\n')
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: pkg01-0121-fresh-checkout-reproducibility
          path: dist-pkg01/01.21/final
          if-no-files-found: error
