name: PKG-02 02.08 Windows Self-Hosted Certification

on:
  pull_request:
    branches:
      - main
    types: [synchronize]
    paths:
      - '.github/workflows/pkg02-task-0208-local-win-02.yml'
      - 'scripts/self-hosted/pkg02-0208.ps1'
      - 'crates/vsn-project/**'
      - 'crates/vsn-core/**'
      - 'crates/vsn-files/**'
      - 'apps/agent/**'
      - 'apps/cli/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pkg02-0208-self-hosted-pr-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  certify-0208:
    name: 02.08 self-hosted bootstrap certification
    runs-on: self-hosted
    timeout-minutes: 90
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
        with:
          clean: true

      - name: Verify compatible self-hosted runner
        run: |
          $ErrorActionPreference = 'Stop'
          if (-not $IsWindows) { throw "02.08 certification requires Windows; selected runner '$env:RUNNER_NAME' is incompatible" }
          Write-Host "runner=$env:RUNNER_NAME os=$env:RUNNER_OS arch=$env:RUNNER_ARCH"

      - name: Run 02.08 certification
        run: |
          $ErrorActionPreference = 'Stop'
          & pwsh -NoProfile -File scripts/self-hosted/pkg02-0208.ps1
          if ($LASTEXITCODE -ne 0) { throw "02.08 certification failed with exit $LASTEXITCODE" }

      - name: Upload 02.08 self-hosted evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pkg02-0208-self-hosted
          path: dist-self-hosted/02.08
          if-no-files-found: warn
