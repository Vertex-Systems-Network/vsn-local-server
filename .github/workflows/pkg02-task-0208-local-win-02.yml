name: PKG-02 02.08 LOCAL-WIN-02 Certification

on:
  push:
    branches:
      - pkg02/0208-project-bootstrap
    paths:
      - '.github/workflows/pkg02-task-0208-local-win-02.yml'
      - 'scripts/self-hosted/pkg02-0208.ps1'
      - 'crates/vsn-project/**'
      - 'crates/vsn-core/**'
      - 'crates/vsn-files/**'
      - 'apps/agent/**'
      - 'apps/cli/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pkg02-0208-local-win-02
  cancel-in-progress: false

jobs:
  certify-0208:
    name: 02.08 LOCAL-WIN-02 bootstrap certification
    runs-on: [self-hosted, LOCAL-WIN-02]
    timeout-minutes: 90
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
        with:
          clean: true

      - name: Verify exclusive runner identity
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:RUNNER_NAME -ne 'LOCAL-WIN-02') {
            throw "refusing runner '$env:RUNNER_NAME'; LOCAL-WIN-02 is required"
          }
          if (-not $IsWindows) { throw 'LOCAL-WIN-02 certification requires Windows' }
          Write-Host "runner=$env:RUNNER_NAME os=$env:RUNNER_OS arch=$env:RUNNER_ARCH"

      - name: Run 02.08 certification
        run: |
          $ErrorActionPreference = 'Stop'
          & pwsh -NoProfile -File scripts/self-hosted/pkg02-0208.ps1
          if ($LASTEXITCODE -ne 0) { throw "02.08 certification failed with exit $LASTEXITCODE" }

      - name: Upload 02.08 LOCAL-WIN-02 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pkg02-0208-local-win-02
          path: dist-self-hosted/02.08
          if-no-files-found: warn
