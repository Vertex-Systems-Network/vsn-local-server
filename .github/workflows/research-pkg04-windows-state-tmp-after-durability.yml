name: Research PKG-04 Windows State Temp After Durability

on:
  push:
    branches:
      - research/pkg04-windows-state-tmp-after-durability-20260907

permissions:
  contents: read

concurrency:
  group: research-pkg04-windows-state-tmp-after-durability-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows-composition:
    name: windows-latest · prospective durability + state-temp hardlink composition
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - name: Checkout exact research source
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 2

      - name: Bind workflow-only branch to canonical base
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $canonical='79812eafdead24de88d8b3fafd19f1bfc0e1435c'
          $parent=(git rev-parse HEAD^).Trim()
          if($parent -ne $canonical){ throw "Unexpected parent: expected=$canonical actual=$parent" }
          $changed=@(git diff --name-only HEAD^ HEAD)
          if($changed.Count -ne 1 -or $changed[0] -ne '.github/workflows/research-pkg04-windows-state-tmp-after-durability.yml'){
            throw "Research branch is not workflow-only: $($changed -join ', ')"
          }
          if(@(git status --porcelain=v1 --untracked-files=no).Count -ne 0){ throw 'Tracked checkout is dirty.' }

      - name: Install exact Rust 1.97.1
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          rustup toolchain install 1.97.1 --profile minimal --component clippy
          rustup default 1.97.1
          if((rustc --version).Trim() -notmatch '^rustc 1\.97\.1 '){ throw 'Unexpected rustc version.' }
          if((cargo --version).Trim() -notmatch '^cargo 1\.97\.1 '){ throw 'Unexpected cargo version.' }

      - name: Fetch locked dependency graph
        run: cargo fetch --locked

      - name: Apply prospective Windows durability handle adaptation
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $path='crates/vsn-update/src/lib.rs'
          $text=[IO.File]::ReadAllText($path)
          $old='fs::OpenOptions::new().read(true).open(path)?;'
          $new='fs::OpenOptions::new().read(true).write(true).open(path)?;'
          $count=([regex]::Matches($text,[regex]::Escape($old))).Count
          if($count -ne 1){ throw "Expected one durability reopen, found $count" }
          [IO.File]::WriteAllText($path,$text.Replace($old,$new),[Text.UTF8Encoding]::new($false))
          git diff --check
          git diff -- $path

      - name: Materialize Windows state-temp composition probe
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          New-Item -ItemType Directory -Force -Path crates/vsn-update/tests | Out-Null
          @'
          use sha2::{Digest, Sha256};
          use std::{
              fs,
              path::PathBuf,
              time::{SystemTime, UNIX_EPOCH},
          };

          fn digest_hex(bytes: &[u8]) -> String {
              Sha256::digest(bytes)
                  .iter()
                  .map(|byte| format!("{byte:02x}"))
                  .collect::<String>()
          }

          #[test]
          fn prospective_windows_durability_reaches_preplanted_state_tmp_hardlink() {
              let unique = format!(
                  "vsn-pkg04-win-state-tmp-after-durability-{}-{}",
                  std::process::id(),
                  SystemTime::now()
                      .duration_since(UNIX_EPOCH)
                      .expect("clock")
                      .as_nanos()
              );
              let base: PathBuf = std::env::temp_dir().join(unique);
              let root = base.join("install");
              let target = root.join("bin").join("vsn-agent.exe");
              let control = root.join(".vsn-update");
              let staged = base.join("candidate.bin");
              let outside = base.join("outside-state-sentinel.json");
              let state_tmp = control.join("state.json.tmp");
              let state_path = control.join("state.json");
              let candidate = b"NEW-CANDIDATE";

              fs::create_dir_all(target.parent().expect("target parent"))
                  .expect("create target parent");
              fs::create_dir_all(&control).expect("create normal updater control root");
              fs::write(&target, b"OLD-CURRENT").expect("seed current target");
              fs::write(&staged, candidate).expect("seed staged candidate");
              fs::write(&outside, b"OUTSIDE-SENTINEL").expect("seed outside sentinel");
              fs::hard_link(&outside, &state_tmp)
                  .expect("preplant state.json.tmp as controlled hardlink");

              fs::write(&state_tmp, b"DIRECT-HARDLINK-PROBE")
                  .expect("prove Windows hardlink write-through primitive");
              assert_eq!(
                  fs::read(&outside).expect("outside after primitive probe"),
                  b"DIRECT-HARDLINK-PROBE"
              );
              fs::write(&outside, b"OUTSIDE-SENTINEL").expect("reset sentinel");

              let request = vsn_update::ApplyFileRequest {
                  install_root: root.clone(),
                  target_relative: PathBuf::from("bin/vsn-agent.exe"),
                  staged_artifact: staged,
                  expected_sha256: digest_hex(candidate),
                  release: "2.0.0".into(),
                  confirm_apply: true,
              };

              let result = vsn_update::apply_verified_file(&request)
                  .expect("prospective #187 durability adaptation should allow Windows apply to reach state projection");

              assert_eq!(fs::read(&target).expect("target after apply"), candidate);
              assert_eq!(result.release, "2.0.0");

              let outside_after = fs::read(&outside).expect("outside after state projection");
              assert_ne!(outside_after, b"OUTSIDE-SENTINEL");
              let projected: serde_json::Value = serde_json::from_slice(&outside_after)
                  .expect("outside hardlink now contains updater state JSON");
              assert_eq!(projected["current_release"], "2.0.0");
              assert_eq!(projected["target_relative"], "bin/vsn-agent.exe");
              assert_eq!(
                  fs::read(&state_path).expect("final state path"),
                  outside_after,
                  "state.json and outside hardlink must expose identical projected bytes"
              );

              let alias_probe = b"POST-APPLY-ALIAS-PROBE";
              fs::write(&outside, alias_probe).expect("mutate outside alias after state temp rename");
              assert_eq!(
                  fs::read(&state_path).expect("state after outside alias mutation"),
                  alias_probe,
                  "final state.json remains aliased to the outside hardlink object"
              );

              println!(
                  "PKG04_WINDOWS_PROSPECTIVE_STATE_TMP_COMPOSITION_CONFIRMED durability_patch=read_write hardlink_primitive=true reached_state_projection=true outside_mutated=true final_alias_persists=true target_after={} release={}",
                  String::from_utf8_lossy(candidate),
                  result.release
              );

              fs::remove_dir_all(&base).expect("cleanup isolated probe tree");
          }
          '@ | Set-Content -LiteralPath crates/vsn-update/tests/pkg04_state_tmp_hardlink_windows_composition.rs -Encoding utf8

      - name: Execute combined Windows composition proof
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          New-Item -ItemType Directory -Force -Path audit-evidence | Out-Null
          $lines=@(& cargo test --locked -p vsn-update --test pkg04_state_tmp_hardlink_windows_composition -- --nocapture 2>&1)
          $exit=$LASTEXITCODE
          $lines | Tee-Object -FilePath audit-evidence/probe.log
          if($exit -ne 0){ throw "Composition probe failed with cargo exit $exit" }
          if(-not (Select-String -LiteralPath audit-evidence/probe.log -Pattern 'PKG04_WINDOWS_PROSPECTIVE_STATE_TMP_COMPOSITION_CONFIRMED' -Quiet)){
            throw 'Expected composition marker missing.'
          }

          [ordered]@{
            schema = 'vsn.pkg04.windows-state-tmp-after-durability.v1'
            checkout_sha = (git rev-parse HEAD).Trim()
            canonical_base_sha = '79812eafdead24de88d8b3fafd19f1bfc0e1435c'
            runner_os = $env:RUNNER_OS
            runner_arch = $env:RUNNER_ARCH
            generated_test_only = $true
            production_state_used = $false
            product_source_committed = $false
            prospective_windows_durability_patch = 'OpenOptions read(true)+write(true)'
            hardlink_primitive_confirmed = $true
            prospective_apply_reached_state_projection = $true
            outside_file_mutation_via_state_tmp_confirmed = $true
            final_state_alias_persists = $true
            canonical_activation_claimed = $false
            finding = 'With the separately proven #187 write-capable durability reopen applied only inside CI, Windows reaches state projection and the pre-existing deterministic state.json.tmp hardlink redirects projected state to the outside sentinel; this is prospective composition evidence, not canonical activation.'
          } | ConvertTo-Json -Depth 5 | Set-Content -LiteralPath audit-evidence/result.json -Encoding utf8

      - name: Run updater regression and clippy under prospective handle adaptation
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          cargo test --locked -p vsn-update
          if($LASTEXITCODE -ne 0){ throw 'vsn-update regression suite failed' }
          cargo clippy --locked -p vsn-update --all-targets -- -D warnings
          if($LASTEXITCODE -ne 0){ throw 'vsn-update clippy failed' }

      - name: Remove temporary probe and prospective source patch
        if: always()
        shell: pwsh
        run: |
          Remove-Item -Force -ErrorAction SilentlyContinue crates/vsn-update/tests/pkg04_state_tmp_hardlink_windows_composition.rs
          git checkout -- crates/vsn-update/src/lib.rs
          git diff --exit-code
          if(@(git status --porcelain=v1 --untracked-files=no).Count -ne 0){ throw 'Tracked source drift remains after cleanup.' }

      - name: Upload non-secret audit evidence
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: pkg04-windows-state-tmp-after-durability
          path: audit-evidence/**
          if-no-files-found: error
          retention-days: 14
