name: PKG-01 Ledger 01.21

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  reconcile:
    if: github.event.pull_request.head.ref == 'pkg01/0121-fresh-checkout-reproducibility'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: pkg01/0121-fresh-checkout-reproducibility
          fetch-depth: 0

      - name: Reconcile 01.21 certification, status and canonical ledger
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64
          import json
          from pathlib import Path

          cert_path = Path('certification/pkg01-build-foundation-v1.json')
          cert = json.loads(cert_path.read_text())
          cert['done'] = 21
          cert['percent'] = 95.45
          cert['active_task'] = '01.22'
          for task in cert['tasks']:
              if task['id'] == '01.21':
                  task['status'] = 'DONE'
                  task['evidence'] = 'Workflow run 32476458115 passed three independent cold-checkout reproducibility paths. Rust job 96753708402 passed locked fetch/fmt/full Clippy/full tests and rebuilt vsn-agent, vsn and vsn-updater-helper byte-for-byte against the certified artifacts. Desktop job 96753708260 and Dashboard job 96753708458 reproduced their certified production output trees. Aggregate job 96755638779 passed; artifact 9444687636 records fresh_checkout=true, cache_restore_used=false, rust_locked_gates_reproduced=true, rust_release_outputs_byte_for_byte_match=true, desktop_output_tree_match=true and dashboard_output_tree_match=true.'
                  task.pop('depends_on', None)
              elif task['id'] == '01.22':
                  task['status'] = 'IN_PROGRESS'
          cert_path.write_text(json.dumps(cert, indent=2) + '\n')

          status_path = Path('docs/MASTER-EXECUTION-STATUS.json')
          status = json.loads(status_path.read_text())
          status['active_task'] = '01.22'
          pkg = next(p for p in status['packages'] if p['id'] == 'PKG-01')
          pkg['done'] = 21
          pkg['percent'] = 95.45
          pkg['status'] = 'IN_PROGRESS'
          status['notes'] = [n for n in status['notes'] if not n.startswith('01.21 ACTIVE:')]
          status['notes'].append('01.21 DONE: run 32476458115 passed independent Rust, Desktop and Dashboard cold-checkout reproducibility; aggregate job 96755638779 and artifact 9444687636 prove no cache restore, full locked Rust gates, byte-for-byte Rust release output matches, and exact Desktop/Dashboard output-tree matches.')
          status['notes'].append('01.22 ACTIVE: validate all PKG-01 task evidence and candidate/build-manifest/lock/reproducibility consistency before marking the package complete.')
          status_path.write_text(json.dumps(status, indent=2) + '\n')

          ledger_path = Path('VSN_AI_PROJECT_STATE.md')
          marker = '## 33. 2026-08-21 - 01.21 fresh-checkout reproducibility certified'
          encoded = ''
          ledger = ledger_path.read_text()
          section = base64.b64decode(encoded).decode('utf-8').strip()
          if marker not in ledger:
              ledger_path.write_text(ledger.rstrip() + '\n\n' + section + '\n')
          PY

          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add certification/pkg01-build-foundation-v1.json docs/MASTER-EXECUTION-STATUS.json VSN_AI_PROJECT_STATE.md
          git diff --cached --check
          if git diff --cached --quiet; then
            echo 'State already reconciled.'
            exit 0
          fi
          git commit -m 'PKG-01: reconcile canonical state through 01.21'
          git push origin HEAD:pkg01/0121-fresh-checkout-reproducibility
