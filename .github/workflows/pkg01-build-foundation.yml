name: PKG-01 Build Foundation

on:
  push:
    branches:
      - chore/repo-cleanup-and-plan-init
      - pkg01/**
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  runtime-gate:
    name: 01.02 Real Rust Runtime
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.97.1'
          components: 'rustfmt, clippy'
      - name: Verify current candidate runtime
        run: python3 certification/pkg01-task-0102-runner.py --output dist-pkg01/task-0102-result.json
      - uses: actions/upload-artifact@v4
        with:
          name: pkg01-0102-runtime-evidence
          path: |
            dist-pkg01/task-0102-result.json
            dist-pkg01/task-0102-result.json.sha256
          if-no-files-found: error

  cargo-graph:
    name: 01.03 Cargo Dependency Graph
    needs: runtime-gate
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.97.1'
          components: 'rustfmt, clippy'
      - name: Resolve dependency graph without mutating a committed lockfile
        run: |
          set -euo pipefail
          if git ls-files --error-unmatch Cargo.lock >/dev/null 2>&1 && test -s Cargo.lock; then
            echo 'Using tracked Cargo.lock; regeneration is forbidden after 01.04.'
          else
            echo 'Cargo.lock is absent; generating the initial candidate lockfile for 01.03/01.04.'
            cargo generate-lockfile
            test -s Cargo.lock
          fi
          mkdir -p dist-pkg01
          cargo metadata --locked --format-version 1 > dist-pkg01/cargo-metadata.json
          sha256sum Cargo.lock > dist-pkg01/Cargo.lock.sha256
      - name: Commit initial candidate Cargo.lock on pkg01 branch
        if: github.event_name == 'push' && startsWith(github.ref_name, 'pkg01/')
        run: |
          set -euo pipefail
          if git diff --quiet -- Cargo.lock && git ls-files --error-unmatch Cargo.lock >/dev/null 2>&1; then
            echo 'Cargo.lock already tracked and unchanged.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Cargo.lock
          git commit -m 'PKG-01: commit generated Cargo.lock [skip lock-commit]'
          git push origin HEAD:${GITHUB_REF_NAME}
      - name: Upload 01.03 dependency evidence and candidate Cargo.lock
        uses: actions/upload-artifact@v4
        with:
          name: pkg01-0103-cargo-graph
          path: |
            Cargo.lock
            dist-pkg01/Cargo.lock.sha256
            dist-pkg01/cargo-metadata.json
          if-no-files-found: error

  fetch-locked:
    name: 01.05 Cargo Fetch Locked
    needs: cargo-graph
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.97.1'
          components: 'rustfmt, clippy'
      - name: Fetch exact locked graph
        run: cargo fetch --locked

  fmt-artifact:
    name: 01.06 Rustfmt Fix Artifact
    needs: fetch-locked
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.97.1'
          components: 'rustfmt'
      - name: Generate deterministic formatted-source artifact
        run: |
          set -euo pipefail
          cargo fmt --all
          git diff --check
          mkdir -p dist-pkg01/formatted
          git diff --name-only -- '*.rs' | sort > dist-pkg01/rustfmt-files.txt
          if [[ -s dist-pkg01/rustfmt-files.txt ]]; then
            while IFS= read -r file; do
              mkdir -p "dist-pkg01/formatted/$(dirname "$file")"
              cp "$file" "dist-pkg01/formatted/$file"
            done < dist-pkg01/rustfmt-files.txt
            (cd dist-pkg01/formatted && find . -type f -print0 | sort -z | xargs -0 sha256sum) > dist-pkg01/rustfmt-formatted.sha256
            echo 'changes-required' > dist-pkg01/rustfmt-status.txt
          else
            : > dist-pkg01/rustfmt-formatted.sha256
            echo 'clean' > dist-pkg01/rustfmt-status.txt
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: pkg01-0106-rustfmt-formatted-source
          path: |
            dist-pkg01/formatted
            dist-pkg01/rustfmt-files.txt
            dist-pkg01/rustfmt-formatted.sha256
            dist-pkg01/rustfmt-status.txt
          if-no-files-found: error

  fmt:
    name: 01.06 Cargo Format Check
    needs: fetch-locked
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.97.1'
          components: 'rustfmt, clippy'
      - run: cargo fmt --all -- --check

  clippy:
    name: 01.07 Cargo Clippy
    needs: fmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Linux native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config \
            libglib2.0-dev \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libssl-dev \
            patchelf
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.97.1'
          components: 'rustfmt, clippy'
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings

  tests:
    name: 01.08 Cargo Tests
    needs: clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Linux native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config \
            libglib2.0-dev \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libssl-dev \
            patchelf
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.97.1'
          components: 'rustfmt, clippy'
      - run: cargo test --workspace --locked

  final-clippy-fix:
    name: TEMP Final Clippy Fix
    if: github.event_name == 'push' && github.ref_name == 'pkg01/clippy-after-pr7'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: pkg01/clippy-after-pr7
          fetch-depth: 0
      - name: Patch final lint, update ledger, and restore workflows
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          python3 - <<'PY'
          from pathlib import Path
          p = Path('crates/vsn-database/src/lib.rs')
          s = p.read_text()
          old = "        let mut caps = CapabilitySet::default();\n        caps.insert = true;\n        caps.export = true;\n"
          new = "        let caps = CapabilitySet {\n            insert: true,\n            export: true,\n            ..Default::default()\n        };\n"
          count = s.count(old)
          if count != 1:
              raise SystemExit(f'expected one CapabilitySet reassignment block, found {count}')
          p.write_text(s.replace(old, new))
          ledger = Path('VSN_AI_PROJECT_STATE.md')
          text = ledger.read_text()
          marker = '## Activity — 2026-08-21 — final observed 01.07 lint batch'
          if marker not in text:
              entry = "\n\n## Activity — 2026-08-21 — final observed 01.07 lint batch\n- Successive exact Clippy probes reduced the remaining workspace failures from control-plane/desktop compile blockers to 4 lints, then 2 test-target blockers, then 1 cloud test initializer blocker, and finally one `vsn-database` test lint.\n- V7 probe run `32434584209` confirmed the Cloud clone initializer fix landed and exposed the last observed lint at `crates/vsn-database/src/lib.rs:1221`: `field_reassign_with_default` in `ui_actions_follow_capabilities`.\n- Fix: initialize `CapabilitySet` with `insert: true`, `export: true`, and `..Default::default()` instead of mutating fields after construction.\n- Progress remains 6/22 = 27.27% until a fresh clean-head authoritative 01.07 Clippy run passes. 01.08 remains blocked until then.\n"
              ledger.write_text(text + entry)
          PY
          git checkout origin/main -- .github/workflows/pkg01-build-foundation.yml
          git rm -f .github/workflows/pkg01-final-clippy-fix.yml || true
          git rm -f _tmp_should_not_exist || true
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add crates/vsn-database/src/lib.rs VSN_AI_PROJECT_STATE.md .github/workflows/pkg01-build-foundation.yml
          git commit -m 'PKG-01: clear final observed workspace Clippy lint'
          git push origin HEAD:pkg01/clippy-after-pr7
