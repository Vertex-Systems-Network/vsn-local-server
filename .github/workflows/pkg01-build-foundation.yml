name: PKG-01 Build Foundation

on:
  push:
    branches:
      - chore/repo-cleanup-and-plan-init
      - pkg01/**
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fix-control-store-test:
    name: TEMP fix control-store snapshot test
    if: github.event_name == 'push' && startsWith(github.ref_name, 'pkg01/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
      - name: Patch test to use an owned temporary directory
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('crates/vsn-control-store/src/lib.rs')
          text = path.read_text()
          old_path = '        let path = std::env::temp_dir().join(format!("vsn-control-store-{}.db", now_ms()));\n'
          new_path = (
              '        let temp_root = std::env::temp_dir().join(format!("vsn-control-store-{}", now_ms()));\n'
              '        let path = temp_root.join("store.db");\n'
          )
          old_cleanup = '        let _ = fs::remove_file(path);\n'
          new_cleanup = (
              '        let _ = fs::remove_file(&path);\n'
              '        let _ = fs::remove_dir(temp_root);\n'
          )
          if text.count(old_path) != 1:
              raise SystemExit(f'expected one snapshot temp-path initializer, found {text.count(old_path)}')
          if text.count(old_cleanup) != 1:
              raise SystemExit(f'expected one snapshot cleanup, found {text.count(old_cleanup)}')
          text = text.replace(old_path, new_path, 1).replace(old_cleanup, new_cleanup, 1)
          path.write_text(text)
          PY
          git fetch origin main
          git checkout origin/main -- .github/workflows/pkg01-build-foundation.yml
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add crates/vsn-control-store/src/lib.rs .github/workflows/pkg01-build-foundation.yml
          git diff --cached --check
          git commit -m 'PKG-01: isolate control-store snapshot test temp directory'
          git push origin HEAD:${GITHUB_REF_NAME}

  runtime-gate:
    name: 01.02 Real Rust Runtime
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.97.1'
          components: 'rustfmt, clippy'
      - name: Verify current candidate runtime
        run: python3 certification/pkg01-task-0102-runner.py --output dist-pkg01/task-0102-result.json
      - uses: actions/upload-artifact@v4
        with:
          name: pkg01-0102-runtime-evidence
          path: |
            dist-pkg01/task-0102-result.json
            dist-pkg01/task-0102-result.json.sha256
          if-no-files-found: error

  cargo-graph:
    name: 01.03 Cargo Dependency Graph
    needs: runtime-gate
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.97.1'
          components: 'rustfmt, clippy'
      - name: Resolve dependency graph without mutating a committed lockfile
        run: |
          set -euo pipefail
          if git ls-files --error-unmatch Cargo.lock >/dev/null 2>&1 && test -s Cargo.lock; then
            echo 'Using tracked Cargo.lock; regeneration is forbidden after 01.04.'
          else
            echo 'Cargo.lock is absent; generating the initial candidate lockfile for 01.03/01.04.'
            cargo generate-lockfile
            test -s Cargo.lock
          fi
          mkdir -p dist-pkg01
          cargo metadata --locked --format-version 1 > dist-pkg01/cargo-metadata.json
          sha256sum Cargo.lock > dist-pkg01/Cargo.lock.sha256
      - name: Commit initial candidate Cargo.lock on pkg01 branch
        if: github.event_name == 'push' && startsWith(github.ref_name, 'pkg01/')
        run: |
          set -euo pipefail
          if git diff --quiet -- Cargo.lock && git ls-files --error-unmatch Cargo.lock >/dev/null 2>&1; then
            echo 'Cargo.lock already tracked and unchanged.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Cargo.lock
          git commit -m 'PKG-01: commit generated Cargo.lock [skip lock-commit]'
          git push origin HEAD:${GITHUB_REF_NAME}
      - name: Upload 01.03 dependency evidence and candidate Cargo.lock
        uses: actions/upload-artifact@v4
        with:
          name: pkg01-0103-cargo-graph
          path: |
            Cargo.lock
            dist-pkg01/Cargo.lock.sha256
            dist-pkg01/cargo-metadata.json
          if-no-files-found: error

  fetch-locked:
    name: 01.05 Cargo Fetch Locked
    needs: cargo-graph
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.97.1'
          components: 'rustfmt, clippy'
      - name: Fetch exact locked graph
        run: cargo fetch --locked

  fmt-artifact:
    name: 01.06 Rustfmt Fix Artifact
    needs: fetch-locked
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.97.1'
          components: 'rustfmt'
      - name: Generate deterministic formatted-source artifact
        run: |
          set -euo pipefail
          cargo fmt --all
          git diff --check
          mkdir -p dist-pkg01/formatted
          git diff --name-only -- '*.rs' | sort > dist-pkg01/rustfmt-files.txt
          if [[ -s dist-pkg01/rustfmt-files.txt ]]; then
            while IFS= read -r file; do
              mkdir -p "dist-pkg01/formatted/$(dirname "$file")"
              cp "$file" "dist-pkg01/formatted/$file"
            done < dist-pkg01/rustfmt-files.txt
            (cd dist-pkg01/formatted && find . -type f -print0 | sort -z | xargs -0 sha256sum) > dist-pkg01/rustfmt-formatted.sha256
            echo 'changes-required' > dist-pkg01/rustfmt-status.txt
          else
            : > dist-pkg01/rustfmt-formatted.sha256
            echo 'clean' > dist-pkg01/rustfmt-status.txt
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: pkg01-0106-rustfmt-formatted-source
          path: |
            dist-pkg01/formatted
            dist-pkg01/rustfmt-files.txt
            dist-pkg01/rustfmt-formatted.sha256
            dist-pkg01/rustfmt-status.txt
          if-no-files-found: error

  fmt:
    name: 01.06 Cargo Format Check
    needs: fetch-locked
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.97.1'
          components: 'rustfmt, clippy'
      - run: cargo fmt --all -- --check

  clippy:
    name: 01.07 Cargo Clippy
    needs: fmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Linux native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config \
            libglib2.0-dev \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libssl-dev \
            patchelf
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.97.1'
          components: 'rustfmt, clippy'
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings

  tests:
    name: 01.08 Cargo Tests
    needs: clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Linux native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config \
            libglib2.0-dev \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libssl-dev \
            patchelf
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.97.1'
          components: 'rustfmt, clippy'
      - run: cargo test --workspace --locked
