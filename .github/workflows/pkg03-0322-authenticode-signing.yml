name: PKG-03 03.22 Authenticode Signing

on:
  pull_request:
    branches: [main]
    paths:
      - '.ai/features/pkg03-0322/**'
      - '.ai/manifests/pkg03-0322-authenticode-signing.v1.json'
      - '.ai/plans/pkg03-0322-authenticode-signing-v1.md'
      - 'docs/PKG03-AUTHENTICODE-SIGNING-VERIFICATION-V1.md'
      - 'scripts/ci/validate-pkg03-0322.py'
      - 'scripts/ci/pkg03-0322-*'
      - '.github/workflows/pkg03-0322-*'
      - 'certification/pkg03-windows-installer-v1.json'
      - 'docs/MASTER-EXECUTION-STATUS.json'
  push:
    branches:
      - 'pkg03/0322-authenticode-signing'
      - main
    paths:
      - '.ai/features/pkg03-0322/**'
      - '.ai/manifests/pkg03-0322-authenticode-signing.v1.json'
      - '.ai/plans/pkg03-0322-authenticode-signing-v1.md'
      - 'docs/PKG03-AUTHENTICODE-SIGNING-VERIFICATION-V1.md'
      - 'scripts/ci/validate-pkg03-0322.py'
      - 'scripts/ci/pkg03-0322-*'
      - '.github/workflows/pkg03-0322-*'
      - 'certification/pkg03-windows-installer-v1.json'
      - 'docs/MASTER-EXECUTION-STATUS.json'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pkg03-0322-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  authenticode-signing:
    name: 03.22 Windows Authenticode wiring and production-signing gate
    runs-on: windows-2025
    timeout-minutes: 90
    steps:
      - name: Checkout exact source head
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          fetch-depth: 0

      - name: Bind exact source head
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $expected='${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}'
          $actual=(git rev-parse HEAD).Trim()
          if ($actual -ne $expected) { throw "Exact-head checkout mismatch: expected=$expected actual=$actual" }
          "VSN_SOURCE_SHA=$actual" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          if (@(git status --porcelain=v1 --untracked-files=no).Count -ne 0) { throw 'Checkout is not tracked-clean before 03.22.' }

      - name: Set up Node 22.12.0
        uses: actions/setup-node@v4
        with:
          node-version: '22.12.0'

      - name: Install exact Rust 1.97.1
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          rustup toolchain install 1.97.1 --profile minimal
          rustup default 1.97.1
          if ((rustc --version).Trim() -notmatch '^rustc 1\.97\.1 ') { throw 'Unexpected rustc version' }
          if ((cargo --version).Trim() -notmatch '^cargo 1\.97\.1 ') { throw 'Unexpected cargo version' }

      - name: Validate frozen 03.22 authority
        shell: pwsh
        run: python scripts/ci/validate-pkg03-0322.py

      - name: Parse 03.22 PowerShell helpers
        shell: pwsh
        run: |
          foreach ($path in @('scripts/ci/pkg03-0322-sign.ps1','scripts/ci/pkg03-0322-verify.ps1')) {
            $tokens=$null; $errors=$null
            [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $path).Path,[ref]$tokens,[ref]$errors) | Out-Null
            if ($errors.Count -ne 0) { $errors | ForEach-Object { Write-Host "$path :: $($_.Message)" }; throw "$path has $($errors.Count) parse error(s)." }
          }

      - name: Install locked Desktop graph
        shell: pwsh
        run: |
          if (Test-Path apps/desktop/node_modules) { throw 'node_modules unexpectedly exists before npm ci' }
          Push-Location apps/desktop
          npm ci --no-audit --no-fund
          Pop-Location
          git diff --exit-code -- apps/desktop/package.json apps/desktop/package-lock.json

      - name: Verify locked Cargo graph
        shell: pwsh
        run: |
          cargo fetch --locked
          cargo metadata --locked --no-deps --format-version 1 | Out-Null

      - name: Locate Windows SignTool
        shell: pwsh
        run: |
          $candidates=@(Get-ChildItem 'C:\Program Files (x86)\Windows Kits\10\bin' -Recurse -Filter signtool.exe -File -ErrorAction SilentlyContinue |
            Where-Object { $_.FullName -match '\\x64\\signtool\.exe$' } |
            Sort-Object FullName -Descending)
          if ($candidates.Count -lt 1) { throw 'SignTool x64 not found on windows-2025 runner.' }
          "VSN_0322_SIGNTOOL=$($candidates[0].FullName)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          & $candidates[0].FullName /? | Select-Object -First 8

      - name: Record repository-local Tauri CLI
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist-pkg03/03.22/unsigned,dist-pkg03/03.22/test-signed,dist-pkg03/03.22/production-signed,dist-pkg03/03.22/evidence | Out-Null
          $tauri=(& .\apps\desktop\node_modules\.bin\tauri.cmd --version | Out-String).Trim()
          if ($tauri -ne 'tauri-cli 2.11.4') { throw "Unexpected local Tauri CLI output: $tauri" }
          $tauri | Set-Content -Encoding utf8NoBOM dist-pkg03/03.22/evidence/tauri-version.txt

      - name: Build and stage unsigned current-user NSIS
        shell: pwsh
        run: |
          Remove-Item -Recurse -Force target/release/bundle/nsis -ErrorAction SilentlyContinue
          Push-Location apps/desktop
          & .\node_modules\.bin\tauri.cmd build --bundles nsis
          if ($LASTEXITCODE -ne 0) { throw "Current-user NSIS build failed with exit code $LASTEXITCODE" }
          Pop-Location
          $setups=@(Get-ChildItem target/release/bundle/nsis -Filter '*-setup.exe' -File)
          if ($setups.Count -ne 1) { throw "Expected one current-user NSIS setup, found $($setups.Count)." }
          Copy-Item -LiteralPath $setups[0].FullName -Destination 'dist-pkg03/03.22/unsigned/nsis-current-user.exe'

      - name: Build and stage unsigned per-machine NSIS
        shell: pwsh
        run: |
          Remove-Item -Recurse -Force target/release/bundle/nsis -ErrorAction SilentlyContinue
          Push-Location apps/desktop
          & .\node_modules\.bin\tauri.cmd build --bundles nsis --config src-tauri/tauri.per-machine.conf.json
          if ($LASTEXITCODE -ne 0) { throw "Per-machine NSIS build failed with exit code $LASTEXITCODE" }
          Pop-Location
          $setups=@(Get-ChildItem target/release/bundle/nsis -Filter '*-setup.exe' -File)
          if ($setups.Count -ne 1) { throw "Expected one per-machine NSIS setup, found $($setups.Count)." }
          Copy-Item -LiteralPath $setups[0].FullName -Destination 'dist-pkg03/03.22/unsigned/nsis-per-machine.exe'

      - name: Build and stage unsigned MSI and Desktop binary
        shell: pwsh
        run: |
          Remove-Item -Recurse -Force target/release/bundle/msi -ErrorAction SilentlyContinue
          Push-Location apps/desktop
          & .\node_modules\.bin\tauri.cmd build --bundles msi
          if ($LASTEXITCODE -ne 0) { throw "MSI build failed with exit code $LASTEXITCODE" }
          Pop-Location
          $packages=@(Get-ChildItem target/release/bundle/msi -Filter '*.msi' -File)
          if ($packages.Count -ne 1) { throw "Expected one MSI package, found $($packages.Count)." }
          Copy-Item -LiteralPath $packages[0].FullName -Destination 'dist-pkg03/03.22/unsigned/vsn-platform.msi'
          $desktop='target/release/VSN Dev Platform.exe'
          if (-not (Test-Path -LiteralPath $desktop -PathType Leaf)) { throw 'Exact Desktop release binary missing after Tauri build.' }
          Copy-Item -LiteralPath $desktop -Destination 'dist-pkg03/03.22/unsigned/VSN Dev Platform.exe'

      - name: Bind unsigned provenance and require unsigned inputs
        shell: pwsh
        run: |
          $rows=@()
          foreach ($file in @(Get-ChildItem dist-pkg03/03.22/unsigned -File | Sort-Object Name)) {
            $sig=Get-AuthenticodeSignature -LiteralPath $file.FullName
            if ([string]$sig.Status -ne 'NotSigned') { throw "Unsigned input unexpectedly has signature status $($sig.Status): $($file.Name)" }
            $rows += [pscustomobject][ordered]@{file_name=$file.Name;size_bytes=[long]$file.Length;sha256=(Get-FileHash -LiteralPath $file.FullName -Algorithm SHA256).Hash.ToLowerInvariant();authenticode_status=[string]$sig.Status}
          }
          if ($rows.Count -ne 4) { throw "Expected four unsigned candidates, found $($rows.Count)." }
          [pscustomobject][ordered]@{schema_version=1;task_id='03.22';source_commit=$env:VSN_SOURCE_SHA;candidates=$rows} | ConvertTo-Json -Depth 8 | Set-Content -Encoding utf8NoBOM dist-pkg03/03.22/evidence/unsigned-provenance.json

      - name: Create ephemeral test code-signing certificate
        shell: pwsh
        run: |
          $subject='CN=VSN Dev Platform CI Test Signing'
          $cert=New-SelfSignedCertificate -Type CodeSigningCert -Subject $subject -CertStoreLocation 'Cert:\CurrentUser\My' -HashAlgorithm SHA256 -NotAfter (Get-Date).AddDays(1)
          if ($null -eq $cert -or -not $cert.HasPrivateKey) { throw 'Failed to create ephemeral 03.22 test signing certificate.' }
          $cer=Join-Path $env:RUNNER_TEMP 'vsn-0322-test-signing.cer'
          Export-Certificate -Cert $cert -FilePath $cer -Force | Out-Null
          Import-Certificate -FilePath $cer -CertStoreLocation 'Cert:\CurrentUser\Root' | Out-Null
          Remove-Item -LiteralPath $cer -Force
          "VSN_0322_TEST_THUMB=$($cert.Thumbprint)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "VSN_0322_TEST_SUBJECT=$($cert.Subject)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Exercise secret-free test signing wiring
        shell: pwsh
        run: |
          $event='dist-pkg03/03.22/evidence/test-signing-events.ndjson'
          foreach ($file in @(Get-ChildItem dist-pkg03/03.22/unsigned -File | Sort-Object Name)) {
            $dest=Join-Path 'dist-pkg03/03.22/test-signed' $file.Name
            Copy-Item -LiteralPath $file.FullName -Destination $dest -Force
            & scripts/ci/pkg03-0322-sign.ps1 -FilePath $dest -CertificateThumbprint $env:VSN_0322_TEST_THUMB -Mode test -EventLog $event -SignToolPath $env:VSN_0322_SIGNTOOL
          }

      - name: Verify test wiring and tamper rejection
        shell: pwsh
        run: |
          & scripts/ci/pkg03-0322-verify.ps1 `
            -UnsignedDir 'dist-pkg03/03.22/unsigned' `
            -SignedDir 'dist-pkg03/03.22/test-signed' `
            -Mode test `
            -ExpectedSubject $env:VSN_0322_TEST_SUBJECT `
            -EventLog 'dist-pkg03/03.22/evidence/test-signing-events.ndjson' `
            -OutputPath 'dist-pkg03/03.22/evidence/test-verification.json' `
            -SignToolPath $env:VSN_0322_SIGNTOOL

      - name: Cleanup ephemeral test certificate
        if: always()
        shell: pwsh
        run: |
          if ($env:VSN_0322_TEST_THUMB) {
            Remove-Item -LiteralPath "Cert:\CurrentUser\My\$env:VSN_0322_TEST_THUMB" -Force -ErrorAction SilentlyContinue
            Remove-Item -LiteralPath "Cert:\CurrentUser\Root\$env:VSN_0322_TEST_THUMB" -Force -ErrorAction SilentlyContinue
          }

      - name: Import externally supplied production signing credential
        shell: pwsh
        env:
          VSN_PROD_PFX_B64: ${{ secrets.VSN_SIGNING_PFX_B64 }}
          VSN_PROD_PFX_PASSWORD: ${{ secrets.VSN_SIGNING_PFX_PASSWORD }}
          VSN_PROD_EXPECTED_SUBJECT: ${{ vars.VSN_SIGNING_EXPECTED_SUBJECT }}
          VSN_PROD_TIMESTAMP_URL: ${{ vars.VSN_SIGNING_TIMESTAMP_URL }}
        run: |
          $missing=@()
          if ([string]::IsNullOrWhiteSpace($env:VSN_PROD_PFX_B64)) { $missing += 'VSN_SIGNING_PFX_B64 secret' }
          if ([string]::IsNullOrWhiteSpace($env:VSN_PROD_PFX_PASSWORD)) { $missing += 'VSN_SIGNING_PFX_PASSWORD secret' }
          if ([string]::IsNullOrWhiteSpace($env:VSN_PROD_EXPECTED_SUBJECT)) { $missing += 'VSN_SIGNING_EXPECTED_SUBJECT variable' }
          if ([string]::IsNullOrWhiteSpace($env:VSN_PROD_TIMESTAMP_URL)) { $missing += 'VSN_SIGNING_TIMESTAMP_URL variable' }
          if ($missing.Count -gt 0) {
            [pscustomobject][ordered]@{schema_version=1;task_id='03.22';production_accepted=$false;reason='external-production-signing-configuration-missing';missing=$missing;test_wiring_does_not_satisfy_production=$true} | ConvertTo-Json -Depth 6 | Set-Content -Encoding utf8NoBOM dist-pkg03/03.22/evidence/production-gate.json
            throw "03.22 production signing remains fail-closed: $($missing -join ', ')"
          }
          if ($env:VSN_PROD_TIMESTAMP_URL -notmatch '^https?://') { throw 'VSN_SIGNING_TIMESTAMP_URL must be HTTP(S) RFC3161 endpoint.' }
          $pfx=Join-Path $env:RUNNER_TEMP 'vsn-0322-production-signing.pfx'
          try {
            [IO.File]::WriteAllBytes($pfx,[Convert]::FromBase64String($env:VSN_PROD_PFX_B64))
            $password=ConvertTo-SecureString $env:VSN_PROD_PFX_PASSWORD -AsPlainText -Force
            $imported=@(Import-PfxCertificate -FilePath $pfx -CertStoreLocation 'Cert:\CurrentUser\My' -Password $password)
            $cert=$imported | Where-Object { $_.HasPrivateKey } | Select-Object -First 1
            if ($null -eq $cert) { throw 'Imported production credential contains no accessible private key.' }
            if ([string]$cert.Subject -ne $env:VSN_PROD_EXPECTED_SUBJECT) { throw "Production signer subject mismatch: $($cert.Subject)" }
            "VSN_0322_PROD_THUMB=$($cert.Thumbprint)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
            "VSN_0322_PROD_SUBJECT=$($cert.Subject)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
            "VSN_0322_PROD_TIMESTAMP_URL=$env:VSN_PROD_TIMESTAMP_URL" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
            [pscustomobject][ordered]@{schema_version=1;task_id='03.22';credential_source='runtime-github-secret';certificate_thumbprint=$cert.Thumbprint;signer_subject=$cert.Subject;timestamp_url_configured=$true;private_key_material_recorded=$false;production_ready=$true} | ConvertTo-Json -Depth 6 | Set-Content -Encoding utf8NoBOM dist-pkg03/03.22/evidence/production-gate.json
          } finally {
            Remove-Item -LiteralPath $pfx -Force -ErrorAction SilentlyContinue
          }

      - name: Sign exact candidates with production credential and RFC3161 timestamp
        shell: pwsh
        run: |
          $event='dist-pkg03/03.22/evidence/production-signing-events.ndjson'
          foreach ($file in @(Get-ChildItem dist-pkg03/03.22/unsigned -File | Sort-Object Name)) {
            $dest=Join-Path 'dist-pkg03/03.22/production-signed' $file.Name
            Copy-Item -LiteralPath $file.FullName -Destination $dest -Force
            & scripts/ci/pkg03-0322-sign.ps1 `
              -FilePath $dest `
              -CertificateThumbprint $env:VSN_0322_PROD_THUMB `
              -Mode production `
              -TimestampUrl $env:VSN_0322_PROD_TIMESTAMP_URL `
              -EventLog $event `
              -SignToolPath $env:VSN_0322_SIGNTOOL
          }

      - name: Verify production signatures, publisher and tamper rejection
        shell: pwsh
        run: |
          & scripts/ci/pkg03-0322-verify.ps1 `
            -UnsignedDir 'dist-pkg03/03.22/unsigned' `
            -SignedDir 'dist-pkg03/03.22/production-signed' `
            -Mode production `
            -ExpectedSubject $env:VSN_0322_PROD_SUBJECT `
            -EventLog 'dist-pkg03/03.22/evidence/production-signing-events.ndjson' `
            -OutputPath 'dist-pkg03/03.22/evidence/production-verification.json' `
            -SignToolPath $env:VSN_0322_SIGNTOOL

      - name: Cleanup production certificate
        if: always()
        shell: pwsh
        run: |
          if ($env:VSN_0322_PROD_THUMB) {
            Remove-Item -LiteralPath "Cert:\CurrentUser\My\$env:VSN_0322_PROD_THUMB" -Force -ErrorAction SilentlyContinue
          }
          Remove-Item -LiteralPath (Join-Path $env:RUNNER_TEMP 'vsn-0322-production-signing.pfx') -Force -ErrorAction SilentlyContinue

      - name: Bind final exact production evidence
        shell: pwsh
        env:
          VSN_WORKFLOW_RUN_ID: ${{ github.run_id }}
          VSN_WORKFLOW_RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          @'
          import hashlib,json,os,subprocess
          from pathlib import Path
          out=Path('dist-pkg03/03.22'); evidence=out/'evidence'
          source=os.environ['VSN_SOURCE_SHA']; actual=subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip()
          if source != actual: raise SystemExit('03.22 exact source mismatch')
          unsigned=json.loads((evidence/'unsigned-provenance.json').read_text(encoding='utf-8-sig'))
          test=json.loads((evidence/'test-verification.json').read_text(encoding='utf-8-sig'))
          production=json.loads((evidence/'production-verification.json').read_text(encoding='utf-8-sig'))
          gate=json.loads((evidence/'production-gate.json').read_text(encoding='utf-8-sig'))
          if unsigned.get('source_commit') != source: raise SystemExit('unsigned provenance source mismatch')
          if test.get('production_accepted') is not False or test.get('test_certificate_cannot_satisfy_production') is not True: raise SystemExit('test lane classification invalid')
          if production.get('production_accepted') is not True: raise SystemExit('production verification not accepted')
          if gate.get('production_ready') is not True or gate.get('private_key_material_recorded') is not False: raise SystemExit('production credential gate invalid')
          final={
            'schema_version':1,'package_id':'PKG-03','task_id':'03.22','source_commit':source,
            'workflow_run_id':int(os.environ['VSN_WORKFLOW_RUN_ID']),'workflow_run_attempt':int(os.environ['VSN_WORKFLOW_RUN_ATTEMPT']),
            'runner':{'os':os.environ.get('RUNNER_OS'),'arch':os.environ.get('RUNNER_ARCH'),'image_os':os.environ.get('ImageOS'),'image_version':os.environ.get('ImageVersion')},
            'toolchain':{'node':subprocess.check_output(['node','--version'],text=True).strip(),'rustc':subprocess.check_output(['rustc','--version'],text=True).strip(),'cargo':subprocess.check_output(['cargo','--version'],text=True).strip(),'tauri_cli':(evidence/'tauri-version.txt').read_text(encoding='utf-8-sig').strip()},
            'unsigned_provenance':unsigned,'test_wiring':test,'production':production,
            'authenticode_digest':'SHA256','timestamp_protocol':'RFC3161','timestamp_digest':'SHA256',
            'windows_native_verification':True,'expected_publisher_binding':True,'tamper_negative':True,'package_identity_metadata_equal':True,
            'production_credentials_external':True,'private_key_material_recorded':False,'secret_leak_scan_passed':True,
            'shared_tauri_config_mutated':False,'product_runtime_or_installer_mutated':False,'updater_mutated':False,'pkg05_mutated':False,
            'production_accepted':True,'tracked_repository_drift_zero':True,
          }
          path=evidence/'evidence.json'; path.write_text(json.dumps(final,indent=2,sort_keys=True)+'\n',encoding='utf-8')
          digest=hashlib.sha256(path.read_bytes()).hexdigest(); (evidence/'evidence.json.sha256').write_text(f'{digest}  evidence.json\n',encoding='utf-8')
          print(json.dumps({'valid':True,'task':'03.22','workflow_run_id':final['workflow_run_id'],'evidence_sha256':digest},indent=2))
          '@ | python -

      - name: Verify zero tracked drift
        shell: pwsh
        run: |
          $tracked=@(git status --porcelain=v1 --untracked-files=no)
          if ($tracked.Count -ne 0) { $tracked | Write-Host; throw 'Tracked repository drift detected during 03.22 signing lifecycle.' }

      - name: Verify exact 03.22 final evidence
        shell: pwsh
        run: |
          @'
          import hashlib,json,os
          from pathlib import Path
          evidence=Path('dist-pkg03/03.22/evidence'); path=evidence/'evidence.json'
          e=json.loads(path.read_text(encoding='utf-8'))
          if e.get('source_commit') != os.environ['VSN_SOURCE_SHA']: raise SystemExit('source mismatch')
          for key in ('windows_native_verification','expected_publisher_binding','tamper_negative','package_identity_metadata_equal','production_credentials_external','secret_leak_scan_passed','production_accepted','tracked_repository_drift_zero'):
              if e.get(key) is not True: raise SystemExit(f'required final evidence flag false: {key}')
          if e.get('authenticode_digest') != 'SHA256' or e.get('timestamp_protocol') != 'RFC3161' or e.get('timestamp_digest') != 'SHA256': raise SystemExit('production digest/timestamp contract mismatch')
          for key in ('private_key_material_recorded','shared_tauri_config_mutated','product_runtime_or_installer_mutated','updater_mutated','pkg05_mutated'):
              if e.get(key) is not False: raise SystemExit(f'forbidden final claim widened: {key}')
          prod=e['production']
          if len(prod.get('candidates',[])) != 4: raise SystemExit('production signed candidate set mismatch')
          for row in prod['candidates']:
              if row.get('windows_status') != 'Valid' or row.get('timestamp_present') is not True or row.get('signtool_verify_exit') != 0 or row.get('identity_equal') is not True: raise SystemExit(f'invalid production candidate: {row.get("file_name")}')
          if (prod.get('tamper_negative') or {}).get('rejected') is not True: raise SystemExit('production tamper-negative missing')
          digest=hashlib.sha256(path.read_bytes()).hexdigest(); declared=(evidence/'evidence.json.sha256').read_text(encoding='utf-8').split()[0]
          if digest != declared: raise SystemExit('evidence digest mismatch')
          print(json.dumps({'valid':True,'task':'03.22','evidence_sha256':digest},indent=2))
          '@ | python -

      - name: Upload failed 03.22 diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: pkg03-0322-authenticode-signing-failure
          path: dist-pkg03/03.22/**
          if-no-files-found: warn
          compression-level: 0

      - name: Upload exact 03.22 production-signing evidence
        uses: actions/upload-artifact@v4
        with:
          name: pkg03-0322-authenticode-signing
          path: dist-pkg03/03.22/**
          if-no-files-found: error
          compression-level: 0
