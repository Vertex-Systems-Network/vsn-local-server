name: PKG-02 02.01 Agent Lifecycle

on:
  push:
    branches:
      - pkg02/**

permissions:
  contents: write

jobs:
  apply-0226:
    name: 02.26 registered scoped implementation apply
    if: "${{ github.event.head_commit.message == 'chore(02.26): trigger registered scoped apply' }}"
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Verify staging-only delta
        shell: bash
        run: |
          set -euo pipefail
          base=44d7c89df06f48a19b93d1dbbcb512b4eaaa25c0
          git merge-base --is-ancestor "$base" HEAD
          mapfile -t changed < <(git diff --name-only "$base" HEAD)
          for path in "${changed[@]}"; do
            case "$path" in
              scripts/_pkg02_0226_apply.py|.github/workflows/_pkg02-0226-apply.yml|.github/workflows/pkg02-task-0201-agent-lifecycle.yml) ;;
              *) echo "unexpected pre-implementation path: $path" >&2; exit 1 ;;
            esac
          done

      - name: Apply frozen 02.26 implementation
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p = Path('scripts/_pkg02_0226_apply.py')
          s = p.read_text(encoding='utf-8')
          regex_needle = 'text2, count = re.subn(pattern, replacement, text, count=1, flags=re.S)'
          if s.count(regex_needle) != 1:
              raise SystemExit('unexpected regex_once implementation')
          s = s.replace(
              regex_needle,
              'text2, count = re.subn(pattern, lambda _match: replacement, text, count=1, flags=re.S)',
          )
          redis_needle = 'rest.split_once("]: ")'
          if s.count(redis_needle) != 1:
              raise SystemExit('unexpected Redis IPv6 parser template')
          s = s.replace(redis_needle, 'rest.split_once("]:")')
          p.write_text(s, encoding='utf-8', newline='\n')
          PY
          python scripts/_pkg02_0226_apply.py
          cargo fmt --all
          git diff --check

      - name: Restore staging mechanics and verify final scope
        shell: bash
        run: |
          set -euo pipefail
          base=44d7c89df06f48a19b93d1dbbcb512b4eaaa25c0
          git checkout "$base" -- .github/workflows/pkg02-task-0201-agent-lifecycle.yml
          rm -f scripts/_pkg02_0226_apply.py .github/workflows/_pkg02-0226-apply.yml
          mapfile -t changed < <(git diff --name-only "$base")
          for path in "${changed[@]}"; do
            case "$path" in
              crates/vsn-database/src/lib.rs|\
              crates/vsn-database-cli/src/lib.rs|\
              crates/vsn-database-native/src/lib.rs|\
              crates/vsn-core/src/lib.rs|\
              apps/cli/src/main.rs|\
              crates/vsn-database/tests/pkg02_0226_capabilities.rs|\
              crates/vsn-core/tests/pkg02_0226_policy.rs) ;;
              *) echo "unexpected final implementation path: $path" >&2; exit 1 ;;
            esac
          done
          test ${#changed[@]} -eq 7
          git diff --check

      - name: Commit focused implementation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'WPEssential'
          git config user.email 'wordpress.essential@gmail.com'
          git add -A
          git commit -m 'feat(02.26): harden external native database adapters'
          git push origin HEAD:pkg02/0226-external-native-database-main-sync
