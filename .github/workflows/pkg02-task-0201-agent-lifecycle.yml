name: PKG-02 02.01 Agent Lifecycle

on:
  push:
    branches:
      - pkg02/**

permissions:
  contents: write

jobs:
  correct-0226-harness:
    name: 02.26 helper-based harness correction
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Verify bounded staging delta
        shell: bash
        run: |
          set -euo pipefail
          base=db8cb9d0b506c901c0028fd9e16369d15920f3dc
          git merge-base --is-ancestor "$base" HEAD
          mapfile -t changed < <(git diff --name-only "$base" HEAD)
          for path in "${changed[@]}"; do
            case "$path" in
              .github/workflows/_pkg02-0226-harness-fix.yml|scripts/_pkg02_0226_harness_trigger.txt|scripts/_pkg02_0226_harness_fix.py|.github/workflows/pkg02-task-0201-agent-lifecycle.yml) ;;
              *) echo "unexpected staging path: $path" >&2; exit 1 ;;
            esac
          done

      - name: Apply and parse certification correction
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/_pkg02_0226_harness_fix.py
          pwsh -NoProfile -Command '$tokens=$null; $errors=$null; [System.Management.Automation.Language.Parser]::ParseFile("scripts/self-hosted/pkg02-0226.ps1",[ref]$tokens,[ref]$errors) > $null; if ($errors.Count -ne 0) { $errors | Format-List | Out-String | Write-Error; exit 1 }'
          git diff --check

      - name: Remove staging mechanics and verify final scope
        shell: bash
        run: |
          set -euo pipefail
          base=db8cb9d0b506c901c0028fd9e16369d15920f3dc
          git checkout 836feb4171a9eb882208a6d666600cea4abe3f42 -- .github/workflows/pkg02-task-0201-agent-lifecycle.yml
          rm -f .github/workflows/_pkg02-0226-harness-fix.yml scripts/_pkg02_0226_harness_trigger.txt scripts/_pkg02_0226_harness_fix.py
          mapfile -t changed < <(git diff --name-only "$base")
          printf 'final path: %s\n' "${changed[@]}"
          test ${#changed[@]} -eq 1
          test "${changed[0]}" = 'scripts/self-hosted/pkg02-0226.ps1'
          git diff --check

      - name: Commit focused harness correction
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'WPEssential'
          git config user.email 'wordpress.essential@gmail.com'
          git add -A
          git commit -m 'test(02.26): strengthen certification fixtures'
          git push origin HEAD:pkg02/0226-external-native-database-main-sync
