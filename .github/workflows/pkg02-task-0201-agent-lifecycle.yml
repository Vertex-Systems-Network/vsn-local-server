name: PKG-02 02.01 Agent Lifecycle

on:
  push:
    branches:
      - pkg02/**

permissions:
  contents: write

jobs:
  apply-0226-native-budget-fix:
    name: 02.26 scoped native read budget fix
    if: "${{ github.event.head_commit.message == 'chore(02.26): trigger native read budget fix' }}"
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Verify exact staging source
        shell: bash
        run: |
          set -euo pipefail
          base=9fe39a6ff293021aa9db97f1516bb6133e457621
          test "$(git rev-parse HEAD^)" = "$base"
          mapfile -t changed < <(git diff --name-only "$base" HEAD)
          test ${#changed[@]} -eq 1
          test "${changed[0]}" = '.github/workflows/pkg02-task-0201-agent-lifecycle.yml'

      - name: Apply AC-09 bounded read fix
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('crates/vsn-database-native/src/lib.rs')
          text = path.read_text(encoding='utf-8')
          names = ['postgres_indexes', 'postgres_relations', 'mongo_indexes']
          for name in names:
              marker = f'pub fn {name}('
              start = text.find(marker)
              if start < 0:
                  raise SystemExit(f'{name} function not found')
              next_pub = text.find('\npub fn ', start + len(marker))
              if next_pub < 0:
                  next_pub = len(text)
              block = text[start:next_pub]
              needle = '    Ok(NativeGrid {'
              if block.count(needle) != 1:
                  raise SystemExit(f'{name} expected exactly one manual NativeGrid return, got {block.count(needle)}')
              block = block.replace(needle, '    bounded_read_result(NativeGrid {', 1)
              text = text[:start] + block + text[next_pub:]
          path.write_text(text, encoding='utf-8', newline='\n')
          PY
          cargo fmt --all -- --check
          cargo test --locked --package vsn-database-native native_result_budgets_reject_large_cells_and_results
          git diff --check

      - name: Restore registered workflow and verify scope
        shell: bash
        run: |
          set -euo pipefail
          base=9fe39a6ff293021aa9db97f1516bb6133e457621
          git checkout 836feb4171a9eb882208a6d666600cea4abe3f42 -- .github/workflows/pkg02-task-0201-agent-lifecycle.yml
          mapfile -t changed < <(git diff --name-only "$base")
          printf 'final path: %s\n' "${changed[@]}"
          test ${#changed[@]} -eq 1
          test "${changed[0]}" = 'crates/vsn-database-native/src/lib.rs'
          git diff --check

      - name: Commit focused AC-09 fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'WPEssential'
          git config user.email 'wordpress.essential@gmail.com'
          git add crates/vsn-database-native/src/lib.rs .github/workflows/pkg02-task-0201-agent-lifecycle.yml
          git commit -m 'fix(02.26): bound all native read grids'
          git push origin HEAD:pkg02/0226-external-native-database-main-sync
