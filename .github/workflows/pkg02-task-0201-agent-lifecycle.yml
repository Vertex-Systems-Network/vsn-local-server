name: PKG-02 02.01 Agent Lifecycle

on:
  push:
    branches:
      - pkg02/**
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  agent-lifecycle:
    name: 02.01 Local Agent startup and health lifecycle
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux lifecycle dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends keyutils

      - name: Build current Agent and CLI from locked source
        shell: bash
        run: |
          set -euo pipefail
          rustc --version
          cargo --version
          cargo build --locked --release --package vsn-agent --package vsn
          mkdir -p dist-pkg02/02.01/bin
          cp target/release/vsn-agent dist-pkg02/02.01/bin/vsn-agent
          cp target/release/vsn dist-pkg02/02.01/bin/vsn
          chmod +x dist-pkg02/02.01/bin/vsn-agent dist-pkg02/02.01/bin/vsn
          sha256sum dist-pkg02/02.01/bin/vsn-agent > dist-pkg02/02.01/vsn-agent.sha256
          sha256sum dist-pkg02/02.01/bin/vsn > dist-pkg02/02.01/vsn.sha256

      - name: Run clean local Agent lifecycle acceptance
        shell: keyctl session vsn-pkg02-0201 bash --noprofile --norc -eo pipefail {0}
        run: |
          set -euo pipefail
          keyctl rdescribe @s > dist-pkg02/02.01/session-keyring.txt
          bin=dist-pkg02/02.01/bin
          test ! -e dist-pkg02/02.01/agent.log

          "$bin/vsn-agent" > dist-pkg02/02.01/agent.log 2>&1 &
          agent_pid=$!
          echo "$agent_pid" > dist-pkg02/02.01/agent.pid

          cleanup() {
            if kill -0 "$agent_pid" 2>/dev/null; then
              kill -INT "$agent_pid" || true
              for _ in $(seq 1 50); do
                if ! kill -0 "$agent_pid" 2>/dev/null; then break; fi
                sleep 0.1
              done
              if kill -0 "$agent_pid" 2>/dev/null; then
                kill -KILL "$agent_pid" || true
              fi
            fi
          }
          trap cleanup EXIT

          ready=false
          for _ in $(seq 1 80); do
            if "$bin/vsn" ping > dist-pkg02/02.01/ping.json 2> dist-pkg02/02.01/ping.err; then
              ready=true
              break
            fi
            if ! kill -0 "$agent_pid" 2>/dev/null; then
              echo 'Agent exited before IPC readiness.' >&2
              cat dist-pkg02/02.01/session-keyring.txt >&2 || true
              cat dist-pkg02/02.01/agent.log >&2 || true
              cat dist-pkg02/02.01/ping.err >&2 || true
              exit 1
            fi
            sleep 0.25
          done
          if [[ "$ready" != true ]]; then
            echo 'Timed out waiting for authenticated local IPC readiness.' >&2
            cat dist-pkg02/02.01/session-keyring.txt >&2 || true
            cat dist-pkg02/02.01/agent.log >&2 || true
            cat dist-pkg02/02.01/ping.err >&2 || true
            exit 1
          fi
          kill -0 "$agent_pid"

          "$bin/vsn" status > dist-pkg02/02.01/status.json
          "$bin/vsn" machine > dist-pkg02/02.01/machine.json
          "$bin/vsn" security > dist-pkg02/02.01/security.json

          python3 - <<'PY'
          import json
          from pathlib import Path
          ping = json.loads(Path('dist-pkg02/02.01/ping.json').read_text())
          status = json.loads(Path('dist-pkg02/02.01/status.json').read_text())
          machine = json.loads(Path('dist-pkg02/02.01/machine.json').read_text())
          security = json.loads(Path('dist-pkg02/02.01/security.json').read_text())
          assert ping.get('pong') is True and ping.get('version') == '0.38.1'
          assert status['health']['healthy'] is True
          assert isinstance(status['health'].get('detail'), str) and status['health']['detail']
          assert isinstance(machine.get('device_id'), str) and len(machine['device_id']) >= 8
          assert isinstance(machine.get('display_name'), str) and machine['display_name']
          assert isinstance(machine.get('os'), str) and machine['os']
          assert isinstance(machine.get('public_key'), str) and machine['public_key']
          assert security.get('device_identity_ready') is True
          assert security.get('ipc_secret_ready') is True
          PY

          kill -INT "$agent_pid"
          set +e
          wait "$agent_pid"
          exit_code=$?
          set -e
          trap - EXIT
          echo "$exit_code" > dist-pkg02/02.01/agent-exit-code.txt
          test "$exit_code" -eq 0
          test ! -e /proc/$agent_pid
          grep -q 'VSN Agent 0.38.1' dist-pkg02/02.01/agent.log
          grep -q 'agent_state=running' dist-pkg02/02.01/agent.log
          grep -q 'ipc_address=127.0.0.1:39731' dist-pkg02/02.01/agent.log

      - name: Package 02.01 evidence
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path

          def digest(path):
              return hashlib.sha256(Path(path).read_bytes()).hexdigest()

          candidate = json.loads(Path('docs/release-candidate-current.json').read_text())
          ping = json.loads(Path('dist-pkg02/02.01/ping.json').read_text())
          status = json.loads(Path('dist-pkg02/02.01/status.json').read_text())
          machine = json.loads(Path('dist-pkg02/02.01/machine.json').read_text())
          security = json.loads(Path('dist-pkg02/02.01/security.json').read_text())
          evidence = {
              'schema_version': 1,
              'package_id': 'PKG-02',
              'task_id': '02.01',
              'artifact': 'local-agent-lifecycle',
              'product_version': candidate['product_version'],
              'candidate_id': candidate['candidate_id'],
              'source_commit': os.environ['GITHUB_SHA'],
              'build_mode': 'locked-release-from-current-source',
              'agent_sha256': digest('dist-pkg02/02.01/bin/vsn-agent'),
              'cli_sha256': digest('dist-pkg02/02.01/bin/vsn'),
              'linux_shared_session_keyring': True,
              'first_run_ipc_secret_race_fixed': True,
              'agent_started': True,
              'agent_process_alive_during_checks': True,
              'authenticated_cli_ping': ping.get('pong') is True,
              'agent_health_healthy': status['health']['healthy'] is True,
              'device_identity_ready': security.get('device_identity_ready') is True,
              'ipc_secret_ready': security.get('ipc_secret_ready') is True,
              'machine_device_id_present': bool(machine.get('device_id')),
              'machine_public_key_present': bool(machine.get('public_key')),
              'ipc_address': '127.0.0.1:39731',
              'shutdown_signal': 'SIGINT',
              'clean_shutdown_exit_code': int(Path('dist-pkg02/02.01/agent-exit-code.txt').read_text().strip()),
              'agent_log_sha256': digest('dist-pkg02/02.01/agent.log'),
          }
          assert all([
              evidence['linux_shared_session_keyring'], evidence['first_run_ipc_secret_race_fixed'],
              evidence['agent_started'], evidence['authenticated_cli_ping'], evidence['agent_health_healthy'],
              evidence['device_identity_ready'], evidence['ipc_secret_ready'], evidence['machine_device_id_present'],
              evidence['machine_public_key_present'], evidence['clean_shutdown_exit_code'] == 0,
          ])
          Path('dist-pkg02/02.01/evidence.json').write_text(json.dumps(evidence, indent=2, sort_keys=True) + '\n')
          PY
          sha256sum dist-pkg02/02.01/evidence.json > dist-pkg02/02.01/evidence.json.sha256

      - uses: actions/upload-artifact@v7
        with:
          name: pkg02-0201-agent-lifecycle
          path: dist-pkg02/02.01
          if-no-files-found: error
