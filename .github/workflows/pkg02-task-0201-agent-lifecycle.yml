name: PKG-02 02.01 Agent Lifecycle

on:
  push:
    branches:
      - pkg02/**

permissions:
  contents: write

jobs:
  correct-0226-certification:
    name: 02.26 certification harness correction
    if: "${{ github.event.head_commit.message == 'chore(02.26): trigger certification harness correction' }}"
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Verify exact staging source
        shell: bash
        run: |
          set -euo pipefail
          base=4aef63fe478594a5651b9459ca6b4dc3c3868797
          test "$(git rev-parse HEAD^)" = "$base"
          mapfile -t changed < <(git diff --name-only "$base" HEAD)
          test ${#changed[@]} -eq 1
          test "${changed[0]}" = '.github/workflows/pkg02-task-0201-agent-lifecycle.yml'

      - name: Correct frozen certification harness implementation
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path('scripts/self-hosted/pkg02-0226.ps1')
          s = p.read_text(encoding='utf-8')

          old = '''function Write-FakeClient([string]$Name, [string]$Body) {
    $path = Join-Path $script:FakeBin "$Name.cmd"
    Set-Content -LiteralPath $path -Value $Body -Encoding ascii
}'''
          new = '''function Write-FakeClient([string]$Name, [string]$Body) {
    $path = Join-Path $script:FakeBin "$Name.cmd"
    $expanded = $Body.Replace('`r`n', [Environment]::NewLine)
    Set-Content -LiteralPath $path -Value $expanded -Encoding ascii -NoNewline
}'''
          if s.count(old) != 1:
              raise SystemExit('Write-FakeClient block mismatch')
          s = s.replace(old, new, 1)

          old = '''$outsideCa = Join-Path $outside 'outside-ca.pem'
$junctionCa = Join-Path $junction 'outside-ca.pem'
$script:FakeLog'''
          new = '''$outsideCa = Join-Path $outside 'outside-ca.pem'
$junctionCa = Join-Path $junction 'outside-ca.pem'
$outsideCredential = Join-Path $outside 'outside-client.cnf'
$junctionCredential = Join-Path $junction 'outside-client.cnf'
$script:FakeLog'''
          if s.count(old) != 1:
              raise SystemExit('credential variable insertion point mismatch')
          s = s.replace(old, new, 1)

          old = '''$fakeDetectionElapsedMs = 0L
$payloadZipSha = $null'''
          new = '''$fakeDetectionElapsedMs = 0L
$slowDetectionElapsedMs = 0L
$noisyDetectionElapsedMs = 0L
$payloadZipSha = $null'''
          if s.count(old) != 1:
              raise SystemExit('detection measurement insertion point mismatch')
          s = s.replace(old, new, 1)

          old = '''Set-Content -LiteralPath $outsideCa -Value 'outside-root-ca' -Encoding ascii
    New-Item -ItemType Junction'''
          new = '''Set-Content -LiteralPath $outsideCa -Value 'outside-root-ca' -Encoding ascii
    Set-Content -LiteralPath $outsideCredential -Value "[client]`npassword=outside-secret" -Encoding ascii
    New-Item -ItemType Junction'''
          if s.count(old) != 1:
              raise SystemExit('outside credential fixture insertion point mismatch')
          s = s.replace(old, new, 1)

          needle = '''    $fiveEngineCount = $clientRows.Count

    $pgLocal = Invoke-CliJson'''
          insert = '''    $fiveEngineCount = $clientRows.Count

    Write-FakeClient 'psql' '@echo off`r`nif "%1"=="--version" (ping -n 8 127.0.0.1 >nul& exit /b 0)`r`nexit /b 0`r`n'
    $slowSw = [Diagnostics.Stopwatch]::StartNew()
    $slowClients = Invoke-CliJson @('db','clients') 'db-clients-slow-version'
    $slowSw.Stop()
    $slowDetectionElapsedMs = [int64]$slowSw.ElapsedMilliseconds
    if ($slowDetectionElapsedMs -ge 8000) { throw "slow client detection exceeded bounded expectation: $slowDetectionElapsedMs ms" }
    $slowPg = @($slowClients) | Where-Object { [string]$_.engine -eq 'postgresql' }
    if ($null -eq $slowPg -or $slowPg.available -ne $true -or $null -ne $slowPg.version) { throw 'slow --version detection did not fail closed to unavailable version metadata' }

    Write-FakeClient 'psql' '@echo off`r`nif "%1"=="--version" (for /L %%i in (1,1,70000) do @echo 012345678901234567890123456789& exit /b 0)`r`nexit /b 0`r`n'
    $noisySw = [Diagnostics.Stopwatch]::StartNew()
    $noisyClients = Invoke-CliJson @('db','clients') 'db-clients-noisy-version'
    $noisySw.Stop()
    $noisyDetectionElapsedMs = [int64]$noisySw.ElapsedMilliseconds
    if ($noisyDetectionElapsedMs -ge 8000) { throw "noisy client detection exceeded bounded expectation: $noisyDetectionElapsedMs ms" }
    $noisyPg = @($noisyClients) | Where-Object { [string]$_.engine -eq 'postgresql' }
    if ($null -eq $noisyPg -or $noisyPg.available -ne $true -or $null -ne $noisyPg.version) { throw 'high-output --version detection did not fail closed to unavailable version metadata' }
    Write-FakeClient 'psql' $commonRelational

    $pgLocal = Invoke-CliJson'''
          if s.count(needle) != 1:
              raise SystemExit('hostile detection insertion point mismatch')
          s = s.replace(needle, insert, 1)

          needle = '''    $mariaLocal = Invoke-CliJson @('db','inspect','mariadb','::1','3306','fixture','app') 'maria-local-inspect'
    foreach ($item in @($pgLocal,$mysqlLocal,$mariaLocal)) {'''
          insert = '''    $mariaLocal = Invoke-CliJson @('db','inspect','mariadb','::1','3306','fixture','app') 'maria-local-inspect'
    $loopbackExtra = @(
        (Invoke-CliJson @('db','inspect','postgresql','127.0.0.1','5432','fixture','app') 'pg-loopback-127'),
        (Invoke-CliJson @('db','inspect','postgresql','::1','5432','fixture','app') 'pg-loopback-ipv6'),
        (Invoke-CliJson @('db','inspect','mysql','localhost','3306','fixture','app') 'mysql-loopback-localhost'),
        (Invoke-CliJson @('db','inspect','mysql','::1','3306','fixture','app') 'mysql-loopback-ipv6'),
        (Invoke-CliJson @('db','inspect','mariadb','localhost','3306','fixture','app') 'maria-loopback-localhost'),
        (Invoke-CliJson @('db','inspect','mariadb','127.0.0.1','3306','fixture','app') 'maria-loopback-127')
    )
    foreach ($item in @($pgLocal,$mysqlLocal,$mariaLocal) + $loopbackExtra) {'''
          if s.count(needle) != 1:
              raise SystemExit('loopback matrix insertion point mismatch')
          s = s.replace(needle, insert, 1)

          needle = '''    Assert-NoFakeSpawn {
        $missing = Join-Path $workspace 'missing-ca.pem'
        $f = Invoke-CliFailure @('db','inspect-tls','postgresql','db.example.test','5432','fixture','app',$missing) 'reject-missing-ca'
        Assert-FailureContains $f 'unavailable' 'reject-missing-ca'
    } 'reject-missing-ca'

    $pgCredential = Invoke-CliJson'''
          insert = '''    Assert-NoFakeSpawn {
        $missing = Join-Path $workspace 'missing-ca.pem'
        $f = Invoke-CliFailure @('db','inspect-tls','postgresql','db.example.test','5432','fixture','app',$missing) 'reject-missing-ca'
        Assert-FailureContains $f 'unavailable' 'reject-missing-ca'
    } 'reject-missing-ca'
    Assert-NoFakeSpawn {
        $f = Invoke-CliFailure @('db','inspect-tls','postgresql','db.example.test','5432','fixture','app',$ca,$outsideCredential) 'reject-outside-credential'
        Assert-FailureContains $f 'must be inside a configured workspace' 'reject-outside-credential'
    } 'reject-outside-credential'
    Assert-NoFakeSpawn {
        $f = Invoke-CliFailure @('db','inspect-tls','postgresql','db.example.test','5432','fixture','app',$ca,$junctionCredential) 'reject-junction-credential'
        Assert-FailureContains $f 'must be inside a configured workspace' 'reject-junction-credential'
    } 'reject-junction-credential'

    $pgCredential = Invoke-CliJson'''
          if s.count(needle) != 1:
              raise SystemExit('credential containment insertion point mismatch')
          s = s.replace(needle, insert, 1)

          old = '''        client_detection_total_ms = $fakeDetectionElapsedMs
        external_stdout_limit_bytes'''
          new = '''        client_detection_total_ms = $fakeDetectionElapsedMs
        slow_client_detection_total_ms = $slowDetectionElapsedMs
        noisy_client_detection_total_ms = $noisyDetectionElapsedMs
        external_stdout_limit_bytes'''
          if s.count(old) != 1:
              raise SystemExit('measurement insertion point mismatch')
          s = s.replace(old, new, 1)

          p.write_text(s, encoding='utf-8', newline='\n')
          PY
          pwsh -NoProfile -Command '$tokens=$null; $errors=$null; [System.Management.Automation.Language.Parser]::ParseFile("scripts/self-hosted/pkg02-0226.ps1",[ref]$tokens,[ref]$errors) > $null; if ($errors.Count -ne 0) { $errors | Format-List | Out-String | Write-Error; exit 1 }'
          git diff --check

      - name: Restore registered workflow and verify final scope
        shell: bash
        run: |
          set -euo pipefail
          base=4aef63fe478594a5651b9459ca6b4dc3c3868797
          git checkout 836feb4171a9eb882208a6d666600cea4abe3f42 -- .github/workflows/pkg02-task-0201-agent-lifecycle.yml
          mapfile -t changed < <(git diff --name-only "$base")
          printf 'final path: %s\n' "${changed[@]}"
          test ${#changed[@]} -eq 1
          test "${changed[0]}" = 'scripts/self-hosted/pkg02-0226.ps1'
          git diff --check

      - name: Commit focused certification correction
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'WPEssential'
          git config user.email 'wordpress.essential@gmail.com'
          git add scripts/self-hosted/pkg02-0226.ps1 .github/workflows/pkg02-task-0201-agent-lifecycle.yml
          git commit -m 'test(02.26): strengthen certification fixtures'
          git push origin HEAD:pkg02/0226-external-native-database-main-sync
