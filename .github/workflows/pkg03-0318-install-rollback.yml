name: PKG-03 03.18 Install Rollback

on:
  pull_request:
    branches: [main]
    paths:
      - '.ai/features/pkg03-0318/**'
      - '.ai/manifests/pkg03-0318-install-rollback.v1.json'
      - '.ai/plans/pkg03-0318-install-rollback-v1.md'
      - 'docs/PKG03-INSTALLER-FAILURE-ROLLBACK-RECOVERY-V1.md'
      - 'scripts/ci/validate-pkg03-0318.py'
      - 'scripts/ci/pkg03-0318-install-rollback.ps1'
      - '.github/workflows/pkg03-0318-install-rollback.yml'
      - 'certification/pkg03-windows-installer-v1.json'
      - 'docs/MASTER-EXECUTION-STATUS.json'
  push:
    branches:
      - 'pkg03/0318-install-rollback'
      - main
    paths:
      - '.ai/features/pkg03-0318/**'
      - '.ai/manifests/pkg03-0318-install-rollback.v1.json'
      - '.ai/plans/pkg03-0318-install-rollback-v1.md'
      - 'docs/PKG03-INSTALLER-FAILURE-ROLLBACK-RECOVERY-V1.md'
      - 'scripts/ci/validate-pkg03-0318.py'
      - 'scripts/ci/pkg03-0318-install-rollback.ps1'
      - '.github/workflows/pkg03-0318-install-rollback.yml'
      - 'certification/pkg03-windows-installer-v1.json'
      - 'docs/MASTER-EXECUTION-STATUS.json'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pkg03-0318-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  install-rollback:
    name: 03.18 Windows transactional failure rollback and interrupted recovery
    runs-on: windows-2025
    timeout-minutes: 90
    steps:
      - name: Checkout exact source head
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          fetch-depth: 0

      - name: Bind exact source head
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $expected='${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}'
          $actual=(git rev-parse HEAD).Trim()
          if ($actual -ne $expected) { throw "Exact-head checkout mismatch: expected=$expected actual=$actual" }
          "VSN_SOURCE_SHA=$actual" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          if (@(git status --porcelain=v1 --untracked-files=no).Count -ne 0) { throw 'Checkout is not tracked-clean before 03.18.' }

      - name: Set up Node 22.12.0
        uses: actions/setup-node@v4
        with:
          node-version: '22.12.0'

      - name: Install exact Rust 1.97.1
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          rustup toolchain install 1.97.1 --profile minimal
          rustup default 1.97.1
          if ((rustc --version).Trim() -notmatch '^rustc 1\.97\.1 ') { throw 'Unexpected rustc version' }
          if ((cargo --version).Trim() -notmatch '^cargo 1\.97\.1 ') { throw 'Unexpected cargo version' }

      - name: Validate frozen 03.18 authority
        shell: pwsh
        run: python scripts/ci/validate-pkg03-0318.py

      - name: Parse 03.18 PowerShell harness
        shell: pwsh
        run: |
          $tokens=$null; $errors=$null
          [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path 'scripts/ci/pkg03-0318-install-rollback.ps1').Path,[ref]$tokens,[ref]$errors) | Out-Null
          if ($errors.Count -ne 0) { $errors | ForEach-Object { Write-Host $_.Message }; throw "03.18 harness has $($errors.Count) parse error(s)." }

      - name: Install locked Desktop graph
        shell: pwsh
        run: |
          if (Test-Path apps/desktop/node_modules) { throw 'node_modules unexpectedly exists before npm ci' }
          Push-Location apps/desktop
          npm ci --no-audit --no-fund
          Pop-Location
          git diff --exit-code -- apps/desktop/package.json apps/desktop/package-lock.json

      - name: Verify locked Cargo graph
        shell: pwsh
        run: |
          cargo fetch --locked
          cargo metadata --locked --no-deps --format-version 1 | Out-Null

      - name: Record repository-local Tauri CLI
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist-pkg03/03.18/packages | Out-Null
          $tauri=(& .\apps\desktop\node_modules\.bin\tauri.cmd --version | Out-String).Trim()
          if ($tauri -ne 'tauri-cli 2.11.4') { throw "Unexpected local Tauri CLI output: $tauri" }
          $tauri | Set-Content -Encoding utf8NoBOM dist-pkg03/03.18/tauri-version.txt

      - name: Build exact-head current-user NSIS
        shell: pwsh
        run: |
          Remove-Item -Recurse -Force target/release/bundle/nsis -ErrorAction SilentlyContinue
          Push-Location apps/desktop
          & .\node_modules\.bin\tauri.cmd build --bundles nsis
          if ($LASTEXITCODE -ne 0) { throw "Current-user NSIS build failed with exit code $LASTEXITCODE" }
          Pop-Location
          $setups=@(Get-ChildItem target/release/bundle/nsis -Filter '*-setup.exe' -File)
          if ($setups.Count -ne 1) { throw "Expected one current-user NSIS setup, found $($setups.Count)." }
          $copy=Join-Path (Resolve-Path 'dist-pkg03/03.18/packages').Path 'nsis-current-user.exe'
          Copy-Item -LiteralPath $setups[0].FullName -Destination $copy
          "VSN_0318_NSIS_USER=$copy" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Build exact-head per-machine NSIS
        shell: pwsh
        run: |
          Remove-Item -Recurse -Force target/release/bundle/nsis -ErrorAction SilentlyContinue
          Push-Location apps/desktop
          & .\node_modules\.bin\tauri.cmd build --bundles nsis --config src-tauri/tauri.per-machine.conf.json
          if ($LASTEXITCODE -ne 0) { throw "Per-machine NSIS build failed with exit code $LASTEXITCODE" }
          Pop-Location
          $setups=@(Get-ChildItem target/release/bundle/nsis -Filter '*-setup.exe' -File)
          if ($setups.Count -ne 1) { throw "Expected one per-machine NSIS setup, found $($setups.Count)." }
          $copy=Join-Path (Resolve-Path 'dist-pkg03/03.18/packages').Path 'nsis-per-machine.exe'
          Copy-Item -LiteralPath $setups[0].FullName -Destination $copy
          "VSN_0318_NSIS_MACHINE=$copy" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Build exact-head MSI/WiX
        shell: pwsh
        run: |
          Remove-Item -Recurse -Force target/release/bundle/msi -ErrorAction SilentlyContinue
          Push-Location apps/desktop
          & .\node_modules\.bin\tauri.cmd build --bundles msi
          if ($LASTEXITCODE -ne 0) { throw "MSI build failed with exit code $LASTEXITCODE" }
          Pop-Location
          $packages=@(Get-ChildItem target/release/bundle/msi -Filter '*.msi' -File)
          if ($packages.Count -ne 1) { throw "Expected one MSI package, found $($packages.Count)." }
          $copy=Join-Path (Resolve-Path 'dist-pkg03/03.18/packages').Path 'vsn-platform.msi'
          Copy-Item -LiteralPath $packages[0].FullName -Destination $copy
          "VSN_0318_MSI=$copy" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Exercise exact-head transactional failure rollback and interrupted recovery
        shell: pwsh
        run: |
          & scripts/ci/pkg03-0318-install-rollback.ps1 `
            -CurrentUserNsisPath $env:VSN_0318_NSIS_USER `
            -PerMachineNsisPath $env:VSN_0318_NSIS_MACHINE `
            -MsiPath $env:VSN_0318_MSI `
            -SourceSha $env:VSN_SOURCE_SHA `
            -EvidenceDir 'dist-pkg03/03.18'

      - name: Upload failed 03.18 rollback diagnostics
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: pkg03-0318-install-rollback-failure
          path: dist-pkg03/03.18/**
          if-no-files-found: warn
          compression-level: 0

      - name: Bind workflow metadata into exact evidence
        shell: pwsh
        env:
          VSN_WORKFLOW_RUN_ID: ${{ github.run_id }}
          VSN_WORKFLOW_RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          @'
          import hashlib,json,os,subprocess
          from pathlib import Path
          out=Path('dist-pkg03/03.18'); path=out/'evidence.json'
          e=json.loads(path.read_text(encoding='utf-8-sig'))
          source=os.environ['VSN_SOURCE_SHA']; actual=subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip()
          if source != actual or e.get('source_commit') != source: raise SystemExit('03.18 exact-source binding mismatch')
          e['workflow_run_id']=int(os.environ['VSN_WORKFLOW_RUN_ID'])
          e['workflow_run_attempt']=int(os.environ['VSN_WORKFLOW_RUN_ATTEMPT'])
          e['runner']={'os':os.environ.get('RUNNER_OS'),'arch':os.environ.get('RUNNER_ARCH'),'image_os':os.environ.get('ImageOS'),'image_version':os.environ.get('ImageVersion')}
          e['toolchain']={
            'node':subprocess.check_output(['node','--version'],text=True).strip(),
            'rustc':subprocess.check_output(['rustc','--version'],text=True).strip(),
            'cargo':subprocess.check_output(['cargo','--version'],text=True).strip(),
            'tauri_cli':(out/'tauri-version.txt').read_text(encoding='utf-8-sig').strip(),
          }
          path.write_text(json.dumps(e,indent=2,sort_keys=True)+'\n',encoding='utf-8')
          digest=hashlib.sha256(path.read_bytes()).hexdigest(); (out/'evidence.json.sha256').write_text(f'{digest}  evidence.json\n',encoding='utf-8')
          '@ | python -

      - name: Verify zero tracked drift
        shell: pwsh
        run: |
          $tracked=@(git status --porcelain=v1 --untracked-files=no)
          if ($tracked.Count -ne 0) { $tracked | Write-Host; throw 'Tracked drift detected after 03.18 lifecycle.' }

      - name: Verify exact 03.18 evidence
        shell: pwsh
        run: |
          @'
          import hashlib,json,os
          from pathlib import Path
          out=Path('dist-pkg03/03.18'); e=json.loads((out/'evidence.json').read_text(encoding='utf-8'))
          if e.get('source_commit') != os.environ['VSN_SOURCE_SHA']: raise SystemExit('source mismatch')
          for key in ('forced_failure_after_positive_install_invocation','partial_owned_state_forbidden','interrupted_install_positive_start_required','exact_candidate_rerun_recovery_required','duplicate_identity_forbidden','protected_state_nonmutation_required','tracked_repository_drift_zero'):
              if e.get(key) is not True: raise SystemExit(f'required evidence flag false: {key}')
          for key in ('running_process_coordination_claimed','reboot_semantics_claimed','silent_or_passive_deployment_claimed','signing_claimed','updater_mutation_claimed','product_or_installer_mutation'):
              if e.get(key) is not False: raise SystemExit(f'forbidden claim widened: {key}')
          by={row['lifecycle']:row for row in e['lifecycles']}
          if set(by) != {'nsis-current-user','nsis-per-machine','wix-per-machine'}: raise SystemExit('lifecycle set mismatch')
          for name,row in by.items():
              f=row['failure']; i=row['interruption']; r=row['recovered_identity']; c=row['cleanup']
              if f.get('transaction_started') is not True or f.get('expected_nonzero') is not True or f.get('exit_code') == 0: raise SystemExit(f'{name} forced failure proof invalid')
              if i.get('positive_transaction_start') is not True or i.get('interruption_injected') is not True: raise SystemExit(f'{name} interruption proof invalid')
              if r.get('single_identity') is not True or len(r.get('owned',[])) != 3: raise SystemExit(f'{name} recovered identity invalid')
              if c.get('exit_code') != 0: raise SystemExit(f'{name} final cleanup failed')
              if row.get('protected_state_restored') is not True: raise SystemExit(f'{name} protected state not restored')
          wix=by['wix-per-machine']
          for key in ('failure_log','recovery_log','cleanup_log'):
              log=wix.get(key)
              if not log: raise SystemExit(f'MSI {key} missing')
              p=Path(log['path'])
              if not p.is_file() or p.stat().st_size != log['size_bytes'] or p.stat().st_size <= 0: raise SystemExit(f'MSI {key} size mismatch')
              if hashlib.sha256(p.read_bytes()).hexdigest() != log['sha256']: raise SystemExit(f'MSI {key} hash mismatch')
          digest=hashlib.sha256((out/'evidence.json').read_bytes()).hexdigest(); declared=(out/'evidence.json.sha256').read_text(encoding='utf-8').split()[0]
          if digest != declared: raise SystemExit('evidence digest mismatch')
          print(json.dumps({'valid':True,'task':'03.18','workflow_run_id':e['workflow_run_id'],'evidence_sha256':digest},indent=2))
          '@ | python -

      - name: Upload exact 03.18 rollback evidence
        uses: actions/upload-artifact@v7
        with:
          name: pkg03-0318-install-rollback
          path: dist-pkg03/03.18/**
          if-no-files-found: error
          compression-level: 0
