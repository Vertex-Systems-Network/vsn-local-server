name: PKG-02 Ledger Sequence Freeze

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  append-ledger:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'pkg02/freeze-acceptance-sequence'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - name: Append canonical PKG-02 sequence-freeze record
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path('VSN_AI_PROJECT_STATE.md')
          text = path.read_text()
          marker = '## 35. 2026-08-21 - PKG-02 27-task beta sequence frozen'
          if marker not in text:
              section = '''\n\n## 35. 2026-08-21 - PKG-02 27-task beta sequence frozen\n\nPKG-01 is merged and COMPLETE at 22/22. The previously fixed-but-unenumerated PKG-02 denominator is now explicitly defined without claiming implementation progress.\n\n- Base main: `ae66a22d13b83676cbc02a272c9953daaedcf1a0` after PR #23.\n- PR #24 branch: `pkg02/freeze-acceptance-sequence`.\n- `docs/MASTER-EXECUTION-PLAN.md` now freezes exactly 27 sequential tasks `02.01` through `02.27`.\n- `certification/pkg02-usable-local-beta-v1.json` is the machine-readable package ledger: `done=0`, `required=27`, `percent=0.0`, `active_task=02.01`; all later tasks are blocked by the sequential chain.\n- PKG-02 local-beta scope is grounded in current product surfaces: Agent/authenticated IPC, CLI/Desktop, workspaces/projects, runtimes/services/diagnostics, Docker/Podman local baseline, files/terminal, preview/DNS/domain and Database Studio.\n- Windows installer/signing, updater/recovery, Linux/macOS release packaging, security certification, production resilience and pentest/stable-1.0 remain PKG-03 through PKG-08 and are excluded from PKG-02 completion.\n- Sequence validation run `32479717604`, job `96763270857` passed exact IDs, dependencies, status invariants and documentation consistency.\n\nCurrent genuine state:\n\n```text\nPKG-01  22/22 = 100.00% COMPLETE\nPKG-02   0/27 =   0.00% IN PROGRESS\nACTIVE:  02.01 Local Agent startup, machine identity, health/status and clean shutdown\n```\n\nExact continuation rule: do not count 02.01 until a real clean-run Agent lifecycle acceptance passes; do not count later tasks before their declared prerequisite is DONE.\n'''
              path.write_text(text.rstrip() + section)
          PY
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add VSN_AI_PROJECT_STATE.md
          git commit -m 'PKG-02: record frozen 27-task beta sequence'
          git push origin HEAD:${GITHUB_HEAD_REF}
