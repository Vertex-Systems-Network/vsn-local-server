name: PKG-02 02.04 Desktop Agent Bridge

on:
  push:
    branches:
      - pkg02/**
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  desktop-agent-bridge:
    name: 02.04 Desktop authenticated Agent bridge and Overview states
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Desktop and Linux native dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            keyutils \
            pkg-config \
            libglib2.0-dev \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libssl-dev \
            patchelf

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.97.1'
          components: 'rustfmt, clippy'

      - name: Verify explicit Desktop connectivity source invariants
        shell: bash
        run: |
          set -euo pipefail
          grep -q "from './agentOverviewState'" apps/desktop/src/App.tsx
          grep -q 'Promise.allSettled' apps/desktop/src/App.tsx
          grep -q 'offlineOverviewState(e)' apps/desktop/src/App.tsx
          grep -q 'connectionLabel(connection)' apps/desktop/src/App.tsx
          grep -q 'optionalErrors.join' apps/desktop/src/App.tsx
          grep -q 'PKG-02 02.04 connectivity states' apps/desktop/src/styles.css
          if grep -q 'const \[machine,setMachine\]' apps/desktop/src/App.tsx; then
            echo 'Legacy machine-only state model must not reappear.' >&2
            exit 1
          fi
          if grep -q 'setError(' apps/desktop/src/App.tsx; then
            echo 'Legacy monolithic error setter must not reappear.' >&2
            exit 1
          fi
          git diff --check

      - name: Build Desktop production frontend from locked npm graph
        shell: bash
        working-directory: apps/desktop
        run: |
          set -euo pipefail
          npm ci
          npm run build

      - name: Run deterministic Agent Overview state acceptance
        shell: bash
        working-directory: apps/desktop
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/vsn-overview-state"
          rm -rf "$out"
          ./node_modules/.bin/tsc \
            src/agentOverviewState.ts \
            tests/agentOverviewState.acceptance.ts \
            --target ES2022 \
            --module ES2022 \
            --moduleResolution Bundler \
            --skipLibCheck \
            --outDir "$out"
          printf '{"type":"module"}\n' > "$out/package.json"
          node "$out/tests/agentOverviewState.acceptance.js"

      - name: Build current Agent and CLI plus Desktop bridge tests
        shell: bash
        run: |
          set -euo pipefail
          cargo build --locked --release --package vsn-agent --package vsn
          cargo test --locked --package vsn-desktop --no-run
          mkdir -p dist-pkg02/02.04
          sha256sum target/release/vsn-agent > dist-pkg02/02.04/vsn-agent.sha256
          sha256sum target/release/vsn > dist-pkg02/02.04/vsn.sha256
          (cd apps/desktop && find dist -type f -print0 | sort -z | xargs -0 sha256sum) > dist-pkg02/02.04/desktop-dist.sha256
          sha256sum apps/desktop/package-lock.json > dist-pkg02/02.04/desktop-package-lock.sha256

      - name: Run real authenticated Tauri-to-Agent bridge acceptance
        shell: keyctl session vsn-pkg02-0204 bash --noprofile --norc -eo pipefail {0}
        run: |
          set -euo pipefail
          root=dist-pkg02/02.04
          phase="$root/bridge-phase.txt"
          keyctl rdescribe @s > "$root/session-keyring.txt"

          echo offline-bridge > "$phase"
          cargo test --locked --package vsn-desktop desktop_bridge_reports_agent_unavailable -- --ignored \
            > "$root/offline-bridge-test.log" 2>&1

          echo agent-start-readiness > "$phase"
          target/release/vsn-agent > "$root/agent.log" 2>&1 &
          agent_pid=$!
          echo "$agent_pid" > "$root/agent.pid"
          cleanup() {
            if kill -0 "$agent_pid" 2>/dev/null; then
              kill -INT "$agent_pid" || true
              for _ in $(seq 1 50); do
                if ! kill -0 "$agent_pid" 2>/dev/null; then break; fi
                sleep 0.1
              done
              if kill -0 "$agent_pid" 2>/dev/null; then kill -KILL "$agent_pid" || true; fi
            fi
          }
          trap cleanup EXIT

          ready=false
          for _ in $(seq 1 80); do
            if target/release/vsn ping > "$root/readiness-ping.json" 2> "$root/readiness-ping.err"; then
              ready=true
              break
            fi
            if ! kill -0 "$agent_pid" 2>/dev/null; then
              cat "$root/agent.log" >&2 || true
              exit 1
            fi
            sleep 0.25
          done
          test "$ready" = true
          kill -0 "$agent_pid"

          echo live-tauri-bridge > "$phase"
          cargo test --locked --package vsn-desktop desktop_bridge_uses_authenticated_agent -- --ignored \
            > "$root/online-bridge-test.log" 2>&1

          echo response-validation > "$phase"
          target/release/vsn status > "$root/status.json"
          target/release/vsn machine > "$root/machine.json"
          python3 - <<'PY'
          import json
          from pathlib import Path
          root = Path('dist-pkg02/02.04')
          status = json.loads((root / 'status.json').read_text())
          machine = json.loads((root / 'machine.json').read_text())
          assert status['health']['healthy'] is True
          assert status['security']['ipc_secret_ready'] is True
          assert isinstance(machine.get('device_id'), str) and len(machine['device_id']) >= 8
          PY

          echo clean-shutdown > "$phase"
          kill -INT "$agent_pid"
          set +e
          wait "$agent_pid"
          exit_code=$?
          set -e
          trap - EXIT
          echo "$exit_code" > "$root/agent-exit-code.txt"
          test "$exit_code" -eq 0
          test ! -e /proc/$agent_pid
          echo complete > "$phase"

      - name: Diagnose 02.04 failure - offline bridge
        if: ${{ failure() }}
        shell: bash
        run: |
          set -euo pipefail
          phase="$(cat dist-pkg02/02.04/bridge-phase.txt 2>/dev/null || echo pre-bridge)"
          test "$phase" != offline-bridge

      - name: Diagnose 02.04 failure - Agent start or readiness
        if: ${{ failure() }}
        shell: bash
        run: |
          set -euo pipefail
          phase="$(cat dist-pkg02/02.04/bridge-phase.txt 2>/dev/null || echo pre-bridge)"
          test "$phase" != agent-start-readiness

      - name: Diagnose 02.04 failure - live Tauri bridge
        if: ${{ failure() }}
        shell: bash
        run: |
          set -euo pipefail
          phase="$(cat dist-pkg02/02.04/bridge-phase.txt 2>/dev/null || echo pre-bridge)"
          test "$phase" != live-tauri-bridge

      - name: Diagnose 02.04 failure - response validation
        if: ${{ failure() }}
        shell: bash
        run: |
          set -euo pipefail
          phase="$(cat dist-pkg02/02.04/bridge-phase.txt 2>/dev/null || echo pre-bridge)"
          test "$phase" != response-validation

      - name: Diagnose 02.04 failure - clean shutdown
        if: ${{ failure() }}
        shell: bash
        run: |
          set -euo pipefail
          phase="$(cat dist-pkg02/02.04/bridge-phase.txt 2>/dev/null || echo pre-bridge)"
          test "$phase" != clean-shutdown

      - name: Preserve failed 02.04 diagnostics
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: pkg02-0204-desktop-agent-bridge-failure
          path: dist-pkg02/02.04
          if-no-files-found: warn

      - name: Package 02.04 evidence
        shell: bash
        run: |
          set -euo pipefail
          test "$(cat dist-pkg02/02.04/bridge-phase.txt)" = complete
          python3 - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path

          root = Path('dist-pkg02/02.04')
          candidate = json.loads(Path('docs/release-candidate-current.json').read_text())

          def digest(path):
              return hashlib.sha256(Path(path).read_bytes()).hexdigest()

          evidence = {
              'schema_version': 1,
              'package_id': 'PKG-02',
              'task_id': '02.04',
              'artifact': 'desktop-authenticated-agent-bridge-overview-states',
              'product_version': candidate['product_version'],
              'candidate_id': candidate['candidate_id'],
              'source_commit': os.environ['GITHUB_SHA'],
              'rust_version': '1.97.1',
              'desktop_locked_build': True,
              'overview_connecting_online_offline_state_model': True,
              'offline_transition_clears_stale_data': True,
              'optional_failure_keeps_core_agent_online': True,
              'desktop_bridge_offline_failure_verified': True,
              'desktop_bridge_authenticated_status_machine_verified': True,
              'clean_shutdown_exit_code': int((root / 'agent-exit-code.txt').read_text()),
              'agent_sha256_file': digest(root / 'vsn-agent.sha256'),
              'cli_sha256_file': digest(root / 'vsn.sha256'),
              'desktop_dist_manifest_sha256': digest(root / 'desktop-dist.sha256'),
              'desktop_lock_sha256_file': digest(root / 'desktop-package-lock.sha256'),
          }
          assert evidence['clean_shutdown_exit_code'] == 0
          (root / 'evidence.json').write_text(json.dumps(evidence, indent=2, sort_keys=True) + '\n')
          PY
          sha256sum dist-pkg02/02.04/evidence.json > dist-pkg02/02.04/evidence.json.sha256
          git diff --check

      - uses: actions/upload-artifact@v4
        with:
          name: pkg02-0204-desktop-agent-bridge
          path: dist-pkg02/02.04
          if-no-files-found: error
