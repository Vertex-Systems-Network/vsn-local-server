name: Production Signing Admin Readiness Audit

on:
  push:
    branches:
      - audit/production-signing-admin-readiness
  workflow_dispatch:

permissions:
  actions: read
  contents: read

jobs:
  audit:
    name: Audit production-signing structural readiness
    runs-on: ubuntu-24.04
    steps:
      - name: Inspect Environment protection without secret access
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          api="https://api.github.com/repos/${REPO}"
          headers=(
            -H "Accept: application/vnd.github+json"
            -H "X-GitHub-Api-Version: 2026-03-10"
            -H "Authorization: Bearer ${GH_TOKEN}"
          )

          get_json() {
            local url="$1" out="$2" status_file="$3"
            local code
            code="$(curl -sS -o "$out" -w '%{http_code}' "${headers[@]}" "$url")"
            printf '%s' "$code" > "$status_file"
          }

          get_json "$api/environments/production-signing" env.json env.status
          env_code="$(cat env.status)"
          if [[ "$env_code" != "200" ]]; then
            jq -n \
              --arg source_sha "$GITHUB_SHA" \
              --arg actor "$GITHUB_ACTOR" \
              --arg env_http_status "$env_code" \
              '{schema_version:3,audit_scope:"structural-only",source_sha:$source_sha,actor:$actor,environment_exists:false,environment_http_status:$env_http_status,structural_ready:false}' > readiness.json
            cat readiness.json
            exit 1
          fi

          custom="$(jq -r '.deployment_branch_policy.custom_branch_policies // false' env.json)"
          protected="$(jq -r '.deployment_branch_policy.protected_branches // false' env.json)"
          reviewer_count="$(jq '[.protection_rules[]? | select(.type == "required_reviewers") | .reviewers[]?] | length' env.json)"
          reviewer_names="$(jq -c '[.protection_rules[]? | select(.type == "required_reviewers") | .reviewers[]? | .reviewer.login // .reviewer.name // "unknown"] | sort | unique' env.json)"
          prevent_self_review="$(jq -r '[.protection_rules[]? | select(.type == "required_reviewers") | .prevent_self_review][0] // false' env.json)"
          independent_reviewer_present="$(jq -n --argjson names "$reviewer_names" --arg actor "$GITHUB_ACTOR" '$names | any(. != $actor and . != "unknown")')"

          branch_code="not-requested"
          branch_names='[]'
          if [[ "$custom" == "true" ]]; then
            get_json "$api/environments/production-signing/deployment-branch-policies?per_page=100" branches.json branches.status
            branch_code="$(cat branches.status)"
            if [[ "$branch_code" == "200" ]]; then
              branch_names="$(jq -c '[.branch_policies[]? | {name,type}]' branches.json)"
            fi
          fi

          main_only=false
          if [[ "$branch_code" == "200" ]]; then
            main_only="$(jq -n --argjson b "$branch_names" '($b|length)==1 and $b[0].name=="main" and $b[0].type=="branch"')"
          fi

          structural_ready="$(jq -n \
            --argjson reviewer_count "$reviewer_count" \
            --argjson independent "$independent_reviewer_present" \
            --argjson prevent_self "$prevent_self_review" \
            --argjson main_only "$main_only" \
            '($reviewer_count >= 1) and $independent and $prevent_self and $main_only')"

          jq -n \
            --arg source_sha "$GITHUB_SHA" \
            --arg actor "$GITHUB_ACTOR" \
            --arg env_http_status "$env_code" \
            --argjson custom_branch_policies "$custom" \
            --argjson protected_branches "$protected" \
            --argjson reviewer_count "$reviewer_count" \
            --argjson reviewer_names "$reviewer_names" \
            --argjson independent_reviewer_present "$independent_reviewer_present" \
            --argjson prevent_self_review "$prevent_self_review" \
            --arg branch_policy_http_status "$branch_code" \
            --argjson branch_policies "$branch_names" \
            --argjson main_only "$main_only" \
            --argjson structural_ready "$structural_ready" \
            '{schema_version:3,audit_scope:"structural-only",selected_provider:"SignPath Foundation",source_sha:$source_sha,actor:$actor,environment_exists:true,environment_http_status:$env_http_status,custom_branch_policies:$custom_branch_policies,protected_branches:$protected_branches,required_reviewer_count:$reviewer_count,reviewer_names:$reviewer_names,independent_reviewer_present:$independent_reviewer_present,prevent_self_review:$prevent_self_review,branch_policy_http_status:$branch_policy_http_status,branch_policies:$branch_policies,main_only_branch_policy:$main_only,structural_ready:$structural_ready,provider_configuration_status:"deferred-until-foundation-approval",provider_secret_values_inspected:false,legacy_pfx_required:false}' > readiness.json

          echo '--- production-signing structural readiness (no secret values) ---'
          cat readiness.json
          echo '--- end readiness ---'

      - name: Require structural readiness only
        shell: bash
        run: |
          set -euo pipefail
          [[ "$(jq -r '.environment_exists' readiness.json)" == "true" ]] || { echo 'production-signing Environment is absent or unreadable'; exit 1; }
          [[ "$(jq -r '.required_reviewer_count >= 1' readiness.json)" == "true" ]] || { echo 'required reviewer missing'; exit 1; }
          [[ "$(jq -r '.independent_reviewer_present' readiness.json)" == "true" ]] || { echo 'independent required reviewer is not proven'; exit 1; }
          [[ "$(jq -r '.prevent_self_review' readiness.json)" == "true" ]] || { echo 'Prevent self-review is not enabled'; exit 1; }
          [[ "$(jq -r '.main_only_branch_policy' readiness.json)" == "true" ]] || { echo 'main-only custom deployment branch policy is not proven'; exit 1; }
          [[ "$(jq -r '.structural_ready' readiness.json)" == "true" ]] || { echo 'structural readiness is false'; exit 1; }

          echo 'STRUCTURAL_READY=PASS'
          echo 'Provider credential/configuration readiness remains a separate post-SignPath-approval trusted-main gate.'
