name: PKG-01 Clippy Hotfix V2

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  hotfix:
    if: github.event.pull_request.head.ref == 'pkg01/clippy-after-pr7'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: pkg01/clippy-after-pr7
          fetch-depth: 0
      - name: Apply verified compiler-suggested fixes
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re, struct, zlib
          p=Path('cloud/control-plane/src/main.rs')
          s=p.read_text()
          def ex(old,new,n=1):
              global s
              c=s.count(old)
              if c!=n: raise SystemExit(f'expected {n} of {old!r}, found {c}')
              s=s.replace(old,new)

          ex('AuthorizationCode, ClientId, ClientSecret, IssuerUrl, Nonce, PkceCodeVerifier, RedirectUrl,','AuthorizationCode, ClientId, ClientSecret, IssuerUrl, Nonce as OidcNonce, PkceCodeVerifier, RedirectUrl,')
          ex('.claims(&verifier, &Nonce::new(pending.transaction.nonce.clone()))','.claims(&verifier, &OidcNonce::new(pending.transaction.nonce.clone()))')
          ex('state.state_postgres.as_ref().and_then(','state.state_postgres.as_ref().as_ref().and_then(')

          pat=re.compile(r'(\.state_postgres\s*\.as_ref\(\))(\s*\.ok_or_else\()')
          s,c=pat.subn(r'\1.as_ref()\2',s)
          if c!=7: raise SystemExit(f'expected 7 Postgres Option borrow sites, found {c}')

          ex('vsn_remote::AgentGatewayResponseV1::Poll(v)','vsn_remote::AgentGatewayResponseV1::Poll(Box::new(v))')

          # Three recursive stream protocol payloads were changed to Box<RemoteCommandV1>.
          pat=re.compile(r'(?m)^(\s*)authorization,\n(\s*)request: (request\.clone\(\)|reopen_request|request),$')
          def box_auth(m):
              return f'{m.group(1)}authorization: Box::new(authorization),\n{m.group(2)}request: {m.group(3)},'
          s,c=pat.subn(box_auth,s)
          if c!=3: raise SystemExit(f'expected 3 boxed authorization sites, found {c}')

          ex('#[derive(Debug, Clone, Deserialize)]\nstruct ScimBulkOperation {','#[derive(Debug, Clone, Serialize, Deserialize)]\nstruct ScimBulkOperation {')
          ex('    let mut builder = WebauthnBuilder::new(&rp_id, &origin)','    let builder = WebauthnBuilder::new(&rp_id, &origin)')
          p.write_text(s)

          icon=Path('apps/desktop/src-tauri/icons/icon.png')
          if not icon.exists():
              icon.parent.mkdir(parents=True,exist_ok=True)
              w=h=32
              raw=b''.join(b'\x00'+bytes([17,17,17,255])*w for _ in range(h))
              def chunk(kind,data):
                  return struct.pack('>I',len(data))+kind+data+struct.pack('>I',zlib.crc32(kind+data)&0xffffffff)
              icon.write_bytes(b'\x89PNG\r\n\x1a\n'+chunk(b'IHDR',struct.pack('>IIBBBBB',w,h,8,6,0,0,0))+chunk(b'IDAT',zlib.compress(raw,9))+chunk(b'IEND',b''))
          PY
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.97.1'
          components: 'rustfmt, clippy'
      - name: Format source
        run: |
          cargo fmt --all
          git diff --check
      - name: Install Linux native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config libglib2.0-dev libgtk-3-dev libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev librsvg2-dev libssl-dev patchelf
      - name: Full locked workspace Clippy verdict
        id: verify
        shell: bash
        run: |
          set +e
          cargo clippy --workspace --all-targets --locked -- -D warnings 2>&1 | tee /tmp/clippy.log
          status=${PIPESTATUS[0]}
          set -e
          python3 - <<'PY'
          import re
          from pathlib import Path
          t=re.sub(r'\x1b\[[0-9;]*m','',Path('/tmp/clippy.log').read_text(errors='replace'))
          ls=t.splitlines(); starts=[i for i,x in enumerate(ls) if x.startswith('error')]; out=[]
          for n,i in enumerate(starts):
              j=starts[n+1] if n+1<len(starts) else len(ls)
              out.append('\n'.join(ls[i:j]).rstrip())
          Path('clippy-hotfix-v2-errors.txt').write_text(('\n\n'.join(out) if out else 'CLIPPY_GREEN')+'\n')
          PY
          echo "status=$status" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: pkg01-clippy-hotfix-v2-verdict
          path: clippy-hotfix-v2-errors.txt
          if-no-files-found: error
      - name: Commit fixes and remove temporary workflow
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/pkg01-clippy-hotfix-v2.yml
          git add -A
          git commit -m 'PKG-01: clear control-plane compile blocker batch'
          git push origin HEAD:pkg01/clippy-after-pr7
      - name: Preserve Clippy verdict
        if: steps.verify.outputs.status != '0'
        run: exit 1
