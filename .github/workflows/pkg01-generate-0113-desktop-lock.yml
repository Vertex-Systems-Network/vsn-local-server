name: PKG-01 Generate 01.13 Desktop Lock

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  generate-lock:
    if: github.event.pull_request.head.ref == 'pkg01/0113-desktop-lockfile'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: pkg01/0113-desktop-lockfile
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22.12.0'

      - name: Generate and commit certified Desktop lockfile
        working-directory: apps/desktop
        shell: bash
        run: |
          set -euo pipefail
          if [ -f package-lock.json ]; then
            echo 'Desktop package-lock.json already exists; verify certified hash.'
            echo 'b2f41ab8c7a116cb9c78d41fd8036e7e1b1307bc3b78cd9a33ef37d5911c0aa6  package-lock.json' | sha256sum -c -
            exit 0
          fi
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund
          test -s package-lock.json
          echo 'b2f41ab8c7a116cb9c78d41fd8036e7e1b1307bc3b78cd9a33ef37d5911c0aa6  package-lock.json' | sha256sum -c -
          git diff --check -- package-lock.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package-lock.json
          git commit -m 'PKG-01: commit certified Desktop package-lock.json'
          git push origin HEAD:pkg01/0113-desktop-lockfile
