name: PKG-01 01.07 Apply Database CLI Extension Fixes

on:
  push:
    branches:
      - pkg01/clippy-after-pr6
    paths:
      - .github/workflows/pkg01-0107-apply-dbcli-extension.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact branch head
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify source blob identities
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object crates/vsn-database-cli/src/lib.rs)" = "868450760dbcdb734721c551f238ea91d9db00b0"
          test "$(git hash-object crates/vsn-extension/src/lib.rs)" = "3a9911a5396ad836bbd108a3def1a1f1a76477be"

      - name: Apply exact asserted fixes
        shell: python
        run: |
          from pathlib import Path

          def replace_exact(path: Path, old: str, new: str, expected: int = 1) -> None:
              text = path.read_text(encoding="utf-8")
              count = text.count(old)
              if count != expected:
                  raise SystemExit(f"{path}: expected {expected} occurrence(s), found {count}: {old!r}")
              path.write_text(text.replace(old, new, expected), encoding="utf-8")

          db = Path("crates/vsn-database-cli/src/lib.rs")
          replace_exact(
              db,
              '.map(|r| json!({"schema":r.get(0),"name":r.get(1),"type":r.get(2)}))',
              '.map(|r| json!({"schema":r.first(),"name":r.get(1),"type":r.get(2)}))',
              2,
          )
          replace_exact(db, ".unwrap_or_else(Vec::new);", ".unwrap_or_default();")
          replace_exact(db, "            Ok(mut jobs) => jobs", "            Ok(jobs) => jobs")
          replace_exact(
              db,
              "    out.sort_by(|a, b| b.created_at_unix_ms.cmp(&a.created_at_unix_ms));",
              "    out.sort_by_key(|b| std::cmp::Reverse(b.created_at_unix_ms));",
          )

          ext = Path("crates/vsn-extension/src/lib.rs")
          replace_exact(
              ext,
              "    fs, io,\n",
              "    fs,\n    io::{self, Read},\n",
          )

      - name: Verify patch shape
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          git diff -- crates/vsn-database-cli/src/lib.rs crates/vsn-extension/src/lib.rs
          test "$(git diff --name-only | sort | tr '\n' ' ')" = "crates/vsn-database-cli/src/lib.rs crates/vsn-extension/src/lib.rs "

      - name: Commit exact fixes to active branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "vsn-ci"
          git config user.email "vsn-ci@users.noreply.github.com"
          git add -- crates/vsn-database-cli/src/lib.rs crates/vsn-extension/src/lib.rs
          git commit -m "fix(pkg01): clear database-cli extension Clippy blockers"
          git push origin HEAD:pkg01/clippy-after-pr6
