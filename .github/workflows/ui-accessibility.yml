name: UI Standards and Accessibility

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - 'apps/desktop/**'
      - 'scripts/ui-accessibility/**'
      - '.github/workflows/ui-accessibility.yml'
  push:
    branches: [main]
    paths:
      - 'apps/desktop/**'
      - 'scripts/ui-accessibility/**'
      - '.github/workflows/ui-accessibility.yml'
  workflow_dispatch:
    inputs:
      wave_url:
        description: 'Public staging/page URL for official WAVE API analysis'
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: ui-accessibility-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  semantic-fix:
    if: github.event_name == 'pull_request'
    name: Apply exact semantic fixes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
      - name: Patch exact source strings and commit
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('apps/desktop/src/App.tsx')
          text = path.read_text(encoding='utf-8')
          replacements = {
              '<h3>{DESKTOP_CAPABILITIES.length} operator capabilities</h3>': '<h2>{DESKTOP_CAPABILITIES.length} operator capabilities</h2>',
              '<textarea className="editor" value={content} onChange={e=>setContent(e.target.value)} rows={18}/>': '<textarea className="editor" aria-label="File content editor" value={content} onChange={e=>setContent(e.target.value)} rows={18}/>',
          }
          for old, new in replacements.items():
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'expected exactly one occurrence of {old!r}, found {count}')
              text = text.replace(old, new)
          path.write_text(text, encoding='utf-8')
          PY
          git diff --check
          git diff -- apps/desktop/src/App.tsx
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add apps/desktop/src/App.tsx
          git commit -m 'fix(ui): correct heading hierarchy and label file editor [skip ci]'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
          echo 'Semantic source patch pushed; stop this temporary run.'
          exit 1
