name: UI Standards and Accessibility

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - 'apps/desktop/**'
      - 'scripts/ui-accessibility/**'
      - '.github/workflows/ui-accessibility.yml'
  push:
    branches: [main]
    paths:
      - 'apps/desktop/**'
      - 'scripts/ui-accessibility/**'
      - '.github/workflows/ui-accessibility.yml'
  workflow_dispatch:
    inputs:
      wave_url:
        description: 'Public staging/page URL for official WAVE API analysis'
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: ui-accessibility-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  local-standards:
    name: W3C markup + WCAG 2.2 AA
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Verify exact source and GitHub-hosted runner
        shell: bash
        run: |
          set -euo pipefail
          expected='${{ github.event.pull_request.head.sha || github.sha }}'
          actual="$(git rev-parse HEAD)"
          test "$actual" = "$expected" || { echo "source mismatch expected=$expected actual=$actual" >&2; exit 1; }
          test "${RUNNER_ENVIRONMENT:-}" = 'github-hosted' || { echo 'GitHub-hosted runner required' >&2; exit 1; }
          printf 'source=%s\nrunner=%s\nenvironment=%s\nos=%s\narch=%s\n' "$actual" "$RUNNER_NAME" "$RUNNER_ENVIRONMENT" "$RUNNER_OS" "$RUNNER_ARCH"

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json

      - name: Install desktop dependencies
        working-directory: apps/desktop
        run: npm ci

      - name: Build desktop web UI
        working-directory: apps/desktop
        run: npm run build

      - name: Prepare accessibility artifacts
        run: mkdir -p dist-accessibility

      - name: W3C Nu HTML validation for built shell
        shell: bash
        run: |
          set -o pipefail
          npx --yes --package vnu-jar@26.8.21 vnu --errors-only apps/desktop/dist/index.html 2>&1 | tee dist-accessibility/w3c-vnu-shell.txt

      - name: Start built UI preview
        shell: bash
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 --directory apps/desktop/dist > dist-accessibility/preview.log 2>&1 &
          echo $! > dist-accessibility/preview.pid
          for i in {1..30}; do
            if curl --fail --silent http://127.0.0.1:4173/ >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat dist-accessibility/preview.log
          exit 1

      - name: Install isolated accessibility browser tools
        run: |
          npm install --prefix /tmp/vsn-ui-a11y-tools --no-save --package-lock=false \
            puppeteer@25.8.0 axe-core@4.13.0

      - name: Automated WCAG 2.2 AA audit across every Desktop section
        env:
          NODE_PATH: /tmp/vsn-ui-a11y-tools/node_modules
          UI_TEST_URL: http://127.0.0.1:4173/
          UI_A11Y_OUT: dist-accessibility
        run: node scripts/ui-accessibility/axe-sections.cjs

      - name: W3C Nu validation for rendered Desktop sections
        if: always()
        shell: bash
        run: |
          set -o pipefail
          if ! compgen -G 'dist-accessibility/rendered/*.html' > /dev/null; then
            echo 'Rendered accessibility snapshots were not produced.' >&2
            exit 1
          fi
          npx --yes --package vnu-jar@26.8.21 vnu --errors-only dist-accessibility/rendered/*.html 2>&1 | tee dist-accessibility/w3c-vnu-rendered.txt

      - name: Upload local accessibility reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ui-accessibility-local
          path: dist-accessibility
          if-no-files-found: warn

  wave-api:
    name: Official WAVE API
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && vars.WAVE_TEST_URL != '')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      WAVE_API_KEY: ${{ secrets.WAVE_API_KEY }}
      WAVE_TEST_URL: ${{ inputs.wave_url || vars.WAVE_TEST_URL }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Run official WAVE analysis
        run: node scripts/ui-accessibility/wave-api-check.mjs

      - name: Upload WAVE report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ui-accessibility-wave
          path: dist-accessibility
          if-no-files-found: warn
