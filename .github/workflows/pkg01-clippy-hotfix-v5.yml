name: PKG-01 Clippy Hotfix V5

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  hotfix:
    if: github.event.pull_request.head.ref == 'pkg01/clippy-after-pr7'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: pkg01/clippy-after-pr7
          fetch-depth: 0
      - name: Apply two exact test-target fixes
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          a=Path('crates/vsn-auth/src/lib.rs'); s=a.read_text()
          old='        let mut p = EnterpriseAuthPolicy::default();\n        p.require_passkey_for_high_risk = true;'
          new='        let p = EnterpriseAuthPolicy {\n            require_passkey_for_high_risk: true,\n            ..Default::default()\n        };'
          if s.count(old)!=1: raise SystemExit(f'auth test pattern count={s.count(old)}')
          a.write_text(s.replace(old,new))
          d=Path('crates/vsn-database-sqlite/src/lib.rs'); s=d.read_text()
          old='        assert_eq!(page.total_rows, Some(1));'; new='        assert_eq!(page.total_rows, 1);'
          if s.count(old)!=1: raise SystemExit(f'sqlite total_rows pattern count={s.count(old)}')
          d.write_text(s.replace(old,new))
          PY
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.97.1'
          components: 'rustfmt, clippy'
      - name: Format
        run: |
          cargo fmt --all
          git diff --check
      - name: Install native dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends pkg-config libglib2.0-dev libgtk-3-dev libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libssl-dev patchelf
      - name: Run exact full Clippy gate
        id: verify
        shell: bash
        run: |
          set +e
          cargo clippy --workspace --all-targets --locked -- -D warnings 2>&1 | tee /tmp/clippy.log
          status=${PIPESTATUS[0]}
          set -e
          python3 - <<'PY'
          import re
          from pathlib import Path
          t=re.sub(r'\x1b\[[0-9;]*m','',Path('/tmp/clippy.log').read_text(errors='replace'))
          ls=t.splitlines(); st=[i for i,x in enumerate(ls) if x.startswith('error')]; out=[]
          for n,i in enumerate(st):
              j=st[n+1] if n+1<len(st) else len(ls); out.append('\n'.join(ls[i:j]).rstrip())
          Path('clippy-v5-errors.txt').write_text(('\n\n'.join(out) if out else 'CLIPPY_GREEN')+'\n')
          PY
          echo "status=$status" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: pkg01-clippy-v5-verdict
          path: clippy-v5-errors.txt
          if-no-files-found: error
      - name: Commit fixes and self-delete
        if: always()
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/pkg01-clippy-hotfix-v5.yml
          git add -A
          git commit -m 'PKG-01: clear final observed test-target Clippy blockers'
          git push origin HEAD:pkg01/clippy-after-pr7
      - name: Preserve Clippy verdict
        if: steps.verify.outputs.status != '0'
        run: exit 1
