name: PKG-04 Rollback State Temp Hardlink Audit

on:
  push:
    branches:
      - audit/pkg04-rollback-state-tmp-hardlink-20260907
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pkg04-rollback-state-tmp-hardlink-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unix-rollback-state-temp-hardlink:
    name: ${{ matrix.os }} · rollback state temp hardlink composition
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        os: [ubuntu-24.04, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15

    steps:
      - name: Checkout exact source without credentials
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 1

      - name: Bind exact checkout identity
        shell: bash
        run: |
          set -euo pipefail
          expected='${{ github.sha }}'
          actual="$(git rev-parse HEAD)"
          test "$actual" = "$expected"
          test -z "$(git status --porcelain=v1 --untracked-files=no)"

      - name: Install exact Rust 1.97.1
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install 1.97.1 --profile minimal
          rustup default 1.97.1
          rustc --version | grep '^rustc 1.97.1 '
          cargo --version | grep '^cargo 1.97.1 '

      - name: Fetch locked dependency graph
        run: cargo fetch --locked

      - name: Materialize temporary Unix rollback hardlink probe
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p crates/vsn-update/tests
          cat > crates/vsn-update/tests/pkg04_rollback_state_tmp_hardlink_probe.rs <<'RS'
          use std::{
              fs,
              os::unix::fs::MetadataExt,
              path::PathBuf,
              time::{SystemTime, UNIX_EPOCH},
          };

          #[test]
          fn rollback_preexisting_state_tmp_hardlink_mutates_outside_file() {
              let unique = format!(
                  "vsn-pkg04-rollback-state-tmp-hardlink-{}-{}",
                  std::process::id(),
                  SystemTime::now()
                      .duration_since(UNIX_EPOCH)
                      .expect("clock")
                      .as_nanos()
              );
              let base: PathBuf = std::env::temp_dir().join(unique);
              let root = base.join("install");
              let target = root.join("bin").join("vsn-agent");
              let control = root.join(".vsn-update");
              let previous = control.join("previous");
              let backup = previous.join("vsn-agent.previous");
              let state_path = control.join("state.json");
              let state_tmp = control.join("state.json.tmp");
              let outside = base.join("outside-rollback-state-sentinel.json");

              fs::create_dir_all(target.parent().expect("target parent"))
                  .expect("create target parent");
              fs::create_dir_all(&previous).expect("create previous directory");
              fs::write(&target, b"NEW-CURRENT").expect("seed current target");
              fs::write(&backup, b"OLD-ROLLBACK").expect("seed rollback backup");
              fs::write(
                  &state_path,
                  br#"{
                    "target_relative": "bin/vsn-agent",
                    "current_release": "2.0.0",
                    "previous_release": "1.0.0"
                  }"#,
              )
              .expect("seed updater state");
              fs::write(&outside, b"OUTSIDE-SENTINEL").expect("seed outside sentinel");
              fs::hard_link(&outside, &state_tmp)
                  .expect("preplant rollback state.json.tmp as controlled hardlink");

              assert_eq!(
                  fs::read(&outside).expect("outside before rollback"),
                  b"OUTSIDE-SENTINEL"
              );

              let result = vsn_update::rollback_verified_file(&root, true)
                  .expect("Unix rollback should reach state projection with current code");

              assert_eq!(fs::read(&target).expect("target after rollback"), b"OLD-ROLLBACK");
              let failed_target = control
                  .join("failed-current")
                  .join("vsn-agent.2.0.0");
              assert_eq!(
                  fs::read(&failed_target).expect("failed current bytes"),
                  b"NEW-CURRENT"
              );
              assert!(!backup.exists(), "rollback backup should have been moved into target");

              let outside_after = fs::read(&outside).expect("outside after rollback");
              assert_ne!(outside_after, b"OUTSIDE-SENTINEL");
              let outside_state: serde_json::Value = serde_json::from_slice(&outside_after)
                  .expect("outside sentinel should now contain projected rollback state JSON");
              assert_eq!(outside_state["target_relative"], "bin/vsn-agent");
              assert_eq!(outside_state["current_release"], "1.0.0");
              assert!(outside_state["previous_release"].is_null());

              let final_state = fs::read(&state_path).expect("final state bytes");
              assert_eq!(final_state, outside_after);
              let outside_meta = fs::metadata(&outside).expect("outside metadata");
              let state_meta = fs::metadata(&state_path).expect("state metadata");
              assert_eq!(outside_meta.dev(), state_meta.dev());
              assert_eq!(outside_meta.ino(), state_meta.ino());
              assert_eq!(result.release, "1.0.0");
              assert!(!result.rollback_available);

              println!(
                  "PKG04_ROLLBACK_STATE_TMP_HARDLINK_CONFIRMED state_path={} outside={} same_dev={} same_ino={} current_release={} target_after=OLD-ROLLBACK failed_current=NEW-CURRENT",
                  state_path.display(),
                  outside.display(),
                  outside_meta.dev() == state_meta.dev(),
                  outside_meta.ino() == state_meta.ino(),
                  outside_state["current_release"]
              );

              fs::remove_dir_all(&base).expect("cleanup isolated probe tree");
          }
          RS

      - name: Execute isolated Unix rollback hardlink composition probe
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p audit-evidence
          cargo test --locked -p vsn-update --test pkg04_rollback_state_tmp_hardlink_probe -- --nocapture 2>&1 | tee audit-evidence/probe.log
          grep -q 'PKG04_ROLLBACK_STATE_TMP_HARDLINK_CONFIRMED' audit-evidence/probe.log
          checkout_sha="$(git rev-parse HEAD)"
          expected_sha='${{ github.sha }}'
          test "$checkout_sha" = "$expected_sha"
          cat > audit-evidence/result.json <<JSON
          {
            "schema": "vsn.pkg04.rollback-state-tmp-hardlink-probe.v1",
            "checkout_sha": "$checkout_sha",
            "expected_source_sha": "$expected_sha",
            "event_sha": "${GITHUB_SHA}",
            "canonical_base_sha": "79812eafdead24de88d8b3fafd19f1bfc0e1435c",
            "runner_os": "${RUNNER_OS}",
            "runner_arch": "${RUNNER_ARCH}",
            "generated_test_only": true,
            "production_state_used": false,
            "hardlink_primitive_confirmed": true,
            "canonical_rollback_reached_state_projection": true,
            "outside_file_mutation_via_state_tmp_confirmed": true,
            "final_state_remains_hardlinked_outside": true,
            "rollback_target_replaced_before_state_projection": true,
            "finding": "rollback_verified_file writes a deterministic preexisting state.json.tmp entry without exclusive creation; a planted hardlink causes rollback state projection to overwrite an outside file and leaves state.json linked to the same outside inode"
          }
          JSON

      - name: Remove temporary probe and prove tracked tree unchanged
        if: always()
        shell: bash
        run: |
          rm -f crates/vsn-update/tests/pkg04_rollback_state_tmp_hardlink_probe.rs
          git diff --exit-code
          test -z "$(git status --porcelain=v1 --untracked-files=no)"

      - name: Upload non-secret audit evidence
        if: success()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: pkg04-rollback-state-tmp-hardlink-${{ matrix.os }}
          path: audit-evidence/**
          if-no-files-found: error
          retention-days: 14

  windows-rollback-state-temp-hardlink-diagnostic:
    name: windows-2025 · rollback state temp hardlink phase diagnostic
    runs-on: windows-2025
    timeout-minutes: 15

    steps:
      - name: Checkout exact source without credentials
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 1

      - name: Bind exact checkout identity
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $expected='${{ github.sha }}'
          $actual=(git rev-parse HEAD).Trim()
          if($actual -ne $expected){ throw "Exact-head mismatch: expected=$expected actual=$actual" }
          if(@(git status --porcelain=v1 --untracked-files=no).Count -ne 0){ throw 'Tracked checkout is dirty.' }

      - name: Install exact Rust 1.97.1
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          rustup toolchain install 1.97.1 --profile minimal
          rustup default 1.97.1
          if((rustc --version).Trim() -notmatch '^rustc 1\.97\.1 '){ throw 'Unexpected rustc version.' }
          if((cargo --version).Trim() -notmatch '^cargo 1\.97\.1 '){ throw 'Unexpected cargo version.' }

      - name: Fetch locked dependency graph
        run: cargo fetch --locked

      - name: Materialize Windows rollback hardlink phase diagnostic
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          New-Item -ItemType Directory -Force -Path crates/vsn-update/tests | Out-Null
          @'
          use std::{
              fs,
              path::PathBuf,
              time::{SystemTime, UNIX_EPOCH},
          };

          #[test]
          fn rollback_hardlink_primitive_is_supported_but_current_windows_stops_before_state_projection() {
              let unique = format!(
                  "vsn-pkg04-rollback-state-tmp-hardlink-{}-{}",
                  std::process::id(),
                  SystemTime::now()
                      .duration_since(UNIX_EPOCH)
                      .expect("clock")
                      .as_nanos()
              );
              let base: PathBuf = std::env::temp_dir().join(unique);
              let root = base.join("install");
              let target = root.join("bin").join("vsn-agent.exe");
              let control = root.join(".vsn-update");
              let previous = control.join("previous");
              let backup = previous.join("vsn-agent.exe.previous");
              let state_path = control.join("state.json");
              let state_tmp = control.join("state.json.tmp");
              let outside = base.join("outside-rollback-state-sentinel.json");

              fs::create_dir_all(target.parent().expect("target parent"))
                  .expect("create target parent");
              fs::create_dir_all(&previous).expect("create previous directory");
              fs::write(&target, b"NEW-CURRENT").expect("seed current target");
              fs::write(&backup, b"OLD-ROLLBACK").expect("seed rollback backup");
              fs::write(
                  &state_path,
                  br#"{
                    "target_relative": "bin/vsn-agent.exe",
                    "current_release": "2.0.0",
                    "previous_release": "1.0.0"
                  }"#,
              )
              .expect("seed updater state");
              fs::write(&outside, b"OUTSIDE-SENTINEL").expect("seed outside sentinel");
              fs::hard_link(&outside, &state_tmp)
                  .expect("preplant rollback state.json.tmp as controlled hardlink");

              fs::write(&state_tmp, b"DIRECT-HARDLINK-PROBE")
                  .expect("prove Windows hardlink write-through primitive");
              assert_eq!(
                  fs::read(&outside).expect("outside after direct write"),
                  b"DIRECT-HARDLINK-PROBE"
              );
              fs::write(&outside, b"OUTSIDE-SENTINEL").expect("reset sentinel");
              assert_eq!(
                  fs::read(&state_tmp).expect("state temp after reset"),
                  b"OUTSIDE-SENTINEL"
              );

              let outcome = vsn_update::rollback_verified_file(&root, true);
              assert!(outcome.is_err(), "current Windows rollback is expected to fail at durability before state projection");

              assert_eq!(
                  fs::read(&outside).expect("outside after canonical rollback"),
                  b"OUTSIDE-SENTINEL",
                  "do not claim canonical Windows state-temp composition before rollback reaches state projection"
              );
              assert_eq!(
                  fs::read(&target).expect("target after canonical rollback"),
                  b"OLD-ROLLBACK",
                  "current Windows rollback mutates target before the durability failure"
              );
              let failed_target = control
                  .join("failed-current")
                  .join("vsn-agent.exe.2.0.0");
              assert_eq!(
                  fs::read(&failed_target).expect("failed current bytes"),
                  b"NEW-CURRENT"
              );
              assert!(!backup.exists(), "backup should already have moved into target before durability failure");
              let persisted: serde_json::Value = serde_json::from_slice(
                  &fs::read(&state_path).expect("persisted state after rollback failure")
              )
              .expect("parse persisted state");
              assert_eq!(persisted["current_release"], "2.0.0");
              assert_eq!(persisted["previous_release"], "1.0.0");

              println!(
                  "PKG04_WINDOWS_ROLLBACK_STATE_TMP_HARDLINK_PHASE primitive_confirmed=true canonical_rollback_reached_state_projection=false target_mutated_before_error=true state_stale_after_error=true outcome={:?} target_after=OLD-ROLLBACK failed_current=NEW-CURRENT outside_after=OUTSIDE-SENTINEL",
                  outcome
              );

              fs::remove_dir_all(&base).expect("cleanup isolated probe tree");
          }
          '@ | Set-Content -LiteralPath crates/vsn-update/tests/pkg04_rollback_state_tmp_hardlink_probe.rs -Encoding utf8

      - name: Execute isolated Windows rollback hardlink phase diagnostic
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          New-Item -ItemType Directory -Force -Path audit-evidence | Out-Null
          $lines = @(& cargo test --locked -p vsn-update --test pkg04_rollback_state_tmp_hardlink_probe -- --nocapture 2>&1)
          $exit = $LASTEXITCODE
          $lines | Tee-Object -FilePath audit-evidence/probe.log
          if($exit -ne 0){ throw "Rollback hardlink diagnostic failed with exit $exit" }
          if(-not (Select-String -LiteralPath audit-evidence/probe.log -SimpleMatch 'PKG04_WINDOWS_ROLLBACK_STATE_TMP_HARDLINK_PHASE')){ throw 'Expected phase marker missing.' }
          $checkout=(git rev-parse HEAD).Trim()
          $expected='${{ github.sha }}'
          if($checkout -ne $expected){ throw 'Exact-head mismatch after test.' }
          @"
          {
            "schema": "vsn.pkg04.rollback-state-tmp-hardlink-windows-diagnostic.v1",
            "checkout_sha": "$checkout",
            "expected_source_sha": "$expected",
            "event_sha": "$env:GITHUB_SHA",
            "canonical_base_sha": "79812eafdead24de88d8b3fafd19f1bfc0e1435c",
            "runner_os": "$env:RUNNER_OS",
            "runner_arch": "$env:RUNNER_ARCH",
            "generated_test_only": true,
            "production_state_used": false,
            "hardlink_primitive_confirmed": true,
            "canonical_rollback_reached_state_projection": false,
            "outside_file_mutation_via_state_tmp_confirmed": false,
            "rollback_target_mutated_before_error": true,
            "persisted_state_stale_after_error": true,
            "blocked_before_state_projection_by_windows_durability": true
          }
          "@ | Set-Content -LiteralPath audit-evidence/result.json -Encoding utf8

      - name: Remove temporary probe and prove tracked tree unchanged
        if: always()
        shell: pwsh
        run: |
          Remove-Item -LiteralPath crates/vsn-update/tests/pkg04_rollback_state_tmp_hardlink_probe.rs -Force -ErrorAction SilentlyContinue
          git diff --exit-code
          if(@(git status --porcelain=v1 --untracked-files=no).Count -ne 0){ throw 'Tracked checkout drift detected.' }

      - name: Upload non-secret audit evidence
        if: success()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: pkg04-rollback-state-tmp-hardlink-windows-2025
          path: audit-evidence/**
          if-no-files-found: error
          retention-days: 14
