name: PKG-03 03.05 Owned Payload + Containment

on:
  pull_request:
    branches: [main]
    paths:
      - '.ai/features/pkg03-0305/**'
      - '.ai/manifests/pkg03-0305-owned-payload.v1.json'
      - '.ai/plans/pkg03-0305-owned-payload-v1.md'
      - '.github/workflows/pkg03-0305-owned-payload.yml'
      - 'docs/PKG03-WINDOWS-OWNED-PAYLOAD-V1.md'
      - 'installer/windows/owned-payload.v1.json'
      - 'scripts/ci/validate-pkg03-0305.py'
      - 'apps/desktop/src-tauri/tauri.conf.json'
      - 'apps/desktop/src-tauri/tauri.per-machine.conf.json'
      - 'apps/desktop/src-tauri/Cargo.toml'
      - 'apps/cli/Cargo.toml'
      - 'apps/agent/Cargo.toml'
      - 'Cargo.lock'
      - 'rust-toolchain.toml'
      - 'certification/pkg03-windows-installer-v1.json'
      - 'docs/MASTER-EXECUTION-STATUS.json'
  push:
    branches:
      - 'pkg03/0305-owned-payload'
      - main
    paths:
      - '.ai/features/pkg03-0305/**'
      - '.ai/manifests/pkg03-0305-owned-payload.v1.json'
      - '.ai/plans/pkg03-0305-owned-payload-v1.md'
      - '.github/workflows/pkg03-0305-owned-payload.yml'
      - 'docs/PKG03-WINDOWS-OWNED-PAYLOAD-V1.md'
      - 'installer/windows/owned-payload.v1.json'
      - 'scripts/ci/validate-pkg03-0305.py'
      - 'apps/desktop/src-tauri/tauri.conf.json'
      - 'apps/desktop/src-tauri/tauri.per-machine.conf.json'
      - 'apps/desktop/src-tauri/Cargo.toml'
      - 'apps/cli/Cargo.toml'
      - 'apps/agent/Cargo.toml'
      - 'Cargo.lock'
      - 'rust-toolchain.toml'
      - 'certification/pkg03-windows-installer-v1.json'
      - 'docs/MASTER-EXECUTION-STATUS.json'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pkg03-0305-${{ github.ref }}
  cancel-in-progress: true

jobs:
  owned-payload:
    name: 03.05 Windows owned-payload containment
    runs-on: windows-2025
    timeout-minutes: 35
    steps:
      - name: Checkout exact source head
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          fetch-depth: 0

      - name: Bind exact source head
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $expected = '${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}'
          $actual = (git rev-parse HEAD).Trim()
          if ($actual -ne $expected) {
            throw "Exact-head checkout mismatch: expected=$expected actual=$actual"
          }
          "VSN_SOURCE_SHA=$actual" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          $tracked = @(git status --porcelain=v1 --untracked-files=no)
          if ($tracked.Count -ne 0) {
            $tracked | Write-Host
            throw 'Checkout is not tracked-clean before 03.05.'
          }

      - name: Install exact Rust 1.97.1
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          rustup toolchain install 1.97.1 --profile minimal
          rustup default 1.97.1
          if ((rustc --version).Trim() -notmatch '^rustc 1\.97\.1 ') { throw 'Unexpected rustc version' }
          if ((cargo --version).Trim() -notmatch '^cargo 1\.97\.1 ') { throw 'Unexpected cargo version' }

      - name: Validate frozen 03.05 authority and containment
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          python scripts/ci/validate-pkg03-0305.py

      - name: Capture locked Cargo package identity
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force dist-pkg03/03.05 | Out-Null
          cargo metadata --locked --format-version 1 --no-deps | Set-Content -Encoding utf8NoBOM dist-pkg03/03.05/cargo-metadata.json
          @'
          import json
          from pathlib import Path

          meta = json.loads(Path('dist-pkg03/03.05/cargo-metadata.json').read_text(encoding='utf-8-sig'))
          packages = {p['name']: p for p in meta['packages']}
          expected = {'vsn-desktop': '0.38.1', 'vsn': '0.38.1', 'vsn-agent': '0.38.1'}
          for name, version in expected.items():
              pkg = packages.get(name)
              if pkg is None or pkg.get('version') != version:
                  raise SystemExit(f'Cargo package identity mismatch: {name} expected {version}')
          Path('dist-pkg03/03.05/package-identities.json').write_text(
              json.dumps({name: {'version': packages[name]['version'], 'manifest_path': packages[name]['manifest_path']} for name in expected}, indent=2, sort_keys=True) + '\n',
              encoding='utf-8',
          )
          '@ | python -

      - name: Build CLI and Agent payload binaries without installer execution
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          cargo build --locked --release -p vsn -p vsn-agent
          if (!(Test-Path target/release/vsn.exe)) { throw 'Missing target/release/vsn.exe' }
          if (!(Test-Path target/release/vsn-agent.exe)) { throw 'Missing target/release/vsn-agent.exe' }
          if ((Get-Item target/release/vsn.exe).Length -le 0) { throw 'vsn.exe is empty' }
          if ((Get-Item target/release/vsn-agent.exe).Length -le 0) { throw 'vsn-agent.exe is empty' }

      - name: Exercise lexical install-root containment vectors
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          @'
          import json
          import re
          from pathlib import Path

          root = Path.cwd() / 'dist-pkg03' / '03.05' / 'ephemeral-install-root'
          root.mkdir(parents=True, exist_ok=True)
          manifest = json.loads(Path('installer/windows/owned-payload.v1.json').read_text(encoding='utf-8'))
          reserved = {'CON', 'PRN', 'AUX', 'NUL', *{f'COM{i}' for i in range(1, 10)}, *{f'LPT{i}' for i in range(1, 10)}}

          def validate(path):
              if not isinstance(path, str) or not path: return False
              if '\\' in path or path.startswith('/') or re.match(r'^[A-Za-z]:', path): return False
              if path.startswith('//') or ':' in path: return False
              if any(ord(c) < 32 or ord(c) == 127 for c in path): return False
              if '*' in path or '?' in path: return False
              segments = path.split('/')
              if any(s == '' for s in segments): return False
              for s in segments:
                  if s in {'.', '..'} or s.endswith(' ') or s.endswith('.'): return False
                  if s.split('.', 1)[0].upper() in reserved: return False
              return True

          owned = [x['relative_path'] for x in manifest['owned_files']]
          bad = [
              '', 'C:/evil.exe', 'C:\\evil.exe', '/evil.exe', '//server/share/evil.exe',
              '\\\\?\\C:\\evil.exe', '\\\\.\\C:\\evil.exe', '../evil.exe', 'bin/../evil.exe',
              './bin/vsn.exe', 'bin\\vsn.exe', 'bin/vsn.exe:stream', 'CON', 'NUL.txt',
              'bin/COM1.exe', 'bin/LPT9', 'bin/vsn.exe.', 'bin/vsn.exe ', 'bin//vsn.exe',
              'bin/\x01bad.exe', 'bin/*.exe'
          ]
          if any(not validate(p) for p in owned):
              raise SystemExit('An accepted owned path failed containment validation')
          accepted_bad = [p for p in bad if validate(p)]
          if accepted_bad:
              raise SystemExit(f'Malicious vectors accepted: {accepted_bad!r}')
          if len({p.casefold() for p in owned}) != len(owned):
              raise SystemExit('Case-insensitive owned-path collision')
          if 'BIN/VSN.EXE'.casefold() != 'bin/vsn.exe'.casefold():
              raise SystemExit('Windows case-insensitive membership model broken')

          resolved = []
          root_abs = root.resolve()
          for p in owned:
              candidate = (root / Path(*p.split('/'))).resolve()
              try:
                  candidate.relative_to(root_abs)
              except ValueError:
                  raise SystemExit(f'Owned path escaped ephemeral root: {p}')
              resolved.append(str(candidate))

          result = {
              'positive_vectors_accepted': len(owned),
              'negative_vectors_rejected': len(bad),
              'case_collision_check': True,
              'ephemeral_root': str(root_abs),
              'resolved_owned_paths': resolved,
              'reparse_containment_required_downstream': bool(manifest['path_policy']['require_reparse_containment_downstream']),
          }
          Path('dist-pkg03/03.05/containment.json').write_text(json.dumps(result, indent=2, sort_keys=True) + '\n', encoding='utf-8')
          print(json.dumps(result, indent=2, sort_keys=True))
          '@ | python -

      - name: Verify zero tracked drift
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          git diff --exit-code
          $tracked = @(git status --porcelain=v1 --untracked-files=no)
          if ($tracked.Count -ne 0) {
            $tracked | Write-Host
            throw 'Tracked repository drift detected during 03.05.'
          }

      - name: Build exact owned-payload evidence
        shell: pwsh
        env:
          VSN_WORKFLOW_RUN_ID: ${{ github.run_id }}
          VSN_WORKFLOW_RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          $ErrorActionPreference = 'Stop'
          @'
          import hashlib
          import json
          import os
          import subprocess
          from pathlib import Path

          root = Path('.')
          out = root / 'dist-pkg03' / '03.05'

          def sha_bytes(data):
              return hashlib.sha256(data).hexdigest()

          def git_bytes(path):
              return subprocess.check_output(['git', 'show', f'HEAD:{path}'])

          source = os.environ['VSN_SOURCE_SHA']
          actual = subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip()
          if source != actual:
              raise SystemExit(f'source mismatch: env={source} git={actual}')

          ownership = json.loads((root / 'installer/windows/owned-payload.v1.json').read_text(encoding='utf-8'))
          identities = json.loads((out / 'package-identities.json').read_text(encoding='utf-8'))
          containment = json.loads((out / 'containment.json').read_text(encoding='utf-8'))
          cli = root / 'target/release/vsn.exe'
          agent = root / 'target/release/vsn-agent.exe'
          if not cli.is_file() or not agent.is_file():
              raise SystemExit('Expected payload binaries missing')

          evidence = {
              'schema_version': 1,
              'package_id': 'PKG-03',
              'task_id': '03.05',
              'source_commit': source,
              'workflow_run_id': int(os.environ['VSN_WORKFLOW_RUN_ID']),
              'workflow_run_attempt': int(os.environ['VSN_WORKFLOW_RUN_ATTEMPT']),
              'install_root_token': ownership['install_root_token'],
              'owned_paths': [x['relative_path'] for x in ownership['owned_files']],
              'package_identities': identities,
              'payload_builds': {
                  'bin/vsn.exe': {'size': cli.stat().st_size, 'sha256': sha_bytes(cli.read_bytes())},
                  'bin/vsn-agent.exe': {'size': agent.stat().st_size, 'sha256': sha_bytes(agent.read_bytes())},
              },
              'containment': containment,
              'input_sha256': {
                  'ownership_manifest': sha_bytes(git_bytes('installer/windows/owned-payload.v1.json')),
                  'cargo_lock': sha_bytes(git_bytes('Cargo.lock')),
                  'task_manifest': sha_bytes(git_bytes('.ai/manifests/pkg03-0305-owned-payload.v1.json')),
                  'tauri_config': sha_bytes(git_bytes('apps/desktop/src-tauri/tauri.conf.json')),
                  'per_machine_overlay': sha_bytes(git_bytes('apps/desktop/src-tauri/tauri.per-machine.conf.json')),
              },
              'updater_helper_owned': False,
              'installer_executed': False,
              'uac_prompted': False,
              'privileged_mutation': False,
              'service_registration_performed': False,
              'acl_mutation_performed': False,
              'signing_performed': False,
              'updater_mutation': False,
              'external_filesystem_ownership': False,
              'tracked_repository_drift_zero': True,
          }
          if evidence['owned_paths'] != ['VSN Dev Platform.exe', 'bin/vsn.exe', 'bin/vsn-agent.exe']:
              raise SystemExit('Owned paths changed during evidence build')
          if evidence['input_sha256']['tauri_config'] != '366291310a2353a0e6cfbaa2acb748ce87ab5f51efe077b531b8dc7b3449f9e7':
              raise SystemExit('Accepted Tauri config drifted')
          if evidence['input_sha256']['per_machine_overlay'] != '48fd4eb22ffe99a884ce5f4770de83e29ad919650d7c254b5d180fca3add7429':
              raise SystemExit('Accepted per-machine overlay drifted')

          path = out / 'evidence.json'
          path.write_text(json.dumps(evidence, indent=2, sort_keys=True) + '\n', encoding='utf-8')
          digest = sha_bytes(path.read_bytes())
          (out / 'evidence.json.sha256').write_text(f'{digest}  evidence.json\n', encoding='utf-8')
          print(json.dumps(evidence, indent=2, sort_keys=True))
          '@ | python -

      - name: Verify evidence
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          @'
          import hashlib
          import json
          from pathlib import Path

          root = Path('dist-pkg03/03.05')
          path = root / 'evidence.json'
          evidence = json.loads(path.read_text(encoding='utf-8'))
          assert evidence['owned_paths'] == ['VSN Dev Platform.exe', 'bin/vsn.exe', 'bin/vsn-agent.exe']
          assert evidence['containment']['positive_vectors_accepted'] == 3
          assert evidence['containment']['negative_vectors_rejected'] == 21
          assert evidence['containment']['reparse_containment_required_downstream'] is True
          assert evidence['updater_helper_owned'] is False
          assert evidence['installer_executed'] is False
          assert evidence['uac_prompted'] is False
          assert evidence['privileged_mutation'] is False
          assert evidence['service_registration_performed'] is False
          assert evidence['acl_mutation_performed'] is False
          assert evidence['signing_performed'] is False
          assert evidence['updater_mutation'] is False
          assert evidence['external_filesystem_ownership'] is False
          assert evidence['tracked_repository_drift_zero'] is True
          for key in ['bin/vsn.exe', 'bin/vsn-agent.exe']:
              assert evidence['payload_builds'][key]['size'] > 0
              assert len(evidence['payload_builds'][key]['sha256']) == 64
          digest = hashlib.sha256(path.read_bytes()).hexdigest()
          expected = (root / 'evidence.json.sha256').read_text(encoding='utf-8').split()[0]
          assert digest == expected
          print(json.dumps({'evidence_sha256': digest, 'valid': True}, indent=2))
          '@ | python -

      - name: Upload exact 03.05 owned-payload evidence
        uses: actions/upload-artifact@v4
        with:
          name: pkg03-0305-owned-payload
          path: dist-pkg03/03.05
          if-no-files-found: error
          compression-level: 0
