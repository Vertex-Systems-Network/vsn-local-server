name: PKG-01 Ledger 01.18

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  reconcile:
    if: github.event.pull_request.head.ref == 'pkg01/0118-dashboard-npm-ci'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: pkg01/0118-dashboard-npm-ci
          fetch-depth: 0
      - name: Append 01.18 evidence to canonical ledger
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64
          from pathlib import Path
          marker = '## 30. 2026-08-21 - 01.18 Dashboard npm ci certified'
          encoded = ''
          path = Path('VSN_AI_PROJECT_STATE.md')
          text = path.read_text()
          section = base64.b64decode(encoded).decode('ascii').strip()
          if marker not in text:
              path.write_text(text.rstrip() + '\n\n' + section + '\n')
          PY
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add VSN_AI_PROJECT_STATE.md
          git diff --cached --check
          if git diff --cached --quiet; then
            echo 'Ledger already reconciled.'
            exit 0
          fi
          git commit -m 'PKG-01: reconcile canonical state through 01.18'
          git push origin HEAD:pkg01/0118-dashboard-npm-ci
