name: PKG-01 01.07 Apply Marketplace Extension Fixes

on:
  push:
    branches:
      - pkg01/clippy-after-pr7
    paths:
      - .github/workflows/pkg01-0107-apply-marketplace-extension.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact branch head
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify source blob identities
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object crates/vsn-marketplace/src/lib.rs)" = "35d0b2b066ad20a3e23412bcddd84c9dea16032c"
          test "$(git hash-object crates/vsn-extension/src/lib.rs)" = "bd4c4908f1645907272eac6d96b183f6283587c2"

      - name: Apply exact asserted fixes
        shell: python
        run: |
          from pathlib import Path

          def replace_exact(path: Path, old: str, new: str, expected: int = 1) -> None:
              text = path.read_text(encoding="utf-8")
              count = text.count(old)
              if count != expected:
                  raise SystemExit(f"{path}: expected {expected} occurrence(s), found {count}: {old!r}")
              path.write_text(text.replace(old, new, expected), encoding="utf-8")

          marketplace = Path("crates/vsn-marketplace/src/lib.rs")
          replace_exact(
              marketplace,
              "v.split(|c| c == '.' || c == '-' || c == '+')",
              "v.split(['.', '-', '+'])",
          )

          extension = Path("crates/vsn-extension/src/lib.rs")
          replace_exact(
              extension,
              "        return SandboxCapabilities {\n            backend: \"bubblewrap\".into(),",
              "        SandboxCapabilities {\n            backend: \"bubblewrap\".into(),",
          )
          replace_exact(
              extension,
              "                vec![\"Bubblewrap executable is required on the host\".into()]\n            },\n        };\n    }\n    #[cfg(target_os = \"windows\")]",
              "                vec![\"Bubblewrap executable is required on the host\".into()]\n            },\n        }\n    }\n    #[cfg(target_os = \"windows\")]",
          )
          replace_exact(
              extension,
              "        return run_linux_bubblewrap(&root, rel, &manifest, exec, request);",
              "        run_linux_bubblewrap(&root, rel, &manifest, exec, request)",
          )

      - name: Verify patch shape
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          git diff -- crates/vsn-marketplace/src/lib.rs crates/vsn-extension/src/lib.rs
          test "$(git diff --name-only | sort | tr '\n' ' ')" = "crates/vsn-extension/src/lib.rs crates/vsn-marketplace/src/lib.rs "
          git diff --exit-code -- Cargo.lock

      - name: Commit exact fixes to active branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "vsn-ci"
          git config user.email "vsn-ci@users.noreply.github.com"
          git add -- crates/vsn-marketplace/src/lib.rs crates/vsn-extension/src/lib.rs
          git commit -m "fix(pkg01): clear marketplace extension Clippy blockers"
          git push origin HEAD:pkg01/clippy-after-pr7
