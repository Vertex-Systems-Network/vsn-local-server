name: Fast Epoch Gate

on:
  push:
    branches:
      - 'integration/fast-epoch-*'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fast-epoch-${{ github.ref }}
  cancel-in-progress: true

jobs:
  preimplementation-contracts:
    name: NON_ACCEPTANCE_PREIMPLEMENTATION contracts
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout exact epoch head
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 0

      - name: Bind exact source and canonical base
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
          git fetch --no-tags --depth=1 origin main
          git diff --check
          git diff --exit-code origin/main -- docs/MASTER-EXECUTION-STATUS.json certification/pkg03-windows-installer-v1.json

      - name: Verify live canonical state remains acceptance-blocked at 03.22
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/ci/live-work-state.py --head "${GITHUB_SHA}" --compact > live-state.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          state=json.loads(Path('live-state.json').read_text(encoding='utf-8'))
          assert state['active_package']=='PKG-03'
          assert state['active_task']=='03.22'
          assert state['ready_tasks']==['03.22']
          assert state['package_progress']['done']==21
          assert state['package_progress']['required']==25
          assert state['package_progress']['percent']==84.0
          print('FAST_EPOCH_CANONICAL_STATE=PASS')
          PY

      - name: Validate machine-readable execution map
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/ci/validate-fast-epoch-map.py \
            --map .ai/changes/FAST-EPOCH-1-EXECUTION-MAP.json \
            --expected-main "$(git rev-parse origin/main)" \
            --expected-branch "${GITHUB_REF_NAME}" \
            --output .fast-out/execution-map.json

      - name: Run frozen 03.23 signed-subject synthetic contract
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/ci/audit-pkg03-0323-handoff-contract.py --self-test --output .audit-out/0323.json

      - name: Run frozen 03.24 VM-evidence synthetic contract
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/ci/audit-pkg03-0324-vm-evidence-contract.py --self-test --output .audit-out/0324.json

      - name: Run frozen 03.25 final-evidence synthetic contract
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/ci/audit-pkg03-0325-final-evidence-contract.py --self-test --output .audit-out/0325.json

      - name: Validate frozen non-acceptance outputs
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path
          expected={
            '0323.json': {'pass':1,'negative_rejections':11,'total':12},
            '0324.json': {'pass':1,'negative_rejections':12,'total':13},
            '0325.json': {'pass':1,'negative_rejections':11,'total':12},
          }
          for name, summary in expected.items():
              data=json.loads((Path('.audit-out')/name).read_text(encoding='utf-8'))
              assert data['mode']=='synthetic-only'
              assert data['production_evidence_consumed'] is False
              assert data['canonical_state_changed'] is False
              assert data['implementation_authority'] is False
              assert data['summary']==summary
          print('FROZEN_NON_ACCEPTANCE_CONTRACTS=PASS')
          PY

      - name: Build deterministic 03.23 provenance and SBOM fixtures
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/ci/pkg03-0323-provenance-preimplementation.py --self-test --output-dir .fast-out/0323-a
          python3 scripts/ci/pkg03-0323-provenance-preimplementation.py --self-test --output-dir .fast-out/0323-b
          diff -ru .fast-out/0323-a .fast-out/0323-b

      - name: Build deterministic 03.24 VM harness fixtures
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/ci/pkg03-0324-vm-harness-preimplementation.py --self-test --output-dir .fast-out/0324-a
          python3 scripts/ci/pkg03-0324-vm-harness-preimplementation.py --self-test --output-dir .fast-out/0324-b
          diff -ru .fast-out/0324-a .fast-out/0324-b

      - name: Build deterministic 03.25 final-index fixtures
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/ci/pkg03-0325-final-index-preimplementation.py --self-test --output-dir .fast-out/0325-a
          python3 scripts/ci/pkg03-0325-final-index-preimplementation.py --self-test --output-dir .fast-out/0325-b
          diff -ru .fast-out/0325-a .fast-out/0325-b

      - name: Prove MSIX Store shell privilege boundary
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/ci/pkg03-msix-store-compat.py --repo-root . --output .fast-out/msix-store.json

      - name: Render deterministic MSIX manifest and staging fixtures
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/ci/pkg03-msix-manifest-preimplementation.py --repo-root . --fixture --output-dir .fast-out/msix-a
          python3 scripts/ci/pkg03-msix-manifest-preimplementation.py --repo-root . --fixture --output-dir .fast-out/msix-b
          diff -ru .fast-out/msix-a .fast-out/msix-b

      - name: Validate extended preimplementation reports
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path
          execution=json.loads(Path('.fast-out/execution-map.json').read_text(encoding='utf-8'))
          assert execution['result']=='PASS'
          assert execution['preimplementation_lane_count']==5
          assert execution['targeted_pkg04_preimplementation_gate_bound'] is True
          assert execution['targeted_pkg04_adversarial_gate_bound'] is True
          assert execution['canonical_state_changed'] is False
          assert execution['implementation_authority'] is False
          assert execution['production_evidence_consumed'] is False
          for task in ('0323','0324','0325'):
              data=json.loads((Path('.fast-out')/f'{task}-a'/'report.json').read_text(encoding='utf-8'))
              assert data['mode']=='NON_ACCEPTANCE_PREIMPLEMENTATION'
              assert data['production_evidence_consumed'] is False
              assert data['canonical_state_changed'] is False
              assert data['implementation_authority'] is False
              assert data['deterministic_outputs'] is True
          msix=json.loads(Path('.fast-out/msix-store.json').read_text(encoding='utf-8'))
          assert msix['mode']=='NON_ACCEPTANCE_PREIMPLEMENTATION'
          assert msix['production_evidence_consumed'] is False
          assert msix['canonical_state_changed'] is False
          assert msix['implementation_authority'] is False
          assert msix['identity_placeholders_verified'] is True
          assert msix['desktop_current_user'] is True
          assert msix['desktop_ipc_delegation'] is True
          assert msix['store_shell_source_preparation_viable'] is True
          assert msix['standalone_full_feature_store_package_ready'] is False
          assert msix['direct_installer_lane_must_remain'] is True
          assert msix['required_runtime_boundary']=='external_or_preprovisioned_authenticated_agent'
          manifest=json.loads(Path('.fast-out/msix-a/report.json').read_text(encoding='utf-8'))
          assert manifest['mode']=='NON_ACCEPTANCE_PREIMPLEMENTATION'
          assert manifest['fixture_identity'] is True
          assert manifest['production_identity_present'] is False
          assert manifest['assets_ready'] is False
          assert manifest['package_build_performed'] is False
          assert manifest['package_signed'] is False
          assert manifest['store_submission_performed'] is False
          assert manifest['standalone_full_feature_store_package_ready'] is False
          assert manifest['required_runtime_boundary']=='external_or_preprovisioned_authenticated_agent'
          assert manifest['deterministic_outputs'] is True
          staging=json.loads(Path('.fast-out/msix-a/staging-plan.json').read_text(encoding='utf-8'))
          assert staging['executable_source']=='target/release/VSN Dev Platform.exe'
          assert staging['executable_destination']=='VSN Dev Platform.exe'
          assert staging['assets_ready'] is False
          assert staging['package_build_performed'] is False
          assert staging['package_signed'] is False
          assert staging['store_submission_performed'] is False
          print('EXTENDED_NON_ACCEPTANCE_PREIMPLEMENTATION=PASS')
          PY

      - name: Verify zero tracked drift
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .audit-out .fast-out live-state.json
          test -z "$(git status --porcelain=v1)"
